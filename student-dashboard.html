<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — OS 3.3 AI Layer</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg: radial-gradient(circle at 20% 10%, #0b0030, #000);
  --glass: rgba(255,255,255,0.06);
  --stroke: rgba(255,255,255,0.12);
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --text:#fff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:var(--bg);
  color:white;
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:rgba(255,255,255,0.04);
  border-bottom:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:Orbitron;
}

.brand img{
  width:44px;
  height:44px;
  filter:drop-shadow(0 0 12px var(--blue));
}

.brand span{
  font-size:1.2rem;
  background:linear-gradient(90deg,var(--blue),var(--violet),var(--green));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* AI PANEL (NEW CORE UPGRADE) */
.ai-panel{
  margin:16px;
  padding:14px;
  border-radius:16px;
  background:rgba(0,240,255,0.06);
  border:1px solid rgba(0,240,255,0.25);
}

.ai-title{
  font-family:Orbitron;
  font-size:13px;
  margin-bottom:6px;
}

.ai-text{
  font-size:13px;
  opacity:0.9;
}

.ai-next{
  margin-top:10px;
  font-size:12px;
  color:var(--green);
}

/* LAYOUT */
.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* CARD */
.card{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:18px;
  backdrop-filter:blur(14px);
}

/* PROFILE */
.profile{
  display:flex;
  gap:16px;
  align-items:center;
  background:linear-gradient(90deg,rgba(0,240,255,0.06),rgba(156,77,255,0.06));
}

.profile img{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(0,240,255,0.3);
}

.badge{
  display:inline-block;
  background:rgba(0,255,148,0.12);
  color:var(--green);
  padding:4px 10px;
  border-radius:999px;
  font-size:11px;
}

/* PROGRESS */
.meter{
  height:10px;
  background:rgba(255,255,255,0.08);
  border-radius:999px;
  overflow:hidden;
}

.meter-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--blue),var(--violet));
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;
}

.small-card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:14px;
}

/* BUTTONS */
.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}

button{
  border:none;
  border-radius:14px;
  padding:14px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:black;
  font-weight:bold;
}

/* FLOAT AI */
.ai-btn{
  position:fixed;
  bottom:18px;
  right:18px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  border:none;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
    <span>Zep Swipe</span>
  </div>
  <button onclick="logout()">⎋</button>
</header>

<!-- 🧠 AI LAYER 3.3 -->
<div class="ai-panel">
  <div class="ai-title">🧠 Zep AI ENGINE</div>
  <div class="ai-text" id="aiInsight">Analyzing your learning + earning behavior...</div>
  <div class="ai-next" id="aiNext">Next Action: Loading recommendation...</div>
</div>

<div class="container">

  <!-- PROFILE -->
  <div class="card profile">
    <img id="profileImg">
    <div>
      <h2 id="name">Loading...</h2>
      <small id="level"></small>
      <span id="verified" class="badge" style="display:none;">Verified</span>

      <br><br>
      <small id="completion"></small>
      <div class="meter"><div id="meterFill" class="meter-fill"></div></div>

      <br>
      <small id="wallet"></small>
    </div>
  </div>

  <!-- STATS -->
  <div class="card">
    <h3>Overview</h3>
    <div class="grid">
      <div class="small-card" id="xpBox">XP: 0</div>
      <div class="small-card" id="refBox">Referrals: 0</div>
      <div class="small-card" id="earnBox">Earnings: $0</div>
    </div>
  </div>

  <!-- COURSES -->
  <div class="card">
    <h3>Learn & Earn Progress</h3>
    <div class="grid" id="courses"></div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <button onclick="location.href='learn-earn.html'">📚 Learn</button>
    <button onclick="location.href='wallet.html'">💰 Wallet</button>
    <button onclick="location.href='swipe-merchants.html'">💼 Jobs</button>
    <button onclick="location.href='profile.html'">👤 Profile</button>
  </div>

</div>

<button class="ai-btn">🤖</button>

<script>
const SUPABASE_URL = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let userData = null;

/* LOAD */
async function loadUser(){

  const { data: { user } } = await sb.auth.getUser();

  if(!user){
    window.location.href = "login.html";
    return;
  }

  const { data } = await sb
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  userData = data;
  render();
  runAI();
}

/* 🧠 AI ENGINE 3.3 */
function runAI(){

  const xp = userData.xp || 0;
  const earnings = userData.wallet_balance || 0;
  const referrals = userData.referrals || 0;

  let insight = "";
  let next = "";

  if(xp < 50){
    insight = "You are in FOUNDATION stage. Focus on completing daily skills.";
    next = "👉 Start Learn & Earn module for 15 minutes today.";
  }
  else if(earnings < 20){
    insight = "You are entering EARLY EARNING stage. Skills are forming income potential.";
    next = "👉 Apply for 1 freelance task or gig today.";
  }
  else if(referrals < 3){
    insight = "You are ready for SCALE stage. Growth is now network-driven.";
    next = "👉 Invite 3 students to unlock multiplier bonus.";
  }
  else{
    insight = "You are in GROWTH ENGINE mode. Income + learning compounding.";
    next = "👉 Focus on high-value gigs ($20+ tasks).";
  }

  document.getElementById("aiInsight").innerText = insight;
  document.getElementById("aiNext").innerText = next;
}

/* RENDER */
function render(){

  document.getElementById("profileImg").src =
    userData.profile_image || "https://via.placeholder.com/80";

  document.getElementById("name").innerText =
    userData.name || "Student";

  document.getElementById("level").innerText =
    userData.level || "Beginner";

  document.getElementById("completion").innerText =
    `Profile Completion: ${userData.profile_completion || 0}%`;

  document.getElementById("meterFill").style.width =
    `${userData.freelancer_readiness || 0}%`;

  document.getElementById("wallet").innerText =
    `Wallet: $${userData.wallet_balance || 0}`;

  document.getElementById("xpBox").innerText =
    `XP: ${userData.xp || 0}`;

  document.getElementById("refBox").innerText =
    `Referrals: ${userData.referrals || 0}`;

  document.getElementById("earnBox").innerText =
    `Earnings: $${userData.wallet_balance || 0}`;

  const courses = userData.learn_earn_progress || {};
  const box = document.getElementById("courses");
  box.innerHTML = "";

  Object.entries(courses).forEach(([name, progress])=>{
    const div = document.createElement("div");
    div.className = "small-card";
    div.innerHTML = `<strong>${name}</strong><br>${progress}%`;
    box.appendChild(div);
  });
}

async function logout(){
  await sb.auth.signOut();
  window.location.href = "login.html";
}

loadUser();

/* live refresh AI */
setInterval(runAI, 6000);
</script>

</body>
</html>
