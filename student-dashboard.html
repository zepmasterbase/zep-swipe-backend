<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Student Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400,500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,.08);
  --glass-strong:rgba(255,255,255,.12);
  --text-light:rgba(255,255,255,.85);
  --verified-green:#39ff14;
  --wallet-glow:#00ff94;
  --card-hover-shadow:0 0 20px var(--zep-blue),0 0 30px var(--zep-violet);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif;}
body{background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;}

header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 24px;
  border-radius:16px;
  background:linear-gradient(90deg,rgba(0,240,255,.15),rgba(156,77,255,.15));
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.08);
}

.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand img{width:48px;height:48px;}
.brand span{
  font-family:Orbitron;
  font-size:1.6rem;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.logout-btn{
  background:rgba(255,255,255,.1);
  border:none;border-radius:50%;
  width:40px;height:40px;color:#fff;cursor:pointer;
}

.dashboard{padding:20px;display:flex;flex-direction:column;gap:24px;max-width:1200px;margin:auto;}

.section{
  background:var(--glass);
  border-radius:18px;
  padding:20px;
  border:1px solid var(--glass-strong);
}

.section h3{font-family:Orbitron;margin-bottom:14px;}

.profile-summary{
  display:flex;align-items:center;gap:18px;
  background:linear-gradient(90deg,rgba(0,240,255,.1),rgba(156,77,255,.1));
  padding:18px;border-radius:18px;
}

.profile-summary img{
  width:88px;height:88px;border-radius:50%;
}

.verified-badge{
  width:14px;height:14px;background:var(--verified-green);
  border-radius:50%;display:inline-block;margin-left:6px;
}

.readiness-meter{height:12px;background:rgba(255,255,255,.1);border-radius:999px;margin-top:6px;}
.readiness-fill{height:100%;background:var(--wallet-glow);width:0%;}

.horizontal-cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.card{
  background:linear-gradient(135deg, rgba(0,240,255,0.15), rgba(156,77,255,0.15));
  border-radius:18px;
  padding:16px;
  transition:.3s;
}

.card:hover{transform:translateY(-4px);box-shadow:var(--card-hover-shadow);}

.graph-box{
  height:180px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:16px;
}

.graph-bar{
  flex:1;
  background:linear-gradient(180deg,var(--zep-blue),var(--zep-violet));
  border-radius:8px 8px 0 0;
  position:relative;
}

.graph-bar span{
  position:absolute;
  top:-20px;
  font-size:.7rem;
  display:none;
}

.graph-bar:hover span{display:block;}

.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:16px;
}

.actions button{
  border:none;
  border-radius:18px;
  padding:16px;
  background:linear-gradient(135deg,var(--zep-blue),var(--zep-violet));
  font-family:Orbitron;
  cursor:pointer;
}

#zepAIButton{
  position:fixed;
  bottom:20px;right:20px;
  width:60px;height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--zep-blue),var(--zep-violet));
  border:none;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
    <span>Zep Swipe</span>
  </div>
  <button class="logout-btn" onclick="logout()">⎋</button>
</header>

<div class="dashboard">

  <div class="section profile-summary">
    <img id="profileImg">
    <div>
      <h3 id="studentName"></h3>
      <span id="studentLevel"></span><span id="verifiedBadge" class="verified-badge" style="display:none;"></span>
      <br>
      <small id="completionText"></small>
      <div class="readiness-meter"><div id="readinessFill" class="readiness-fill"></div></div>
      <br>
      <small id="walletBalance"></small>
    </div>
  </div>

  <div class="section">
    <h3>Courses</h3>
    <div class="horizontal-cards" id="courses"></div>
  </div>

  <div class="section">
    <h3>Weekly Earnings</h3>
    <div class="graph-box" id="graph"></div>
  </div>

  <div class="section actions">
    <button onclick="location.href='learn-earn.html'">📚 Learn</button>
    <button onclick="location.href='wallet.html'">💰 Wallet</button>
    <button onclick="location.href='swipe-merchants.html'">💼 Jobs</button>
    <button onclick="location.href='profile.html'">👤 Profile</button>
  </div>

</div>

<button id="zepAIButton">🤖</button>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let userData = null;

async function loadUser(){
  const { data: { user } } = await sb.auth.getUser();

  if(!user){
    location.href = "login.html";
    return;
  }

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if(error){
    console.error(error);
    return;
  }

  userData = data;
  renderUI();
}

function renderUI(){

  document.getElementById("profileImg").src =
    userData.profile_image || "https://via.placeholder.com/80";

  document.getElementById("studentName").innerText =
    userData.name || "Student";

  document.getElementById("studentLevel").innerText =
    userData.level || "Beginner";

  if(userData.verified){
    document.getElementById("verifiedBadge").style.display="inline-block";
  }

  document.getElementById("completionText").innerText =
    `Profile Completion: ${userData.profile_completion || 0}%`;

  document.getElementById("readinessFill").style.width =
    `${userData.freelancer_readiness || 0}%`;

  document.getElementById("walletBalance").innerText =
    `Wallet: ${userData.zac_balance || 0} ZAC (~$${(userData.wallet_balance || 0).toFixed(2)})`;

  // courses
  const courses = userData.learn_earn_progress || {};
  const container = document.getElementById("courses");
  container.innerHTML = "";

  Object.keys(courses).forEach(c=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML = `<h4>${c}</h4><p>${courses[c]}%</p>`;
    container.appendChild(div);
  });

  // graph
  const graph = document.getElementById("graph");
  graph.innerHTML = "";

  (userData.earnings_history || [5,10,8,12,6,15]).forEach(v=>{
    const bar = document.createElement("div");
    bar.className="graph-bar";
    bar.style.height = (v*5)+"px";
    bar.innerHTML = `<span>${v}</span>`;
    graph.appendChild(bar);
  });
}

async function logout(){
  await sb.auth.signOut();
  location.href = "login.html";
}

loadUser();
</script>

</body>
</html>
