<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep OS 3.8 Student Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg: radial-gradient(circle at 20% 10%, #0b0030, #000);
  --glass: rgba(255,255,255,0.06);
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
  background:var(--bg);
  color:white;
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:rgba(255,255,255,0.04);
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  font-family:Orbitron;
}

.brand img{
  width:42px;
  height:42px;
}

.card{
  background:var(--glass);
  margin:16px;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.1);
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  font-weight:700;
}

/* AI */
.ai{
  margin:16px;
  padding:14px;
  border-radius:14px;
  background:rgba(0,240,255,0.05);
  border:1px solid rgba(0,240,255,0.2);
}

.progress{
  height:10px;
  background:#111;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--blue),var(--violet));
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
    <div>Zep OS 3.8</div>
  </div>

  <button onclick="logout()">Logout</button>
</header>

<!-- AI PANEL -->
<div class="ai">
  <div><b>🧠 AI Engine</b></div>
  <div id="aiText">Loading intelligence...</div>
</div>

<!-- PROFILE -->
<div class="card">
  <h3 id="name">Loading...</h3>
  <p id="country"></p>
  <p id="level"></p>

  <br>

  <p>XP: <span id="xp"></span></p>
  <p>Wallet: $<span id="wallet"></span></p>
  <p>Referrals: <span id="ref"></span></p>

  <br>

  <div class="progress">
    <div class="progress-fill" id="bar"></div>
  </div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* 🔥 SUPABASE INIT (FIXED) */
const supabase = createClient(
  "https://kcdrezgxuclqmtozpyif.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjZHJlemd4dWNscW10b3pweWlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTA3MDUsImV4cCI6MjA5MTY2NjcwNX0.j34W8Ar2ansJjKc4AG-DVcemnMBg0Eq_tcyBrysTcO0"
);

/* STATE */
let user = null;
let profile = null;

/* ==============================
   SESSION CHECK (PERSISTENT LOGIN)
============================== */
async function loadSession(){

  const { data } = await supabase.auth.getSession();

  if(!data.session){
    window.location.href = "login-signup.html";
    return;
  }

  user = data.session.user;

  await loadProfile();
}

supabase.auth.onAuthStateChange((_event, session)=>{
  if(session){
    user = session.user;
    loadProfile();
  } else {
    window.location.href = "login-signup.html";
  }
});

/* ==============================
   LOAD PROFILE FROM BACKEND
============================== */
async function loadProfile(){

  const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if(error || !data){
    console.log("Profile missing, creating fallback...");

    profile = {
      name: user.user_metadata?.name || "Student",
      country: user.user_metadata?.country || "Unknown",
      level: "Beginner",
      xp: 0,
      wallet_balance: 0,
      referrals: 0,
      freelancer_readiness: 0
    };

  } else {
    profile = data;
  }

  render();
  runAI();
}

/* ==============================
   RENDER UI
============================== */
function render(){

  document.getElementById("name").innerText = profile.name || "Student";
  document.getElementById("country").innerText = profile.country || "";
  document.getElementById("level").innerText = profile.level || "Beginner";

  document.getElementById("xp").innerText = profile.xp || 0;
  document.getElementById("wallet").innerText = profile.wallet_balance || 0;
  document.getElementById("ref").innerText = profile.referrals || 0;

  document.getElementById("bar").style.width =
    (profile.freelancer_readiness || 0) + "%";
}

/* ==============================
   AI ENGINE (OS 3.8 LOGIC)
============================== */
function runAI(){

  let msg = "";

  if((profile.xp || 0) < 50){
    msg = "Foundation stage — complete daily learning tasks.";
  }
  else if((profile.wallet_balance || 0) < 20){
    msg = "Early earning stage — start applying for gigs.";
  }
  else if((profile.referrals || 0) < 3){
    msg = "Growth stage — invite 3 students to scale earnings.";
  }
  else {
    msg = "Elite mode — focus on high value tasks.";
  }

  document.getElementById("aiText").innerText = msg;
}

/* ==============================
   LOGOUT
============================== */
async function logout(){
  await supabase.auth.signOut();
  window.location.href = "login-signup.html";
}

/* START */
loadSession();

</script>

</body>
</html>
