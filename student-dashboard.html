<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Student Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,.08);
  --glass-strong:rgba(255,255,255,.12);
  --green:#00ff94;
  --text:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  background:rgba(255,255,255,0.05);
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:Orbitron;
}

.brand img{width:45px;height:45px;}

.brand span{
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-size:1.3rem;
}

/* LAYOUT */
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* CARD */
.card{
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:18px;
}

/* PROFILE */
.profile{
  display:flex;
  gap:16px;
  align-items:center;
  background:linear-gradient(90deg,rgba(0,240,255,0.08),rgba(156,77,255,0.08));
}

.profile img{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
}

.badge{
  display:inline-block;
  background:rgba(0,255,148,0.15);
  color:var(--green);
  padding:3px 8px;
  border-radius:20px;
  font-size:12px;
  margin-left:6px;
}

/* METERS */
.meter{
  height:10px;
  background:rgba(255,255,255,0.1);
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}

.meter-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
}

.small-card{
  background:rgba(255,255,255,0.06);
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.08);
}

/* BUTTONS */
.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
}

button{
  border:none;
  border-radius:14px;
  padding:14px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  color:black;
}

/* GRAPH */
.graph{
  display:flex;
  align-items:flex-end;
  gap:8px;
  height:140px;
}

.bar{
  flex:1;
  background:linear-gradient(180deg,var(--zep-blue),var(--zep-violet));
  border-radius:8px 8px 0 0;
  position:relative;
}

.bar span{
  position:absolute;
  top:-18px;
  font-size:10px;
  display:none;
}

.bar:hover span{display:block;}

/* FLOAT AI */
.ai-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
    <span>Zep Swipe</span>
  </div>
  <button onclick="logout()">⎋</button>
</header>

<div class="container">

  <!-- PROFILE -->
  <div class="card profile">
    <img id="profileImg">
    <div>
      <h2 id="name">Loading...</h2>
      <small id="level"></small>
      <span id="verified" class="badge" style="display:none;">Verified</span>
      <br><br>
      <small id="completion"></small>
      <div class="meter"><div id="meterFill" class="meter-fill"></div></div>
      <br>
      <small id="wallet"></small>
    </div>
  </div>

  <!-- STATS -->
  <div class="card">
    <h3>Overview</h3>
    <div class="grid">
      <div class="small-card" id="xpBox">XP: 0</div>
      <div class="small-card" id="refBox">Referrals: 0</div>
      <div class="small-card" id="earnBox">Earnings: $0</div>
    </div>
  </div>

  <!-- COURSES -->
  <div class="card">
    <h3>Learn & Earn Progress</h3>
    <div class="grid" id="courses"></div>
  </div>

  <!-- GRAPH -->
  <div class="card">
    <h3>Weekly Earnings</h3>
    <div class="graph" id="graph"></div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <button onclick="location.href='learn-earn.html'">📚 Learn</button>
    <button onclick="location.href='wallet.html'">💰 Wallet</button>
    <button onclick="location.href='swipe-merchants.html'">💼 Jobs</button>
    <button onclick="location.href='profile.html'">👤 Profile</button>
  </div>

</div>

<button class="ai-btn">🤖</button>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let userData = null;

/* ================= AUTH GUARD ================= */
async function loadUser(){

  const { data: { user } } = await sb.auth.getUser();

  if(!user){
    window.location.href = "login.html";
    return;
  }

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if(error){
    console.error(error);
    return;
  }

  userData = data;
  render();
}

/* ================= RENDER UI ================= */
function render(){

  document.getElementById("profileImg").src =
    userData.profile_image || "https://via.placeholder.com/80";

  document.getElementById("name").innerText =
    userData.name || "Student";

  document.getElementById("level").innerText =
    userData.level || "Beginner";

  document.getElementById("completion").innerText =
    `Profile Completion: ${userData.profile_completion || 0}%`;

  document.getElementById("meterFill").style.width =
    `${userData.freelancer_readiness || 0}%`;

  document.getElementById("wallet").innerText =
    `Wallet: $${userData.wallet_balance || 0}`;

  if(userData.verified){
    document.getElementById("verified").style.display="inline-block";
  }

  /* XP + REF */
  document.getElementById("xpBox").innerText =
    `XP: ${userData.xp || 0}`;

  document.getElementById("refBox").innerText =
    `Referrals: ${userData.referrals || 0}`;

  document.getElementById("earnBox").innerText =
    `Earnings: $${userData.wallet_balance || 0}`;

  /* COURSES */
  const courses = userData.learn_earn_progress || {};
  const courseBox = document.getElementById("courses");
  courseBox.innerHTML = "";

  Object.entries(courses).forEach(([name, progress])=>{
    const div = document.createElement("div");
    div.className = "small-card";
    div.innerHTML = `<strong>${name}</strong><br>${progress}%`;
    courseBox.appendChild(div);
  });

  /* GRAPH */
  const graph = document.getElementById("graph");
  graph.innerHTML = "";

  const earnings = userData.earnings_history || [5,10,8,12,6,15];

  earnings.forEach(v=>{
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = `${v * 5}px`;
    bar.innerHTML = `<span>${v}</span>`;
    graph.appendChild(bar);
  });
}

/* ================= LOGOUT ================= */
async function logout(){
  await sb.auth.signOut();
  window.location.href = "login.html";
}

loadUser();
</script>

</body>
</html>
