<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zep AI Skill OS 2.0</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
body{
  font-family:Poppins;
  background: radial-gradient(circle at top, #0a0620, #000010);
  color:white;
}

.glass{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border-radius:16px;
}

.glow{
  background:linear-gradient(90deg,#00f0ff,#9c4dff,#00ffb3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
</style>
</head>

<body class="p-4">

<!-- HEADER -->
<header class="glass p-4 flex justify-between items-center">
  <div>
    <h1 class="text-xl font-bold glow">Zep AI Skill OS 2.0</h1>
    <p class="text-xs text-gray-300">Adaptive learning engine for freelancers</p>
  </div>
  <button onclick="logout()" class="bg-pink-500 px-3 py-1 rounded-full text-xs">Logout</button>
</header>

<!-- AI STATUS PANEL -->
<div class="glass mt-4 p-4">
  <h2 class="font-bold text-cyan-300">🧠 AI Learning Engine</h2>
  <p class="text-xs text-gray-300 mt-1" id="aiInsight">
    Loading learning intelligence...
  </p>
</div>

<!-- SKILL HEADER -->
<div class="glass mt-4 p-4">
  <h2 id="courseTitle" class="text-lg font-bold glow"></h2>
  <p id="courseShort" class="text-sm text-gray-300"></p>

  <div class="mt-3">
    <div class="flex justify-between text-xs">
      <span>Skill Mastery</span>
      <span id="skillScore">0 / 100</span>
    </div>
    <div class="w-full bg-gray-800 h-2 rounded-full mt-1">
      <div id="skillBar" class="h-2 bg-gradient-to-r from-cyan-400 to-pink-500 rounded-full" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- MODULES -->
<div class="glass mt-4 p-4">
  <h3 class="font-bold text-cyan-300">📚 Modules</h3>
  <div id="modules" class="space-y-3 mt-3"></div>
</div>

<!-- AI NEXT ACTION -->
<div class="glass mt-4 p-4">
  <h3 class="font-bold text-green-300">🔮 AI Next Action</h3>
  <p id="nextAction" class="text-sm text-gray-300 mt-1"></p>
</div>

<!-- PRACTICE -->
<div class="glass mt-4 p-4">
  <h3 class="font-bold text-purple-300">🛠 Practice Generator</h3>
  <div id="practice"></div>
</div>

<!-- CTA -->
<div class="glass mt-4 p-4">
  <h3 class="font-bold text-cyan-300">🚀 Unlock System</h3>
  <p id="ctaText" class="text-xs text-gray-300"></p>
  <button id="testBtn"
    class="mt-3 w-full bg-gray-700 text-gray-400 py-2 rounded-full text-xs"
    disabled>
    Locked
  </button>
</div>

<script>
/* =============================
   STORAGE KEYS (UNCHANGED)
============================= */
const COURSE_KEY = "zepswipe_course_progress_v1";
const BAL_KEY = "zepswipe_balance_v1";

/* =============================
   COURSES (SAME STRUCTURE)
============================= */
const COURSES = {
  s1:{
    title:"AI Prompt Engineering",
    short:"Learn to control AI outputs like a pro.",
    modules:["Basics","Structuring","Iteration"],
    practice:[
      "Write a prompt for summarizing notes",
      "Create a reusable business prompt",
      "Improve a bad AI response"
    ]
  }
};

/* =============================
   LOAD SKILL
============================= */
const id = new URLSearchParams(location.search).get("skillId") || "s1";
const course = COURSES[id];

/* =============================
   INIT UI
============================= */
document.getElementById("courseTitle").innerText = course.title;
document.getElementById("courseShort").innerText = course.short;

/* =============================
   STORAGE HELPERS (INTACT LOGIC)
============================= */
function getProgress(){
  return JSON.parse(localStorage.getItem(COURSE_KEY)) || {};
}

function saveProgress(p){
  localStorage.setItem(COURSE_KEY, JSON.stringify(p));
}

/* =============================
   MODULE RENDER
============================= */
function renderModules(){
  const wrap = document.getElementById("modules");
  wrap.innerHTML = "";

  const progress = getProgress();
  const done = progress[id]?.completed || [];

  course.modules.forEach((m,i)=>{
    const div = document.createElement("div");
    div.className = "flex items-center justify-between bg-black/40 p-3 rounded-lg";

    const checked = done.includes(i);

    div.innerHTML = `
      <div>
        <p class="text-sm">${m}</p>
      </div>
      <input type="checkbox" ${checked?"checked":""}/>
    `;

    div.querySelector("input").onchange = (e)=>{
      const p = getProgress();
      if(!p[id]) p[id]={completed:[]};

      if(e.target.checked){
        p[id].completed.push(i);
      } else {
        p[id].completed = p[id].completed.filter(x=>x!==i);
      }

      saveProgress(p);
      updateAI();
    };

    wrap.appendChild(div);
  });
}

/* =============================
   AI SKILL ENGINE 2.0
============================= */
function updateAI(){
  const p = getProgress();
  const done = p[id]?.completed?.length || 0;
  const total = course.modules.length;

  const score = Math.round((done/total)*100);

  document.getElementById("skillScore").innerText = score + "/100";
  document.getElementById("skillBar").style.width = score + "%";

  /* AI INSIGHT ENGINE */
  let insight = "";

  if(score === 0){
    insight = "Start your journey. AI recommends beginning with fundamentals.";
  } 
  else if(score < 40){
    insight = "You're building foundation skills. Focus on consistency.";
  } 
  else if(score < 80){
    insight = "You're job-ready forming. Start thinking like a freelancer.";
  } 
  else {
    insight = "High skill detected. You are ready for paid work opportunities.";
  }

  document.getElementById("aiInsight").innerText = insight;

  /* NEXT ACTION ENGINE */
  let next = "";

  if(score < 100){
    next = "Complete remaining modules → then unlock freelance readiness test.";
  } else {
    next = "🔥 You are ready: Apply for gigs or generate invoice work.";
  }

  document.getElementById("nextAction").innerText = next;

  /* CTA ENGINE */
  const btn = document.getElementById("testBtn");

  if(score === 100){
    btn.disabled = false;
    btn.className = "mt-3 w-full bg-gradient-to-r from-cyan-400 to-pink-500 text-black py-2 rounded-full text-xs";
    btn.innerText = "Take Skill Test";
    document.getElementById("ctaText").innerText =
      "You unlocked freelance readiness. Go to Learn & Earn.";
    btn.onclick = () => location.href="learn-earn.html";
  } else {
    btn.disabled = true;
    btn.innerText = "Locked";
    document.getElementById("ctaText").innerText =
      "Complete all modules to unlock earning potential.";
  }

  /* PRACTICE ENGINE */
  const practice = document.getElementById("practice");
  practice.innerHTML = "";

  course.practice.forEach(p=>{
    const div = document.createElement("p");
    div.className = "text-sm text-gray-300 mt-2";
    div.innerText = "• " + p;
    practice.appendChild(div);
  });
}

/* =============================
   LOGOUT
============================= */
function logout(){
  window.location.href="index.html";
}

/* =============================
   INIT
============================= */
renderModules();
updateAI();

</script>

</body>
</html>
