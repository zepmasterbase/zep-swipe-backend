<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep AI Business OS</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,0.06);
  --text:rgba(255,255,255,0.9);
  --muted:rgba(255,255,255,0.6);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins, sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  margin:16px;
  border-radius:16px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
}

.brand{
  font-family:Orbitron;
  font-size:1.4rem;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

button{
  border:none;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#050015;
}

/* GRID */
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

.card{
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.1);
  padding:16px;
  border-radius:16px;
}

/* BUSINESS ITEM */
.business{
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  margin-top:10px;
}

.status{
  font-size:12px;
  padding:4px 8px;
  border-radius:999px;
  display:inline-block;
  margin-top:6px;
}

.active{background:#00ff94;color:#000;}
.pending{background:#ffc107;color:#000;}
.suspended{background:#ff4d4d;color:#fff;}

/* AI PANEL */
.ai{
  padding:12px;
  border-radius:12px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.2);
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep Business OS</div>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- AI STATUS -->
  <div class="ai">
    🤖 <span id="aiStatus">Loading business intelligence...</span>
  </div>

  <!-- BUSINESS LIST -->
  <div class="card">
    <h3>Your Businesses</h3>
    <div id="businessList"></div>
  </div>

</div>

<script>

/* =======================
   SUPABASE INIT
======================= */
const SUPABASE_URL = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_KEY";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =======================
   STATE
======================= */
let user = null;
let businesses = [];

/* =======================
   AUTH CHECK
======================= */
async function loadUser(){
  const { data } = await supabase.auth.getUser();
  user = data?.user;

  if(!user){
    window.location.href = "login.html";
  } else {
    loadBusinesses();
  }
}
loadUser();

/* =======================
   LOAD BUSINESSES
======================= */
async function loadBusinesses(){

  const { data, error } = await supabase
    .from("businesses")
    .select("*")
    .eq("owner_id", user.id)
    .order("created_at", { ascending:false });

  if(error){
    console.error(error);
    return;
  }

  businesses = data || [];
  render();
  runAI();
}

/* =======================
   RENDER UI
======================= */
function render(){

  const list = document.getElementById("businessList");
  list.innerHTML = "";

  if(businesses.length === 0){
    list.innerHTML = "<small>No businesses found</small>";
    return;
  }

  businesses.forEach(b => {

    const div = document.createElement("div");
    div.className = "business";

    div.innerHTML = `
      <h4>${b.name}</h4>
      <p>${b.description || "No description"}</p>
      <span class="status ${b.status || 'pending'}">
        ${b.status || "pending"}
      </span>
    `;

    list.appendChild(div);
  });
}

/* =======================
   AI ENGINE (LIGHTWEIGHT)
======================= */
function runAI(){

  let active = businesses.filter(b => b.status === "active").length;
  let pending = businesses.filter(b => b.status === "pending").length;
  let suspended = businesses.filter(b => b.status === "suspended").length;

  let msg = "";

  if(active > pending){
    msg = "🔥 Business growth is healthy and active listings dominate.";
  } else if(pending > active){
    msg = "⚠️ Many businesses pending approval. Review recommended.";
  } else if(suspended > 0){
    msg = "🚨 Suspensions detected. System risk flagged.";
  } else {
    msg = "System stable. Monitoring business ecosystem...";
  }

  document.getElementById("aiStatus").innerText = msg;
}

/* =======================
   REAL-TIME UPDATES
======================= */
supabase
  .channel("business-live")
  .on("postgres_changes",
    { event:"*", schema:"public", table:"businesses" },
    () => loadBusinesses()
  )
  .subscribe();

/* =======================
   LOGOUT
======================= */
async function logout(){
  await supabase.auth.signOut();
  window.location.href = "login.html";
}

</script>

</body>
</html>
