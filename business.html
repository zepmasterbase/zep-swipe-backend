<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Submit Student Deal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:radial-gradient(circle at 25% 10%, #050018 0%, #00000c 100%);
  --glass:rgba(255,255,255,0.08);
}

body{
  margin:0;
  font-family:Poppins,sans-serif;
  background: var(--bg);
  color:#fff;
  min-height:100vh;
  padding:20px;
}

h1{
  text-align:center;
  font-size:1.6rem;
  font-family:Orbitron;
  background: linear-gradient(90deg, var(--zep-blue), var(--zep-violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

form{
  background:var(--glass);
  border:1px solid rgba(255,255,255,.12);
  padding:20px;
  border-radius:18px;
  max-width:500px;
  margin:0 auto;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin-bottom:14px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  color:#fff;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  font-family:Orbitron;
  cursor:pointer;
}

/* LIST */
.submissions{
  max-width:500px;
  margin:20px auto;
  padding:16px;
  border-radius:16px;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,.12);
}

.item{
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,.1);
  font-size:13px;
}
</style>
</head>

<body>

<h1>Submit Your Student Deal</h1>

<form id="dealForm">
  <input type="text" id="storeName" placeholder="Store Name" required>
  <input type="url" id="storeLogo" placeholder="Store Logo URL">
  <input type="text" id="storeAddress" placeholder="Store Address" required>

  <textarea id="dealDesc" placeholder="Deal Description" required></textarea>

  <select id="dealCategory" required>
    <option value="">Select Category</option>
    <option value="Food">Food</option>
    <option value="Retail">Retail</option>
    <option value="Services">Services</option>
    <option value="Other">Other</option>
  </select>

  <input type="text" id="contactInfo" placeholder="Contact Info">

  <button type="submit">Submit Deal</button>
</form>

<div class="submissions">
  <h3 style="text-align:center;">Live Deals</h3>
  <div id="list"></div>
</div>

<script>
/* =========================
   SUPABASE INIT
========================= */
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   GET USER (OPTIONAL)
========================= */
let user = null;

async function getUser(){
  const { data } = await sb.auth.getUser();
  user = data?.user || null;
}
getUser();

/* =========================
   LOAD DEALS
========================= */
async function loadDeals(){
  const { data, error } = await sb
    .from("student_deals")
    .select("*")
    .order("created_at", { ascending: false });

  if(error){
    console.error(error);
    return;
  }

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(d => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <strong>${d.store_name}</strong> (${d.deal_category})<br>
      ${d.deal_desc}<br>
      📍 ${d.store_address}<br>
      📞 ${d.contact_info || "N/A"}
    `;
    list.appendChild(div);
  });
}

loadDeals();

/* =========================
   SUBMIT DEAL
========================= */
document.getElementById("dealForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const store_name = storeName.value.trim();
  const store_logo = storeLogo.value.trim();
  const store_address = storeAddress.value.trim();
  const deal_desc = dealDesc.value.trim();
  const deal_category = dealCategory.value;
  const contact_info = contactInfo.value.trim();

  const { error } = await sb
    .from("student_deals")
    .insert([
      {
        user_id: user?.id || null,
        store_name,
        store_logo,
        store_address,
        deal_desc,
        deal_category,
        contact_info
      }
    ]);

  if(error){
    console.error(error);
    alert("Error submitting deal");
    return;
  }

  alert("Deal submitted successfully!");
  e.target.reset();
  loadDeals();
});
</script>

</body>
</html>
