<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zep Swipe — Submit Work</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff9d;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,0.06);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  background:var(--bg);
  color:white;
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  cursor:pointer;
}

.brand img{
  width:42px;
  height:42px;
}

.brand span{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:20px auto;
  padding:16px;
}

/* CARD */
.card{
  background:var(--glass);
  padding:18px;
  border-radius:16px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s;
}

.card:hover{
  box-shadow:0 0 20px rgba(0,240,255,0.12);
}

/* BUTTON */
button{
  padding:10px 16px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  margin-top:10px;
  width:100%;
}

button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

/* STATUS */
.status{
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
}

.Escrow{background:var(--blue);color:#000;}
.Submitted{background:var(--green);color:#000;}
.Pending{background:orange;color:#000;}
.ready_to_release{background:var(--green);color:#000;}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.7);
}

.modal-box{
  background:var(--glass);
  padding:20px;
  border-radius:12px;
  text-align:center;
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>

<header>
  <div class="brand" onclick="location.href='student-dashboard.html'">
    <img src="https://pe56d.s3.amazonaws.com/o_1jfnua21qtu1vi2pfom33p641h.png">
    <span>Zep Swipe</span>
  </div>

  <div>Submit Work</div>
</header>

<div class="container">
  <h2>Active Invoices</h2>
  <div id="list"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <p id="msg">Processing...</p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphemJkYmtvcWp4ZHppc2ZzemVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTA4MzAsImV4cCI6MjA5MTQ4NjgzMH0.uTqieGXErIpooSUn0TMmYwYYJuo0yHYcAqdampHWRj4";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= USER ================= */
let userId = localStorage.getItem("currentUserId");

/* fallback safety */
async function getUser(){
  const { data } = await supabase.auth.getUser();
  if(data?.user){
    userId = data.user.id;
  }

  if(!userId){
    window.location.href = "login-signup.html";
  }
}

/* ================= MODAL ================= */
function show(msg){
  document.getElementById("msg").innerText = msg;
  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

/* ================= LOAD INVOICES ================= */
async function loadInvoices(){

  await getUser();

  const { data, error } = await supabase
    .from("invoices")
    .select("*")
    .eq("user_id", userId);

  const container = document.getElementById("list");
  container.innerHTML = "";

  if(error){
    container.innerHTML = "<p>Error loading invoices</p>";
    return;
  }

  if(!data || data.length === 0){
    container.innerHTML = "<p>No invoices found</p>";
    return;
  }

  data.forEach(inv=>{

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${inv.service_title || "Service"} - $${inv.payout_usd || 0}</h3>

      <p>Client: ${inv.client_name || "N/A"}</p>
      <p>Delivery: ${inv.delivery_date || "TBD"}</p>

      <p>Status:
        <span class="status ${inv.status}">
          ${inv.status}
        </span>
      </p>

      <button ${inv.status !== "Escrow" ? "disabled" : ""}
        onclick="submitWork('${inv.id}','${inv.payout_usd || 0}')">
        Submit Work
      </button>
    `;

    container.appendChild(card);
  });
}

/* ================= SUBMIT WORK FLOW ================= */
async function submitWork(invoiceId, amount){

  show("Submitting work...");

  try{

    // 1. update invoice
    await supabase
      .from("invoices")
      .update({ status: "Submitted" })
      .eq("id", invoiceId);

    // 2. update escrow
    await supabase
      .from("escrow")
      .update({ status: "ready_to_release" })
      .eq("invoice_id", invoiceId);

    // 3. credit wallet
    const { data: wallet } = await supabase
      .from("wallets")
      .select("*")
      .eq("user_id", userId)
      .maybeSingle();

    if(wallet){

      await supabase
        .from("wallets")
        .update({
          balance: Number(wallet.balance || 0) + Number(amount || 0)
        })
        .eq("user_id", userId);
    }

    show(`Work submitted! $${amount} released to wallet`);

    loadInvoices();

  } catch(err){
    console.error(err);
    show("Error submitting work");
  }
}

/* INIT */
loadInvoices();
</script>

</body>
</html>
