<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Submit Work</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:#050018;
  --glass:rgba(255,255,255,.08);
  --green:#00ff94;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif;}
body{background:var(--bg);color:#fff;min-height:100vh;}

header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px;
  background:rgba(255,255,255,.05);
}

.brand{display:flex;gap:10px;align-items:center;cursor:pointer;}
.brand img{width:45px;height:45px;}
.brand span{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.container{
  max-width:900px;
  margin:20px auto;
  padding:16px;
}

.card{
  background:var(--glass);
  padding:18px;
  border-radius:16px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.1);
}

button{
  padding:10px 16px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  color:#050015;
  margin-top:10px;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.status{
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
}

.Escrow{background:var(--zep-blue);color:#000;}
.Submitted{background:var(--green);color:#000;}
.Pending{background:orange;color:#000;}

.modal{
  position:fixed;inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.7);
}

.modal-box{
  background:var(--glass);
  padding:20px;
  border-radius:12px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <div class="brand" onclick="location.href='student-dashboard.html'">
    <img src="https://pe56d.s3.amazonaws.com/o_1jfnua21qtu1vi2pfom33p641h.png">
    <span>Zep Swipe</span>
  </div>
  <div>Submit Work</div>
</header>

<div class="container">
  <h2>Active Invoices</h2>
  <div id="list"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <p id="msg">Processing...</p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
/* ================= SUPABASE INIT ================= */
const supabase = window.supabase.createClient(
  "https://sqlisgobnayfpzamdolf.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28"
);

const userId = localStorage.getItem("currentUserId");

/* ================= UI ================= */
function show(msg){
  document.getElementById("msg").innerText = msg;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* ================= LOAD INVOICES ================= */
async function loadInvoices(){

  const { data, error } = await supabase
    .from("invoices")
    .select("*")
    .eq("user_id", userId);

  const container = document.getElementById("list");
  container.innerHTML = "";

  if(!data || data.length === 0){
    container.innerHTML = "<p>No invoices found</p>";
    return;
  }

  data.forEach(inv=>{
    const card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <h3>${inv.service_title} - $${inv.payout_usd}</h3>

      <p>Client: ${inv.client_name}</p>
      <p>Delivery: ${inv.delivery_date}</p>

      <p>Status:
        <span class="status ${inv.status}">
          ${inv.status}
        </span>
      </p>

      <button ${inv.status !== "Escrow" ? "disabled" : ""}
        onclick="submitWork('${inv.id}','${inv.payout_usd}')">
        Submit Work
      </button>
    `;

    container.appendChild(card);
  });
}

/* ================= SUBMIT WORK FLOW ================= */
async function submitWork(invoiceId, amount){

  show("Submitting work...");

  // 1. update invoice
  await supabase
    .from("invoices")
    .update({
      status: "Submitted"
    })
    .eq("id", invoiceId);

  // 2. update escrow
  await supabase
    .from("escrow")
    .update({
      status: "ready_to_release"
    })
    .eq("invoice_id", invoiceId);

  // 3. credit wallet
  const { data: wallet } = await supabase
    .from("wallets")
    .select("*")
    .eq("user_id", userId)
    .single();

  await supabase
    .from("wallets")
    .update({
      balance: wallet.balance + Number(amount)
    })
    .eq("user_id", userId);

  show(`Work submitted! $${amount} released to wallet`);
  loadInvoices();
}

loadInvoices();
</script>

</body>
</html>
