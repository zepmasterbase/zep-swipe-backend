<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zep Swipe — Notifications</title>
<meta name="description" content="Zep Swipe notifications and account updates.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --bg:#070707;--panel:#101010;--panel2:#151515;--line:#282828;
  --text:#f5f5f5;--muted:#8f8f8f;--green:#b8ff3b;--green2:#8dcc20;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:84px}
button,a{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.topbar{
 position:sticky;top:0;z-index:20;display:flex;align-items:center;
 justify-content:space-between;padding:13px 17px;background:rgba(7,7,7,.9);
 backdrop-filter:blur(18px);border-bottom:1px solid #202020
}
.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:.08em}
.logo{width:35px;height:35px;border-radius:10px;background:#000;border:1px solid #333;
display:grid;place-items:center;overflow:hidden;color:var(--green);font-weight:1000}
.logo img{width:100%;height:100%;object-fit:contain}
.back{
 width:40px;height:40px;border-radius:13px;border:1px solid var(--line);
 background:#111;color:#fff;display:grid;place-items:center
}
.page{width:min(760px,100%);margin:auto;padding:25px 16px 35px}
.hero{
 border:1px solid #292929;border-radius:24px;padding:23px;
 background:linear-gradient(135deg,rgba(184,255,59,.07),#111 45%,#0b0b0b);
 margin-bottom:15px
}
.kicker{font-size:10px;font-weight:1000;letter-spacing:.16em;color:var(--green)}
.hero h1{font-size:34px;line-height:1;margin:8px 0 8px;letter-spacing:-.045em}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.toolbar{
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:9px;border:1px solid var(--line);border-radius:17px;background:#0d0d0d;margin-bottom:10px
}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;color:#777;padding:9px 11px;border-radius:11px;
font-size:11px;font-weight:900}
.tab.active{background:#1a1a1a;color:#fff}
.tab span{color:var(--green);margin-left:3px}
.mark{border:0;background:none;color:var(--green);font-size:10px;font-weight:900}
.list{display:grid;gap:8px}
.item{
 display:flex;gap:12px;align-items:flex-start;padding:15px 13px;border:1px solid transparent;
 border-radius:18px;background:#0e0e0e;cursor:pointer;transition:.18s
}
.item:hover{border-color:#303030;background:#131313;transform:translateY(-1px)}
.item.unread{background:rgba(184,255,59,.045);border-color:#26361b}
.icon{
 flex:0 0 42px;width:42px;height:42px;border-radius:14px;background:#191919;
 color:var(--green);display:grid;place-items:center
}
.body{min-width:0;flex:1}
.row{display:flex;justify-content:space-between;gap:10px}
.title{font-size:13px;font-weight:950}
.time{font-size:9px;color:#666;white-space:nowrap}
.message{font-size:11px;color:#999;line-height:1.5;margin-top:5px}
.meta{display:flex;align-items:center;gap:7px;margin-top:9px;color:#666;font-size:9px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);
box-shadow:0 0 9px rgba(184,255,59,.5)}
.empty,.loading,.error{
 padding:58px 20px;text-align:center;border:1px solid var(--line);border-radius:20px;background:#0e0e0e
}
.empty-icon{width:54px;height:54px;border-radius:17px;background:#181818;color:#666;
display:grid;place-items:center;margin:0 auto 12px}
.empty strong{display:block;font-size:14px;margin-bottom:5px}
.empty span,.error span{display:block;color:#777;font-size:11px;line-height:1.5}
.spinner{width:18px;height:18px;border:2px solid #303030;border-top-color:var(--green);
border-radius:50%;display:inline-block;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.error strong{display:block;margin-bottom:6px}
.retry{margin-top:14px;border:1px solid #343434;background:#181818;color:#fff;
padding:10px 14px;border-radius:12px;font-size:11px;font-weight:900}
.footer{
 position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:1fr 1fr;
 background:rgba(8,8,8,.95);backdrop-filter:blur(18px);border-top:1px solid #222;
 padding:9px 10px max(9px,env(safe-area-inset-bottom))
}
.footer button{border:0;background:none;color:#888;font-size:10px;font-weight:800;
display:flex;align-items:center;justify-content:center;gap:6px;padding:8px}
.footer button:hover{color:var(--green)}
@media(max-width:560px){
 .page{padding:16px 12px 25px}.hero{padding:19px}.hero h1{font-size:30px}
 .toolbar{align-items:stretch}.mark{font-size:9px}.time{font-size:8px}
}
</style>
</head>

<body>
<header class="topbar">
  <button class="back" onclick="goBack()" aria-label="Back"><i data-lucide="arrow-left"></i></button>
  <a class="brand" href="marketplace.html">
    <span class="logo">
      <img src="logo.png" alt="Zep Swipe" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span style="display:none">Z</span>
    </span>
    <span>ZEP SWIPE</span>
  </a>
  <div style="width:40px"></div>
</header>

<main class="page">
  <section class="hero">
    <div class="kicker"><span class="dot" style="display:inline-block;margin-right:5px"></span>ACCOUNT CENTER</div>
    <h1>Notifications</h1>
    <p>Important updates from Zep Swipe, including deals, customer opportunities and account activity.</p>
  </section>

  <section class="toolbar">
    <div class="tabs">
      <button class="tab active" id="allTab" onclick="setFilter('all')">All</button>
      <button class="tab" id="unreadTab" onclick="setFilter('unread')">Unread <span id="unreadCount">0</span></button>
    </div>
    <button class="mark" onclick="markAllRead()">Mark all read</button>
  </section>

  <section class="list" id="notificationList">
    <div class="loading">
      <span class="spinner"></span>
      <div>Loading your notifications…</div>
    </div>
  </section>
</main>

<footer class="footer">
  <button onclick="goBack()"><i data-lucide="layout-dashboard"></i>Dashboard</button>
  <button onclick="location.href='marketplace.html'"><i data-lucide="store"></i>Marketplace</button>
</footer>

<script>
const SUPABASE_URL="https://tieekcelcathtuluwcfc.supabase.co";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentUser=null;
let notifications=[];
let filter="all";

const notificationTypes={
  deal_submitted:{icon:"send",title:"Deal submitted"},
  deal_approved:{icon:"badge-check",title:"Deal approved"},
  deal_rejected:{icon:"circle-x",title:"Deal needs attention"},
  deal_redeemed:{icon:"ticket-check",title:"Deal redeemed"},
  new_lead:{icon:"user-plus",title:"New customer opportunity"},
  mobility_lead:{icon:"car-front",title:"New mobility enquiry"},
  payment:{icon:"credit-card",title:"Payment update"},
  default:{icon:"bell",title:"Zep Swipe update"}
};

function goBack(){
  if(document.referrer && document.referrer.includes(location.host)) history.back();
  else location.href="business-deals.html";
}

function escapeHtml(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function timeAgo(value){
 const d=new Date(value),s=Math.max(0,Math.floor((Date.now()-d)/1000));
 if(s<60)return"Just now";
 const m=Math.floor(s/60);if(m<60)return m+"m ago";
 const h=Math.floor(m/60);if(h<24)return h+"h ago";
 const days=Math.floor(h/24);if(days<7)return days+"d ago";
 return d.toLocaleDateString();
}

function metaFor(type){
 return notificationTypes[String(type||"default").toLowerCase()]||notificationTypes.default;
}

function setFilter(value){
 filter=value;
 document.getElementById("allTab").classList.toggle("active",value==="all");
 document.getElementById("unreadTab").classList.toggle("active",value==="unread");
 render();
}

function render(){
 const list=document.getElementById("notificationList");
 const unread=notifications.filter(n=>!n.read_at);
 document.getElementById("unreadCount").textContent=unread.length;

 const visible=filter==="unread"?unread:notifications;

 if(!visible.length){
  list.innerHTML=`
   <div class="empty">
    <div class="empty-icon"><i data-lucide="${filter==="unread"?"check-check":"bell-off"}"></i></div>
    <strong>${filter==="unread"?"You're all caught up":"No notifications yet"}</strong>
    <span>${filter==="unread"
      ?"There are no unread updates right now."
      :"When something important happens on Zep Swipe, it will appear here."}</span>
   </div>`;
  lucide.createIcons();
  return;
 }

 list.innerHTML=visible.map(n=>{
  const meta=metaFor(n.type);
  const unreadClass=n.read_at?"":"unread";
  return `
   <article class="item ${unreadClass}" onclick="openNotification('${encodeURIComponent(n.id)}')">
    <div class="icon"><i data-lucide="${meta.icon}"></i></div>
    <div class="body">
     <div class="row">
      <span class="title">${escapeHtml(n.title||meta.title)}</span>
      <span class="time">${escapeHtml(timeAgo(n.created_at))}</span>
     </div>
     <div class="message">${escapeHtml(n.message||"")}</div>
     <div class="meta">
      ${n.read_at?'<span>Read</span>':'<span class="dot"></span><span>Unread</span>'}
     </div>
    </div>
   </article>`;
 }).join("");

 lucide.createIcons();
}

async function load(){
 const list=document.getElementById("notificationList");
 try{
  const {data:{session}}=await db.auth.getSession();
  currentUser=session?.user||null;

  if(!currentUser){
   location.href="auth.html?redirect=notification.html";
   return;
  }

  const {data,error}=await db
   .from("notifications")
   .select("id,user_id,type,title,message,data,read_at,created_at")
   .eq("user_id",currentUser.id)
   .order("created_at",{ascending:false})
   .limit(100);

  if(error)throw error;

  notifications=data||[];
  render();
 }catch(err){
  console.error("Notification load:",err);
  list.innerHTML=`
   <div class="error">
    <div class="empty-icon"><i data-lucide="cloud-off"></i></div>
    <strong>Notifications unavailable</strong>
    <span>We couldn't load your notifications. Check your connection or Supabase notification setup.</span>
    <button class="retry" onclick="load()">Try again</button>
   </div>`;
  lucide.createIcons();
 }
}

async function markRead(id){
 const item=notifications.find(n=>String(n.id)===String(id));
 if(!item||item.read_at||!currentUser)return;

 const {error}=await db
  .from("notifications")
  .update({read_at:new Date().toISOString()})
  .eq("id",id)
  .eq("user_id",currentUser.id);

 if(!error){
  item.read_at=new Date().toISOString();
  render();
 }
}

async function markAllRead(){
 if(!currentUser)return;
 const unread=notifications.filter(n=>!n.read_at);
 if(!unread.length)return;

 const now=new Date().toISOString();
 const {error}=await db
  .from("notifications")
  .update({read_at:now})
  .eq("user_id",currentUser.id)
  .is("read_at",null);

 if(error){
  alert("Could not mark notifications as read.");
  return;
 }

 notifications.forEach(n=>{if(!n.read_at)n.read_at=now});
 render();
}

async function openNotification(encodedId){
 const id=decodeURIComponent(encodedId);
 const item=notifications.find(n=>String(n.id)===String(id));
 if(!item)return;

 await markRead(id);

 const data=item.data||{};
 const url=data.url||data.link;
 const dealId=data.deal_id||data.dealId;

 if(url){
  location.href=url;
 }else if(dealId){
  location.href="deal.html?id="+encodeURIComponent(dealId);
 }
}

function initRealtime(){
 try{
  db.channel("zep-swipe-notifications-page")
   .on(
    "postgres_changes",
    {event:"INSERT",schema:"public",table:"notifications",filter:`user_id=eq.${currentUser.id}`},
    payload=>{
     if(payload?.new){
      notifications=[payload.new,...notifications].slice(0,100);
      render();
     }
    }
   )
   .subscribe();
 }catch(err){
  console.warn("Notification realtime unavailable:",err);
 }
}

document.addEventListener("DOMContentLoaded",async()=>{
 lucide.createIcons();
 await load();
 if(currentUser)initRealtime();
});
</script>
</body>
</html>
