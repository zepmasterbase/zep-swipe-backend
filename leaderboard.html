<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Leaderboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #0b0f1a, #05070d);
    color: white;
}

/* HEADER */
.header {
    text-align: center;
    padding: 20px;
}
.logo {
    font-size: 26px;
    font-weight: bold;
    color: #00ffd5;
}
.subtitle {
    font-size: 12px;
    opacity: 0.7;
}

/* BACK */
.nav-bar {
    display: flex;
    justify-content: center;
}
.back-btn {
    padding: 10px 16px;
    border-radius: 20px;
    border: 1px solid rgba(0,255,213,0.4);
    background: rgba(0,255,213,0.08);
    color: #00ffd5;
    cursor: pointer;
}

/* TABS */
.tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
}
.tab {
    padding: 10px 18px;
    border-radius: 20px;
    background: #111827;
    cursor: pointer;
}
.tab.active {
    background: #00ffd5;
    color: black;
}

/* CONTAINER */
.container {
    max-width: 500px;
    margin: auto;
    padding: 15px;
}

/* CARD */
.card {
    background: linear-gradient(145deg, #0f172a, #0b1220);
    border: 1px solid rgba(0,255,213,0.15);
    padding: 12px;
    margin: 10px 0;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s;
}

/* TOP 3 GLOW */
.top1 { box-shadow: 0 0 15px gold; }
.top2 { box-shadow: 0 0 10px silver; }
.top3 { box-shadow: 0 0 10px orange; }

.card:hover {
    transform: scale(1.03);
    border-color: #00ffd5;
}

.left {
    display: flex;
    gap: 10px;
}

.rank {
    color: #00ffd5;
    font-weight: bold;
}

.xp {
    color: #ffd700;
    font-weight: bold;
}

/* LIVE */
.live {
    text-align: center;
    font-size: 11px;
    color: #00ffd5;
    animation: pulse 1.5s infinite;
}
@keyframes pulse {
    0% {opacity: 0.4;}
    50% {opacity: 1;}
    100% {opacity: 0.4;}
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">ZEP SWIPE 🧠</div>
    <div class="subtitle">Web3 Campus Leaderboard</div>

    <div class="nav-bar">
        <button class="back-btn" onclick="window.location.href='success.html'">
            ⬅ Back to Dashboard
        </button>
    </div>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('global')">🌍 Global</div>
    <div class="tab" onclick="switchTab('country')">📍 Country</div>
</div>

<div class="container">
<div class="live">⚡ Live XP (Real Data)</div>
<div id="leaderboard"></div>
</div>

<script>
// ======================
// SUPABASE INIT
// ======================
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ======================
let currentTab = "global";
let currentUserCountry = null;

// ======================
// GET USER COUNTRY
// ======================
async function getUserCountry() {
    let userId = localStorage.getItem("zep_user_id");

    if (!userId) return;

    const { data } = await client
        .from("users")
        .select("country")
        .eq("id", userId)
        .single();

    if (data) currentUserCountry = data.country;
}

// ======================
// FETCH LEADERBOARD
// ======================
async function loadLeaderboard() {

    let query = client
        .from("users")
        .select("full_name, country, xp")
        .order("xp", { ascending: false })
        .limit(50);

    if (currentTab === "country" && currentUserCountry) {
        query = client
            .from("users")
            .select("full_name, country, xp")
            .eq("country", currentUserCountry)
            .order("xp", { ascending: false });
    }

    const { data } = await query;

    renderLeaderboard(data || []);
}

// ======================
// RENDER
// ======================
function renderLeaderboard(data) {

    let container = document.getElementById("leaderboard");
    container.innerHTML = "";

    data.forEach((u, index) => {

        let cls = "";
        if(index===0) cls="top1";
        if(index===1) cls="top2";
        if(index===2) cls="top3";

        container.innerHTML += `
        <div class="card ${cls}">
            <div class="left">
                <div class="rank">#${index+1}</div>
                <div>
                    <div>${u.full_name || "Anonymous"}</div>
                    <div style="font-size:11px;opacity:0.6">${u.country}</div>
                </div>
            </div>
            <div class="xp" id="xp-${index}">0</div>
        </div>
        `;

        animateXP(`xp-${index}`, u.xp);
    });
}

// ======================
// XP ANIMATION
// ======================
function animateXP(id, value) {
    let el = document.getElementById(id);
    let count = 0;
    let step = Math.ceil(value / 20);

    let interval = setInterval(() => {
        count += step;
        if(count >= value){
            count = value;
            clearInterval(interval);
        }
        el.innerText = count + " XP";
    }, 30);
}

// ======================
// TAB SWITCH
// ======================
function switchTab(tab){
    currentTab = tab;

    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    event.target.classList.add("active");

    loadLeaderboard();
}

// ======================
// INIT
// ======================
async function init(){
    await getUserCountry();
    await loadLeaderboard();

    // 🔥 REALTIME UPDATE
    client.channel('leaderboard')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'users' },
        () => loadLeaderboard()
      )
      .subscribe();
}

init();
</script>

</body>
</html>
