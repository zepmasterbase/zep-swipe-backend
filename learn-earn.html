<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep AI Learn & Earn</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400,500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,.08);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}
body{background:var(--bg);color:#fff;min-height:100vh;}

header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px;margin:16px;border-radius:16px;
  background:rgba(255,255,255,.05);
}

.brand{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.home-btn{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  border:none;color:#000;font-size:20px;
}

.container{max-width:1200px;margin:auto;padding:16px;}

.profile{
  display:flex;gap:14px;align-items:center;
  background:var(--glass);padding:14px;border-radius:14px;
}

.profile img{width:70px;height:70px;border-radius:50%;}

.courses{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;margin-top:16px;
}

.course{
  background:rgba(255,255,255,.06);
  padding:16px;border-radius:14px;cursor:pointer;
}

.course.selected{border:2px solid var(--green);}

.tasks{
  margin-top:20px;
  background:var(--glass);
  padding:16px;border-radius:16px;
}

.task{
  background:rgba(255,255,255,.05);
  padding:14px;margin-bottom:10px;border-radius:12px;
}

.task.completed{opacity:.5;}

.ai-box{
  background:rgba(0,255,255,.08);
  border:1px solid rgba(0,255,255,.3);
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:13px;
}

button{
  border:none;border-radius:999px;padding:10px 14px;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;font-family:Orbitron;cursor:pointer;
}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;
}

.modal{
  background:var(--glass);
  padding:20px;border-radius:14px;width:90%;max-width:400px;
}

.modal input{
  width:100%;padding:10px;border-radius:10px;border:none;margin-bottom:10px;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep AI Learn & Earn</div>
  <button class="home-btn" onclick="location.href='student-dashboard.html'">🏠</button>
</header>

<div class="container">

  <div class="profile">
    <img id="profileImg">
    <div>
      <h3 id="studentName"></h3>
      <span id="studentEmail"></span>
    </div>
  </div>

  <!-- 🤖 AI INSIGHT PANEL -->
  <div class="ai-box">
    🤖 <span id="aiInsight">Zep AI analyzing learning performance...</span>
  </div>

  <div class="courses" id="courseList"></div>

  <div class="tasks" id="taskSection" style="display:none">
    <h3 id="courseTitle"></h3>
    <div id="tasksContainer"></div>
    <p><b>ZAC Earned:</b> <span id="zac">0</span></p>
  </div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Submit Task Link</h3>
    <input id="linkInput" placeholder="Paste submission link">
    <button onclick="submitTask()">Submit</button>
  </div>
</div>

<script>

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= STATE ================= */
let user = null;
let currentCourse = null;
let selectedDay = null;

/* ================= COURSES ================= */
const coursesData = {
  "Virtual Assistant":[
    "Intro video task",
    "Email system setup",
    "Calendar automation",
    "Client report task"
  ],
  "AI & Prompt Engineering":[
    "Intro video task",
    "Prompt framework",
    "AI workflow build",
    "AI portfolio"
  ]
};

/* ================= AUTH ================= */
async function loadUser(){
  const { data:{ user:authUser } } = await supabase.auth.getUser();

  if(!authUser){
    location.href="login.html";
    return;
  }

  user = authUser;

  document.getElementById("studentName").innerText = user.email;
  document.getElementById("studentEmail").innerText = user.id;

  loadProgress();
}
loadUser();

/* ================= LOAD PROGRESS ================= */
async function loadProgress(){

  const { data } = await supabase
    .from("learn_earn_progress")
    .select("*")
    .eq("user_id", user.id);

  renderCourses();
  renderTasks(data || []);
  runZepAI(data || []);
}

/* ================= COURSES ================= */
function renderCourses(){

  const container = document.getElementById("courseList");
  container.innerHTML="";

  Object.keys(coursesData).forEach(course=>{

    const div=document.createElement("div");
    div.className="course";
    div.innerHTML=`<h4>${course}</h4>`;
    div.onclick=()=>selectCourse(course);

    container.appendChild(div);
  });
}

function selectCourse(course){
  currentCourse = course;
  loadProgress();
}

/* ================= TASKS ================= */
function renderTasks(progress){

  if(!currentCourse) return;

  document.getElementById("taskSection").style.display="block";
  document.getElementById("courseTitle").innerText=currentCourse;

  const container = document.getElementById("tasksContainer");
  container.innerHTML="";

  const completed = progress
    .filter(p=>p.course===currentCourse)
    .map(p=>p.day);

  coursesData[currentCourse].forEach((task,idx)=>{

    const day = idx+1;

    const div = document.createElement("div");
    div.className = "task" + (completed.includes(day) ? " completed":"");

    div.innerHTML=`
      <b>Day ${day}</b>
      <p>${task}</p>
      ${completed.includes(day)
        ? "<span>✔ Completed</span>"
        : `<button onclick="openModal(${day})">Submit</button>`}
    `;

    container.appendChild(div);
  });
}

/* ================= AI ENGINE ================= */
function runZepAI(progress){

  let completed = progress.length;
  let quality = "learning";

  if(completed >= 8) quality = "advanced learner";
  else if(completed >= 4) quality = "intermediate learner";
  else if(completed > 0) quality = "beginner learner";

  let msg = "";

  if(completed === 0){
    msg = "🚀 Start your first task to begin earning ZAC.";
  }
  else if(completed < 3){
    msg = "📘 Keep going! You're building momentum.";
  }
  else if(completed < 7){
    msg = "🔥 Good progress! You're becoming consistent.";
  }
  else{
    msg = "🏆 Excellent performance! Eligible for bonus recommendations.";
  }

  document.getElementById("aiInsight").innerText =
    `Status: ${quality} | ${msg}`;
}

/* ================= MODAL ================= */
function openModal(day){
  selectedDay = day;
  document.getElementById("modalBg").style.display="flex";
}

/* ================= SUBMIT TASK ================= */
async function submitTask(){

  const link = document.getElementById("linkInput").value;

  if(!link){
    alert("Invalid link");
    return;
  }

  const { error } = await supabase
    .from("learn_earn_progress")
    .insert([{
      user_id: user.id,
      course: currentCourse,
      day: selectedDay,
      link
    }]);

  if(error){
    alert("Error saving task");
    return;
  }

  document.getElementById("modalBg").style.display="none";
  loadProgress();
}

</script>

</body>
</html>
