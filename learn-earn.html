<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep OS 3.2 — Learn & Earn</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --bg: radial-gradient(circle at 20% 10%, #0b0030, #000);
  --glass: rgba(255,255,255,0.06);
  --stroke: rgba(255,255,255,0.12);
  --text:#fff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  margin:14px;
  border-radius:16px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--stroke);
  backdrop-filter:blur(14px);
}

.brand{
  font-family:Orbitron;
  font-size:1.2rem;
  background:linear-gradient(90deg,var(--blue),var(--violet),var(--green));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.home-btn{
  width:46px;
  height:46px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  color:#000;
  font-size:18px;
  transition:0.2s;
}
.home-btn:hover{
  transform:scale(1.05);
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

/* PROFILE */
.profile{
  display:flex;
  gap:14px;
  align-items:center;
  background:linear-gradient(90deg,rgba(0,240,255,0.06),rgba(156,77,255,0.06));
  border:1px solid var(--stroke);
  padding:14px;
  border-radius:14px;
}

.profile img{
  width:68px;
  height:68px;
  border-radius:50%;
  border:2px solid rgba(0,240,255,0.3);
}

/* AI BOX */
.ai-box{
  margin:14px 0;
  padding:12px;
  border-radius:12px;
  background:rgba(0,240,255,0.06);
  border:1px solid rgba(0,240,255,0.2);
  font-size:13px;
}

/* COURSES */
.courses{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;
  margin-top:14px;
}

.course{
  background:rgba(255,255,255,0.05);
  border:1px solid var(--stroke);
  padding:14px;
  border-radius:14px;
  cursor:pointer;
  transition:0.2s;
}

.course:hover{
  transform:translateY(-4px);
  border-color:var(--blue);
}

.course.selected{
  border:2px solid var(--green);
}

/* TASKS */
.tasks{
  margin-top:18px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--stroke);
  padding:16px;
  border-radius:16px;
}

.task{
  background:rgba(255,255,255,0.05);
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
}

.task.completed{
  opacity:0.5;
}

/* BUTTON */
button{
  border:none;
  border-radius:999px;
  padding:10px 14px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  font-weight:bold;
}

/* MODAL */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal{
  background:var(--glass);
  border:1px solid var(--stroke);
  padding:18px;
  border-radius:14px;
  width:90%;
  max-width:400px;
  backdrop-filter:blur(12px);
}

.modal input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
  outline:none;
  background:rgba(0,0,0,0.4);
  color:white;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep OS 3.2 Learn & Earn</div>
  <button class="home-btn" onclick="location.href='student-dashboard.html'">🏠</button>
</header>

<div class="container">

  <div class="profile">
    <img id="profileImg" src="https://via.placeholder.com/70">
    <div>
      <h3 id="studentName">Loading...</h3>
      <small id="studentEmail"></small>
    </div>
  </div>

  <div class="ai-box">
    🤖 <span id="aiInsight">Analyzing learning progress...</span>
  </div>

  <div class="courses" id="courseList"></div>

  <div class="tasks" id="taskSection" style="display:none">
    <h3 id="courseTitle"></h3>
    <div id="tasksContainer"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Submit Task Link</h3>
    <input id="linkInput" placeholder="Paste submission link">
    <button onclick="submitTask()">Submit</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user=null;
let currentCourse=null;
let selectedDay=null;

const coursesData={
  "Virtual Assistant":[
    "Intro video task",
    "Email system setup",
    "Calendar automation",
    "Client report task"
  ],
  "AI & Prompt Engineering":[
    "Intro video task",
    "Prompt framework",
    "AI workflow build",
    "AI portfolio"
  ]
};

async function loadUser(){

  const { data:{user:authUser} } = await sb.auth.getUser();

  if(!authUser){
    location.href="login.html";
    return;
  }

  user=authUser;

  document.getElementById("studentName").innerText =
    user.user_metadata?.name || user.email;

  document.getElementById("studentEmail").innerText =
    user.email;

  loadProgress();
}

loadUser();

async function loadProgress(){

  const { data } = await sb
    .from("learn_earn_progress")
    .select("*")
    .eq("user_id",user.id);

  renderCourses();
  renderTasks(data||[]);
  runAI(data||[]);
}

function renderCourses(){

  const container=document.getElementById("courseList");
  container.innerHTML="";

  Object.keys(coursesData).forEach(course=>{

    const div=document.createElement("div");
    div.className="course";
    div.innerHTML=`<h4>${course}</h4>`;

    div.onclick=()=>{
      currentCourse=course;
      loadProgress();
    };

    container.appendChild(div);
  });
}

function renderTasks(progress){

  if(!currentCourse) return;

  document.getElementById("taskSection").style.display="block";
  document.getElementById("courseTitle").innerText=currentCourse;

  const container=document.getElementById("tasksContainer");
  container.innerHTML="";

  const completed=progress
    .filter(p=>p.course===currentCourse)
    .map(p=>p.day);

  coursesData[currentCourse].forEach((task,i)=>{

    const day=i+1;
    const done=completed.includes(day);

    const div=document.createElement("div");
    div.className="task"+(done?" completed":"");

    div.innerHTML=`
      <b>Day ${day}</b>
      <p>${task}</p>
      ${done?"✔ Completed":`<button onclick="openModal(${day})">Submit</button>`}
    `;

    container.appendChild(div);
  });
}

function runAI(progress){

  let completed=progress.length;

  let msg=
    completed===0?"Start your first task to earn ZAC":
    completed<3?"Keep going, momentum building":
    completed<7?"Great progress, stay consistent":
    "Excellent! You're becoming job-ready";

  document.getElementById("aiInsight").innerText=
    `AI Insight: ${msg}`;
}

function openModal(day){
  selectedDay=day;
  document.getElementById("modalBg").style.display="flex";
}

async function submitTask(){

  const link=document.getElementById("linkInput").value.trim();

  if(!link) return alert("Enter link");

  const { data:existing } = await sb
    .from("learn_earn_progress")
    .select("*")
    .eq("user_id",user.id)
    .eq("course",currentCourse)
    .eq("day",selectedDay)
    .maybeSingle();

  if(existing) return alert("Already submitted");

  await sb.from("learn_earn_progress").insert([{
    user_id:user.id,
    course:currentCourse,
    day:selectedDay,
    link,
    created_at:new Date()
  }]);

  document.getElementById("modalBg").style.display="none";
  document.getElementById("linkInput").value="";

  loadProgress();
}
</script>

</body>
</html>
