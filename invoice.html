<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zep AI Invoice → Escrow System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --orange:#ffb020;
  --red:#ff4d4d;
  --glass:rgba(255,255,255,0.07);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  background:var(--bg);
  color:#fff;
  padding:20px;
}

/* HEADER */
h2{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

/* AI BOX */
.ai{
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.25);
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
  font-size:13px;
}

/* FORM CARD */
.box{
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.1);
  padding:16px;
  border-radius:14px;
  max-width:500px;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.4);
  color:#fff;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  font-weight:bold;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
}

/* STATUS COLORS */
.safe{color:var(--green);}
.medium{color:var(--orange);}
.high{color:var(--red);}
</style>
</head>

<body>

<h2>🧾 Zep AI Invoice → Escrow System</h2>

<!-- 🤖 AI PANEL -->
<div class="ai">
  🤖 <span id="aiStatus">AI ready to analyze invoice risk...</span>
</div>

<div class="box">

  <input id="desc" placeholder="Job description">
  <input id="buyer" placeholder="Buyer (auth_id)">
  <input id="seller" placeholder="Seller (auth_id)">
  <input id="amount" type="number" placeholder="Amount (ZAC)">

  <button onclick="createInvoice()">Create Invoice → Escrow</button>
</div>

<script>

/* ================= SUPABASE ================= */
const supabase = window.supabase.createClient(
  "https://sqlisgobnayfpzamdolf.supabase.co",
  "YOUR_ANON_KEY"
);

/* ================= ZEP AI RISK ENGINE ================= */
function analyzeInvoice(desc, amount){

  let risk = 0;
  let notes = [];

  if(!desc || desc.length < 5){
    risk += 40;
    notes.push("Weak description");
  }

  if(amount <= 0){
    risk += 50;
    notes.push("Invalid amount");
  }

  if(amount > 100000){
    risk += 20;
    notes.push("High-value transaction");
  }

  const badWords = ["cash", "urgent scam", "gift", "refund me", "hack"];
  badWords.forEach(word=>{
    if(desc.toLowerCase().includes(word)){
      risk += 30;
      notes.push("Suspicious keyword detected");
    }
  });

  let status = "safe";

  if(risk >= 70) status = "high";
  else if(risk >= 40) status = "medium";

  return { risk, status, notes };
}

/* ================= CREATE INVOICE → ESCROW ================= */
async function createInvoice(){

  const description = document.getElementById("desc").value;
  const buyer_id = document.getElementById("buyer").value;
  const seller_id = document.getElementById("seller").value;
  const amount = Number(document.getElementById("amount").value);

  if(!description || !buyer_id || !seller_id || !amount){
    alert("Please fill all fields");
    return;
  }

  // 🤖 AI ANALYSIS
  const ai = analyzeInvoice(description, amount);

  document.getElementById("aiStatus").innerHTML =
    `Risk: <b class="${ai.status}">${ai.status.toUpperCase()}</b> | Score: ${ai.risk} | Notes: ${ai.notes.join(", ")}`;

  const invoice_id = "INV-" + Date.now();

  // 💼 INSERT ESCROW
  const { error } = await supabase
    .from("escrow")
    .insert([{
      invoice_id,
      description,
      buyer_id,
      seller_id,
      amount,
      status: "locked",
      ai_risk: ai.status,
      ai_score: ai.risk
    }]);

  if(error){
    console.log(error);
    alert("Failed to create invoice escrow");
    return;
  }

  // RESET
  document.getElementById("desc").value = "";
  document.getElementById("buyer").value = "";
  document.getElementById("seller").value = "";
  document.getElementById("amount").value = "";

  alert("Invoice created → Escrow locked 🔒");
}

</script>

</body>
</html>
