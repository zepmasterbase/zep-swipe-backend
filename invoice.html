<!DOCTYPE html>
<html>
<head>
  <title>Create Invoice</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial; background:#0f172a; color:white; padding:20px; }
    input, button { width:100%; padding:10px; margin:5px 0; }
    button { background:#22c55e; border:none; color:white; }
  </style>
</head>

<body>

<h2>🧾 Create Invoice → Escrow</h2>

<input id="desc" placeholder="Job description" />
<input id="buyer" placeholder="Buyer (auth_id)" />
<input id="seller" placeholder="Seller (auth_id)" />
<input id="amount" type="number" placeholder="Amount (ZAC)" />

<button onclick="createInvoice()">Create Invoice</button>

<script>

const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* =========================
   CREATE INVOICE + ESCROW
========================= */
async function createInvoice() {

  const description = document.getElementById("desc").value;
  const buyer_id = document.getElementById("buyer").value;
  const seller_id = document.getElementById("seller").value;
  const amount = document.getElementById("amount").value;

  // Generate invoice ID
  const invoice_id = "INV-" + Date.now();

  /* 1. CREATE ESCROW DIRECTLY FROM INVOICE */
  const { data, error } = await supabase
    .from("escrow")
    .insert([
      {
        invoice_id,
        description,
        buyer_id,
        seller_id,
        amount,
        status: "pending"
      }
    ]);

  if (error) {
    alert("Error creating invoice escrow");
    console.log(error);
    return;
  }

  alert("Invoice created + Escrow locked 🔒");

  console.log("Created:", data);
}

</script>

</body>
</html>
