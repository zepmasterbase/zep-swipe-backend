<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Invoice</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400,500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:#050018;
  --glass:rgba(255,255,255,0.08);
  --green:#00ff94;
  --yellow:#ffc107;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif;}
body{background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  background:rgba(255,255,255,0.05);
}

.container{max-width:900px;margin:20px auto;padding:16px;display:flex;flex-direction:column;gap:20px;}

.card{
  background:var(--glass);
  padding:18px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
}

.status-badge{
  padding:6px 12px;
  border-radius:12px;
  margin-left:10px;
}

.pending{background:var(--yellow);color:#000;}
.escrow{background:var(--zep-blue);color:#000;}
.released{background:var(--green);color:#000;}

button{
  padding:12px 20px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
}

button.secondary{background:rgba(255,255,255,0.1);color:#fff;}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
}
.modal-box{
  background:var(--glass);
  padding:20px;
  border-radius:16px;
}
</style>
</head>

<body>

<header>
  <h2>Zep Swipe Invoice</h2>
</header>

<div class="container">

  <div class="card">
    <h3>
      Invoice #<span id="invoiceId"></span>
      <span id="statusBadge" class="status-badge pending">Pending</span>
    </h3>
  </div>

  <div class="card">
    <h3>Student</h3>
    <div id="studentName"></div>
  </div>

  <div class="card">
    <h3>Client</h3>
    <div id="clientName"></div>
    <div id="clientCountry"></div>
  </div>

  <div class="card">
    <h3>Service</h3>
    <div id="serviceTitle"></div>
    <p id="serviceDesc"></p>
  </div>

  <div class="card">
    <h3>Payment</h3>
    <div>Subtotal: $<span id="subtotal"></span></div>
    <div>Fee: $<span id="fee"></span></div>
    <div>Total: $<span id="total"></span></div>
  </div>

  <button id="payBtn">Pay into Escrow</button>
  <button id="releaseBtn" class="secondary" style="display:none;">Release Funds</button>

</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalText">Loading...</div>
</div>

<script>
/* =========================
   SUPABASE INIT
========================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   STATE
========================= */
let invoice = null;

/* =========================
   GET INVOICE ID FROM URL
========================= */
const params = new URLSearchParams(window.location.search);
const invoiceId = params.get("invoiceId");

/* =========================
   LOAD INVOICE
========================= */
async function loadInvoice(){

  const { data, error } = await sb
    .from("invoices")
    .select("*")
    .eq("id", invoiceId)
    .single();

  if(error || !data){
    document.body.innerHTML = "<h3 style='color:white;text-align:center'>Invoice not found</h3>";
    return;
  }

  invoice = data;
  render();
}

loadInvoice();

/* =========================
   RENDER
========================= */
function render(){

  document.getElementById("invoiceId").innerText = invoice.id;

  const badge = document.getElementById("statusBadge");
  badge.innerText = invoice.status;
  badge.className = "status-badge " + invoice.status.toLowerCase();

  document.getElementById("studentName").innerText = invoice.student_id || "Student";
  document.getElementById("clientName").innerText = invoice.client_name;
  document.getElementById("clientCountry").innerText = invoice.client_country;

  document.getElementById("serviceTitle").innerText = invoice.service_title;
  document.getElementById("serviceDesc").innerText = invoice.service_desc;

  document.getElementById("subtotal").innerText = invoice.subtotal;
  document.getElementById("fee").innerText = invoice.fee;
  document.getElementById("total").innerText = invoice.total;

  if(invoice.status === "Pending"){
    payBtn.style.display = "inline-block";
    releaseBtn.style.display = "none";
  } else if(invoice.status === "Escrow"){
    payBtn.style.display = "none";
    releaseBtn.style.display = "inline-block";
  } else {
    payBtn.style.display = "none";
    releaseBtn.style.display = "none";
  }
}

/* =========================
   MODAL
========================= */
function show(msg){
  modal.style.display = "flex";
  modalText.innerText = msg;
}

modal.onclick = ()=> modal.style.display="none";

/* =========================
   PAY TO ESCROW
========================= */
payBtn.onclick = async ()=>{

  show("Sending payment to escrow...");

  const { error } = await sb
    .from("invoices")
    .update({ status: "Escrow" })
    .eq("id", invoice.id);

  if(error){
    show("Payment failed");
    return;
  }

  invoice.status = "Escrow";
  render();
  show("Payment sent to escrow!");
};

/* =========================
   RELEASE FUNDS
========================= */
releaseBtn.onclick = async ()=>{

  show("Releasing funds...");

  const { error } = await sb
    .from("invoices")
    .update({ status: "Released" })
    .eq("id", invoice.id);

  if(error){
    show("Release failed");
    return;
  }

  invoice.status = "Released";
  render();
  show("Funds released successfully!");
};
</script>

</body>
</html>
