<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zep Swipe | Create Invoice</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
:root {
  --primary:#5b6cff;
  --bg:#0b1020;
  --card:#121a35;
  --text:#eaf0ff;
  --muted:#9aa4d6;
  --success:#2dd4bf;
  --radius:16px;
}

* {
  box-sizing:border-box;
  font-family: Inter, system-ui, sans-serif;
}

body {
  margin:0;
  background:linear-gradient(135deg,#070b1a,#0f1633);
  color:var(--text);
}

header {
  display:flex;
  justify-content:space-between;
  padding:16px 24px;
  background:#0d1430;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.container {
  max-width:1000px;
  margin:24px auto;
  padding:0 16px;
}

.card {
  background:var(--card);
  padding:20px;
  border-radius:var(--radius);
  margin-bottom:18px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;
}

label {
  font-size:12px;
  color:var(--muted);
}

input, select, textarea {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#0a1230;
  color:var(--text);
}

textarea { min-height:100px; }

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(135deg,#5b6cff,#7c8cff);
  color:white;
  font-weight:600;
}

button:hover {
  opacity:.9;
}

.breakdown {
  background:#0a1230;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h1>Zep Swipe • Invoice</h1>
  <a href="wallet.html" style="color:#9aa4d6">Wallet</a>
</header>

<div class="container">

<!-- STUDENT INFO -->
<div class="card">
  <h3>Student Info</h3>
  <div class="grid">
    <input id="studentName" readonly>
    <input id="studentEmail" readonly>
    <input id="studentId" readonly>
  </div>
</div>

<!-- CLIENT -->
<div class="card">
  <h3>Client Details</h3>
  <div class="grid">
    <input id="clientName" placeholder="Client name">
    <select id="clientCountry">
      <option>South Africa</option>
      <option>United States</option>
      <option>United Kingdom</option>
      <option>Canada</option>
    </select>
  </div>
</div>

<!-- SERVICE -->
<div class="card">
  <h3>Service</h3>
  <div class="grid">
    <input id="serviceTitle" placeholder="Service title">
    <select id="category">
      <option>Design</option>
      <option>Writing</option>
      <option>Development</option>
      <option>Marketing</option>
      <option>Other</option>
    </select>
    <input type="date" id="deliveryDate">
  </div>

  <textarea id="description" placeholder="Description"></textarea>
</div>

<!-- PRICING -->
<div class="card">
  <h3>Pricing (USD)</h3>
  <input type="number" id="amount" placeholder="Amount USD">

  <div class="breakdown">
    <p>Fee (5%) → <span id="fee">$0</span></p>
    <p><b>You receive → <span id="receive">$0</span></b></p>
  </div>
</div>

<button onclick="createInvoice()">Generate Invoice</button>

</div>

<script>
/* =========================
   SUPABASE INIT
========================= */
const supabaseUrl = "https://sqlisgobnayfpzamdolf.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* =========================
   AUTH USER
========================= */
let user;

async function loadUser(){
  const { data, error } = await supabase.auth.getUser();

  if(error || !data.user){
    location.href = "auth.html";
    return;
  }

  user = data.user;

  document.getElementById("studentName").value = user.user_metadata?.full_name || "";
  document.getElementById("studentEmail").value = user.email;
  document.getElementById("studentId").value = user.id;
}
loadUser();

/* =========================
   CALCULATION
========================= */
const amountInput = document.getElementById("amount");

amountInput.addEventListener("input", ()=>{
  const amount = parseFloat(amountInput.value) || 0;
  const fee = amount * 0.05;
  const receive = amount - fee;

  document.getElementById("fee").innerText = `$${fee.toFixed(2)}`;
  document.getElementById("receive").innerText = `$${receive.toFixed(2)}`;
});

/* =========================
   CREATE INVOICE
========================= */
async function createInvoice(){

  const amount = parseFloat(amountInput.value);

  if(!amount || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  const invoiceId = crypto.randomUUID();

  const invoice = {
    id: invoiceId,
    student_id: user.id,
    student_name: user.user_metadata?.full_name,
    client_name: document.getElementById("clientName").value,
    client_country: document.getElementById("clientCountry").value,
    service_title: document.getElementById("serviceTitle").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value,
    delivery_date: document.getElementById("deliveryDate").value,
    amount_usd: amount,
    fee_usd: amount * 0.05,
    payout_usd: amount * 0.95,
    status: "pending_payment",
    created_at: new Date().toISOString()
  };

  const { error } = await supabase
    .from("invoices")
    .insert([invoice]);

  if(error){
    console.error(error);
    alert("Failed to create invoice");
    return;
  }

  const link = `${window.location.origin}/invoice.html?id=${invoiceId}`;

  alert("Invoice created!\n\n" + link);
  window.open(link, "_blank");
}
</script>

</body>
</html>
