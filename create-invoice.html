<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zep Swipe | AI Invoice OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
:root{
  --bg:#050014;
  --glass:rgba(255,255,255,0.06);
  --stroke:rgba(255,255,255,0.12);
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --text:rgba(255,255,255,0.85);
}

*{
  box-sizing:border-box;
  font-family:Poppins, system-ui;
}

body{
  margin:0;
  background:radial-gradient(circle at 20% 10%, #0b0020, var(--bg));
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:14px 18px;
  border-bottom:1px solid var(--stroke);
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(10px);
}

header h1{
  font-size:16px;
  font-family:Orbitron;
}

header a{
  color:var(--text);
  text-decoration:none;
}

/* LAYOUT */
.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
  display:grid;
  gap:14px;
}

/* CARD */
.card{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:16px;
  box-shadow:0 0 20px rgba(156,77,255,0.05);
}

h3{
  margin-bottom:10px;
  font-size:14px;
  color:var(--text);
}

/* INPUTS */
input, select, textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.3);
  color:white;
  margin-bottom:10px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:none;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}

/* BREAKDOWN */
.breakdown{
  background:rgba(0,0,0,0.35);
  border:1px solid var(--stroke);
  padding:12px;
  border-radius:12px;
  font-size:13px;
}

/* AI PANEL */
.ai{
  padding:12px;
  border-radius:14px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.2);
  font-size:13px;
  margin-bottom:10px;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  font-weight:bold;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  transition:.2s;
}

button:hover{
  transform:scale(1.02);
}
</style>
</head>

<body>

<header>
  <h1>⚡ Zep Invoice AI OS</h1>
  <a href="wallet.html">Wallet</a>
</header>

<div class="container">

<!-- 🤖 AI PANEL -->
<div class="ai">
  🤖 Invoice AI: <span id="aiInsight">Ready to analyze invoice creation flow...</span>
</div>

<!-- STUDENT -->
<div class="card">
  <h3>Student Info</h3>
  <div class="grid">
    <input id="studentName" readonly>
    <input id="studentEmail" readonly>
    <input id="studentId" readonly>
  </div>
</div>

<!-- CLIENT -->
<div class="card">
  <h3>Client Details</h3>
  <input id="clientName" placeholder="Client name">
  <select id="clientCountry">
    <option>South Africa</option>
    <option>United States</option>
    <option>United Kingdom</option>
    <option>Canada</option>
  </select>
</div>

<!-- SERVICE -->
<div class="card">
  <h3>Service Info</h3>
  <input id="serviceTitle" placeholder="Service title">

  <div class="grid">
    <select id="category">
      <option>Design</option>
      <option>Writing</option>
      <option>Development</option>
      <option>Marketing</option>
      <option>Other</option>
    </select>

    <input type="date" id="deliveryDate">
  </div>

  <textarea id="description" placeholder="Service description"></textarea>
</div>

<!-- PRICING -->
<div class="card">
  <h3>Pricing Engine</h3>

  <input type="number" id="amount" placeholder="Enter USD amount">

  <div class="breakdown">
    <p>Platform Fee (5%) → <span id="fee">$0</span></p>
    <p><b>You Receive → <span id="receive">$0</span></b></p>
  </div>
</div>

<button onclick="createInvoice()">Generate Invoice</button>

</div>

<script>

/* ================= SUPABASE ================= */
const supabaseUrl = "https://sqlisgobnayfpzamdolf.supabase.co";
const supabaseKey = "YOUR_KEY_HERE";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* ================= USER ================= */
let user;

async function loadUser(){
  const { data } = await supabase.auth.getUser();

  if(!data.user){
    location.href="auth.html";
    return;
  }

  user = data.user;

  document.getElementById("studentName").value =
    user.user_metadata?.full_name || "";

  document.getElementById("studentEmail").value = user.email;
  document.getElementById("studentId").value = user.id;

  document.getElementById("aiInsight").innerText =
    "User authenticated. Invoice engine active ⚡";
}

loadUser();

/* ================= LIVE CALC ================= */
document.getElementById("amount").addEventListener("input", e=>{
  const amount = parseFloat(e.target.value) || 0;

  const fee = amount * 0.05;
  const receive = amount - fee;

  document.getElementById("fee").innerText = `$${fee.toFixed(2)}`;
  document.getElementById("receive").innerText = `$${receive.toFixed(2)}`;
});

/* ================= AI VALIDATION ================= */
function validateInvoice(amount, desc){

  let score = 0;

  if(amount > 0) score += 30;
  if(amount > 500) score += 20;
  if(desc?.length > 20) score += 20;

  if(!desc) score -= 20;

  let status = "normal";

  if(score >= 60) status = "strong";
  else if(score < 30) status = "weak";

  return { score, status };
}

/* ================= CREATE INVOICE ================= */
async function createInvoice(){

  const amount = parseFloat(document.getElementById("amount").value);
  const desc = document.getElementById("description").value;

  if(!amount || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  const ai = validateInvoice(amount, desc);

  document.getElementById("aiInsight").innerText =
    `Invoice strength: ${ai.status.toUpperCase()} (${ai.score}/100)`;

  const invoiceId = crypto.randomUUID();

  const invoice = {
    id: invoiceId,
    student_id: user.id,
    student_name: user.user_metadata?.full_name,
    client_name: document.getElementById("clientName").value,
    client_country: document.getElementById("clientCountry").value,
    service_title: document.getElementById("serviceTitle").value,
    category: document.getElementById("category").value,
    description: desc,
    delivery_date: document.getElementById("deliveryDate").value,
    amount_usd: amount,
    fee_usd: amount * 0.05,
    payout_usd: amount * 0.95,
    status: "pending_payment",
    ai_score: ai.score,
    ai_status: ai.status,
    created_at: new Date().toISOString()
  };

  const { error } = await supabase
    .from("invoices")
    .insert([invoice]);

  if(error){
    console.error(error);
    alert("Failed to create invoice");
    return;
  }

  const link = `${window.location.origin}/invoice.html?id=${invoiceId}`;

  alert("Invoice created successfully!\n\n" + link);
  window.open(link, "_blank");
}

</script>

</body>
</html>
