<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Waitlist V5</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050607;
  color: white;
  overflow-x: hidden;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 20px;
  background: radial-gradient(circle at top, rgba(0,255,140,0.2), transparent);
}

.hero h1 {
  color: #00ff8c;
  font-size: 28px;
}

.progress {
  width: 80%;
  height: 10px;
  background: #111;
  margin: 15px auto;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  width: 65%;
  height: 100%;
  background: #00ff8c;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 15px;
}

/* CARDS */
.card {
  background: #0b120e;
  border: 1px solid rgba(0,255,140,0.15);
  border-radius: 12px;
  padding: 15px;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: #00ff8c;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* PROFILE CARD */
.profile {
  text-align: center;
}

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: linear-gradient(45deg,#00ff8c,#0066ff);
  margin: auto;
  margin-bottom: 10px;
}

/* LEADERBOARD */
.rank {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.top {
  color: #00ff8c;
  font-weight: bold;
}

/* MISSIONS */
.mission {
  padding: 10px;
  margin: 5px 0;
  border: 1px solid rgba(0,255,140,0.2);
  border-radius: 8px;
}

/* BADGE */
.badge {
  display: inline-block;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 6px;
  background: #00ff8c;
  color: black;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>🚀 Zep Swipe Early Access</h1>
  <p>Compete. Earn. Get Founder Status Before Launch.</p>

  <div class="progress">
    <div class="bar"></div>
  </div>
  <small>Launch progress: 65%</small>
</div>

<!-- GRID -->
<div class="container">

  <!-- SIGNUP -->
  <div class="card">

    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="Phone">
    <input id="email" placeholder="Email">
    <input id="location" placeholder="City / Town">

    <select id="role">
      <option value="student">Student</option>
      <option value="provider">Provider</option>
      <option value="customer">Customer</option>
    </select>

    <select id="interest">
      <option>Academic Services</option>
      <option>Digital Services</option>
      <option>Technical Services</option>
      <option>Creative Services</option>
      <option>Local Jobs</option>
    </select>

    <input id="ref" placeholder="Referral Code (optional)">

    <button onclick="join()">Join Waitlist</button>

    <p id="code" style="color:#00ff8c;margin-top:10px;"></p>
  </div>

  <!-- PROFILE -->
  <div class="card profile">
    <div class="avatar"></div>
    <h3 id="pname">Guest Player</h3>
    <p id="points">Points: 0</p>
    <p id="rank">Rank: Unranked</p>
    <span class="badge" id="tier">Bronze</span>
  </div>

  <!-- MISSIONS -->
  <div class="card">
    <h3 style="color:#00ff8c;">🎯 Missions</h3>

    <div class="mission">Invite 1 Friend → +5 pts</div>
    <div class="mission">Share on WhatsApp → +3 pts</div>
    <div class="mission">Join Provider List → +10 pts</div>
  </div>

  <!-- LEADERBOARD -->
  <div class="card">
    <h3 style="color:#00ff8c;">🔥 Leaderboard</h3>
    <div id="board"></div>
  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let myPoints = 0;

/* CODE */
function genCode(){
  return "ZEP-" + Math.random().toString(36).substring(2,7).toUpperCase();
}

/* TIER */
function getTier(p){
  if(p >= 150) return "Founder";
  if(p >= 50) return "Gold";
  if(p >= 10) return "Silver";
  return "Bronze";
}

/* JOIN */
async function join(){

  const code = genCode();

  const entry = {
    name: name.value,
    phone: phone.value,
    email: email.value,
    location: location.value,
    role: role.value,
    interest: interest.value,
    ref_code: code,
    referred_by: ref.value || null,
    points: 1
  };

  const { error } = await client.from("waitlist").insert([entry]);

  if(error){
    alert("Error joining");
    return;
  }

  myPoints += 1;

  document.getElementById("code").innerHTML =
    "Your Code: " + code;

  updateProfile(name.value, myPoints);
  loadBoard();
}

/* PROFILE */
function updateProfile(n,p){
  pname.innerText = n;
  points.innerText = "Points: " + p;
  rank.innerText = "Rank: #" + Math.floor(Math.random()*100);
  tier.innerText = getTier(p);
}

/* LEADERBOARD */
async function loadBoard(){

  const { data } = await client
    .from("waitlist")
    .select("*")
    .order("points",{ascending:false})
    .limit(10);

  const board = document.getElementById("board");
  board.innerHTML = "";

  (data || []).forEach((u,i)=>{
    board.innerHTML += `
      <div class="rank ${i===0?'top':''}">
        <span>#${i+1} ${u.name}</span>
        <span>${u.points} pts</span>
      </div>
    `;
  });
}

/* INIT */
loadBoard();

</script>

</body>
</html>
