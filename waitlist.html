<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Waitlist V104 Supabase Ready</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--border:#262626}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:var(--bg);color:#fff;padding-bottom:90px}
.header{padding:14px;background:#0b0b0b;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.hero{margin:16px;padding:32px;border-radius:28px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.85)),url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover}
.card{margin:16px;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:22px}
input,select{width:100%;padding:12px;margin-top:10px;background:#101010;color:#fff;border:1px solid var(--border);border-radius:12px}
.btn{width:100%;padding:14px;margin-top:12px;border:none;border-radius:14px;background:var(--accent);font-weight:800}
#wheel{width:280px;height:280px;margin:20px auto;border-radius:50%;background:conic-gradient(#00ff88 0 60deg,#ffd700 60deg 120deg,#66ff33 120deg 180deg,#00ffaa 180deg 240deg,#b8ff3b 240deg 300deg,#00ff88 300deg 360deg);transition:transform 5s ease-out;display:flex;align-items:center;justify-content:center}
.center{width:110px;height:110px;border-radius:50%;background:#141414;display:flex;align-items:center;justify-content:center;font-weight:800}
#dashboard{display:none}
</style>
</head>
<body>
<div class="header">
<img src="https://pe56d.s3.amazonaws.com/o_1jrl9bj473pej4dqgtbqh12315.png" width="48">
<div><h3 style="color:#b8ff3b">Zep Swipe</h3><small>Student Economy</small></div>
</div>

<div id="signup">
<div class="hero"><h1>Learn • Earn • Refer • Grow</h1></div>
<div class="card">
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="country" placeholder="Country">
<input id="referral" placeholder="Referral Code">
<select id="course"><option>Graphic Design</option><option>Tutoring</option></select>
<button class="btn" onclick="registerStudent()">Unlock Dashboard</button>
</div>
</div>

<div id="dashboard">
<div class="hero"><h2 id="welcome"></h2></div>
<div class="card"><h3>MARI Wallet: <span id="mari">0</span></h3></div>
<div class="card">
<h3>Daily Spin</h3>
<div id="wheel"><div class="center" onclick="spin()">SPIN</div></div>
<p id="result">Rewards: 3,5,7,10,15,20 MARI</p>
</div>
<div class="card">
<h3>Referral Link</h3>
<input id="refLink" readonly>
</div>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function registerStudent(){
 const sid='ZS-'+Math.floor(Math.random()*90000+10000);
 localStorage.setItem('studentId',sid);
 document.getElementById('signup').style.display='none';
 document.getElementById('dashboard').style.display='block';
 document.getElementById('welcome').innerText='Welcome '+name.value+' 👋';
 document.getElementById('refLink').value='https://zepswipe.com/ref/'+sid;

 try{
 await db.from('students').insert({
   student_id:sid,
   full_name:name.value,
   email:email.value,
   country:country.value,
   course:course.value,
   referral_code_used:referral.value,
   mari_balance:0
 });
 }catch(e){}
}

async function spin(){
 const rewards=[3,5,7,10,15,20];
 const win=rewards[Math.floor(Math.random()*rewards.length)];
 const rotate=1800+Math.floor(Math.random()*720);
 wheel.style.transform='rotate('+rotate+'deg)';
 setTimeout(()=>{
   mari.innerText=parseInt(mari.innerText)+win;
   result.innerText='🎉 You won '+win+' MARI';
 },5000);
}

lucide.createIcons();
</script>
</body>
</html>
