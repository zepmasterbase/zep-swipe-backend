<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Waitlist</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #0b0f1a, #05070d);
  color: white;
}

.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  background: #00f0ff;
  filter: blur(120px);
  opacity: 0.15;
  top: -100px;
  left: -100px;
}

.container {
  max-width: 430px;
  margin: auto;
  padding: 20px;
  position: relative;
}

.logo {
  text-align: center;
  margin-top: 20px;
}

.logo img {
  width: 85px;
  animation: pulse 2s infinite;
  filter: drop-shadow(0 0 15px #00f0ff);
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 0.7; }
}

.title {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  margin-top: 10px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 15px;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 16px;
  padding: 18px;
  backdrop-filter: blur(10px);
  margin-top: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

input, select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.4);
  color: white;
  outline: none;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
}

.btn-primary {
  background: linear-gradient(90deg, #00f0ff, #6a5cff);
  color: black;
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.badge {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: rgba(0,255,255,0.1);
  border: 1px solid rgba(0,255,255,0.3);
  font-size: 11px;
  margin-top: 10px;
}

.loading {
  display: none;
  font-size: 12px;
  color: #00f0ff;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

  <div class="logo">
    <img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
  </div>

  <div class="title">Zep Swipe Waitlist</div>
  <div class="subtitle">Learn • Earn • Work remotely in 21 days</div>

  <div class="card">

    <input type="text" id="name" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email Address">

    <select id="country">
      <option value="">Select Country</option>
      <option>South Africa 🇿🇦</option>
      <option>Ghana 🇬🇭</option>
      <option>Zambia 🇿🇲</option>
      <option>Rwanda 🇷🇼</option>
      <option>Namibia 🇳🇦</option>
      <option>Botswana 🇧🇼</option>
      <option>Malawi 🇲🇼</option>
      <option>Kenya 🇰🇪</option>
      <option>Nigeria 🇳🇬</option>
      <option>Uganda 🇺🇬</option>
      <option>Tanzania 🇹🇿</option>
    </select>

    <select id="status">
      <option value="">Are you?</option>
      <option>University Student 🎓</option>
      <option>Free User 💻</option>
      <option>Graduate 👨‍🎓</option>
    </select>

    <select id="withdraw">
      <option value="">Withdrawal Method</option>
      <option>MTN Mobile Money 📱</option>
      <option>Airtel Money 📲</option>
      <option>M-Pesa 💰</option>
      <option>Bank Transfer 🏦</option>
      <option>Crypto Wallet ₿</option>
    </select>

    <input type="text" id="ref" placeholder="Referral Code (optional)">

    <button class="btn-primary" id="submitBtn" onclick="join()">Join Waitlist</button>

    <div class="loading" id="loading">Submitting...</div>

    <div class="badge">🔥 Early access + XP rewards enabled</div>

  </div>

</div>

<script>
/* ================= SUPABASE INIT (FIXED) ================= */
const SUPABASE_URL = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= JOIN FUNCTION ================= */
async function join() {

  const btn = document.getElementById("submitBtn");
  const loading = document.getElementById("loading");

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const country = document.getElementById("country").value;
  const status = document.getElementById("status").value;
  const withdraw = document.getElementById("withdraw").value;
  const ref = document.getElementById("ref").value.trim();

  if (!name || !email || !country) {
    alert("Please fill required fields");
    return;
  }

  try {

    btn.disabled = true;
    loading.style.display = "block";

    const { error } = await supabase
      .from("waitlist_users")
      .insert([{
        name,
        email,
        country,
        status,
        withdraw_method: withdraw || null,
        referred_by: ref || null,
        created_at: new Date()
      }]);

    if (error) throw error;

    window.location.href = "success.html";

  } catch (err) {
    console.error(err);
    alert("Error submitting form");
  } finally {
    btn.disabled = false;
    loading.style.display = "none";
  }
}
</script>

</body>
</html>
