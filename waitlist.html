<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Waitlist V3</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050607;
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
  background: radial-gradient(circle at top, rgba(0,255,140,0.2), transparent);
}

.hero h1 {
  color: #00ff8c;
  font-size: 32px;
}

.hero p {
  opacity: 0.8;
}

/* FORM */
.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #0b120e;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid rgba(0,255,140,0.15);
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 12px;
  background: #00ff8c;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* SUCCESS */
.success {
  display: none;
  text-align: center;
  padding: 20px;
  color: #00ff8c;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Zep Swipe is Coming to Your Area</h1>
  <p>Join the waitlist. Be first when we launch in your city.</p>
</div>

<div class="container">

  <div class="card">

    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="Phone Number">
    <input id="email" placeholder="Email">

    <input id="location" placeholder="City / Town">

    <select id="role">
      <option value="student">Student</option>
      <option value="provider">Freelancer / Provider</option>
      <option value="customer">Customer</option>
    </select>

    <select id="interest">
      <option>Academic Services</option>
      <option>Digital Services</option>
      <option>Technical Services</option>
      <option>Creative Services</option>
      <option>Local Jobs</option>
    </select>

    <button onclick="joinWaitlist()">Join Waitlist</button>

  </div>

  <div class="success" id="success">
    🎉 You’re on the waitlist!<br>
    We’ll notify you when Zep Swipe launches in your area.
  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function joinWaitlist() {

  const entry = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    location: document.getElementById("location").value,
    role: document.getElementById("role").value,
    interest: document.getElementById("interest").value,
    status: "waiting"
  };

  const { error } = await client
    .from("waitlist")
    .insert([entry]);

  if (error) {
    alert("Error joining waitlist");
    console.log(error);
    return;
  }

  document.querySelector(".card").style.display = "none";
  document.getElementById("success").style.display = "block";
}

</script>

</body>
</html>
