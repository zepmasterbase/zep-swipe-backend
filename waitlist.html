<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Waitlist V106</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{margin:0;background:#070707;color:#fff;font-family:Inter,sans-serif;padding-bottom:90px}
.hero,.card{margin:16px;border-radius:24px;background:#141414;border:1px solid #262626}
.hero{padding:32px;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.85)),url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover}
.card{padding:18px;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:0 0 25px rgba(184,255,59,.25)}
input,select{width:100%;padding:12px;margin-top:10px;background:#101010;color:#fff;border:1px solid #262626;border-radius:12px}
.btn{width:100%;padding:14px;background:#b8ff3b;border:none;border-radius:12px;font-weight:800}
#wheel{width:280px;height:280px;border-radius:50%;margin:auto;background:conic-gradient(#00ff88,#b8ff3b,#ffd700,#00ffaa,#66ff33,#00ff88);display:flex;align-items:center;justify-content:center;transition:transform 5s ease-out;box-shadow:0 0 40px rgba(184,255,59,.5)}
.center{width:110px;height:110px;border-radius:50%;background:#141414;display:flex;align-items:center;justify-content:center;color:#b8ff3b;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#101010;padding:12px;border-radius:14px;text-align:center}
.footer{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid #262626;display:flex;justify-content:space-around;padding:12px}
.footer a{color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:12px}
#dashboard{display:none}
.coin{position:fixed;top:-40px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="signup">
<div class="hero"><h1>Learn • Earn • Refer • Grow</h1></div>
<div class="card">
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="country" placeholder="Country">
<input id="referral" placeholder="Referral Code">
<button class="btn" onclick="registerStudent()">Unlock Dashboard</button>
</div>
</div>

<div id="dashboard">
<div class="hero">
<h2 id="welcome"></h2>
<h1><span id="wallet">0</span> MARI</h1>
<p>Daily Streak 🔥 1 Day</p>
</div>

<div class="card">
<h3>🎡 Daily Spin</h3>
<div id="wheel"><div class="center" onclick="spin()">SPIN</div></div>
<p id="result">Spin to win MARI</p>
</div>

<div class="card">
<h3>🚀 Referral Command Center</h3>
<input id="refLink" readonly>
<button class="btn" onclick="shareWhatsApp()">Share on WhatsApp</button>
</div>

<div class="card">
<h3>🎓 Learn & Earn</h3>
<div class="grid">
<div class="stat">Graphic Design<br>+5 MARI</div>
<div class="stat">Tutoring<br>+5 MARI</div>
<div class="stat">Photography<br>+5 MARI</div>
<div class="stat">Tech Support<br>+5 MARI</div>
</div>
</div>
</div>

<div class="footer">
<a href="#"><i data-lucide="home"></i>Home</a>
<a href="#"><i data-lucide="gift"></i>Spin</a>
<a href="#"><i data-lucide="wallet"></i>Wallet</a>
<a href="#"><i data-lucide="trophy"></i>Rank</a>
<a href="#"><i data-lucide="user"></i>Profile</a>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";

function registerStudent(){
 const studentName=document.getElementById('name').value;
 const sid='ZS-'+Math.floor(Math.random()*90000+10000);
 localStorage.setItem('studentName',studentName);
 localStorage.setItem('studentId',sid);
 signup.style.display='none';
 dashboard.style.display='block';
 welcome.innerHTML='Welcome Back, <span style="color:#b8ff3b">'+studentName+'</span> 👋';
 refLink.value='https://zepswipe.com/ref/'+sid;
}
function shareWhatsApp(){
 window.open('https://wa.me/?text='+encodeURIComponent(refLink.value),'_blank');
}
function spin(){
 let rewards=[3,5,7,10,15,20];
 let win=rewards[Math.floor(Math.random()*rewards.length)];
 wheel.style.transform='rotate('+(1800+Math.random()*720)+'deg)';
 setTimeout(()=>{
 wallet.innerText=parseInt(wallet.innerText)+win;
 result.innerText='🎉 You won '+win+' MARI';
 for(let i=0;i<25;i++){
 let c=document.createElement('div');
 c.className='coin'; c.innerHTML='🪙';
 c.style.left=Math.random()*100+'vw';
 document.body.appendChild(c);
 setTimeout(()=>c.remove(),3000);
 }
 },5000);
}
lucide.createIcons();
</script>
</body>
</html>
