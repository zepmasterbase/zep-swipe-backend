<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Waitlist V80 Supabase Ready</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#070707;color:#fff;margin:0;padding:20px}
.card{background:#141414;border:1px solid #262626;border-radius:16px;padding:16px;margin:12px 0}
input,select,button{width:100%;padding:12px;margin-top:10px}
button{background:#b8ff3b;border:none;font-weight:bold}
</style>
</head>
<body>
<h1>Zep Swipe Waitlist V80</h1>

<div class="card">
<h3>Join Waitlist</h3>
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="university" placeholder="University">
<input id="country" placeholder="Country">
<select id="course">
<option>Graphic Design</option>
<option>Tutoring</option>
<option>Photography</option>
<option>Cleaning</option>
<option>Tech Support</option>
</select>
<button onclick="joinWaitlist()">Unlock Dashboard</button>
</div>

<div class="card">
<h3>Supabase Configuration</h3>
<pre>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
</pre>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";

function joinWaitlist(){
 const name=document.getElementById('name').value;
 if(!name){alert('Enter name');return;}
 const id='ZS-'+Math.floor(Math.random()*90000+10000);
 localStorage.setItem('zep_student_id',id);
 alert('Dashboard unlocked. Student ID: '+id);
}
</script>
</body>
</html>
