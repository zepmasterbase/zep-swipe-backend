<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Waitlist V6</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050607;
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 20px;
  background: radial-gradient(circle at top, rgba(0,255,140,0.25), transparent);
}

.hero h1 {
  color: #00ff8c;
}

.progress {
  width: 80%;
  height: 10px;
  background: #111;
  margin: 10px auto;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  width: 70%;
  height: 100%;
  background: #00ff8c;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 15px;
}

/* CARD */
.card {
  background: #0b120e;
  border: 1px solid rgba(0,255,140,0.15);
  border-radius: 12px;
  padding: 15px;
}

/* INPUT */
input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
  border: none;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: #00ff8c;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* LEADERBOARD */
.rank {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.top {
  color: #00ff8c;
  font-weight: bold;
}

/* BADGE */
.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 6px;
  background: #00ff8c;
  color: black;
  font-size: 12px;
}

/* ALERT */
.lock {
  background: rgba(255, 165, 0, 0.1);
  border: 1px solid orange;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>🚀 Zep Swipe Global Waitlist V6</h1>
  <p>Earn rank. Invite friends. Unlock early access.</p>

  <div class="progress">
    <div class="bar"></div>
  </div>
  <small>Launch Progress: 70%</small>
</div>

<div class="container">

  <!-- SIGNUP -->
  <div class="card">

    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="Phone">
    <input id="email" placeholder="Email">
    <input id="location" placeholder="City">

    <input id="country" placeholder="Country">

    <select id="role">
      <option>Student</option>
      <option>Provider</option>
      <option>Customer</option>
    </select>

    <select id="interest">
      <option>Academic</option>
      <option>Digital</option>
      <option>Technical</option>
      <option>Creative</option>
      <option>Local Jobs</option>
    </select>

    <input id="ref" placeholder="Referral Code (optional)">

    <button onclick="join()">Join Waitlist</button>

    <p id="mycode" style="color:#00ff8c;"></p>

    <div id="accessMsg" class="lock"></div>

  </div>

  <!-- PROFILE -->
  <div class="card">
    <h3 style="color:#00ff8c;">👤 Player Profile</h3>

    <p id="pname">Guest</p>
    <p id="points">Points: 0</p>
    <p id="tier">Tier: Bronze</p>
    <p id="refcount">Referrals: 0</p>
  </div>

  <!-- MISSIONS -->
  <div class="card">
    <h3 style="color:#00ff8c;">🎯 Missions</h3>

    <p>Invite 1 friend → +5 pts</p>
    <p>Invite 3 friends → +20 bonus</p>
    <p>Share link → +3 pts</p>
    <p>Join provider list → +10 pts</p>
  </div>

  <!-- LEADERBOARD -->
  <div class="card">
    <h3 style="color:#00ff8c;">🔥 Leaderboard</h3>
    <div id="board"></div>
  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let myPoints = 0;
let myRef = "";

/* TIER SYSTEM */
function getTier(p){
  if(p >= 150) return "FOUNDER";
  if(p >= 50) return "GOLD";
  if(p >= 10) return "SILVER";
  return "BRONZE";
}

/* REF CODE */
function genCode(){
  return "ZEP-" + Math.random().toString(36).substring(2,7).toUpperCase();
}

/* JOIN SYSTEM */
async function join(){

  const ref = new URLSearchParams(window.location.search).get("ref");
  const code = genCode();

  const countryStatus = getCountryStatus(country.value);

  const user = {
    name: name.value,
    phone: phone.value,
    email: email.value,
    location: location.value,
    country: country.value,

    role: role.value,
    interest: interest.value,

    ref_code: code,
    referred_by: ref || null,

    points: ref ? 6 : 1,
    ref_count: 0,

    tier: "BRONZE",
    country_status: countryStatus
  };

  const { error } = await client.from("waitlist").insert([user]);

  if(error){
    alert("Error joining");
    return;
  }

  myPoints = user.points;
  myRef = code;

  document.getElementById("mycode").innerHTML =
    "Your Code: " + code;

  updateProfile(user.name, myPoints, 0);
  loadBoard();

  if(ref) updateReferrer(ref);
}

/* COUNTRY LOGIC */
function getCountryStatus(country){

  const active = ["South Africa"];
  const waitlist = ["Ghana", "Nigeria", "Kenya"];

  if(active.includes(country)) return "ACTIVE";
  if(waitlist.includes(country)) return "WAITLIST";
  return "COMING_SOON";
}

/* REF ENGINE */
async function updateReferrer(refCode){

  const { data } = await client
    .from("waitlist")
    .select("*")
    .eq("ref_code", refCode)
    .single();

  if(!data) return;

  const newPoints = (data.points || 0) + 5;
  const newRefs = (data.ref_count || 0) + 1;

  await client
    .from("waitlist")
    .update({
      points: newPoints,
      ref_count: newRefs
    })
    .eq("ref_code", refCode);
}

/* PROFILE */
function updateProfile(name, pts, refs){

  pname.innerText = name;
  points.innerText = "Points: " + pts;
  tier.innerText = "Tier: " + getTier(pts);
  refcount.innerText = "Referrals: " + refs;
}

/* LEADERBOARD */
async function loadBoard(){

  const { data } = await client
    .from("waitlist")
    .select("*")
    .order("points",{ascending:false})
    .limit(10);

  const board = document.getElementById("board");
  board.innerHTML = "";

  (data || []).forEach((u,i)=>{

    board.innerHTML += `
      <div class="rank ${i===0?'top':''}">
        <span>#${i+1} ${u.name} [${u.tier || "BRONZE"}]</span>
        <span>${u.points} pts</span>
      </div>
    `;
  });
}

/* ACCESS MESSAGE */
function showAccess(countryStatus){

  let msg = "";

  if(countryStatus === "ACTIVE"){
    msg = "🟢 Your country is ACTIVE. Full access will be available on launch.";
  }
  else if(countryStatus === "WAITLIST"){
    msg = "🟡 Your country is in WAITLIST phase. You can earn rank, but no jobs yet.";
  }
  else {
    msg = "🔵 Coming soon to your country. Join early to become a Founder.";
  }

  document.getElementById("accessMsg").innerText = msg;
}

/* INIT */
loadBoard();

</script>

</body>
</html>
