<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zep Swipe — Africa Expansion Waitlist</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#050816;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background-image:
  radial-gradient(circle at top left, rgba(0,255,200,0.14), transparent 30%),
  radial-gradient(circle at bottom right, rgba(0,140,255,0.14), transparent 35%);
}

.card{
  width:100%;
  max-width:650px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:30px;
  padding:35px 25px;
  backdrop-filter:blur(18px);
  box-shadow:0 0 60px rgba(0,255,255,0.08);
  text-align:center;
}

.logo{
  width:70px;
  margin-bottom:15px;
  filter:drop-shadow(0 0 18px rgba(0,255,255,0.4));
}

h1{
  font-size:2rem;
  font-weight:800;
  margin-bottom:10px;
}

.gradient{
  background:linear-gradient(90deg,#00ffe1,#00a2ff,#7b61ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  color:#a8b7d6;
  font-size:0.95rem;
  margin-bottom:20px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(0,255,170,0.12);
  border:1px solid rgba(0,255,170,0.25);
  color:#00ffb2;
  font-size:0.85rem;
  margin-bottom:20px;
}

/* FORM */

label{
  display:block;
  text-align:left;
  margin-top:12px;
  font-size:0.85rem;
  color:#9fb0d5;
}

input, select{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.05);
  color:white;
  margin-top:6px;
  outline:none;
}

.btn{
  width:100%;
  padding:15px;
  margin-top:18px;
  border-radius:18px;
  font-weight:800;
  background:linear-gradient(90deg,#00ffe1,#00a2ff);
  color:#03111f;
  border:none;
  cursor:pointer;
  box-shadow:0 0 25px rgba(0,255,255,0.3);
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.03);
}

/* LEADERBOARD */

.board{
  margin-top:25px;
  text-align:left;
}

.title{
  font-weight:700;
  text-align:center;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  margin-bottom:10px;
}

.score{
  color:#00ffe1;
  font-weight:700;
}

/* NOTE */

.note{
  margin-top:20px;
  font-size:0.8rem;
  color:#7df9ff;
  text-align:center;
}

</style>

</head>

<body>

<div class="card">

<img class="logo"
  src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jpitama61nopisi19aqb041vvo15.png"
  alt="Zep Swipe"
/>

<div class="badge">🌍 Africa Expansion Mode</div>

<h1>
  Bring <span class="gradient">Zep Swipe</span> to Your Country
</h1>

<div class="subtitle">
  We are currently live in South Africa.  
  Help unlock your country by joining the demand list.
</div>

<!-- FORM -->

<label>Full Name</label>
<input type="text" placeholder="e.g. Ama / Tunde / Kevin" />

<label>Phone or Email</label>
<input type="text" placeholder="+234 / +233 / email" />

<label>Select Country</label>
<select>
  <option>Nigeria</option>
  <option>Ghana</option>
  <option>Kenya</option>
  <option>Uganda</option>
  <option>Tanzania</option>
  <option>Ethiopia</option>
  <option>Zambia</option>
  <option>Zimbabwe</option>
  <option>Other</option>
</select>

<button class="btn">
  🚀 Request Country Access
</button>

<!-- COUNTRY DEMAND -->

<div class="board">

  <div class="title">🔥 Country Demand Leaderboard</div>

  <div class="row">
    <div>Nigeria</div>
    <div class="score">2,340 requests</div>
  </div>

  <div class="row">
    <div>Ghana</div>
    <div class="score">1,120 requests</div>
  </div>

  <div class="row">
    <div>Kenya</div>
    <div class="score">980 requests</div>
  </div>

</div>

<div class="note">
⚡ Countries with highest demand get launched first
</div>

</div>

</body>
</html>
