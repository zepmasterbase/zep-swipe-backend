<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Waitlist V4</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050607;
  color: white;
}

.hero {
  text-align: center;
  padding: 50px 20px;
  background: radial-gradient(circle at top, rgba(0,255,140,0.2), transparent);
}

.hero h1 {
  color: #00ff8c;
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

/* CARD */
.card {
  background: #0b120e;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid rgba(0,255,140,0.15);
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: #00ff8c;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* LEADERBOARD */
.leaderboard {
  max-height: 400px;
  overflow-y: auto;
}

.rank {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  justify-content: space-between;
}

.top {
  color: #00ff8c;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Zep Swipe Waitlist V4</h1>
  <p>Join. Invite. Rank up. Get early access.</p>
</div>

<div class="container">

  <!-- SIGNUP -->
  <div class="card">

    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="Phone">
    <input id="email" placeholder="Email">
    <input id="location" placeholder="City / Town">

    <select id="role">
      <option value="student">Student</option>
      <option value="provider">Provider</option>
      <option value="customer">Customer</option>
    </select>

    <select id="interest">
      <option>Academic Services</option>
      <option>Digital Services</option>
      <option>Technical Services</option>
      <option>Creative Services</option>
      <option>Local Jobs</option>
    </select>

    <input id="ref" placeholder="Referral Code (optional)">

    <button onclick="join()">Join Waitlist</button>

    <p id="mycode" style="margin-top:10px;color:#00ff8c;"></p>

  </div>

  <!-- LEADERBOARD -->
  <div class="card leaderboard">

    <h3 style="color:#00ff8c;">🔥 Waitlist Leaderboard</h3>

    <div id="board"></div>

  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* RANDOM REF CODE */
function generateCode(){
  return "ZEP-" + Math.random().toString(36).substring(2,7).toUpperCase();
}

/* JOIN */
async function join(){

  const code = generateCode();

  const data = {
    name: name.value,
    phone: phone.value,
    email: email.value,
    location: location.value,
    role: role.value,
    interest: interest.value,
    ref_code: code,
    referred_by: ref.value || null,
    points: 1
  };

  const { error } = await client
    .from("waitlist")
    .insert([data]);

  if(error){
    alert("Error joining waitlist");
    console.log(error);
    return;
  }

  document.getElementById("mycode").innerHTML =
    "Your Referral Code: " + code;

  alert("Joined successfully!");
  loadBoard();
}

/* LEADERBOARD */
async function loadBoard(){

  const { data } = await client
    .from("waitlist")
    .select("*")
    .order("points", { ascending: false })
    .limit(10);

  const board = document.getElementById("board");
  board.innerHTML = "";

  (data || []).forEach((u, i) => {

    board.innerHTML += `
      <div class="rank ${i===0 ? 'top' : ''}">
        <span>#${i+1} ${u.name}</span>
        <span>${u.points} pts</span>
      </div>
    `;
  });
}

/* INIT */
loadBoard();

</script>

</body>
</html>
