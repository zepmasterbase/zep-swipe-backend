<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zep Swipe AI Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050012;
  --glass:rgba(255,255,255,0.06);
  --blue:#00f0ff;
  --purple:#9b5cff;
  --green:#00ff9d;
  --text:rgba(255,255,255,0.85);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{background:var(--bg);color:white;}

header{
  display:flex;
  justify-content:space-between;
  padding:16px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

.brand{
  font-family:Orbitron;
  font-size:1.2rem;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.ai-box{
  background:var(--glass);
  padding:14px;
  border-radius:14px;
  margin-bottom:20px;
  border:1px solid rgba(255,255,255,0.1);
}

.jobs{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

@media(min-width:800px){
  .jobs{grid-template-columns:1fr 1fr 1fr;}
}

.card{
  background:var(--glass);
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.1);
}

.card h3{font-size:1rem;}
.card p{font-size:.85rem;color:var(--text);margin:6px 0;}

.meta{
  display:flex;
  justify-content:space-between;
  font-size:.8rem;
  margin-top:10px;
  color:var(--text);
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  color:#000;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep Swipe AI</div>
  <button onclick="openDashboard()">Dashboard</button>
</header>

<div class="container">

  <!-- 🤖 ZEP AI INSIGHT PANEL -->
  <div class="ai-box">
    <h3>🤖 Zep AI Freelance Agent</h3>
    <p id="aiSuggestion">Analyzing best gigs for you...</p>
  </div>

  <h3>🔥 Marketplace Gigs</h3>
  <div id="jobs" class="jobs"></div>

</div>

<script>
/* =========================
   SUPABASE INIT
========================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   USER SESSION
========================= */
let user = null;

async function loadUser(){
  const { data } = await supabase.auth.getUser();
  user = data.user;
}
loadUser();

/* =========================
   FETCH GIGS FROM SUPABASE
========================= */
async function loadGigs(){
  let { data: gigs } = await supabase
    .from("gigs")
    .select("*")
    .limit(20);

  if(!gigs) gigs = [];

  renderGigs(gigs);
  runAI(gigs);
}

/* =========================
   RENDER GIGS
========================= */
function renderGigs(gigs){
  const container = document.getElementById("jobs");
  container.innerHTML = "";

  gigs.forEach(g => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${g.title}</h3>
      <p>${g.description}</p>
      <div class="meta">
        <span>${g.country || "Remote"}</span>
        <strong>$${g.price || 0}</strong>
      </div>
      <button onclick="applyGig('${g.id}','${g.title}')">Apply</button>
    `;

    container.appendChild(div);
  });
}

/* =========================
   ZEP AI FREELANCE ENGINE
========================= */
function runAI(gigs){
  if(!user){
    document.getElementById("aiSuggestion").innerText =
      "Login to get AI-powered gig recommendations.";
    return;
  }

  let best = gigs[Math.floor(Math.random() * gigs.length)];

  if(best){
    document.getElementById("aiSuggestion").innerHTML = `
      Recommended for you: <b>${best.title}</b> earning ~$${best.price}<br>
      Zep AI predicts 78% match based on your profile.
    `;
  }
}

/* =========================
   APPLY → INVOICE → ESCROW FLOW
========================= */
async function applyGig(gigId, title){

  if(!user){
    alert("Please login first");
    return;
  }

  // 1. Create invoice
  const { data: invoice } = await supabase
    .from("invoices")
    .insert([{
      user_id: user.id,
      gig_id: gigId,
      status: "pending",
      created_at: new Date()
    }])
    .select();

  // 2. Lock escrow
  await supabase
    .from("escrow")
    .insert([{
      user_id: user.id,
      gig_id: gigId,
      invoice_id: invoice[0].id,
      status: "locked"
    }]);

  alert("Invoice created & funds locked in escrow for: " + title);
}

/* =========================
   DASHBOARD NAV
========================= */
function openDashboard(){
  window.location.href = "student-dashboard.html";
}

/* =========================
   INIT
========================= */
loadGigs();
</script>

</body>
</html>
