<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Employer Auth</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg: radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass: rgba(255,255,255,.07);
  --border: rgba(255,255,255,.12);
  --blue: #00f0ff;
  --violet: #9c4dff;
  --text: rgba(255,255,255,.85);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: var(--bg);
  color:white;
  padding:20px;
}

/* CARD */
.auth-container{
  width:100%;
  max-width:420px;
  background: var(--glass);
  border:1px solid var(--border);
  border-radius:18px;
  padding:32px 26px;
  text-align:center;
  backdrop-filter: blur(18px);
  box-shadow: 0 0 40px rgba(156,77,255,.15);
  transition:0.3s ease;
}

.auth-container:hover{
  box-shadow: 0 0 60px rgba(0,240,255,.15);
  transform: translateY(-2px);
}

h2{
  font-family: Orbitron;
  margin-bottom:22px;
  background: linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* INPUTS */
input{
  width:100%;
  padding:13px 14px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  outline:none;
  background: rgba(0,0,0,.25);
  color:white;
  transition:0.2s;
}

input:focus{
  border:1px solid var(--blue);
  box-shadow: 0 0 10px rgba(0,240,255,.2);
}

/* BUTTON */
button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:999px;
  font-family:Orbitron;
  font-weight:600;
  cursor:pointer;
  color:#000;
  background: linear-gradient(90deg,var(--blue),var(--violet));
  transition:0.3s;
}

button:hover{
  transform: scale(1.02);
  box-shadow: 0 0 25px rgba(156,77,255,.3);
}

/* TOGGLE */
.toggle-link{
  margin-top:14px;
  font-size:0.85rem;
  color: var(--text);
  cursor:pointer;
  display:block;
  transition:0.2s;
}

.toggle-link:hover{
  color: var(--blue);
}

/* SMALL SCREEN */
@media (max-width:480px){
  .auth-container{
    padding:24px 18px;
  }
}
</style>
</head>

<body>

<div class="auth-container">

  <h2 id="formTitle">Employer Sign In</h2>

  <input type="text" id="name" placeholder="Full Name" style="display:none;">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button id="authBtn">Sign In</button>

  <span class="toggle-link" id="toggleLink">
    Don't have an account? Sign Up
  </span>

</div>

<script>
const SUPABASE_URL = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphemJkYmtvcWp4ZHppc2ZzemVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTA4MzAsImV4cCI6MjA5MTQ4NjgzMH0.uTqieGXErIpooSUn0TMmYwYYJuo0yHYcAqdampHWRj4";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isSignUp = false;

const formTitle = document.getElementById("formTitle");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authBtn = document.getElementById("authBtn");
const toggleLink = document.getElementById("toggleLink");

/* ================= TOGGLE MODE ================= */
toggleLink.addEventListener("click", () => {
  isSignUp = !isSignUp;

  formTitle.innerText = isSignUp ? "Employer Sign Up" : "Employer Sign In";
  nameInput.style.display = isSignUp ? "block" : "none";
  authBtn.innerText = isSignUp ? "Sign Up" : "Sign In";

  toggleLink.innerText = isSignUp
    ? "Already have an account? Sign In"
    : "Don't have an account? Sign Up";
});

/* ================= AUTH ================= */
authBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  const name = nameInput.value.trim();

  if(!email || !password){
    alert("Please fill all required fields");
    return;
  }

  try{

    if(isSignUp){

      if(!name){
        alert("Please enter full name");
        return;
      }

      const { data, error } = await sb.auth.signUp({
        email,
        password
      });

      if(error) throw error;

      const { error: profileError } = await sb.from("profiles").insert({
        id: data.user.id,
        name,
        role: "employer",
        profile_image: "",
        company: "",
        verified: false
      });

      if(profileError) throw profileError;

      alert("Account created! Please sign in.");
      toggleLink.click();

    } else {

      const { data, error } = await sb.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      const { data: profile } = await sb
        .from("profiles")
        .select("role")
        .eq("id", data.user.id)
        .single();

      if(profile.role !== "employer"){
        alert("Access denied: Not an employer account");
        await sb.auth.signOut();
        return;
      }

      window.location.href = "employer-dashboard.html";
    }

  } catch(err){
    alert(err.message);
  }
});

/* ================= AUTO LOGIN ================= */
(async () => {
  const { data: { user } } = await sb.auth.getUser();

  if(user){
    const { data } = await sb
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

    if(data?.role === "employer"){
      window.location.href = "employer-dashboard.html";
    }
  }
})();
</script>

</body>
</html>
