<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Employer Auth</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,.08);
  --text-light:rgba(255,255,255,.85);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif;}

body{
  background:var(--bg);
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.auth-container{
  background:var(--glass);
  padding:30px;
  border-radius:16px;
  width:100%;
  max-width:400px;
  text-align:center;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 36px rgba(156,77,255,.2);
}

.auth-container h2{
  font-family:Orbitron;
  margin-bottom:20px;
}

.auth-container input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  border:none;
  outline:none;
}

.auth-container button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  color:#050015;
  font-family:Orbitron;
  cursor:pointer;
}

.toggle-link{
  margin-top:12px;
  font-size:0.85rem;
  color:var(--text-light);
  cursor:pointer;
}
</style>
</head>

<body>

<div class="auth-container">
  <h2 id="formTitle">Employer Sign In</h2>

  <input type="text" id="name" placeholder="Full Name" style="display:none;">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button id="authBtn">Sign In</button>
  <span class="toggle-link" id="toggleLink">Don't have an account? Sign Up</span>
</div>

<script>
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isSignUp = false;

const formTitle = document.getElementById("formTitle");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authBtn = document.getElementById("authBtn");
const toggleLink = document.getElementById("toggleLink");

toggleLink.addEventListener("click", () => {
  isSignUp = !isSignUp;

  formTitle.innerText = isSignUp ? "Employer Sign Up" : "Employer Sign In";
  nameInput.style.display = isSignUp ? "block" : "none";
  authBtn.innerText = isSignUp ? "Sign Up" : "Sign In";
  toggleLink.innerText = isSignUp
    ? "Already have an account? Sign In"
    : "Don't have an account? Sign Up";
});

// MAIN AUTH
authBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  const name = nameInput.value.trim();

  if(!email || !password){
    alert("Please fill all required fields");
    return;
  }

  try {

    if(isSignUp){

      if(!name){
        alert("Please enter full name");
        return;
      }

      // CREATE AUTH USER
      const { data, error } = await sb.auth.signUp({
        email,
        password
      });

      if(error) throw error;

      // CREATE PROFILE
      const { error: profileError } = await sb.from("profiles").insert({
        id: data.user.id,
        name,
        role: "employer",
        profile_image: "",
        company: "",
        verified: false
      });

      if(profileError) throw profileError;

      alert("Employer account created! Please sign in.");
      isSignUp = false;
      toggleLink.click();

    } else {

      // LOGIN
      const { data, error } = await sb.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      // CHECK ROLE
      const { data: profile, error: profileError } = await sb
        .from("profiles")
        .select("role")
        .eq("id", data.user.id)
        .single();

      if(profileError) throw profileError;

      if(profile.role !== "employer"){
        alert("Access denied: Not an employer account");
        await sb.auth.signOut();
        return;
      }

      window.location.href = "employer-dashboard.html";
    }

  } catch(err){
    alert(err.message);
  }
});

// AUTO LOGIN CHECK
(async () => {
  const { data: { user } } = await sb.auth.getUser();

  if(user){
    const { data } = await sb
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

    if(data?.role === "employer"){
      window.location.href = "employer-dashboard.html";
    }
  }
})();
</script>

</body>
</html>
