<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zep Swipe · Order Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet"/>

<style>
body{margin:0;font-family:Poppins;background:#050018;color:#fff}
.container{max-width:900px;margin:auto;padding:16px}

.card{background:rgba(255,255,255,0.06);padding:16px;border-radius:16px;margin-top:16px}

.chat{height:300px;overflow-y:auto;padding:10px;background:rgba(0,0,0,0.3);border-radius:12px}
.msg{margin:6px 0;font-size:14px}
.you{color:#9ff;text-align:right}
.them{color:#fff}

input{
width:80%;padding:10px;border-radius:10px;border:none;background:#111;color:#fff
}
button{
padding:10px 14px;border:none;border-radius:10px;
background:linear-gradient(90deg,#00f0ff,#9c4dff);
cursor:pointer;font-weight:bold
}
.header{display:flex;justify-content:space-between;align-items:center}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Order Chat</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <div id="chatBox" class="chat"></div>

    <div style="margin-top:10px">
      <input id="msgInput" placeholder="Type message..."/>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script>
/* =======================
   SUPABASE INIT
======================= */
const supabaseUrl = "https://wucferiudoekefgaciua.supabase.co";
const supabaseKey = "YOUR_ANON_KEY_HERE"; // 🔴 replace locally
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* =======================
   SESSION USER
======================= */
let currentUser = null;
let orderId = "order_123"; // replace dynamically from URL later

async function loadUser(){
  const { data } = await supabase.auth.getUser();
  currentUser = data.user;

  if(!currentUser){
    alert("Not logged in");
    window.location.href = "login.html";
  }

  loadMessages();
}
loadUser();

/* =======================
   LOAD MESSAGES
======================= */
async function loadMessages(){
  const { data, error } = await supabase
    .from("messages")
    .select("*")
    .eq("order_id", orderId)
    .order("created_at", { ascending: true });

  if(error) return console.log(error);

  renderMessages(data);
}

function renderMessages(messages){
  const box = document.getElementById("chatBox");
  box.innerHTML = "";

  messages.forEach(m=>{
    const div = document.createElement("div");
    div.className = "msg " + (m.sender_id === currentUser.id ? "you" : "them");
    div.textContent = m.message;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* =======================
   SEND MESSAGE
======================= */
async function sendMessage(){
  const input = document.getElementById("msgInput");
  if(!input.value) return;

  const { error } = await supabase
    .from("messages")
    .insert({
      order_id: orderId,
      sender_id: currentUser.id,
      receiver_id: "receiver-placeholder",
      message: input.value
    });

  input.value = "";
  loadMessages();
}

/* =======================
   REALTIME CHAT
======================= */
supabase
  .channel("messages-channel")
  .on(
    "postgres_changes",
    { event: "INSERT", schema: "public", table: "messages" },
    (payload) => {
      loadMessages();
    }
  )
  .subscribe();

/* =======================
   LOGOUT
======================= */
async function logout(){
  await supabase.auth.signOut();
  window.location.href = "login.html";
}
</script>

</body>
</html>
