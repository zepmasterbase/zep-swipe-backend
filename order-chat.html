<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zep Swipe · Order Chat AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#050012;
  --glass:rgba(255,255,255,0.06);
  --blue:#00f0ff;
  --purple:#9c4dff;
  --green:#00ff9d;
  --text:rgba(255,255,255,0.85);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  background:radial-gradient(circle at top,#0b0620,#050012);
  color:white;
  min-height:100vh;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-radius:16px;
  background:linear-gradient(90deg,rgba(0,240,255,0.12),rgba(156,77,255,0.12));
  border:1px solid rgba(255,255,255,0.08);
}

.header h2{
  font-family:Orbitron;
  font-size:18px;
}

/* BUTTON */
button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-family:Orbitron;
  font-weight:700;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  color:#000;
}

/* AI BOX */
.ai-box{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.25);
  font-size:13px;
}

/* CHAT CARD */
.card{
  margin-top:14px;
  background:var(--glass);
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.08);
}

/* CHAT BOX */
.chat{
  height:340px;
  overflow-y:auto;
  padding:12px;
  background:rgba(0,0,0,0.35);
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
}

/* MESSAGES */
.msg{
  margin:8px 0;
  font-size:14px;
  line-height:1.4;
  white-space:pre-wrap;
}

.you{
  text-align:right;
  color:var(--blue);
}

.them{
  text-align:left;
  color:white;
  opacity:0.9;
}

.system{
  text-align:center;
  color:var(--green);
  font-size:12px;
}

/* INPUT AREA */
#inputBox{
  margin-top:12px;
  display:flex;
  gap:8px;
}

input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
  background:#0d0a1f;
  color:white;
  outline:none;
}

/* DISABLED STATE */
.disabled{
  opacity:0.4;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>🧾 Order Chat AI</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- AI PANEL -->
  <div class="ai-box">
    🤖 <span id="aiStatus">Analyzing order...</span>
  </div>

  <!-- CHAT -->
  <div class="card">

    <div id="chatBox" class="chat"></div>

    <div id="inputBox">
      <input id="msgInput" placeholder="Type message..." />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

</div>

<script>
/* =======================
   SUPABASE INIT
======================= */
const supabaseUrl = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphemJkYmtvcWp4ZHppc2ZzemVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTA4MzAsImV4cCI6MjA5MTQ4NjgzMH0.uTqieGXErIpooSUn0TMmYwYYJuo0yHYcAqdampHWRj4";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* =======================
   STATE
======================= */
let currentUser = null;
let orderId = "order_123"; // replace dynamically later
let orderClosed = false;

/* =======================
   LOAD USER
======================= */
async function loadUser(){
  const { data } = await supabase.auth.getUser();
  currentUser = data.user;

  if(!currentUser){
    window.location.href = "login.html";
    return;
  }

  loadMessages();
  watchOrderStatus();
}
loadUser();

/* =======================
   LOAD CHAT
======================= */
async function loadMessages(){

  const { data } = await supabase
    .from("messages")
    .select("*")
    .eq("order_id", orderId)
    .order("created_at", { ascending: true });

  renderMessages(data || []);
}

function renderMessages(messages){

  const box = document.getElementById("chatBox");
  box.innerHTML = "";

  messages.forEach(m => {

    const div = document.createElement("div");

    if(m.sender_id === "system"){
      div.className = "msg system";
    }
    else{
      div.className = "msg " +
        (m.sender_id === currentUser.id ? "you" : "them");
    }

    div.textContent = m.message;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* =======================
   SEND MESSAGE
======================= */
async function sendMessage(){

  if(orderClosed){
    alert("Order is completed. Chat is locked.");
    return;
  }

  const input = document.getElementById("msgInput");
  if(!input.value.trim()) return;

  await supabase.from("messages").insert({
    order_id: orderId,
    sender_id: currentUser.id,
    message: input.value
  });

  input.value = "";
  loadMessages();
}

/* =======================
   REALTIME CHAT
======================= */
supabase
  .channel("chat-channel")
  .on(
    "postgres_changes",
    { event: "INSERT", schema: "public", table: "messages" },
    () => loadMessages()
  )
  .subscribe();

/* =======================
   ORDER STATUS WATCHER
======================= */
async function watchOrderStatus(){

  const { data: escrow } = await supabase
    .from("escrow")
    .select("*")
    .eq("id", orderId)
    .single();

  if(!escrow) return;

  if(escrow.status === "released" || escrow.status === "paid"){
    closeChat();
  }

  runZepAI(escrow);
}

/* =======================
   ZEP AI STATUS ENGINE
======================= */
function runZepAI(escrow){

  let statusText = "";

  if(!escrow){
    statusText = "Waiting for order confirmation...";
  }
  else if(escrow.status === "locked"){
    statusText = "Order active. Funds secured in escrow.";
  }
  else if(escrow.status === "pending"){
    statusText = "Payment pending approval.";
  }
  else if(escrow.status === "released"){
    statusText = "Payment released. Order completed.";
  }

  document.getElementById("aiStatus").innerText = statusText;
}

/* =======================
   CLOSE CHAT
======================= */
function closeChat(){

  orderClosed = true;

  document.getElementById("inputBox").classList.add("disabled");

  const box = document.getElementById("chatBox");

  const sys = document.createElement("div");
  sys.className = "msg system";
  sys.textContent = "🔒 Order completed. Chat locked by Zep AI.";

  box.appendChild(sys);

  document.getElementById("aiStatus").innerText =
    "Order completed. Chat locked automatically.";
}

/* =======================
   LOGOUT
======================= */
async function logout(){
  await supabase.auth.signOut();
  window.location.href = "login.html";
}
</script>

</body>
</html>
