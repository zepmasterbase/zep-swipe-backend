<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — AI Viral Deal OS</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050014;
  --glass:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.12);
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --text:rgba(255,255,255,.85);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
  background:radial-gradient(circle at 30% 10%, #050014, #000);
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  margin:14px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);
  backdrop-filter:blur(12px);
}

.brand{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* AI PANEL */
.ai-box{
  margin:14px;
  padding:14px;
  border-radius:14px;
  background:rgba(0,240,255,.06);
  border:1px solid rgba(0,240,255,.2);
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:14px;
  display:grid;
  gap:14px;
}

.deal-card{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:14px;
  transition:.2s;
}

.deal-card:hover{
  transform:translateY(-3px);
  border-color:rgba(0,240,255,.4);
}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:11px;
  margin-top:6px;
  background:rgba(255,255,255,.08);
}

button{
  margin-top:10px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  font-weight:bold;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
}

.modal-box{
  background:var(--glass);
  padding:20px;
  border-radius:14px;
  border:1px solid var(--stroke);
  text-align:center;
  width:90%;
  max-width:360px;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep AI Deal OS</div>
  <button onclick="location.href='student-dashboard.html'">🏠</button>
</header>

<!-- 🤖 AI VIRAL ENGINE -->
<div class="ai-box">
  🤖 <span id="aiInsight">Analyzing viral deal trends...</span>
</div>

<div class="container" id="dealsContainer"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <p id="modalText"></p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= STATE ================= */
let user = null;
let deals = [];

/* ================= INIT ================= */
async function init(){
  const { data: { user: authUser } } = await supabase.auth.getUser();

  if(!authUser){
    location.href="login.html";
    return;
  }

  user = authUser;

  loadDeals();
  subscribeDeals(); // 🔥 realtime engine
}

init();

/* ================= LOAD DEALS ================= */
async function loadDeals(){
  const { data } = await supabase
    .from("deals")
    .select("*");

  deals = data || [];
  renderDeals();
  runAI();
}

/* ================= RENDER ================= */
function renderDeals(){

  const container = document.getElementById("dealsContainer");
  container.innerHTML = "";

  deals.forEach(deal => {

    const viralScore = calculateViralScore(deal);

    const div = document.createElement("div");
    div.className = "deal-card";

    div.innerHTML = `
      <h3>${deal.name}</h3>
      <p>${deal.description}</p>

      <span class="badge">🔥 Viral Score: ${viralScore}/100</span>
      <br>
      <small>${deal.category || "General"} · ${deal.campus || "All Campuses"}</small>

      <button onclick="redeem('${deal.id}')">
        Redeem Deal
      </button>
    `;

    container.appendChild(div);
  });
}

/* ================= VIRAL AI ENGINE ================= */
function calculateViralScore(deal){

  let score = 50;

  if(deal.description?.length > 80) score += 10;
  if(deal.category === "Food") score += 15;
  if(deal.category === "Tech") score += 20;

  if(deal.name?.toLowerCase().includes("free")) score += 25;

  return Math.min(100, score);
}

/* ================= AI INSIGHT PANEL ================= */
function runAI(){

  if(deals.length === 0){
    document.getElementById("aiInsight").innerText =
      "No deals yet — system warming up...";
    return;
  }

  const top = deals
    .map(d => ({...d, score: calculateViralScore(d)}))
    .sort((a,b)=>b.score-a.score)[0];

  document.getElementById("aiInsight").innerText =
    `🔥 Trending Deal: "${top.name}" predicted high engagement & virality.`;
}

/* ================= REALTIME SUBSCRIPTION ================= */
function subscribeDeals(){

  supabase
    .channel("deals-live")
    .on("postgres_changes",
      { event: "*", schema: "public", table: "deals" },
      () => loadDeals()
    )
    .subscribe();
}

/* ================= REDEEM ================= */
async function redeem(dealId){

  const { data: existing } = await supabase
    .from("redemptions")
    .select("*")
    .eq("user_id", user.id)
    .eq("deal_id", dealId)
    .maybeSingle();

  if(existing){
    showModal("Already redeemed: " + existing.code);
    return;
  }

  const code = "ZEP-" + Math.random().toString(36).substring(2,10).toUpperCase();

  const { error } = await supabase
    .from("redemptions")
    .insert([{
      user_id: user.id,
      deal_id: dealId,
      code
    }]);

  if(error){
    showModal("Error redeeming deal");
    return;
  }

  showModal("🎉 Redeem Code: " + code);
}

/* ================= MODAL ================= */
function showModal(text){
  document.getElementById("modalText").innerText = text;
  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
