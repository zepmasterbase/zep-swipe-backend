<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Student Deals</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400,500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,.08);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}
body{background:var(--bg);color:#fff;}

header{
  display:flex;justify-content:space-between;
  padding:16px;margin:16px;border-radius:14px;
  background:rgba(255,255,255,.05);
}

.brand{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.container{max-width:1100px;margin:auto;padding:16px;display:grid;gap:16px;}
.deal-card{background:var(--glass);padding:16px;border-radius:14px;}

button{
  border:none;border-radius:999px;padding:10px;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;font-family:Orbitron;cursor:pointer;
}

.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;
}
.modal-box{
  background:var(--glass);padding:20px;border-radius:14px;
  width:90%;max-width:400px;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep Swipe Deals</div>
  <button onclick="location.href='student-dashboard.html'">🏠</button>
</header>

<div class="container" id="dealsContainer"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <p id="modalText"></p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
// ================= SUPABASE =================
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ================= STATE =================
let user = null;
let deals = [];

// ================= INIT =================
async function init(){
  const { data: { user: authUser } } = await supabase.auth.getUser();

  if(!authUser){
    location.href="login.html";
    return;
  }

  user = authUser;

  loadDeals();
}

init();

// ================= LOAD DEALS =================
async function loadDeals(){
  const { data, error } = await supabase
    .from("deals")
    .select("*");

  if(error){
    console.error(error);
    return;
  }

  deals = data || [];
  renderDeals();
}

// ================= RENDER =================
function renderDeals(){
  const container = document.getElementById("dealsContainer");
  container.innerHTML="";

  deals.forEach(deal=>{
    const div=document.createElement("div");
    div.className="deal-card";

    div.innerHTML=`
      <h3>${deal.name}</h3>
      <p>${deal.description}</p>
      <small>${deal.category} · ${deal.campus}</small>
      <br><br>
      <button onclick="redeem('${deal.id}')">Redeem</button>
    `;

    container.appendChild(div);
  });
}

// ================= REDEEM =================
async function redeem(dealId){

  // check existing redemption
  const { data: existing } = await supabase
    .from("redemptions")
    .select("*")
    .eq("user_id", user.id)
    .eq("deal_id", dealId)
    .maybeSingle();

  if(existing){
    showModal("Already redeemed: " + existing.code);
    return;
  }

  const code = "ZEP-" + Math.random().toString(36).substring(2,10).toUpperCase();

  const { error } = await supabase
    .from("redemptions")
    .insert([{
      user_id: user.id,
      deal_id: dealId,
      code: code
    }]);

  if(error){
    showModal("Error redeeming deal");
    return;
  }

  showModal("Redeem Code: " + code);
}

// ================= MODAL =================
function showModal(text){
  document.getElementById("modalText").innerText=text;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
