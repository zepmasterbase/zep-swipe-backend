<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Student Onboarding V1</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f0d;
  color: white;
}

/* HEADER */
header {
  padding: 14px;
  text-align: center;
  color: #00ff8c;
  font-weight: 700;
}

/* CONTAINER */
.container {
  max-width: 600px;
  margin: auto;
  padding: 14px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px;
}

/* INPUT */
input, textarea, select {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #0b0f0d;
  color: white;
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #00ff8c;
  color: black;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
}

.hidden {
  display: none;
}

</style>
</head>

<body>

<header>
  🚀 Zep Swipe Student Onboarding V1
</header>

<div class="container">

  <div class="card">

    <h3>Become a Student Earner</h3>
    <p>Get discovered, offer skills, earn in your community.</p>

    <button class="primary" onclick="openModal()">
      Start Onboarding
    </button>

  </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">

  <div class="card" style="width:90%; max-width:500px;">

    <h3>Create Your Profile</h3>

    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="WhatsApp Number">
    <input id="location" placeholder="Location">

    <select id="category">
      <option>Academic Services</option>
      <option>Digital Services</option>
      <option>Creative Services</option>
      <option>Technical Services</option>
      <option>Community Services</option>
    </select>

    <textarea id="bio" placeholder="Describe what you can do..."></textarea>

    <input id="skills" placeholder="Skills (e.g Photoshop, Tutoring)">

    <input id="whatsapp" placeholder="WhatsApp link or number">

    <button class="primary" onclick="submitProfile()">
      Save & Join Marketplace
    </button>

    <button onclick="closeModal()">
      Cancel
    </button>

  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* OPEN MODAL */
function openModal(){
  document.getElementById("modal").classList.remove("hidden");
}

/* CLOSE MODAL */
function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

/* SUBMIT PROFILE */
async function submitProfile(){

  const profile = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    location: document.getElementById("location").value,
    category: document.getElementById("category").value,
    bio: document.getElementById("bio").value,
    skills: document.getElementById("skills").value,
    whatsapp: document.getElementById("whatsapp").value
  };

  /* SAVE TO STUDENT PROFILES */
  await client.from("student_profiles").insert([profile]);

  /* ALSO MAKE THEM VISIBLE IN MARKETPLACE */
  await client.from("service_profiles").insert([{
    provider_id: profile.phone,
    category: profile.category,
    description: profile.bio,
    price_range: "Negotiable",
    location: profile.location,
    phone: profile.whatsapp
  }]);

  alert("Welcome! You are now visible in the marketplace.");

  closeModal();
}

</script>

</body>
</html>
