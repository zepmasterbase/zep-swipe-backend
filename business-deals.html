<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zep Swipe Business Dashboard - Supabase Ready</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#070707;color:#fff;font-family:Inter,sans-serif}
.wrap{max-width:900px;margin:auto;padding:24px}
.card{background:#121416;border:1px solid #2a2a2a;border-radius:18px;padding:20px;margin:18px 0}
input,textarea,button{width:100%;padding:12px;margin-top:10px;border-radius:12px}
input,textarea{background:#0f1011;color:#fff;border:1px solid #333}
button{background:#b8ff3b;border:0;font-weight:800}
.deal{background:#181a1d;border:1px solid #333;border-radius:14px;padding:16px;margin-top:12px}
small{color:#9aa0a6}
</style>
</head>
<body>
<div class="wrap">
<h1>Zep Swipe Business</h1>
<p><small>Supabase-ready merchant dashboard starter. Replace the placeholders below with your project credentials.</small></p>

<div class="card">
<h3>Create Deal</h3>
<input id="title" placeholder="Deal title">
<textarea id="description" placeholder="Description"></textarea>
<input id="discount" placeholder="Discount e.g. 20%">
<input id="expiry" type="date">
<button id="publishBtn">Publish Deal</button>
<div id="status"></div>
</div>

<div class="card">
<h3>My Deals</h3>
<div id="deals"></div>
</div>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function loadDeals(){
  const {data,error}=await db.from("deals")
    .select("*")
    .order("created_at",{ascending:false});

  const box=document.getElementById("deals");
  if(error){
    box.innerHTML="<small>Unable to load deals. Check your Supabase connection, table name, and RLS policies.</small>";
    return;
  }
  if(!data.length){
    box.innerHTML="<small>No deals published yet.</small>";
    return;
  }
  box.innerHTML=data.map(d=>`
    <div class="deal">
      <h3>${d.title}</h3>
      <p>${d.description||""}</p>
      <p><strong>${d.discount||""}</strong> ${d.expiry_date?("• Ends "+d.expiry_date):""}</p>
      <button onclick="removeDeal('${d.id}')">Delete</button>
    </div>
  `).join("");
}

async function publishDeal(){
 const payload={
   title:title.value.trim(),
   description:description.value.trim(),
   discount:discount.value.trim(),
   expiry_date:expiry.value||null
 };
 if(!payload.title){
   alert("Enter a title");
   return;
 }
 status.textContent="Publishing...";
 const {error}=await db.from("deals").insert(payload);
 if(error){
   status.textContent=error.message;
   return;
 }
 status.textContent="Deal published.";
 title.value="";description.value="";discount.value="";expiry.value="";
 loadDeals();
}

async function removeDeal(id){
 if(!confirm("Delete this deal?")) return;
 const {error}=await db.from("deals").delete().eq("id",id);
 if(error){alert(error.message);return;}
 loadDeals();
}

publishBtn.addEventListener("click",publishDeal);
loadDeals();
</script>
</body>
</html>
