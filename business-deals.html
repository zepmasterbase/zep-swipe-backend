<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Business Deals</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle at top,#070a09,#050807);
color:white;
padding-bottom:40px;
}

header{
padding:16px;
text-align:center;
border-bottom:1px solid rgba(0,255,140,.15);
}

h1{
color:#00ff8c;
margin:0;
}

.container{
max-width:520px;
margin:auto;
padding:15px;
}

.card{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
padding:12px;
margin-top:12px;
}

input, select, textarea{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:none;
outline:none;
background:rgba(255,255,255,.08);
color:white;
}

label{
font-size:12px;
opacity:.8;
margin-top:10px;
display:block;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

.primary{
background:linear-gradient(90deg,#00ff8c,#00c2ff);
color:black;
}

.preview img{
width:100%;
border-radius:10px;
margin-top:10px;
}

.badge{
display:inline-block;
padding:4px 8px;
font-size:11px;
border-radius:20px;
background:rgba(0,255,140,.15);
color:#00ff8c;
margin-top:6px;
}

.small{
font-size:12px;
opacity:.7;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.days{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:8px;
}

.day{
padding:6px 10px;
border:1px solid rgba(255,255,255,.2);
border-radius:8px;
cursor:pointer;
font-size:12px;
}

.day.active{
background:#00ff8c;
color:black;
}

</style>
</head>

<body>

<header>
<h1>⚡ Zep Business Deals</h1>
<p class="small">Create student offers in seconds</p>
</header>

<div class="container">

<!-- IMAGE UPLOAD -->
<div class="card">

<label>📸 Upload Deal Image</label>
<input type="file" id="imageFile" accept="image/*">

<div class="preview" id="preview"></div>

</div>


<!-- CATEGORY -->
<div class="card">

<label>🏷️ Category</label>
<select id="category">
<option>Food & Drinks</option>
<option>Beauty & Hair</option>
<option>Education</option>
<option>Services</option>
<option>Events</option>
<option>Retail</option>
</select>

</div>


<!-- DETAILS -->
<div class="card">

<label>Deal Title</label>
<input id="title" placeholder="e.g. 50% Off Chicken Meal">

<label>Description</label>
<textarea id="desc"></textarea>

<label>Location</label>
<input id="location">

<label>Business Phone (WhatsApp)</label>
<input id="phone">

</div>


<!-- SCHEDULE -->
<div class="card">

<label>📅 Active Days</label>

<div class="days" id="days">
<div class="day" onclick="toggleDay(this)">Mon</div>
<div class="day" onclick="toggleDay(this)">Tue</div>
<div class="day" onclick="toggleDay(this)">Wed</div>
<div class="day" onclick="toggleDay(this)">Thu</div>
<div class="day" onclick="toggleDay(this)">Fri</div>
<div class="day" onclick="toggleDay(this)">Sat</div>
<div class="day" onclick="toggleDay(this)">Sun</div>
</div>

<label>👥 Students Per Day</label>
<input type="number" id="limit" value="10">

</div>


<!-- ACTION -->
<div class="card">

<button class="primary" onclick="publishDeal()">
🚀 Publish Deal
</button>

<p class="small" id="status"></p>

</div>

</div>


<script>

const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";

const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let selectedDays=[];


/* PREVIEW IMAGE */
document.getElementById("imageFile").onchange = (e)=>{
const file=e.target.files[0];
if(!file)return;

const reader=new FileReader();
reader.onload=()=>{
document.getElementById("preview").innerHTML=
`<img src="${reader.result}">`;
};
reader.readAsDataURL(file);
};


/* DAYS SELECT */
function toggleDay(el){
el.classList.toggle("active");

selectedDays=[...document.querySelectorAll(".day.active")]
.map(d=>d.innerText);
}


/* GENERATE COUPONS */
function generateCoupons(count, dealId){
let coupons=[];

for(let i=0;i<count;i++){
coupons.push({
deal_id:dealId,
coupon_code:"ZS-"+Math.random().toString(36).substring(2,8).toUpperCase(),
is_used:false,
expires_at:new Date(Date.now()+7*24*60*60*1000)
});
}

return coupons;
}


/* UPLOAD IMAGE */
async function uploadImage(file){

const fileName=Date.now()+"-"+file.name;

const {data,error}=await client
.storage
.from("deal-images")
.upload(fileName,file);

if(error){
console.log(error);
return null;
}

const {data:urlData}=client
.storage
.from("deal-images")
.getPublicUrl(fileName);

return urlData.publicUrl;
}


/* PUBLISH DEAL */
async function publishDeal(){

const status=document.getElementById("status");
status.innerText="Publishing...";

const file=document.getElementById("imageFile").files[0];

let imageUrl="";

if(file){
imageUrl=await uploadImage(file);
}


const title=document.getElementById("title").value;
const desc=document.getElementById("desc").value;
const location=document.getElementById("location").value;
const phone=document.getElementById("phone").value;
const category=document.getElementById("category").value;
const limit=parseInt(document.getElementById("limit").value||"0");


const totalCoupons=selectedDays.length * limit;


/* INSERT DEAL */
const {data:deal,error}=await client
.from("deals")
.insert([{
title,
description:desc,
location,
phone,
category,
image_url:imageUrl
}])
.select()
.single();

if(error){
status.innerText="Error publishing deal";
return;
}


/* INSERT COUPONS */
const coupons=generateCoupons(totalCoupons,deal.id);

await client
.from("deal_coupons")
.insert(coupons);


status.innerText=
`Deal published! ${totalCoupons} coupons generated 🎟️`;

}

</script>

</body>
</html>
