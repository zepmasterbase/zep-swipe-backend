<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Student Deals</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   V16 MARKETPLACE THEME
========================= */
:root{
  --bg:#070707;
  --card:#141414;
  --accent:#b8ff3b;
  --text:#ffffff;
  --muted:#aaaaaa;
  --border:#262626;
}

body{
margin:0;
font-family:system-ui;
background:var(--bg);
color:var(--text);
padding-bottom:60px;
}

/* HEADER */
header{
padding:18px;
text-align:center;
border-bottom:1px solid var(--border);
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
}

h1{
color:var(--accent);
margin:0;
}

.small{
font-size:12px;
color:var(--muted);
}

/* CONTAINER */
.container{
max-width:540px;
margin:auto;
padding:16px;
}

/* CARD */
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
padding:14px;
margin-top:12px;
transition:0.3s;
}

.card:hover{
border-color:var(--accent);
transform:translateY(-2px);
}

/* INPUTS */
input, select, textarea{
width:100%;
padding:12px;
margin-top:8px;
border-radius:10px;
border:1px solid var(--border);
background:#0d0d0d;
color:var(--text);
outline:none;
}

input:focus, textarea:focus, select:focus{
border-color:var(--accent);
}

/* LABEL */
label{
font-size:12px;
color:var(--muted);
margin-top:10px;
display:block;
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

.primary{
background:var(--accent);
color:black;
}

.primary:hover{
box-shadow:0 10px 25px rgba(184,255,59,0.15);
transform:translateY(-2px);
}

/* IMAGE */
.preview img{
width:100%;
border-radius:10px;
margin-top:10px;
border:1px solid var(--border);
}

/* DAYS */
.days{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:8px;
}

.day{
padding:6px 10px;
border:1px solid var(--border);
border-radius:8px;
cursor:pointer;
font-size:12px;
background:#0d0d0d;
}

.day.active{
background:var(--accent);
color:black;
}

/* STATUS */
.status{
font-size:12px;
color:var(--muted);
margin-top:10px;
}

</style>
</head>

<body>

<header>
<h1>⚡ Zep Business Deals</h1>
<p class="small">Ecosystem-powered student deals engine</p>
</header>

<div class="container">

<!-- IMAGE -->
<div class="card">
<label>📸 Upload Deal Image</label>
<input type="file" id="imageFile" accept="image/*">
<div class="preview" id="preview"></div>
</div>

<!-- CATEGORY -->
<div class="card">
<label>🏷️ Category</label>
<select id="category">
<option>Food & Drinks</option>
<option>Beauty & Hair</option>
<option>Education</option>
<option>Services</option>
<option>Events</option>
<option>Retail</option>
</select>
</div>

<!-- DETAILS -->
<div class="card">
<label>Deal Title</label>
<input id="title" placeholder="e.g. 50% Off Chicken Meal">

<label>Description</label>
<textarea id="desc"></textarea>

<label>Location</label>
<input id="location">

<label>WhatsApp Number</label>
<input id="phone">
</div>

<!-- SCHEDULE -->
<div class="card">
<label>📅 Active Days</label>

<div class="days" id="days">
<div class="day" onclick="toggleDay(this)">Mon</div>
<div class="day" onclick="toggleDay(this)">Tue</div>
<div class="day" onclick="toggleDay(this)">Wed</div>
<div class="day" onclick="toggleDay(this)">Thu</div>
<div class="day" onclick="toggleDay(this)">Fri</div>
<div class="day" onclick="toggleDay(this)">Sat</div>
<div class="day" onclick="toggleDay(this)">Sun</div>
</div>

<label>👥 Limit Per Day</label>
<input type="number" id="limit" value="10">
</div>

<!-- ACTION -->
<div class="card">

<button class="primary" onclick="publishDeal()">
🚀 Publish Deal
</button>

<div class="status" id="status"></div>

</div>

</div>

<script>

const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";

const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let selectedDays=[];

/* IMAGE PREVIEW */
document.getElementById("imageFile").onchange=(e)=>{
const file=e.target.files[0];
if(!file)return;

const reader=new FileReader();
reader.onload=()=>{
document.getElementById("preview").innerHTML=
`<img src="${reader.result}">`;
};
reader.readAsDataURL(file);
};

/* DAYS SELECT */
function toggleDay(el){
el.classList.toggle("active");

selectedDays=[...document.querySelectorAll(".day.active")]
.map(d=>d.innerText);
}

/* UPLOAD IMAGE */
async function uploadImage(file){

const fileName=Date.now()+"-"+file.name;

const {data,error}=await client.storage
.from("deal-images")
.upload(fileName,file);

if(error){
console.log(error);
return null;
}

const {data:urlData}=client.storage
.from("deal-images")
.getPublicUrl(fileName);

return urlData.publicUrl;
}

/* COUPONS ENGINE */
function generateCoupons(count, dealId){
let coupons=[];
for(let i=0;i<count;i++){
coupons.push({
deal_id:dealId,
coupon_code:"ZS-"+Math.random().toString(36).substring(2,8).toUpperCase(),
is_used:false,
expires_at:new Date(Date.now()+7*24*60*60*1000)
});
}
return coupons;
}

/* PUBLISH DEAL */
async function publishDeal(){

const status=document.getElementById("status");
status.innerText="Publishing deal...";

const file=document.getElementById("imageFile").files[0];
let imageUrl="";

if(file){
imageUrl=await uploadImage(file);
}

const title=document.getElementById("title").value;
const desc=document.getElementById("desc").value;
const location=document.getElementById("location").value;
const phone=document.getElementById("phone").value;
const category=document.getElementById("category").value;
const limit=parseInt(document.getElementById("limit").value||"0");

const totalCoupons=selectedDays.length*limit;

/* INSERT DEAL */
const {data:deal,error}=await client
.from("deals")
.insert([{
title,
description:desc,
location,
phone,
category,
image_url:imageUrl
}])
.select()
.single();

if(error){
status.innerText="Error publishing deal";
return;
}

/* INSERT COUPONS */
const coupons=generateCoupons(totalCoupons,deal.id);

await client.from("deal_coupons").insert(coupons);

/* ECOSYSTEM EVENT (READY FOR V16 ANALYTICS) */
await client.from("analytics").insert([{
event_type:"deal_created",
meta:{deal_id:deal.id,totalCoupons}
}]);

status.innerText=
`🚀 Deal live! ${totalCoupons} coupons generated`;
}

</script>

</body>
</html>
