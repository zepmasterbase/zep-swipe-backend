<style>

body{background:var(--bg);color:#fff;padding-bottom:90px}
.hero{margin:16px;padding:34px;border-radius:28px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.85)),url('https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1600&q=80') center/cover}

.card{background:#141414;border:1px solid #262626;border-radius:20px;padding:16px;margin:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat,.deal{background:#101010;border:1px solid #262626;border-radius:16px;padding:14px}
input,select,textarea{width:100%;padding:12px;margin-top:10px;background:#101010;color:#fff;border:1px solid #262626;border-radius:12px}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#b8ff3b;color:#000;font-weight:800;margin-top:12px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid #262626;display:flex;justify-content:space-around;padding:12px 0}
.footer a{display:flex;flex-direction:column;align-items:center;color:#fff;text-decoration:none;font-size:12px}
</style>
</head>
<body>

<div class="hero">
<span class="badge">🏷 Student Deals Network</span>
<h1 style="margin-top:12px">Create Deals. Get Customers.</h1>
<p>Publish student offers, track claims and grow your business.</p>
</div>

<div class="card">
<div class="grid">
<div class="stat"><h2 id="views">0</h2><small>Views</small></div>
<div class="stat"><h2 id="claims">0</h2><small>Claims</small></div>
<div class="stat"><h2 id="leads">0</h2><small>Leads</small></div>
<div class="stat"><h2 id="activeDeals">0</h2><small>Active Deals</small></div>
</div>
</div>

<div class="card">

<option>Featured Deal</option>

<select id="category">
<option>Food & Drinks</option>
<option>Salon & Barber</option>
<option>Fashion</option>
<option>Electronics</option>
<option>Education</option>
</select>
<input id="title" placeholder="Deal Title">
<textarea id="description" placeholder="Deal Description"></textarea>
<input id="discount" placeholder="Discount %">
<input id="expiry" type="date">
<button class="btn" onclick="publishDeal()">Publish Deal</button>
</div>

<div class="card">
<h3>📦 My Deals</h3>
<div id="dealsContainer"></div>
</div>

<div class="card">
<h3>✅ Verified Student Claims</h3>

</div>

<div class="footer">

</html>
