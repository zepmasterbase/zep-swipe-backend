<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Employer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400,500,600&display=swap" rel="stylesheet">

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,0.08);
  --text-light:rgba(255,255,255,.85);
  --green:#00ff94;
  --yellow:#ffc107;
  --purple:#9c4dff;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif;}
body{background:var(--bg);color:#fff;min-height:100vh;padding-bottom:50px;}

button{
  border:none;border-radius:999px;padding:8px 14px;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  color:#050015;cursor:pointer;
}

/* same styling (unchanged for brevity) */

.dashboard{padding:20px;max-width:1200px;margin:auto;display:flex;flex-direction:column;gap:24px;}
.jobs-container{display:grid;grid-template-columns:1fr;gap:16px;}
.job-card{background:var(--glass);padding:16px;border-radius:16px;}
.applicant-card{display:flex;justify-content:space-between;padding:8px;background:rgba(255,255,255,.05);margin-top:6px;border-radius:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;}
.modal{background:var(--glass);padding:20px;border-radius:12px;}
</style>
</head>

<body>

<header>
  <h2 style="font-family:Orbitron">Zep Swipe Employer</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="dashboard">

  <div id="jobsContainer" class="jobs-container"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <p id="modalText"></p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
// ================= SUPABASE INIT =================
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ================= STATE =================
let currentEmployer = null;
let jobs = [];
let invoices = [];

const jobsContainer = document.getElementById("jobsContainer");

// ================= AUTH CHECK =================
async function checkSession(){
  const { data: { session } } = await supabase.auth.getSession();

  if(!session){
    window.location.href = "employer-auth.html";
    return;
  }

  currentEmployer = session.user;
  loadJobs();
}

checkSession();

// ================= LOAD JOBS FROM SUPABASE =================
async function loadJobs(){
  const { data, error } = await supabase
    .from("jobs")
    .select("*")
    .eq("employer_id", currentEmployer.id);

  if(error){
    console.error(error);
    return;
  }

  jobs = data || [];
  renderJobs();
}

// ================= LOGOUT =================
async function logout(){
  await supabase.auth.signOut();
  window.location.href = "employer-auth.html";
}

// ================= MODAL =================
function showModal(text){
  document.getElementById("modalText").innerText = text;
  document.getElementById("modalOverlay").style.display = "flex";
}
function closeModal(){
  document.getElementById("modalOverlay").style.display = "none";
}

// ================= RENDER JOBS =================
function renderJobs(){
  jobsContainer.innerHTML = "";

  jobs.forEach((job, idx)=>{
    const div = document.createElement("div");
    div.className = "job-card";

    div.innerHTML = `
      <h3>${job.title}</h3>
      <p>Rate: $${job.rate}</p>
      <div id="app-${idx}">Loading applicants...</div>
    `;

    jobsContainer.appendChild(div);

    loadApplicants(job.id, idx);
  });
}

// ================= LOAD APPLICANTS =================
async function loadApplicants(jobId, idx){
  const { data, error } = await supabase
    .from("job_applicants")
    .select("*")
    .eq("job_id", jobId);

  const container = document.getElementById(`app-${idx}`);

  if(error){
    container.innerHTML = "Error loading applicants";
    return;
  }

  if(!data.length){
    container.innerHTML = "<small>No applicants</small>";
    return;
  }

  container.innerHTML = "";

  data.forEach(app=>{
    const card = document.createElement("div");
    card.className = "applicant-card";

    card.innerHTML = `
      <span>${app.student_name}</span>
      <button onclick="approveStudent('${app.id}','${jobId}','${app.student_id}')">
        Approve
      </button>
    `;

    container.appendChild(card);
  });
}

// ================= APPROVE STUDENT =================
async function approveStudent(applicantId, jobId, studentId){

  const { error } = await supabase
    .from("job_applicants")
    .update({ status: "approved" })
    .eq("id", applicantId);

  if(error){
    showModal("Error approving student");
    return;
  }

  // create invoice
  const { error: invErr } = await supabase
    .from("invoices")
    .insert([{
      employer_id: currentEmployer.id,
      student_id: studentId,
      job_id: jobId,
      status: "pending"
    }]);

  if(invErr){
    showModal("Approved but invoice failed");
    return;
  }

  showModal("Student approved & invoice created!");
  loadJobs();
}

</script>

</body>
</html>
