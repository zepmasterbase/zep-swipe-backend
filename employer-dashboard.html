<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Real-Time Employer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050012;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --text:rgba(255,255,255,0.85);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  background:radial-gradient(circle at 20% 10%, #0b0020, var(--bg));
  color:#fff;
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:rgba(5,0,18,0.6);
  backdrop-filter:blur(12px);
}

header h2{
  font-family:Orbitron;
  font-size:1rem;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* BUTTON */
button{
  border:none;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* DASHBOARD */
.dashboard{
  max-width:1100px;
  margin:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* AI PANEL */
.ai-box{
  padding:12px;
  border-radius:14px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.25);
  font-size:13px;
}

/* JOB CARD */
.job-card{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  box-shadow:0 0 25px rgba(156,77,255,0.08);
  transition:0.2s;
}

.job-card:hover{
  transform:translateY(-2px);
}

.job-title{
  font-size:15px;
  margin-bottom:4px;
}

.job-rate{
  font-size:13px;
  color:var(--text);
}

/* APPLICANT */
.applicant-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  font-size:13px;
}

/* EMPTY */
small{
  color:rgba(255,255,255,0.5);
}

/* REALTIME PULSE */
.pulse{
  width:8px;
  height:8px;
  background:var(--green);
  border-radius:50%;
  display:inline-block;
  margin-right:6px;
  box-shadow:0 0 10px var(--green);
}
</style>
</head>

<body>

<header>
  <h2>⚡ Zep Employer Live Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="dashboard">

  <!-- LIVE AI STATUS -->
  <div class="ai-box">
    <span class="pulse"></span>
    🤖 Zep AI: <span id="aiStatus">Connecting real-time system...</span>
  </div>

  <div id="jobsContainer"></div>

</div>

<script>

// ================= SUPABASE =================
const SUPABASE_URL = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_KEY_HERE";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ================= STATE =================
let currentEmployer = null;
let jobs = [];

const jobsContainer = document.getElementById("jobsContainer");

// ================= AUTH =================
async function checkSession(){
  const { data:{ session } } = await supabase.auth.getSession();

  if(!session){
    window.location.href = "employer-auth.html";
    return;
  }

  currentEmployer = session.user;
  loadJobs();
  setupRealtime();
}

checkSession();

// ================= LOAD JOBS =================
async function loadJobs(){

  const { data } = await supabase
    .from("jobs")
    .select("*")
    .eq("employer_id", currentEmployer.id);

  jobs = data || [];
  renderJobs();
}

// ================= REALTIME ENGINE =================
function setupRealtime(){

  // JOB APPLICANTS LIVE
  supabase
    .channel("job-applicants-live")
    .on("postgres_changes",
      { event:"*", schema:"public", table:"job_applicants" },
      payload => {
        console.log("Applicant update:", payload);
        loadJobs();
      }
    )
    .subscribe();

  // JOBS LIVE
  supabase
    .channel("jobs-live")
    .on("postgres_changes",
      { event:"*", schema:"public", table:"jobs" },
      payload => {
        console.log("Job update:", payload);
        loadJobs();
      }
    )
    .subscribe();

  document.getElementById("aiStatus").innerText =
    "Live system active — listening for job & applicant updates ⚡";
}

// ================= LOGOUT =================
async function logout(){
  await supabase.auth.signOut();
  window.location.href = "employer-auth.html";
}

// ================= RENDER JOBS =================
function renderJobs(){

  jobsContainer.innerHTML = "";

  jobs.forEach((job, idx)=>{

    const card = document.createElement("div");
    card.className = "job-card";

    card.innerHTML = `
      <div class="job-title">${job.title}</div>
      <div class="job-rate">💰 Rate: $${job.rate}</div>
      <div id="app-${idx}"><small>Loading applicants...</small></div>
    `;

    jobsContainer.appendChild(card);

    loadApplicants(job.id, idx);
  });
}

// ================= LOAD APPLICANTS =================
async function loadApplicants(jobId, idx){

  const { data } = await supabase
    .from("job_applicants")
    .select("*")
    .eq("job_id", jobId);

  const container = document.getElementById(`app-${idx}`);

  if(!data || !data.length){
    container.innerHTML = "<small>No applicants yet</small>";
    return;
  }

  container.innerHTML = "";

  data.forEach(app=>{

    const div = document.createElement("div");
    div.className = "applicant-card";

    div.innerHTML = `
      <span>${app.student_name}</span>
      <button onclick="approveStudent('${app.id}','${jobId}','${app.student_id}')">
        Approve
      </button>
    `;

    container.appendChild(div);
  });
}

// ================= APPROVE STUDENT =================
async function approveStudent(applicantId, jobId, studentId){

  await supabase
    .from("job_applicants")
    .update({ status:"approved" })
    .eq("id", applicantId);

  await supabase
    .from("invoices")
    .insert([{
      employer_id: currentEmployer.id,
      student_id: studentId,
      job_id: jobId,
      status: "pending"
    }]);

  loadJobs();
}

</script>

</body>
</html>
