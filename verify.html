<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zep Swipe | Email Verified</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#030403;
  --panel:#0d100c;
  --line:#252a23;
  --accent:#b8ff3b;
  --accent2:#d9ff79;
  --muted:#8e9588;
}
*{box-sizing:border-box;font-family:Inter,sans-serif}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  overflow:hidden;
}
body:before{
  content:"";
  position:fixed;
  width:620px;height:620px;
  top:-290px;left:50%;
  transform:translateX(-50%);
  background:radial-gradient(circle,rgba(184,255,59,.18),transparent 68%);
  pointer-events:none;
}
body:after{
  content:"";
  position:fixed;
  width:420px;height:420px;
  bottom:-260px;right:-180px;
  background:radial-gradient(circle,rgba(184,255,59,.08),transparent 70%);
  pointer-events:none;
}
.shell{width:100%;max-width:470px;position:relative;z-index:2}
.brand{text-align:center;margin-bottom:20px}
.logo-orbit{
  width:116px;height:116px;margin:0 auto 14px;
  border-radius:50%;
  display:grid;place-items:center;
  position:relative;
  background:radial-gradient(circle at 35% 30%,#253a16,#10170c 42%,#050705 75%);
  border:1px solid rgba(184,255,59,.65);
  box-shadow:
    0 0 0 5px rgba(184,255,59,.035),
    0 0 28px rgba(184,255,59,.28),
    0 0 70px rgba(184,255,59,.14),
    inset 0 0 28px rgba(184,255,59,.12);
  animation:pulse 2.8s ease-in-out infinite;
}
.logo-orbit:before,.logo-orbit:after{
  content:"";position:absolute;border-radius:50%;
  border:1px solid rgba(184,255,59,.2);
  animation:ring 3s ease-out infinite;
}
.logo-orbit:before{inset:-9px}
.logo-orbit:after{inset:-19px;animation-delay:1.45s}
.logo-orbit img{
  width:76px;height:76px;object-fit:contain;border-radius:50%;
  filter:drop-shadow(0 0 10px rgba(184,255,59,.55));
}
@keyframes pulse{
  50%{
    transform:scale(1.035);
    box-shadow:
      0 0 0 8px rgba(184,255,59,.045),
      0 0 45px rgba(184,255,59,.42),
      0 0 95px rgba(184,255,59,.18),
      inset 0 0 35px rgba(184,255,59,.18);
  }
}
@keyframes ring{
  0%{transform:scale(.88);opacity:.8}
  100%{transform:scale(1.18);opacity:0}
}
.wordmark{font-size:29px;font-weight:900;letter-spacing:-1.6px}
.wordmark span{color:var(--accent)}
.tagline{
  margin-top:5px;color:#687064;font-size:9px;
  letter-spacing:2.6px;text-transform:uppercase
}
.panel{
  background:linear-gradient(145deg,rgba(18,22,17,.97),rgba(7,9,7,.98));
  border:1px solid var(--line);
  border-radius:28px;
  padding:25px;
  box-shadow:0 30px 100px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.035);
  backdrop-filter:blur(20px);
  text-align:center;
}
.check{
  width:74px;height:74px;margin:0 auto 18px;
  border-radius:50%;
  display:grid;place-items:center;
  background:rgba(184,255,59,.09);
  border:1px solid rgba(184,255,59,.55);
  color:var(--accent);
  font-size:35px;font-weight:900;
  box-shadow:0 0 30px rgba(184,255,59,.18),inset 0 0 20px rgba(184,255,59,.08);
}
h1{font-size:28px;letter-spacing:-1.5px;margin:0 0 8px}
p{color:var(--muted);font-size:11px;line-height:1.6;margin:0 auto;max-width:350px}
.status{
  display:inline-flex;align-items:center;gap:7px;
  margin:18px 0 4px;padding:9px 12px;
  border-radius:12px;
  border:1px solid rgba(184,255,59,.14);
  background:rgba(184,255,59,.045);
  color:#b9c4b1;font-size:9px;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 12px var(--accent);
}
button{
  width:100%;padding:14px;margin-top:20px;
  border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--accent2),var(--accent) 55%,#8dff27);
  color:#050505;font-weight:900;cursor:pointer;
  box-shadow:0 10px 30px rgba(184,255,59,.14);
}
button:hover{box-shadow:0 15px 40px rgba(184,255,59,.25);transform:translateY(-1px)}
.note{margin-top:14px;color:#626960;font-size:9px;line-height:1.5}
.error{color:#ff7777!important}
@media(max-width:420px){
  body{padding:13px}
  .panel{padding:20px;border-radius:24px}
  .logo-orbit{width:96px;height:96px}
  .logo-orbit img{width:65px;height:65px}
  h1{font-size:25px}
  .wordmark{font-size:26px}
}
</style>
</head>

<body>
<div class="shell">

  <div class="brand">
    <div class="logo-orbit">
      <img src="https://payhip.com/cdn-cgi/image/format=auto,width=1500/https://pe56d.s3.amazonaws.com/o_1jrl9bj473pej4dqgtbqh12315.png" alt="Zep Swipe logo">
    </div>
    <div class="wordmark">ZEP <span>SWIPE</span></div>
    <div class="tagline">The Student Economy</div>
  </div>

  <div class="panel">
    <div class="check">✓</div>

    <h1>Email Verified!</h1>

    <p>
      Your Zep Swipe email has been successfully verified.
      Your account is ready.
    </p>

    <div class="status">
      <span class="dot"></span>
      <span>Verification successful</span>
    </div>

    <button id="continueBtn" onclick="continueToApp()">
      CONTINUE TO ZEP SWIPE →
    </button>

    <div class="note" id="note">
      Checking your account and preparing your dashboard...
    </div>
  </div>

</div>

<script>
const SUPABASE_URL="https://tqxfkijetudtzldflrjb.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ0cXhmamlldHVkdHpsZGZscmpiIiwiaWF0IjoxNzg2MzEwODI3LCJleHAiOjIxMDE4ODY4Mjd9.FHCgU6h911ghgI3k9MSo0GKaasFcwpjN_82H-4pyfd8";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function getRole(){
  const {data:{user}}=await db.auth.getUser();

  if(!user) return "customer";

  const {data:profile}=await db
    .from("profiles")
    .select("role")
    .eq("id",user.id)
    .maybeSingle();

  return profile?.role || "customer";
}

async function continueToApp(){
  const btn=document.getElementById("continueBtn");
  const note=document.getElementById("note");

  btn.disabled=true;
  btn.textContent="OPENING ZEP SWIPE...";
  note.textContent="Preparing your dashboard...";

  try{
    const role=await getRole();

    if(role==="provider"){
      location.replace("provider.html");
    }else if(role==="business"){
      location.replace("business-deals.html");
    }else{
      location.replace("customer.html");
    }
  }catch(e){
    note.textContent="Could not load your account. Please return to sign in.";
    note.classList.add("error");
    btn.disabled=false;
    btn.textContent="BACK TO SIGN IN";
    btn.onclick=()=>location.replace("auth.html");
  }
}

async function init(){
  const {data:{session}}=await db.auth.getSession();

  if(!session){
    document.getElementById("note").textContent=
      "Please sign in to continue to your Zep Swipe account.";
    return;
  }

  document.getElementById("note").textContent=
    "Your account is verified. You can continue to your dashboard.";
}

init();
</script>

</body>
</html>
