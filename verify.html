<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030403">
<title>Zep Swipe | Verify Your Email</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#030403;--panel:#0d100c;--line:#252a23;--accent:#b8ff3b;--accent2:#d9ff79;--muted:#8e9588}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
body:before{content:"";position:fixed;width:620px;height:620px;top:-290px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(184,255,59,.18),transparent 68%);pointer-events:none}
body:after{content:"";position:fixed;width:420px;height:420px;bottom:-260px;right:-180px;background:radial-gradient(circle,rgba(184,255,59,.08),transparent 70%);pointer-events:none}
.shell{width:100%;max-width:470px;position:relative;z-index:2}
.brand{text-align:center;margin-bottom:27px}
.logo-orbit{width:108px;height:108px;margin:0 auto 15px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#253a16,#10170c 42%,#050705 75%);border:1px solid rgba(184,255,59,.65);box-shadow:0 0 0 5px rgba(184,255,59,.035),0 0 28px rgba(184,255,59,.28),0 0 70px rgba(184,255,59,.14),inset 0 0 28px rgba(184,255,59,.12)}
.logo-orbit img{width:76px;height:76px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 10px rgba(184,255,59,.4))}
.wordmark{font-size:29px;font-weight:900;letter-spacing:-1.6px}.wordmark span{color:var(--accent)}
.tagline{margin-top:6px;color:#687064;font-size:9px;letter-spacing:2.6px;text-transform:uppercase}
.panel{background:linear-gradient(145deg,rgba(18,22,17,.97),rgba(7,9,7,.98));border:1px solid var(--line);border-radius:27px;padding:27px 25px;box-shadow:0 30px 100px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(20px);text-align:center}
.check{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:rgba(184,255,59,.09);border:1px solid rgba(184,255,59,.55);color:var(--accent);font-size:34px;font-weight:900;box-shadow:0 0 30px rgba(184,255,59,.18),inset 0 0 20px rgba(184,255,59,.08)}
h1{font-size:27px;letter-spacing:-1.2px;margin:0 0 10px}
p{color:var(--muted);font-size:12px;line-height:1.7;margin:0 auto;max-width:355px}
.status{display:inline-flex;align-items:center;gap:8px;margin:18px 0 4px;padding:10px 12px;border-radius:12px;border:1px solid rgba(184,255,59,.14);background:rgba(184,255,59,.045);color:#b9c4b1;font-size:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--accent) 55%,#8dff27);color:#050505;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(184,255,59,.14)}
button:hover{box-shadow:0 15px 40px rgba(184,255,59,.25);transform:translateY(-1px)}
button:disabled{opacity:.6;cursor:wait;transform:none}
.secondary{background:transparent;color:#fff;border:1px solid var(--line);box-shadow:none;margin-top:10px}
.note{margin-top:15px;color:#747c70;font-size:10px;line-height:1.6;overflow-wrap:anywhere}
.error{color:#ff7777!important}
[hidden]{display:none!important}
@media(max-width:420px){body{padding:13px}.panel{padding:22px 18px;border-radius:23px}.logo-orbit{width:94px;height:94px}.logo-orbit img{width:65px;height:65px}h1{font-size:24px}.wordmark{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="brand">
    <div class="logo-orbit">
      <img src="https://payhip.com/cdn-cgi/image/format=auto,width=1500/https://pe56d.s3.amazonaws.com/o_1jrl9bj473pej4dqgtbqh12315.png" alt="Zep Swipe logo">
    </div>
    <div class="wordmark">ZEP <span>SWIPE</span></div>
    <div class="tagline">The Student Economy</div>
  </header>

  <main class="panel">
    <div class="check" aria-hidden="true">✓</div>
    <h1 id="heading">Confirming your email...</h1>
    <p id="description">Please wait while Zep Swipe confirms your sign-in and prepares your account.</p>
    <div class="status"><span class="dot"></span><span id="statusText">Checking verification link</span></div>
    <button id="continueBtn" type="button" hidden>CONTINUE TO ZEP SWIPE →</button>
    <button id="loginBtn" class="secondary" type="button" hidden>GO TO SIGN IN</button>
    <div class="note" id="note" aria-live="polite">Keep this page open for a moment.</div>
  </main>
</div>

<script>
// Use the SAME Supabase project URL and PUBLIC anon/publishable key as auth.html.
// Never put a service-role key in browser code.
const SUPABASE_URL = "https://tieekcelcathtuluwcfc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFod2p0ZHNia2pmZGd3ZXZlbWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTM2ODQsImV4cCI6MjEwNDA4OTY4NH0.BauF1Ef7dDUu3JRFSwl4WX3-8AYnIAcEC0nk58ryJTo";
const configured =
  SUPABASE_ANON_KEY !== "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFod2p0ZHNia2pmZGd3ZXZlbWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTM2ODQsImV4cCI6MjEwNDA4OTY4NH0.BauF1Ef7dDUu3JRFSwl4WX3-8AYnIAcEC0nk58ryJTo" &&
  SUPABASE_ANON_KEY.trim().length > 20;

const $ = id => document.getElementById(id);
let db = null;
let redirectStarted = false;
let redirectTimer = null;

function showState({title, description, status, note, error=false}) {
  $("heading").textContent = title;
  $("description").textContent = description;
  $("statusText").textContent = status;
  $("note").textContent = note;
  $("note").classList.toggle("error", error);
}

function displayRole(role) {
  const value = String(role || "customer").toLowerCase();
  if (value === "provider" || value === "student_provider") return "Student Provider";
  if (["business", "merchant", "business_owner"].includes(value)) return "Business";
  return "Customer";
}

async function getAccountRole(user) {
  // Read the saved profile first, then use the role saved during signup.
  try {
    const {data, error} = await db
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .maybeSingle();

    if (error) console.warn("Profile role lookup:", error.message);

    const saved = String(data?.role || "").toLowerCase();
    if (["customer", "provider", "business"].includes(saved)) return saved;
  } catch (err) {
    console.warn("Could not read profile role:", err);
  }

  const metadataRole = String(user?.user_metadata?.role || "").toLowerCase();
  return ["customer", "provider", "business"].includes(metadataRole)
    ? metadataRole
    : "customer";
}

function goToSignIn(message) {
  clearTimeout(redirectTimer);
  $("continueBtn").hidden = true;
  $("loginBtn").hidden = false;
  $("loginBtn").onclick = () => location.replace("auth.html");

  showState({
    title: "One more step",
    description: message || "Your email link opened, but this browser has no active session. Sign in to continue.",
    status: "Sign-in required",
    note: "After signing in, Zep Swipe will open your account page."
  });
}

async function routeToAccount(user) {
  if (redirectStarted) return;
  redirectStarted = true;

  $("continueBtn").hidden = false;
  $("continueBtn").disabled = true;
  $("loginBtn").hidden = true;

  try {
    const role = await getAccountRole(user);

    showState({
      title: "Email verified!",
      description: "Your email is confirmed. We are opening your Zep Swipe account.",
      status: "Verified · " + displayRole(role),
      note: "Redirecting to account.html..."
    });

    $("continueBtn").disabled = false;
    $("continueBtn").textContent = "CONTINUE TO MY ACCOUNT →";
    $("continueBtn").onclick = () => location.replace("account.html");

    // All account types use account.html as the shared account/dashboard page.
    // That page should read the user's actual role from the profiles table.
    redirectTimer = setTimeout(() => location.replace("account.html"), 900);
  } catch (err) {
    console.error("Could not prepare account redirect:", err);
    redirectStarted = false;
    $("continueBtn").hidden = true;
    $("loginBtn").hidden = false;
    $("loginBtn").onclick = () => location.replace("auth.html");

    showState({
      title: "Email verified",
      description: "Your verification appears complete, but we could not load your account details automatically.",
      status: "Account needs attention",
      note: "Select GO TO SIGN IN to continue. If this keeps happening, check profile table permissions.",
      error: true
    });
  }
}

async function init() {
  if (!configured) {
    showState({
      title: "Setup required",
      description: "Add the public Supabase anon/publishable key used by auth.html to connect this page.",
      status: "Supabase not configured",
      note: "Welcome to Zep Swipe- The student economy.",
      error: true
    });
    $("loginBtn").hidden = false;
    $("loginBtn").onclick = () => location.replace("auth.html");
    return;
  }

  // The Supabase client handles supported verification callback URLs,
  // including callback tokens in the URL hash and PKCE code callbacks.
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });

  const search = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  const callbackError =
    search.get("error_description") ||
    search.get("error") ||
    hash.get("error_description") ||
    hash.get("error");

  if (callbackError) {
    goToSignIn("The verification link reported an error: " + callbackError.replace(/\+/g, " "));
    $("note").classList.add("error");
    return;
  }

  // The Supabase client processes the callback URL during initialization.
  const {data, error} = await db.auth.getSession();
  if (error) throw error;

  if (data?.session?.user) {
    // Remove callback tokens and query parameters from the visible URL.
    try {
      history.replaceState({}, document.title, location.pathname);
    } catch (_e) {}

    await routeToAccount(data.session.user);
    return;
  }

  // Some project configurations confirm email without creating a browser
  // session. In that case, the user must sign in before entering account.html.
  goToSignIn(
    "Your verification link opened, but no active session was returned. Your email may already be verified; sign in to continue."
  );
}

$("continueBtn").onclick = () => location.replace("account.html");
$("loginBtn").onclick = () => location.replace("auth.html");

init().catch(err => {
  console.error("Verification callback failed:", err);

  showState({
    title: "Could not finish verification",
    description: "The link may have expired or Supabase could not establish a session.",
    status: "Please sign in",
    note: err?.message || "Return to sign in and request a new verification email if needed.",
    error: true
  });

  $("continueBtn").hidden = true;
  $("loginBtn").hidden = false;
  $("loginBtn").onclick = () => location.replace("auth.html");
});
</script>
</body>
</html>
