<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
  background:var(--bg);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:90%;
  max-width:380px;
  background:rgba(255,255,255,.08);
  padding:24px;
  border-radius:18px;
  backdrop-filter:blur(12px);
  box-shadow:0 0 30px rgba(0,240,255,.2);
}

h2{
  text-align:center;
  font-family:Orbitron;
  margin-bottom:20px;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:10px;
  background:#020617;
  color:#fff;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#050015;
  font-family:Orbitron;
  cursor:pointer;
  margin-top:8px;
}

.switch{
  text-align:center;
  margin-top:14px;
  font-size:14px;
  cursor:pointer;
  color:#ccc;
}

.message{
  margin-top:10px;
  font-size:13px;
  text-align:center;
}

.success{color:#00ff94;}
.error{color:#ff4d4d;}
</style>
</head>

<body>

<div class="container">

  <h2 id="formTitle">Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="handleAuth()" id="actionBtn">Login</button>

  <div class="switch" onclick="toggleMode()">
    Don't have an account? Sign Up
  </div>

  <div class="message" id="message"></div>

</div>

<script>

/* =========================
   🔐 REPLACE THESE (IMPORTANT)
========================= */
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   STATE
========================= */
let isLogin = true;

/* =========================
   TOGGLE LOGIN / SIGNUP
========================= */
function toggleMode(){
  isLogin = !isLogin;

  document.getElementById("formTitle").innerText = isLogin ? "Login" : "Sign Up";
  document.getElementById("actionBtn").innerText = isLogin ? "Login" : "Create Account";

  document.querySelector(".switch").innerText =
    isLogin ? "Don't have an account? Sign Up"
            : "Already have an account? Login";

  clearMessage();
}

/* =========================
   AUTH FUNCTION
========================= */
async function handleAuth(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(!email || !password){
    showMessage("Please fill all fields", "error");
    return;
  }

  try{

    if(isLogin){
      /* LOGIN */
      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      showMessage("Login successful 🚀", "success");

      setTimeout(()=>{
        window.location.href = "student-dashboard.html";
      },1000);

    } else {
      /* SIGNUP */
      const { data, error } = await supabase.auth.signUp({
        email,
        password
      });

      if(error) throw error;

      showMessage("Account created! Check your email 📩", "success");
    }

  }catch(err){
    showMessage(err.message, "error");
  }
}

/* =========================
   MESSAGE UI
========================= */
function showMessage(msg, type){
  const el = document.getElementById("message");
  el.innerText = msg;
  el.className = "message " + type;
}

function clearMessage(){
  document.getElementById("message").innerText="";
}

/* =========================
   AUTO LOGIN CHECK
========================= */
async function checkSession(){
  const { data:{ session } } = await supabase.auth.getSession();

  if(session){
    window.location.href = "student-dashboard.html";
  }
}

checkSession();

</script>

</body>
</html>
