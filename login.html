<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Access OS 3.2</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg: radial-gradient(circle at 20% 10%, #1a0025, #000);
  --glass: rgba(255,255,255,0.06);
  --stroke: rgba(255,255,255,0.12);

  /* 💗 FULL LOVE GRADIENT */
  --pink:#ff4fd8;
  --purple:#9c4dff;
  --blue:#00f0ff;

  --text: rgba(255,255,255,0.85);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:var(--bg);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* 💡 GLOW SYSTEM (PINK + BLUE) */
.glow-pink{
  position:absolute;
  width:500px;
  height:500px;
  background:var(--pink);
  filter:blur(140px);
  opacity:.15;
  top:-120px;
  left:-120px;
}

.glow-blue{
  position:absolute;
  width:500px;
  height:500px;
  background:var(--blue);
  filter:blur(140px);
  opacity:.12;
  bottom:-120px;
  right:-120px;
}

/* CONTAINER */
.container{
  max-width:440px;
  margin:auto;
  padding:26px;
}

/* LOGO */
.logo{
  text-align:center;
  margin-top:30px;
}

.logo img{
  width:90px;
  animation:pulse 2.4s infinite;
  filter:drop-shadow(0 0 18px var(--pink));
}

@keyframes pulse{
  0%{transform:scale(1);opacity:.7}
  50%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1);opacity:.7}
}

/* TITLE */
.title{
  text-align:center;
  font-size:24px;
  font-family:Orbitron;
  margin-top:10px;

  /* 🌈 FULL GRADIENT */
  background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  font-size:13px;
  opacity:.7;
}

/* CARD */
.card{
  margin-top:22px;
  background:var(--glass);
  border:1px solid rgba(255,79,216,0.25); /* 💗 pink border */
  border-radius:18px;
  padding:18px;
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* INPUTS */
input,select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(0,0,0,0.35);
  color:white;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 2px rgba(255,79,216,0.2);
}

/* BUTTONS */
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:800;
  cursor:pointer;
  font-family:Orbitron;
}

/* 🌈 PRIMARY BUTTON */
.btn-primary{
  background:linear-gradient(90deg,var(--pink),var(--purple));
  color:black;
}

/* TOGGLE */
.btn-toggle{
  background:transparent;
  color:var(--pink);
  font-size:12px;
  border:1px solid rgba(255,79,216,0.3);
}

/* BADGE */
.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,79,216,0.08);
  border:1px solid rgba(255,79,216,0.25);
  text-align:center;
}

/* FOOT */
.foot{
  text-align:center;
  font-size:11px;
  opacity:.6;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- 💡 GLOWS -->
<div class="glow-pink"></div>
<div class="glow-blue"></div>

<div class="container">

  <div class="logo">
    <img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
  </div>

  <div class="title">Zep Swipe Access</div>
  <div class="subtitle">Login or create your student OS account</div>

  <div class="card">

    <div id="detected" class="badge">Detecting region...</div>

    <select id="country">
      <option>South Africa 🇿🇦</option>
      <option>Ghana 🇬🇭</option>
      <option>Zambia 🇿🇲</option>
      <option>Rwanda 🇷🇼</option>
      <option>Namibia 🇳🇦</option>
      <option>Botswana 🇧🇼</option>
      <option>Malawi 🇲🇼</option>
      <option>Kenya 🇰🇪</option>
      <option>Nigeria 🇳🇬</option>
      <option>Uganda 🇺🇬</option>
      <option>Tanzania 🇹🇿</option>
    </select>

    <div id="nameField" style="display:none;">
      <input type="text" id="name" placeholder="Full Name">
    </div>

    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">

    <button class="btn-primary" onclick="handleAuth()" id="actionBtn">
      Login
    </button>

    <button class="btn-toggle" onclick="toggleMode()">
      Switch to Signup
    </button>

    <div class="foot">
      Zep OS 3.2 — Neon Love Gradient Layer 💖
    </div>

  </div>

</div>

</body>
</html>
