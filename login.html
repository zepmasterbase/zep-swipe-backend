<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Access OS 3.2</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg: radial-gradient(circle at 20% 10%, #0b0030, #000);
  --glass: rgba(255,255,255,0.06);
  --stroke: rgba(255,255,255,0.12);

  /* NEON LOVE GRADIENT */
  --pink:#ff4fd8;
  --purple:#9c4dff;
  --blue:#00f0ff;

  --green:#00ff94;
  --text: rgba(255,255,255,0.85);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:var(--bg);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* BACK GLOW */
.glow{
  position:absolute;
  width:500px;
  height:500px;
  background:var(--pink);
  filter:blur(160px);
  opacity:.15;
  top:-120px;
  left:-120px;
}

/* CENTER WRAPPER */
.container{
  max-width:440px;
  margin:auto;
  padding:26px;
}

/* =========================
   🔥 NEW CIRCLE LOGO
========================= */
.logo{
  display:flex;
  justify-content:center;
  margin-top:40px;
}

.logo-circle{
  width:95px;
  height:95px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--purple),var(--blue));
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Orbitron;
  font-size:20px;
  font-weight:700;
  color:black;
  letter-spacing:1px;

  /* glow */
  box-shadow:
    0 0 25px rgba(255,79,216,0.5),
    0 0 45px rgba(156,77,255,0.35),
    0 0 65px rgba(0,240,255,0.25);

  animation:floatGlow 3s ease-in-out infinite;
}

@keyframes floatGlow{
  0%{transform:scale(1);opacity:.85}
  50%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1);opacity:.85}
}

/* TITLE */
.title{
  text-align:center;
  font-size:24px;
  font-family:Orbitron;
  margin-top:14px;
  background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  font-size:13px;
  opacity:.7;
}

/* CARD */
.card{
  margin-top:22px;
  background:var(--glass);
  border:1px solid rgba(255,79,216,0.25);
  border-radius:18px;
  padding:18px;
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* INPUTS */
input,select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(0,0,0,0.35);
  color:white;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 2px rgba(255,79,216,0.15);
}

/* BUTTONS */
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:800;
  cursor:pointer;
  font-family:Orbitron;
}

.btn-primary{
  background:linear-gradient(90deg,var(--pink),var(--purple));
  color:black;
}

.btn-toggle{
  background:transparent;
  color:var(--pink);
  font-size:12px;
  border:1px solid rgba(255,79,216,0.25);
}

/* BADGE */
.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,79,216,0.08);
  border:1px solid rgba(255,79,216,0.25);
  text-align:center;
}

/* SMALL FOOTNOTE */
.foot{
  text-align:center;
  font-size:11px;
  opacity:.6;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

  <!-- 🔥 NEW LOGO -->
  <div class="logo">
    <div class="logo-circle">ZEP</div>
  </div>

  <div class="title">Zep Swipe Access</div>
  <div class="subtitle">Login or create your student OS account</div>

  <div class="card">

    <div id="detected" class="badge">Detecting region...</div>

    <select id="country">
      <option>South Africa 🇿🇦</option>
      <option>Ghana 🇬🇭</option>
      <option>Zambia 🇿🇲</option>
      <option>Rwanda 🇷🇼</option>
      <option>Namibia 🇳🇦</option>
      <option>Botswana 🇧🇼</option>
      <option>Malawi 🇲🇼</option>
      <option>Kenya 🇰🇪</option>
      <option>Nigeria 🇳🇬</option>
      <option>Uganda 🇺🇬</option>
      <option>Tanzania 🇹🇿</option>
    </select>

    <div id="nameField" style="display:none;">
      <input type="text" id="name" placeholder="Full Name">
    </div>

    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">

    <button class="btn-primary" onclick="handleAuth()" id="actionBtn">
      Login
    </button>

    <button class="btn-toggle" onclick="toggleMode()">
      Switch to Signup
    </button>

    <div class="foot">
      Zep OS 3.2 Secure Access Layer
    </div>

  </div>

</div>

<!-- ⚡ SCRIPT (UNCHANGED) -->
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isLogin = true;

const urlParams = new URLSearchParams(window.location.search);
const referrer = urlParams.get("ref");

const PILOT_COUNTRIES = ["South Africa 🇿🇦","Ghana 🇬🇭","Zambia 🇿🇲"];

function detectCountry(){
  let locale = navigator.language || "en-ZA";
  let code = locale.split("-")[1] || "ZA";

  const map = {
    ZA:"South Africa 🇿🇦", GH:"Ghana 🇬🇭", ZM:"Zambia 🇿🇲",
    RW:"Rwanda 🇷🇼", NA:"Namibia 🇳🇦", BW:"Botswana 🇧🇼",
    KE:"Kenya 🇰🇪", NG:"Nigeria 🇳🇬", UG:"Uganda 🇺🇬", TZ:"Tanzania 🇹🇿"
  };

  const country = map[code] || "South Africa 🇿🇦";

  document.getElementById("detected").innerText =
    `Zep OS detected: ${country}`;

  document.getElementById("country").value = country;

  return country;
}

const detectedCountry = detectCountry();

function routeUser(country){
  return PILOT_COUNTRIES.includes(country)
    ? "student-dashboard.html"
    : "waitlist.html";
}

window.toggleMode = function(){
  isLogin = !isLogin;

  document.getElementById("actionBtn").innerText =
    isLogin ? "Login" : "Create Account";

  document.getElementById("nameField").style.display =
    isLogin ? "none" : "block";
};

window.handleAuth = async function(){

  const name = document.getElementById("name").value?.trim();
  const email = document.getElementById("email").value?.trim();
  const password = document.getElementById("password").value?.trim();
  const country = document.getElementById("country").value || detectedCountry;

  if(!email || !password){
    alert("Fill required fields");
    return;
  }

  try{

    let user;

    if(isLogin){
      const { data, error } = await supabase.auth.signInWithPassword({
        email, password
      });
      if(error) throw error;
      user = data.user;
    } else {

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options:{ data:{ name, country, role:"student" } }
      });
      if(error) throw error;
      user = data.user;

      await supabase.from("users").upsert({
        id:user.id,
        full_name:name,
        email,
        country,
        role:"student",
        xp:0,
        wallet_balance:0,
        referrals:0,
        referrer:referrer || null,
        created_at:new Date()
      });

      await supabase.from("wallets").upsert({
        user_id:user.id,
        balance:0
      });
    }

    localStorage.setItem("currentUserId", user.id);
    localStorage.setItem("currentCountry", country);

    window.location.href = routeUser(country);

  } catch(err){
    alert(err.message);
  }
};

async function checkSession(){
  const { data } = await supabase.auth.getSession();

  if(data.session){
    const user = data.session.user;

    const country =
      user.user_metadata?.country ||
      localStorage.getItem("currentCountry") ||
      detectedCountry;

    window.location.href = routeUser(country);
  }
}

checkSession();
</script>

</body>
</html>
