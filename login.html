<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Access</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #0b0f1a, #05070d);
  color: white;
}

.glow {
  position: absolute;
  width: 420px;
  height: 420px;
  background: #00f0ff;
  filter: blur(120px);
  opacity: 0.12;
  top: -120px;
  left: -120px;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 24px;
}

.logo {
  text-align: center;
  margin-top: 30px;
}

.logo img {
  width: 88px;
  animation: pulse 2s infinite;
  filter: drop-shadow(0 0 15px #00f0ff);
}

@keyframes pulse {
  0% {transform: scale(1); opacity: 0.7;}
  50% {transform: scale(1.06); opacity: 1;}
  100% {transform: scale(1); opacity: 0.7;}
}

.title {
  text-align: center;
  font-size: 24px;
  font-weight: 800;
  margin-top: 10px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  opacity: 0.7;
}

.card {
  margin-top: 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 18px;
  padding: 18px;
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

input, select {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(0,0,0,0.35);
  color: white;
  outline: none;
}

input:focus, select:focus {
  border-color: #00f0ff;
  box-shadow: 0 0 0 2px rgba(0,240,255,0.2);
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-weight: 800;
  cursor: pointer;
}

.btn-primary {
  background: linear-gradient(90deg, #00f0ff, #6a5cff);
  color: black;
}

.btn-toggle {
  background: transparent;
  color: #00f0ff;
  font-size: 12px;
  border: 1px solid rgba(0,255,255,0.3);
}

.badge {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(0,255,255,0.1);
  border: 1px solid rgba(0,255,255,0.25);
  text-align: center;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

  <div class="logo">
    <img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
  </div>

  <div class="title">Zep Swipe Access</div>
  <div class="subtitle">Login or create your student account</div>

  <div class="card">

    <div id="detected" class="badge">Detecting location...</div>

    <select id="country">
      <option>South Africa 🇿🇦</option>
      <option>Ghana 🇬🇭</option>
      <option>Zambia 🇿🇲</option>
      <option>Rwanda 🇷🇼</option>
      <option>Namibia 🇳🇦</option>
      <option>Botswana 🇧🇼</option>
      <option>Malawi 🇲🇼</option>
      <option>Kenya 🇰🇪</option>
      <option>Nigeria 🇳🇬</option>
      <option>Uganda 🇺🇬</option>
      <option>Tanzania 🇹🇿</option>
    </select>

    <div id="nameField" style="display:none;">
      <input type="text" id="name" placeholder="Full Name">
    </div>

    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">

    <button class="btn-primary" onclick="handleAuth()" id="actionBtn">
      Login
    </button>

    <button class="btn-toggle" onclick="toggleMode()">
      Switch to Signup
    </button>

  </div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================
   🔑 SUPABASE
========================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isLogin = true;

/* =========================
   REFERRAL SYSTEM
========================= */
const urlParams = new URLSearchParams(window.location.search);
const referrer = urlParams.get("ref"); // 👈 NEW

/* =========================
   PILOT COUNTRIES
========================= */
const PILOT_COUNTRIES = ["South Africa 🇿🇦","Ghana 🇬🇭","Zambia 🇿🇲"];

/* =========================
   DETECT COUNTRY
========================= */
function detectCountry() {
  let locale = navigator.language || "en-ZA";
  let code = locale.split("-")[1] || "ZA";

  const map = {
    ZA:"South Africa 🇿🇦", GH:"Ghana 🇬🇭", ZM:"Zambia 🇿🇲",
    RW:"Rwanda 🇷🇼", NA:"Namibia 🇳🇦", BW:"Botswana 🇧🇼",
    KE:"Kenya 🇰🇪", NG:"Nigeria 🇳🇬", UG:"Uganda 🇺🇬", TZ:"Tanzania 🇹🇿"
  };

  const country = map[code] || "South Africa 🇿🇦";

  document.getElementById("detected").innerText =
    `We think you're in ${country}`;

  document.getElementById("country").value = country;

  return country;
}

const detectedCountry = detectCountry();

/* =========================
   ROUTING
========================= */
function routeUser(country) {
  return PILOT_COUNTRIES.includes(country)
    ? "student-dashboard.html"
    : "waitlist.html";
}

/* =========================
   TOGGLE
========================= */
window.toggleMode = function () {
  isLogin = !isLogin;

  document.getElementById("actionBtn").innerText =
    isLogin ? "Login" : "Create Account";

  document.getElementById("nameField").style.display =
    isLogin ? "none" : "block";
};

/* =========================
   AUTH
========================= */
window.handleAuth = async function () {

  const name = document.getElementById("name").value?.trim();
  const email = document.getElementById("email").value?.trim();
  const password = document.getElementById("password").value?.trim();
  const country = document.getElementById("country").value || detectedCountry;

  if (!email || !password) {
    alert("Fill all required fields");
    return;
  }

  try {

    let user;

    /* LOGIN */
    if (isLogin) {
      const { data, error } = await supabase.auth.signInWithPassword({
        email, password
      });
      if (error) throw error;
      user = data.user;
    }

    /* SIGNUP */
    else {

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { name, country, role: "student" }
        }
      });

      if (error) throw error;
      user = data.user;

      const { data: exists } = await supabase
        .from("users")
        .select("id")
        .eq("id", user.id)
        .maybeSingle();

      if (!exists) {

        await supabase.from("users").insert({
          id: user.id,
          full_name: name,
          email,
          country,
          role: "student",
          xp: 0,
          wallet_balance: 0,
          referrals: 0,
          referrer: referrer || null,
          created_at: new Date()
        });

        await supabase.from("wallets").insert({
          user_id: user.id,
          balance: 0
        });
      }
    }

    /* SESSION */
    localStorage.setItem("currentUserId", user.id);
    localStorage.setItem("currentCountry", country);

    window.location.href = routeUser(country);

  } catch (err) {
    alert(err.message);
  }
};

/* =========================
   SESSION CHECK
========================= */
async function checkSession() {
  const { data } = await supabase.auth.getSession();

  if (data.session) {
    const user = data.session.user;

    const country =
      user.user_metadata?.country ||
      localStorage.getItem("currentCountry") ||
      detectedCountry;

    window.location.href = routeUser(country);
  }
}

checkSession();
</script>

</body>
</html>
