<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Login / Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
  background:var(--bg);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:400px;
  background:rgba(255,255,255,0.05);
  padding:24px;
  border-radius:20px;
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);
}

.brand{
  text-align:center;
  margin-bottom:20px;
  font-family:Orbitron;
  font-size:1.6rem;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.08);
  color:#fff;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:999px;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  color:#050015;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  box-shadow:0 0 20px var(--zep-blue),0 0 40px var(--zep-violet);
}

.toggle{
  text-align:center;
  margin-top:12px;
  cursor:pointer;
  font-size:.85rem;
  color:#aaa;
}
.toggle:hover{color:#fff;}
</style>
</head>

<body>

<div class="container">

  <div class="brand">Zep Swipe</div>

  <input type="text" id="name" placeholder="Full Name (Signup only)" style="display:none;">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button id="authBtn" onclick="handleAuth()">Login</button>

  <div class="toggle" onclick="toggleMode()" id="toggleText">
    Don't have an account? Sign up
  </div>

</div>

<script>
// 🔐 SUPABASE INIT (ADD YOUR KEYS LOCALLY)
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isSignup = false;

// TOGGLE UI
function toggleMode(){
  isSignup = !isSignup;

  document.getElementById("name").style.display = isSignup ? "block" : "none";
  document.getElementById("authBtn").innerText = isSignup ? "Sign Up" : "Login";

  document.getElementById("toggleText").innerText = isSignup
    ? "Already have an account? Login"
    : "Don't have an account? Sign up";
}

// SIGNUP + LOGIN HANDLER
async function handleAuth(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    alert("Please fill required fields");
    return;
  }

  // ===================== SIGNUP =====================
  if(isSignup){

    if(!name){
      alert("Enter your full name");
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email,
      password
    });

    if(error){
      alert(error.message);
      return;
    }

    const user = data.user;

    // insert into users table
    const { error: dbError } = await supabase
      .from("users")
      .insert({
        auth_id: user.id,
        name: name,
        email: email,
        role: "student",
        zac_balance: 0,
        wallet_balance: 0
      });

    if(dbError){
      alert(dbError.message);
      return;
    }

    alert("Signup successful!");
    window.location.href = "student-dashboard.html";
  }

  // ===================== LOGIN =====================
  else{

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if(error){
      alert(error.message);
      return;
    }

    const user = data.user;

    // fetch profile from DB
    const { data: profile, error: profileError } = await supabase
      .from("users")
      .select("*")
      .eq("auth_id", user.id)
      .single();

    if(profileError){
      alert(profileError.message);
      return;
    }

    alert("Login successful!");

    // redirect based on role
    if(profile.role === "employer"){
      window.location.href = "employer-dashboard.html";
    } else {
      window.location.href = "student-dashboard.html";
    }
  }
}

// AUTO SESSION CHECK (NO LOCALSTORAGE)
async function checkSession(){
  const { data } = await supabase.auth.getUser();

  if(data?.user){
    const { data: profile } = await supabase
      .from("users")
      .select("*")
      .eq("auth_id", data.user.id)
      .single();

    if(profile){
      if(profile.role === "employer"){
        window.location.href = "employer-dashboard.html";
      } else {
        window.location.href = "student-dashboard.html";
      }
    }
  }
}

checkSession();
toggleMode();

</script>

</body>
</html>
