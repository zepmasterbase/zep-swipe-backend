<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
font-family:Inter,system-ui;
background:#070707;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:340px;
background:#141414;
border:1px solid #262626;
border-radius:16px;
padding:20px;
}

h2{color:#b8ff3b;margin-bottom:10px}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #262626;
background:#0b0b0b;
color:white;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:#b8ff3b;
color:black;
font-weight:800;
cursor:pointer;
}

.small{
font-size:12px;
opacity:0.7;
margin-top:10px;
text-align:center;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="card" id="authBox">
  <h2>⚡ Zep Swipe</h2>
  <p class="small">Login or Sign up to continue</p>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>

  <p class="small" id="msg"></p>
</div>

<script>

/* =========================
   SUPABASE
========================= */
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* =========================
   GEO CHECK
========================= */
async function checkLocation(){

try {
const res = await fetch("https://ipapi.co/json/");
const data = await res.json();

if(data.country_code !== "ZA"){
window.location.href = "waitlist.html";
return;
}

document.getElementById("msg").innerText =
"✔ South Africa verified - access granted";

} catch(e){
console.log("Geo check failed",e);
window.location.href = "waitlist.html";
}
}

checkLocation();

/* =========================
   SIGNUP
========================= */
async function signup(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const {error} = await client.auth.signUp({
email,
password
});

if(error){
document.getElementById("msg").innerText = error.message;
return;
}

document.getElementById("msg").innerText =
"Account created. Please login.";
}

/* =========================
   LOGIN
========================= */
async function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const {data,error} = await client.auth.signInWithPassword({
email,
password
});

if(error){
document.getElementById("msg").innerText = error.message;
return;
}

/* SAVE SESSION (PERSISTENT LOGIN) */
localStorage.setItem("zep_user", JSON.stringify(data.user));

window.location.href = "provider.html";
}

</script>

</body>
</html>
