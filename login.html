<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep OS 3.8 Identity Core</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:#050014;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* MAIN CARD */
.container{
  width:420px;
  background:rgba(255,255,255,0.05);
  padding:22px;
  border-radius:18px;
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.1);
  position:relative;
  overflow:hidden;
}

/* LOGO WRAPPER */
.logo-wrapper{
  display:flex;
  justify-content:center;
  margin-top:10px;
  margin-bottom:10px;
  position:relative;
}

/* GLASS GLOW RING */
.logo-wrapper::before{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:conic-gradient(#ff4fd8,#9c4dff,#00f0ff,#ff4fd8);
  animation:spin 4s linear infinite;
  filter:blur(8px);
  opacity:0.8;
}

/* INNER GLOW */
.logo-wrapper::after{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
  box-shadow:0 0 25px rgba(156,77,255,0.6);
}

/* LOGO IMAGE */
.logo{
  width:90px;
  height:90px;
  border-radius:50%;
  z-index:2;
  object-fit:cover;
  border:2px solid rgba(255,255,255,0.3);
  box-shadow:0 0 25px rgba(0,240,255,0.4);
}

/* ROTATION */
@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

h2{
  font-family:Orbitron;
  text-align:center;
  background:linear-gradient(90deg,#ff4fd8,#9c4dff,#00f0ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-top:10px;
}

input,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.4);
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:linear-gradient(90deg,#ff4fd8,#9c4dff);
}

.toggle{
  background:transparent;
  border:1px solid #ff4fd8;
  color:#ff4fd8;
}
</style>
</head>

<body>

<div class="container">

  <!-- GLOWING ZEP LOGO -->
  <div class="logo-wrapper">
    <img class="logo" src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png" />
  </div>

  <h2>Zep OS 3.8 Identity</h2>

  <select id="country">
    <option>South Africa 🇿🇦</option>
    <option>Ghana 🇬🇭</option>
    <option>Zambia 🇿🇲</option>
    <option>Kenya 🇰🇪</option>
    <option>Nigeria 🇳🇬</option>
  </select>

  <input id="name" placeholder="Full Name" style="display:none;">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="primary" onclick="auth()" id="btn">Login</button>
  <button class="toggle" onclick="toggleMode()">Switch Mode</button>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_ANON_KEY"
);

let isLogin = true;

/* PILOT ROUTE */
const PILOT = ["South Africa 🇿🇦","Ghana 🇬🇭","Zambia 🇿🇲"];

function route(country){
  return PILOT.includes(country)
    ? "student.html"
    : "waitlist.html";
}

/* SESSION RESTORE (CRITICAL FIX) */
async function restoreSession(){
  const { data } = await supabase.auth.getSession();

  if(data.session){
    redirect(data.session.user);
  }
}

supabase.auth.onAuthStateChange((event, session)=>{
  if(session){
    redirect(session.user);
  }
});

/* REDIRECT ENGINE */
async function redirect(user){

  const country =
    user.user_metadata?.country ||
    "South Africa 🇿🇦";

  await supabase.from("users").upsert({
    id:user.id,
    email:user.email,
    country
  });

  localStorage.setItem("country", country);

  window.location.href = route(country);
}

/* TOGGLE */
window.toggleMode = function(){
  isLogin = !isLogin;
  document.getElementById("btn").innerText =
    isLogin ? "Login" : "Create Account";

  document.getElementById("name").style.display =
    isLogin ? "none" : "block";
};

/* AUTH */
window.auth = async function(){

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const country = document.getElementById("country").value;

  if(!email || !password){
    alert("Missing fields");
    return;
  }

  if(isLogin){

    const { error } = await supabase.auth.signInWithPassword({
      email,password
    });

    if(error) return alert(error.message);

  } else {

    const { error } = await supabase.auth.signUp({
      email,password,
      options:{
        data:{
          name,
          country,
          role:"student"
        }
      }
    });

    if(error) return alert(error.message);
  }
};

restoreSession();
</script>

</body>
</html>
