<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Student Login</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:radial-gradient(circle at 30% 10%, #050018, #000);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:360px;
  padding:24px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 0 25px rgba(0,240,255,0.15);
}

h1{
  font-family:Orbitron;
  text-align:center;
  margin-bottom:20px;
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.1);
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-family:Orbitron;
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  color:#000;
}

button:hover{
  opacity:0.9;
}

.toggle{
  text-align:center;
  margin-top:12px;
  cursor:pointer;
  font-size:0.9rem;
  color:#aaa;
}

.error{
  color:#ff4d4d;
  font-size:0.85rem;
  text-align:center;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Student Access</h1>

  <input type="email" id="email" placeholder="Student Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="handleAuth()">Login / Signup</button>

  <div class="error" id="error"></div>

  <div class="toggle" onclick="toggleMode()">
    Don't have an account? Sign up
  </div>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isLogin = true;

function toggleMode(){
  isLogin = !isLogin;
  document.querySelector("h1").innerText = isLogin
    ? "Student Access"
    : "Student Sign Up";
}

async function handleAuth(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("error");

  errorBox.innerText = "";

  if(!email || !password){
    errorBox.innerText = "Please fill all fields";
    return;
  }

  try {

    if(isLogin){

      // LOGIN
      const { data, error } = await sb.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      await checkStudentRole(data.user.id);

    } else {

      // SIGNUP
      const { data, error } = await sb.auth.signUp({
        email,
        password
      });

      if(error) throw error;

      // create student profile
      await sb.from("profiles").insert({
        id: data.user.id,
        name: email.split("@")[0],
        role: "student",
        profile_image: "",
        level: "Beginner Freelancer",
        profile_completion: 0,
        freelancer_readiness: 0,
        verified: false,
        zac_balance: 0,
        wallet_balance: 0,
        learn_earn_progress: {},
        earnings_history: [0,0,0,0,0,0,0]
      });

      alert("Account created! Please login.");
      isLogin = true;
      toggleMode();
    }

  } catch(err){
    errorBox.innerText = err.message;
  }
}

async function checkStudentRole(userId){
  const { data, error } = await sb
    .from("profiles")
    .select("role")
    .eq("id", userId)
    .single();

  if(error){
    document.getElementById("error").innerText = "Profile not found";
    return;
  }

  if(data.role !== "student"){
    document.getElementById("error").innerText =
      "Access denied: Not a student account";
    await sb.auth.signOut();
    return;
  }

  location.href = "student-dashboard.html";
}

// auto redirect if already logged in
(async () => {
  const { data: { user } } = await sb.auth.getUser();
  if(user){
    checkStudentRole(user.id);
  }
})();
</script>

</body>
</html>
