<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#070707;
  --card:#141414;
  --accent:#b8ff3b;
  --text:#ffffff;
  --muted:#aaaaaa;
  --border:#262626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui;
}

body{
  background:radial-gradient(circle at top,#0f0f0f,#070707);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  padding:20px;
}

/* CARD */
.card{
  width:360px;
  background:rgba(20,20,20,0.85);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  text-align:center;
}

/* LOGO */
.logo{
  font-size:20px;
  font-weight:800;
  color:var(--accent);
  margin-bottom:6px;
}

/* TEXT */
h2{
  margin-top:10px;
  font-size:18px;
}

.small{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0b0b;
  color:white;
  outline:none;
}

/* BUTTONS */
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.primary{
  background:var(--accent);
  color:black;
}

.secondary{
  background:transparent;
  border:1px solid var(--accent);
  color:var(--accent);
}

button:hover{
  transform:translateY(-2px);
}

/* MESSAGE */
#msg{
  font-size:12px;
  margin-top:10px;
  color:var(--muted);
  min-height:16px;
}

/* LOADING DOT */
.dot{
  display:inline-block;
  width:6px;
  height:6px;
  background:var(--accent);
  border-radius:50%;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,100%{opacity:0.3}
  50%{opacity:1}
}

</style>
</head>

<body>

<div class="card">

  <div class="logo">⚡ Zep Swipe</div>
  <div class="small">Earn • Learn • Get Hired</div>

  <h2>Welcome Back</h2>
  <div class="small">Login or create your account</div>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="primary" onclick="signup()">Create Account</button>
  <button class="secondary" onclick="login()">Login</button>

  <div id="msg"></div>

</div>

<script>

/* =========================
   SUPABASE
========================= */
const SUPABASE_URL = "https://lysepsmhaepxecngoybt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5c2Vwc21oYWVweGVjbmdveWJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTk5NjEsImV4cCI6MjA5ODAzNTk2MX0.uxyZBeF6KH8x6Z1YzpiDGYXcwtGt1pqw4g7oKoVkQfU";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   GEO RESTRICTION (South Africa only)
========================= */
async function checkLocation(){

  try{

    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();

    if(data.country_code !== "ZA"){
      window.location.href = "waitlist.html";
      return;
    }

    showMsg("Access verified for South Africa ✔");

  }catch(err){
    console.log(err);
    window.location.href = "waitlist.html";
  }
}

/* =========================
   SIGNUP
========================= */
async function signup(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  showMsg("Creating account <span class='dot'></span>");

  const { error } = await client.auth.signUp({
    email,
    password
  });

  if(error){
    showMsg(error.message);
    return;
  }

  showMsg("Account created. Please login ✔");
}

/* =========================
   LOGIN
========================= */
async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  showMsg("Logging in <span class='dot'></span>");

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showMsg(error.message);
    return;
  }

  localStorage.setItem("zep_user", JSON.stringify(data.user));

  showMsg("Success ✔ Redirecting...");

  setTimeout(()=>{
    window.location.href = "provider.html";
  },800);
}

/* =========================
   MESSAGE
========================= */
function showMsg(msg){
  document.getElementById("msg").innerHTML = msg;
}

/* INIT */
checkLocation();

</script>

</body>
</html>
