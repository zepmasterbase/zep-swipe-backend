<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep OS 3.8 Identity Core</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:radial-gradient(circle at 20% 10%, #0a0018, #000);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:420px;
  background:rgba(255,255,255,0.05);
  padding:22px;
  border-radius:18px;
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.1);
  position:relative;
}

/* GLOW */
.container::before{
  content:"";
  position:absolute;
  inset:-100px;
  background:radial-gradient(circle, rgba(0,240,255,0.15), transparent 60%);
  filter:blur(40px);
  z-index:-1;
}

/* LOGO */
.logo{
  display:flex;
  justify-content:center;
  margin:10px 0;
}

.logo img{
  width:90px;
  height:90px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.2);
  box-shadow:0 0 25px rgba(0,240,255,0.4);
}

h2{
  text-align:center;
  font-family:Orbitron;
  background:linear-gradient(90deg,#ff4fd8,#9c4dff,#00f0ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.4);
  color:white;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:linear-gradient(90deg,#ff4fd8,#9c4dff);
  color:black;
}

.toggle{
  background:transparent;
  border:1px solid #ff4fd8;
  color:#ff4fd8;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
  </div>

  <h2>Zep OS 3.8 Identity</h2>

  <!-- STRICT DROPDOWN -->
  <select id="country">
    <option>South Africa 🇿🇦</option>
    <option>Ghana 🇬🇭</option>
    <option>Zambia 🇿🇲</option>
    <option value="GLOBAL">🌍 Global (Join Waitlist)</option>
  </select>

  <input id="name" placeholder="Full Name" style="display:none;">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="primary" onclick="auth()" id="btn">Login</button>
  <button class="toggle" onclick="toggleMode()">Switch Mode</button>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* 🔐 REPLACE THESE */
const supabase = createClient(
  "https://kcdrezgxuclqmtozpyif.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjZHJlemd4dWNscW10b3pweWlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwOTA3MDUsImV4cCI6MjA5MTY2NjcwNX0.j34W8Ar2ansJjKc4AG-DVcemnMBg0Eq_tcyBrysTcO0"
);

/* ONLY PILOT COUNTRIES */
const PILOT = ["South Africa 🇿🇦","Ghana 🇬🇭","Zambia 🇿🇲"];

let isLogin = true;

/* ROUTE ENGINE */
function route(country){
  return PILOT.includes(country)
    ? "student.html"
    : "waitlist.html";
}

/* SESSION RESTORE (FIXED PROPERLY) */
async function restoreSession(){
  const { data } = await supabase.auth.getSession();

  if(data?.session){
    redirect(data.session.user);
  }
}

/* AUTH STATE LISTENER */
supabase.auth.onAuthStateChange((event, session)=>{
  if(session){
    redirect(session.user);
  }
});

/* REDIRECT ENGINE */
async function redirect(user){

  const country =
    user.user_metadata?.country ||
    document.getElementById("country").value;

  /* SAVE USER PROFILE TO DB */
  await supabase.from("users").upsert({
    auth_id: user.id,
    email: user.email,
    name: user.user_metadata?.name || null,
    country: country
  });

  localStorage.setItem("country", country);

  window.location.href = route(country);
}

/* TOGGLE MODE */
window.toggleMode = function(){
  isLogin = !isLogin;

  document.getElementById("btn").innerText =
    isLogin ? "Login" : "Create Account";

  document.getElementById("name").style.display =
    isLogin ? "none" : "block";
};

/* AUTH */
window.auth = async function(){

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const country = document.getElementById("country").value;

  if(!email || !password){
    alert("Fill required fields");
    return;
  }

  /* 🌍 GLOBAL GOES TO WAITLIST ALWAYS */
  if(country === "GLOBAL"){
    window.location.href = "waitlist.html";
    return;
  }

  if(isLogin){

    const { error } = await supabase.auth.signInWithPassword({
      email, password
    });

    if(error) return alert(error.message);

  } else {

    const { error } = await supabase.auth.signUp({
      email,
      password,
      options:{
        data:{
          name,
          country,
          role:"student"
        }
      }
    });

    if(error) return alert(error.message);
  }
};

restoreSession();
</script>

</body>
</html>
