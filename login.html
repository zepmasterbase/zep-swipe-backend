<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================
   🔑 CONNECT YOUR BACKEND
========================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isLogin = true;

/* =========================
   PILOT COUNTRIES
========================= */
const PILOT_COUNTRIES = [
  "South Africa 🇿🇦",
  "Ghana 🇬🇭",
  "Zambia 🇿🇲"
];

/* =========================
   COUNTRY DETECTION
========================= */
function detectCountry() {
  let locale = navigator.language || "en-ZA";
  let code = locale.split("-")[1] || "ZA";

  const map = {
    ZA: "South Africa 🇿🇦",
    GH: "Ghana 🇬🇭",
    ZM: "Zambia 🇿🇲",
    RW: "Rwanda 🇷🇼",
    NA: "Namibia 🇳🇦",
    BW: "Botswana 🇧🇼",
    MW: "Malawi 🇲🇼"
  };

  let country = map[code] || "South Africa 🇿🇦";

  document.getElementById("detected").innerText =
    `We think you're in ${country}`;

  document.getElementById("country").value = country;

  return country;
}

const detectedCountry = detectCountry();

/* =========================
   ROUTING ENGINE
========================= */
function routeUser(country) {
  return PILOT_COUNTRIES.includes(country)
    ? "student-dashboard.html"
    : "waitlist.html";
}

/* =========================
   TOGGLE LOGIN/SIGNUP
========================= */
window.toggleMode = function () {
  isLogin = !isLogin;

  document.getElementById("actionBtn").innerText =
    isLogin ? "Login" : "Create Account";

  document.getElementById("nameField").style.display =
    isLogin ? "none" : "block";
};

/* =========================
   AUTH FLOW (ENHANCED)
========================= */
window.handleAuth = async function () {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const country = document.getElementById("country").value || detectedCountry;

  if (!email || !password) {
    alert("Fill all fields");
    return;
  }

  try {

    let user;

    /* ================= LOGIN ================= */
    if (isLogin) {
      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;
      user = data.user;
    }

    /* ================= SIGNUP ================= */
    else {

      if (!name) {
        alert("Enter full name");
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            name,
            country,
            role: "student"
          }
        }
      });

      if (error) throw error;

      user = data.user;

      /* 🔥 CHECK IF USER EXISTS (avoid duplicates) */
      const { data: existing } = await supabase
        .from("users")
        .select("id")
        .eq("id", user.id)
        .maybeSingle();

      if (!existing) {

        /* CREATE USER PROFILE */
        await supabase.from("users").insert({
          id: user.id,
          full_name: name,
          email: email,
          country: country,
          role: "student",
          xp: 0,
          zac_balance: 0,
          wallet_balance: 0,
          created_at: new Date()
        });

        /* 🔥 CREATE WALLET */
        await supabase.from("wallets").insert({
          user_id: user.id,
          balance: 0
        });
      }
    }

    /* ================= SAVE SESSION ================= */
    localStorage.setItem("currentUserId", user.id);
    localStorage.setItem("currentCountry", country);

    /* ================= REDIRECT ================= */
    window.location.href = routeUser(country);

  } catch (err) {
    console.error(err);
    alert(err.message);
  }
};

/* =========================
   SESSION CHECK (SMART)
========================= */
async function checkSession() {

  const { data } = await supabase.auth.getSession();

  if (data.session) {

    const user = data.session.user;

    const country =
      user.user_metadata?.country ||
      localStorage.getItem("currentCountry") ||
      detectedCountry;

    window.location.href = routeUser(country);
  }
}

checkSession();
</script>
