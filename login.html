<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Access OS 3.5 Identity</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg: radial-gradient(circle at 20% 10%, #120018, #000);
  --glass: rgba(255,255,255,0.06);
  --stroke: rgba(255,255,255,0.12);

  --pink:#ff4fd8;
  --purple:#9c4dff;
  --blue:#00f0ff;

  --text: rgba(255,255,255,0.85);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:var(--bg);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* GLOW */
.glow{
  position:absolute;
  width:520px;
  height:520px;
  background:radial-gradient(circle,var(--pink),transparent);
  filter:blur(140px);
  opacity:.14;
  top:-140px;
  left:-140px;
}

/* LOGO */
.logo{
  display:flex;
  justify-content:center;
  margin-top:45px;
}

.logo-ring{
  width:120px;
  height:120px;
  border-radius:50%;
  position:relative;
  background:conic-gradient(var(--pink),var(--purple),var(--blue),var(--pink));
  padding:4px;
  box-shadow:
    0 0 25px rgba(255,79,216,0.6),
    0 0 60px rgba(156,77,255,0.35),
    0 0 90px rgba(0,240,255,0.25);
  animation:spin 6s linear infinite;
}

.logo-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  background:rgba(5,0,20,0.9);
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-inner img{
  width:68%;
  filter:drop-shadow(0 0 10px rgba(255,79,216,0.6));
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* UI */
.container{
  max-width:440px;
  margin:auto;
  padding:26px;
}

.title{
  text-align:center;
  font-size:24px;
  font-family:Orbitron;
  margin-top:18px;
  background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  font-size:13px;
  opacity:.7;
}

.card{
  margin-top:22px;
  background:var(--glass);
  border:1px solid rgba(255,79,216,0.18);
  border-radius:18px;
  padding:18px;
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  gap:12px;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(0,0,0,0.35);
  color:white;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 2px rgba(255,79,216,0.2);
}

button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:800;
  cursor:pointer;
  font-family:Orbitron;
}

.btn-primary{
  background:linear-gradient(90deg,var(--pink),var(--purple));
  color:black;
}

.btn-toggle{
  background:transparent;
  color:var(--pink);
  border:1px solid rgba(255,79,216,0.3);
}

.badge{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,79,216,0.08);
  border:1px solid rgba(255,79,216,0.25);
  text-align:center;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="logo">
  <div class="logo-ring">
    <div class="logo-inner">
      <img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jhp2503i1gm41unj1tlt1me117of15.png">
    </div>
  </div>
</div>

<div class="title">Zep Swipe Identity</div>
<div class="subtitle">OS 3.5 Secure Identity Layer</div>

<div class="card">

  <div id="detected" class="badge">Detecting identity...</div>

  <select id="country">
    <option>South Africa 🇿🇦</option>
    <option>Ghana 🇬🇭</option>
    <option>Zambia 🇿🇲</option>
  </select>

  <div id="nameField" style="display:none;">
    <input id="name" placeholder="Full Name">
  </div>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="btn-primary" onclick="handleAuth()" id="btn">
    Login
  </button>

  <button class="btn-toggle" onclick="toggleMode()">
    Switch Mode
  </button>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient("https://zazbdbkoqjxdzisfszeg.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphemJkYmtvcWp4ZHppc2ZzemVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTA4MzAsImV4cCI6MjA5MTQ4NjgzMH0.uTqieGXErIpooSUn0TMmYwYYJuo0yHYcAqdampHWRj4");

let isLogin = true;

/* ================= OS 3.5 IDENTITY ENGINE ================= */

/* 1. REAL IP LOCATION */
async function getIPCountry(){
  try{
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();
    return data.country_name || "South Africa";
  } catch {
    return "South Africa";
  }
}

/* 2. DEVICE FINGERPRINT */
function getDeviceId(){
  let id = localStorage.getItem("zep_device_id");

  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem("zep_device_id", id);
  }

  return id;
}

/* 3. INIT IDENTITY */
let detectedCountry = "South Africa";

async function initIdentity(){
  detectedCountry = await getIPCountry();

  document.getElementById("detected").innerText =
    "Identity locked: " + detectedCountry;

  document.getElementById("country").value = detectedCountry;
}

initIdentity();

/* ROUTING */
function routeUser(country){
  return ["South Africa","Ghana","Zambia","Kenya"].includes(country)
    ? "student-dashboard.html"
    : "waitlist.html";
}

/* SESSION RESTORE */
async function boot(){
  const { data } = await supabase.auth.getSession();

  if(data?.session){
    redirect(data.session.user);
  }
}

supabase.auth.onAuthStateChange((_, session)=>{
  if(session) redirect(session.user);
});

/* REDIRECT ENGINE */
function redirect(user){
  const country =
    user.user_metadata?.country ||
    detectedCountry;

  localStorage.setItem("currentCountry", country);
  localStorage.setItem("device_id", getDeviceId());

  window.location.href = routeUser(country);
}

/* TOGGLE */
window.toggleMode = function(){
  isLogin = !isLogin;
  document.getElementById("btn").innerText =
    isLogin ? "Login" : "Create Account";

  document.getElementById("nameField").style.display =
    isLogin ? "none" : "block";
};

/* AUTH */
window.handleAuth = async function(){

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const country = detectedCountry;

  if(!email || !password){
    alert("Fill required fields");
    return;
  }

  if(isLogin){
    const { error } = await supabase.auth.signInWithPassword({
      email, password
    });
    if(error) return alert(error.message);
  } else {

    const { data, error } = await supabase.auth.signUp({
      email, password,
      options:{
        data:{
          name,
          country,
          device_id:getDeviceId(),
          role:"student"
        }
      }
    });

    if(error) return alert(error.message);
  }

  localStorage.setItem("currentCountry", country);
};

boot();
</script>

</body>
</html>
