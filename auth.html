<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>Zep Swipe | Account Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--panel:#11130f;--line:#292d25;--accent:#b8ff3b;--accent2:#d9ff79;--muted:#a0a69a;--danger:#ff7979}
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px;color:#f5f7f2;background:radial-gradient(ellipse at top,rgba(184,255,59,.08),transparent 48%),var(--bg)}
.page{width:100%;max-width:480px;position:relative}
.brand{text-align:center;margin:0 auto 22px}
.logo-wrap{width:82px;height:82px;margin:0 auto 12px;border:1px solid rgba(184,255,59,.56);border-radius:25px;display:grid;place-items:center;background:linear-gradient(145deg,#1c2810,#0c0f09);box-shadow:0 0 35px rgba(184,255,59,.12)}
.logo-wrap img{display:block;width:65px;height:65px;object-fit:contain;border-radius:16px}
.wordmark{font-size:30px;font-weight:900;letter-spacing:-1.8px}
.wordmark span{color:var(--accent)}
.tagline{margin-top:5px;font-size:9px;letter-spacing:2.8px;text-transform:uppercase;color:#7d8575}
.card{border:1px solid var(--line);border-radius:25px;padding:25px;background:linear-gradient(145deg,rgba(20,23,18,.98),rgba(10,11,9,.99));box-shadow:0 24px 80px rgba(0,0,0,.42)}
.eyebrow{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent);font-weight:800;margin:0 0 9px}
h1{font-size:27px;line-height:1.15;letter-spacing:-1.2px;margin:0 0 9px}
.intro{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 21px}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:5px;border:1px solid #262a23;border-radius:14px;background:#080907;margin-bottom:18px}
.mode-tab{border:0;border-radius:10px;padding:12px 8px;background:transparent;color:#92998b;font-weight:800;font-size:12px;cursor:pointer}
.mode-tab.active{background:var(--accent);color:#080a06}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:17px}
.role{min-width:0;padding:13px 7px 12px;border:1px solid var(--line);background:#0a0c09;border-radius:13px;color:#f5f7f2;text-align:center;cursor:pointer}
.role[aria-pressed="true"]{border-color:var(--accent);background:rgba(184,255,59,.075)}
.role .emoji{display:block;font-size:21px;margin-bottom:7px}
.role strong{display:block;font-size:10px;line-height:1.35}
.role small{display:block;color:#8f9687;font-size:9px;line-height:1.4;margin-top:4px}
.field{margin-top:13px}
.field label{display:block;font-size:11px;font-weight:700;color:#cbd0c5;margin-bottom:7px}
.field input:not([type="checkbox"]){display:block;width:100%;min-height:47px;border:1px solid #30352b;border-radius:12px;padding:13px 14px;background:#090b08;color:#fff;outline:none;font-size:13px}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,255,59,.08)}
.field input::placeholder{color:#666d60}
.field-note{font-size:10px;color:#81887a;margin-top:6px;line-height:1.5}
.inline-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}
.check-label{display:flex;align-items:flex-start;gap:8px;color:#9ba293;font-size:10px;line-height:1.5}
.check-label input{margin:2px 0 0;accent-color:var(--accent)}
.text-button{border:0;background:transparent;color:var(--accent);font-size:10px;font-weight:700;padding:4px 0;cursor:pointer}
.primary,.secondary{width:100%;min-height:48px;padding:13px 15px;border-radius:13px;font-weight:900;font-size:12px;cursor:pointer;margin-top:17px}
.primary{border:0;background:linear-gradient(130deg,var(--accent2),var(--accent) 65%,#99ef28);color:#080a06;box-shadow:0 10px 28px rgba(184,255,59,.12)}
.secondary{border:1px solid #3a4230;background:transparent;color:#eef3e8;margin-top:9px}
button:disabled{opacity:.55;cursor:wait}
#message{display:none;margin-top:15px;padding:12px;border:1px solid #30372a;border-radius:12px;background:#0a0c09;color:#c4ccb9;font-size:11px;line-height:1.6;overflow-wrap:anywhere}
#message.show{display:block}
#message.error{border-color:rgba(255,121,121,.4);color:var(--danger)}
#message.success{border-color:rgba(184,255,59,.28);color:var(--accent2)}
.footnote{text-align:center;margin:17px 8px 0;color:#737a6d;font-size:9px;line-height:1.7}
.footnote a{color:#b6c0aa;text-decoration:none}
.footnote a:hover{color:var(--accent)}
[hidden]{display:none!important}
@media(max-width:390px){.card{padding:19px;border-radius:21px}.roles{gap:5px}.role{padding:11px 4px}.role strong{font-size:9px}h1{font-size:24px}.wordmark{font-size:27px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <header class="brand">
    <div class="logo-wrap">
      <img src="https://payhip.com/cdn-cgi/image/format=auto,width=1500/https://pe56d.s3.amazonaws.com/o_1jrl9bj473pej4dqgtbqh12315.png" alt="Zep Swipe logo">
    </div>
    <div class="wordmark">ZEP <span>SWIPE</span></div>
    <div class="tagline">The Student Economy</div>
  </header>

  <section class="card" aria-labelledby="title">
    <p class="eyebrow">Your next move starts here</p>
    <h1 id="title">Welcome to Zep Swipe</h1>
    <p class="intro" id="intro">Sign in or create your account to discover opportunities, earn, connect and build.</p>

    <div class="mode-tabs" role="tablist" aria-label="Account access">
      <button class="mode-tab active" id="loginTab" type="button" role="tab" aria-selected="true">Sign in</button>
      <button class="mode-tab" id="signupTab" type="button" role="tab" aria-selected="false">Create account</button>
    </div>

    <div id="roleSection" hidden>
      <div class="roles" aria-label="Choose account type">
        <button class="role" type="button" data-role="customer" aria-pressed="true">
          <span class="emoji">👤</span><strong>Customer</strong><small>Find services & deals</small>
        </button>
        <button class="role" type="button" data-role="provider" aria-pressed="false">
          <span class="emoji">🛠️</span><strong>Student Provider</strong><small>Offer skills & earn</small>
        </button>
        <button class="role" type="button" data-role="business" aria-pressed="false">
          <span class="emoji">🏪</span><strong>Business</strong><small>Reach students</small>
        </button>
      </div>
    </div>

    <form id="authForm" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="100" placeholder="Enter your full name">
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Enter your password">
        <div class="field-note" id="passwordHint">Use the password you created for Zep Swipe.</div>
      </div>

      <div class="field" id="confirmField" hidden>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Enter your password again">
      </div>

      <div class="field" id="resetField" hidden>
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Choose a new password">
      </div>

      <div class="inline-row" id="loginOptions">
        <label class="check-label"><input id="remember" type="checkbox" checked> Keep me signed in on this device</label>
        <button class="text-button" id="forgotBtn" type="button">Forgot password?</button>
      </div>

      <div class="field" id="termsField" hidden>
        <label class="check-label"><input id="terms" type="checkbox"> I agree to the Zep Swipe terms and privacy policy.</label>
      </div>

      <button class="primary" id="submitBtn" type="submit">SIGN IN →</button>
      <button class="secondary" id="backBtn" type="button" hidden>BACK TO SIGN IN</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <div class="footnote">
    Zep Swipe · Discover · Earn · Connect · Build<br>
    Need help? <a href="mailto:support@zepswipe.com">Contact support</a>
  </div>
</main>

<script>
/* ZEP SWIPE AUTH
   Use your Supabase PUBLIC anon/publishable key below.
   Never put a service-role key or secret API key in browser HTML.
*/
const SUPABASE_URL = "https://qhwjtdsbkjfdgwevemiv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFod2p0ZHNia2pmZGd3ZXZlbWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTM2ODQsImV4cCI6MjEwNDA4OTY4NH0.BauF1Ef7dDUu3JRFSwl4WX3-8AYnIAcEC0nk58ryJTo";
const VERIFY_URL = new URL("verify.html", window.location.href).href;

if (!window.supabase) {
  document.getElementById("message").textContent =
    "The sign-in service could not load. Refresh the page and try again.";
  document.getElementById("message").className = "show error";
  throw new Error("Supabase JS failed to load");
}

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

const $ = id => document.getElementById(id);
let mode = new URLSearchParams(location.search).get("mode") === "reset" ? "reset" : "login";
let role = "customer";
let busy = false;

function showMessage(text, type="") {
  const el = $("message");
  el.textContent = text;
  el.className = "show" + (type ? " " + type : "");
}

function clearMessage() {
  $("message").textContent = "";
  $("message").className = "";
}

function normalizeRole(value) {
  const r = String(value || "").toLowerCase();
  if (["provider", "student_provider"].includes(r)) return "provider";
  if (["business", "merchant", "business_owner"].includes(r)) return "business";
  return "customer";
}

function roleDashboard(value) {
  const r = normalizeRole(value);
  if (r === "provider") return "provider.html";
  if (r === "business") return "business-deals.html";
  return "customer.html";
}

function getSafeRedirect() {
  const raw = new URLSearchParams(location.search).get("redirect");
  if (!raw) return null;

  // Permit internal HTML paths only. Reject external redirects.
  if (raw.includes(":") || raw.includes("\\") || raw.startsWith("/") || raw.includes("..")) return null;

  const path = raw.split("?")[0].split("#")[0];
  if (!/^[a-z0-9_-]+\.html$/i.test(path)) return null;

  return raw;
}

function routeAfterAuth(profile, user) {
  const intended = getSafeRedirect();
  const destination = intended || roleDashboard(profile?.role || user?.user_metadata?.role);
  location.replace(destination);
}

async function getAccountProfile(user) {
  const { data, error } = await db
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .maybeSingle();

  if (error) console.warn("Could not load account role:", error.message);

  return data || { role: normalizeRole(user.user_metadata?.role) };
}

function setMode(next) {
  mode = next;
  clearMessage();

  const isSignup = mode === "signup";
  const isReset = mode === "reset";

  $("loginTab").classList.toggle("active", mode === "login");
  $("signupTab").classList.toggle("active", isSignup);
  $("loginTab").setAttribute("aria-selected", String(mode === "login"));
  $("signupTab").setAttribute("aria-selected", String(isSignup));
  $("loginTab").hidden = isReset;
  $("signupTab").hidden = isReset;

  $("roleSection").hidden = !isSignup;
  $("nameField").hidden = !isSignup;
  $("confirmField").hidden = !isSignup;
  $("termsField").hidden = !isSignup;
  $("loginOptions").hidden = isSignup || isReset;
  $("resetField").hidden = !isReset;
  $("password").hidden = isReset;
  $("password").required = !isReset;
  $("password").autocomplete = isSignup ? "new-password" : "current-password";
  $("passwordHint").hidden = isReset;
  $("backBtn").hidden = !isReset;

  $("submitBtn").textContent =
    isSignup ? "CREATE ACCOUNT →" :
    isReset ? "SAVE NEW PASSWORD →" :
    "SIGN IN →";

  $("title").textContent =
    isSignup ? "Create your account" :
    isReset ? "Reset your password" :
    "Welcome to Zep Swipe";

  $("intro").textContent =
    isSignup ? "Choose your account type and join the student economy." :
    isReset ? "Choose a new password for your Zep Swipe account." :
    "Sign in to discover opportunities, earn, connect and build.";
}

function setRole(nextRole) {
  role = normalizeRole(nextRole);

  document.querySelectorAll(".role").forEach(btn => {
    btn.setAttribute("aria-pressed", String(btn.dataset.role === role));
  });
}

function setBusy(value, text) {
  busy = value;
  $("submitBtn").disabled = value;
  $("backBtn").disabled = value;

  if (value && text) $("submitBtn").textContent = text;

  if (!value) {
    $("submitBtn").textContent =
      mode === "signup" ? "CREATE ACCOUNT →" :
      mode === "reset" ? "SAVE NEW PASSWORD →" :
      "SIGN IN →";
  }
}

async function signup() {
  const fullName = $("fullName").value.trim();
  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;
  const confirmPassword = $("confirmPassword").value;

  if (!fullName) return showMessage("Please enter your full name.", "error");
  if (!email) return showMessage("Please enter your email address.", "error");
  if (password.length < 6) return showMessage("Your password must contain at least 6 characters.", "error");
  if (password !== confirmPassword) return showMessage("Your passwords do not match.", "error");
  if (!$("terms").checked) return showMessage("Please agree to the terms and privacy policy to continue.", "error");

  setBusy(true, "CREATING ACCOUNT...");
  showMessage("Creating your account securely...", "");

  let waitingForEmailConfirmation = false;

  try {
    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: VERIFY_URL,
        data: {
          role,
          full_name: fullName,
          name: fullName
        }
      }
    });

    if (error) throw error;

    // The database trigger should create the profile from auth metadata.
    // Do not make an unauthenticated profile insert when email verification is enabled.
    if (data.session && data.user) {
      showMessage("Account created. Opening your dashboard...", "success");
      routeAfterAuth({ role }, data.user);
      return;
    }

    waitingForEmailConfirmation = true;
    showMessage(
      "Account created. Check your email and click the verification link. You will then be taken to the correct dashboard.",
      "success"
    );
    $("submitBtn").textContent = "VERIFICATION EMAIL SENT";
    $("submitBtn").disabled = true;

  } catch (error) {
    console.error("Signup error:", error);
    showMessage(error.message || "We could not create your account. Please try again.", "error");
  } finally {
    if (waitingForEmailConfirmation) {
      busy = false;
    } else {
      setBusy(false);
    }
  }
}

async function login() {
  const email = $("email").value.trim().toLowerCase();
  const password = $("password").value;

  if (!email || !password) {
    return showMessage("Enter your email address and password.", "error");
  }

  setBusy(true, "SIGNING IN...");
  showMessage("Checking your sign-in details...", "");

  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;

    const profile = await getAccountProfile(data.user);
    routeAfterAuth(profile, data.user);

  } catch (error) {
    console.error("Login error:", error);
    const message = String(error.message || "");

    showMessage(
      message.includes("Email not confirmed")
        ? "Please verify your email using the link we sent you before signing in. Check your spam folder too."
        : message || "We could not sign you in. Check your details and try again.",
      "error"
    );
  } finally {
    setBusy(false);
  }
}

async function requestPasswordReset() {
  const email = $("email").value.trim().toLowerCase();

  if (!email) {
    showMessage("Enter your email address first.", "error");
    $("email").focus();
    return;
  }

  setBusy(true, "SENDING RESET LINK...");

  try {
    const resetUrl = new URL("auth.html?mode=reset", window.location.href).href;
    const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: resetUrl });

    if (error) throw error;

    showMessage(
      "If an account exists for that email, a password reset link has been sent. Follow the email link to choose a new password.",
      "success"
    );

  } catch (error) {
    console.error("Password reset request error:", error);
    showMessage(error.message || "Could not send the password reset email.", "error");
  } finally {
    setBusy(false);
  }
}

async function saveNewPassword() {
  const password = $("newPassword").value;

  if (password.length < 6) {
    return showMessage("Your new password must contain at least 6 characters.", "error");
  }

  setBusy(true, "UPDATING PASSWORD...");

  try {
    const { data: { session }, error: sessionError } = await db.auth.getSession();
    if (sessionError) throw sessionError;

    if (!session) {
      throw new Error("This reset link is no longer active. Request a new password reset email.");
    }

    const { error } = await db.auth.updateUser({ password });
    if (error) throw error;

    showMessage("Password updated successfully. Opening your dashboard...", "success");

    const profile = await getAccountProfile(session.user);
    setTimeout(() => routeAfterAuth(profile, session.user), 700);

  } catch (error) {
    console.error("Password update error:", error);
    showMessage(error.message || "Could not update your password.", "error");
  } finally {
    setBusy(false);
  }
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;

  if (mode === "signup") return signup();
  if (mode === "reset") return saveNewPassword();

  return login();
});

$("loginTab").addEventListener("click", () => setMode("login"));
$("signupTab").addEventListener("click", () => setMode("signup"));
$("forgotBtn").addEventListener("click", requestPasswordReset);

$("backBtn").addEventListener("click", () => {
  const url = new URL(location.href);
  url.searchParams.delete("mode");
  history.replaceState({}, "", url);
  setMode("login");
});

document.querySelectorAll(".role").forEach(btn => {
  btn.addEventListener("click", () => setRole(btn.dataset.role));
});

async function init() {
  setMode(mode);

  const { data: { session }, error } = await db.auth.getSession();
  if (error) console.warn("Session lookup:", error.message);

  if (mode === "reset") {
    showMessage("Enter your new password below. This only works when you opened a valid password-reset link from your email.");
    return;
  }

  if (session?.user) {
    showMessage("You are already signed in. Opening your account...", "success");
    const profile = await getAccountProfile(session.user);
    routeAfterAuth(profile, session.user);
  }
}

init().catch(error => {
  console.error("Auth page initialization error:", error);
  showMessage("The sign-in page could not connect. Check your public Supabase key and refresh this page.", "error");
});
</script>
</body>
</html>
