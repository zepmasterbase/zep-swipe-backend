<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Auth V90</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--line:#262626;--accent:#b8ff3b}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#070707;color:#fff;padding:20px}
.card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.role{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.active{border-color:var(--accent)}
input{width:100%;padding:12px;margin-top:10px;background:#101010;color:#fff;border:1px solid var(--line);border-radius:10px}
button{width:100%;padding:12px;margin-top:12px;border:none;border-radius:10px;font-weight:700}
.primary{background:var(--accent)}
.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
#msg{margin-top:12px;min-height:20px;color:var(--accent)}
</style>
</head>
<body>
<div class="card">
<h2>⚡ Zep Swipe</h2>
<p>Select account type</p>

<div id="customer" class="role active">👤 Customer</div>
<div id="provider" class="role">💼 Provider</div>
<div id="business" class="role">🏪 Business</div>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="primary" onclick="signup()">Create Account</button>
<button class="secondary" onclick="login()">Login</button>

<div id="msg"></div>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let role="customer";
["customer","provider","business"].forEach(r=>{
 document.getElementById(r).onclick=()=>{
   document.querySelectorAll(".role").forEach(x=>x.classList.remove("active"));
   document.getElementById(r).classList.add("active");
   role=r;
 };
});
const msg=t=>document.getElementById("msg").textContent=t;

async function signup(){
 msg("Creating account...");
 const {data,error}=await db.auth.signUp({
   email:email.value.trim(),
   password:password.value
 });
 if(error){msg(error.message);return;}
 if(data.user){
   await db.from("profiles").upsert({
      id:data.user.id,
      email:data.user.email,
      role:role
   });
 }
 if(data.session) redirect(role);
 else msg("Account created. Verify your email then login.");
}

async function login(){
 msg("Signing in...");
 const {data,error}=await db.auth.signInWithPassword({
   email:email.value.trim(),
   password:password.value
 });
 if(error){msg(error.message);return;}
 const {data:profile}=await db.from("profiles").select("role").eq("id",data.user.id).single();
 redirect(profile?.role||"customer");
}

function redirect(r){
 if(r==="customer") location.replace("customer.html");
 else if(r==="provider") location.replace("provider.html");
 else location.replace("business-deals.html");
}
</script>
</body>
</html>
