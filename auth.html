<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zep Swipe — Smart Access</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#050816;
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background-image:
      radial-gradient(circle at top left, rgba(0,255,200,0.14), transparent 30%),
      radial-gradient(circle at bottom right, rgba(0,140,255,0.14), transparent 35%);
    }

    .card{
      width:100%;
      max-width:520px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:30px;
      padding:35px 25px;
      backdrop-filter:blur(18px);
      box-shadow:0 0 60px rgba(0,255,255,0.08);
      text-align:center;
    }

    .logo{
      width:70px;
      margin-bottom:15px;
      filter:drop-shadow(0 0 18px rgba(0,255,255,0.4));
    }

    h1{
      font-size:2rem;
      font-weight:800;
      margin-bottom:10px;
    }

    .subtitle{
      color:#a8b7d6;
      font-size:0.95rem;
      line-height:1.6;
      margin-bottom:20px;
    }

    .gradient{
      background:linear-gradient(90deg,#00ffe1,#00a2ff,#7b61ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .status{
      display:inline-block;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(0,255,170,0.12);
      border:1px solid rgba(0,255,170,0.25);
      color:#00ffb2;
      font-size:0.85rem;
      margin-bottom:20px;
    }

    .btn{
      width:100%;
      padding:15px;
      border-radius:18px;
      font-weight:800;
      cursor:pointer;
      border:none;
      font-size:1rem;
      margin-top:10px;
      transition:0.3s;
    }

    .primary{
      background:linear-gradient(90deg,#00ffe1,#00a2ff);
      color:#03111f;
      box-shadow:0 0 25px rgba(0,255,255,0.3);
    }

    .secondary{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      color:white;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    .loading{
      margin-top:20px;
      font-size:0.85rem;
      color:#9fb0d5;
    }

  </style>
</head>

<body>

<div class="card">

  <img class="logo"
    src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jpitama61nopisi19aqb041vvo15.png"
    alt="Zep Swipe"
  />

  <div class="status">⚡ Smart Access System</div>

  <h1>
    Welcome to <span class="gradient">Zep Swipe</span>
  </h1>

  <div class="subtitle">
    Connecting you to the student economy in your area.
    Checking availability…
  </div>

  <button class="btn primary" onclick="manualStart()">
    🚀 Enter Marketplace
  </button>

  <button class="btn secondary" onclick="window.location.href='waitlist.html'">
    👀 Join Waitlist Instead
  </button>

  <div class="loading" id="statusText">
    Detecting your location...
  </div>

</div>

<script>
async function routeUser() {

  try {

    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();

    const country = data.country_name;
    const city = data.city;

    document.getElementById("statusText").innerText =
      `Detected: ${city}, ${country}`;

    localStorage.setItem("userCountry", country);
    localStorage.setItem("userCity", city);

    // 🟢 ACTIVE CITY (FULL ACCESS)
    if (city === "Randfontein") {
      setTimeout(() => {
        window.location.href = "browse.html";
      }, 1500);
      return;
    }

    // 🟡 SOUTH AFRICA OTHER CITIES
    if (country === "South Africa") {
      setTimeout(() => {
        window.location.href = "waitlist.html?region=sa";
      }, 1500);
      return;
    }

    // 🌍 AFRICA EXPANSION COUNTRIES
    const africanCountries = [
      "Nigeria",
      "Ghana",
      "Kenya",
      "Uganda",
      "Tanzania",
      "Ethiopia",
      "Zambia",
      "Zimbabwe",
      "Botswana",
      "Namibia",
      "Malawi"
    ];

    if (africanCountries.includes(country)) {
      setTimeout(() => {
        window.location.href = "waitlist.html?region=africa";
      }, 1500);
      return;
    }

    // 🌐 GLOBAL USERS
    setTimeout(() => {
      window.location.href = "waitlist.html?region=global";
    }, 1500);

  } catch (err) {
    document.getElementById("statusText").innerText =
      "Unable to detect location. Redirecting to waitlist...";

    setTimeout(() => {
      window.location.href = "waitlist.html";
    }, 2000);
  }
}

// AUTO RUN ON LOAD
routeUser();

// Manual override
function manualStart(){
  window.location.href = "browse.html";
}
</script>

</body>
</html>
