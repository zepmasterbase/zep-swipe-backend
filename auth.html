<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<title>Zep Swipe | Sign In</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070707;
  --card:#141414;
  --line:#262626;
  --accent:#b8ff3b;
  --muted:#aaa;
  --danger:#ff6b6b;
}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#111,#070707);
  color:#fff;
  padding:20px;
}
.card{
  width:100%;
  max-width:460px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.logo{text-align:center;color:var(--accent);font-size:30px;font-weight:800}
.sub{text-align:center;color:var(--muted);margin:8px 0 22px;line-height:1.5}
.roles{display:grid;gap:10px}
.role{
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#101010;
  cursor:pointer;
}
.role.active{border-color:var(--accent);background:#1a2508}
.role strong{font-size:16px}
.role small{display:block;color:var(--muted);margin-top:4px}
label{display:block;margin-top:16px;font-size:13px;color:#ccc}
input{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#101010;
  color:#fff;
  outline:none;
}
input:focus{border-color:var(--accent)}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}
.primary{border:none;background:var(--accent);color:#000}
.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent)}
button:disabled{opacity:.55;cursor:not-allowed}
#msg{margin-top:16px;min-height:22px;text-align:center;color:var(--accent);line-height:1.45}
#msg.error{color:var(--danger)}
.footer-note{margin-top:18px;text-align:center;color:#777;font-size:12px;line-height:1.5}
</style>
</head>

<body>
<div class="card">

  <div class="logo">⚡ Zep Swipe</div>

  <div class="sub">
    Choose your account type when creating your Zep Swipe account.
  </div>

  <div class="roles">
    <div class="role active" data-role="customer">
      <strong>👤 Customer</strong>
      <small>Book services & redeem deals</small>
    </div>

    <div class="role" data-role="provider">
      <strong>💼 Student Provider</strong>
      <small>List services & earn</small>
    </div>

    <div class="role" data-role="business">
      <strong>🏪 Business</strong>
      <small>Create student deals & reach customers</small>
    </div>
  </div>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Your password">

  <button id="signupBtn" class="primary" type="button">Create Account</button>
  <button id="loginBtn" class="secondary" type="button">Login</button>

  <div id="msg"></div>

  <div class="footer-note">
    Zep Swipe connects customers, student providers and businesses.
  </div>
</div>

<script>
/* =========================================================
   ZEP SWIPE SUPABASE CONFIGURATION
   Replace ONLY the two values below.
   ========================================================= */

const SUPABASE_URL =
  "20https://mccsctmgkokkcrkmjuvw.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jY3NjdG1na29ra2Nya21qdXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Nzg0NjcsImV4cCI6MjEwMjU1NDQ2N30.uQrPeROFDjxxiVDPh0vnAyS3TSN6igVTEbbOXkCBx_U";

/*
   Example format:

   const SUPABASE_URL =
     "https://xxxxxxxx.supabase.co";

   const SUPABASE_ANON_KEY =
     "your-public-anon-or-publishable-key";

   NEVER put a service_role/secret key in this HTML file.
*/

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

/*
   DEVELOPMENT REDIRECT
   Replace this with your ACTUAL GitHub Pages auth.html URL.
*/
const AUTH_REDIRECT_URL =
  "https://masterbase.github.io/auth.html";

let selectedRole = "customer";

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const signupBtn = document.getElementById("signupBtn");
const loginBtn = document.getElementById("loginBtn");
const msgEl = document.getElementById("msg");

document.querySelectorAll(".role").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".role")
      .forEach(x => x.classList.remove("active"));

    el.classList.add("active");
    selectedRole = el.dataset.role;

    localStorage.setItem("zep_selected_role", selectedRole);
  });
});

function showMessage(text, error=false){
  msgEl.textContent = text;
  msgEl.className = error ? "error" : "";
}

function setLoading(button, loading, loadingText, normalText){
  button.disabled = loading;
  button.textContent = loading ? loadingText : normalText;
}

function validateForm(){

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email){
    showMessage("Please enter your email.", true);
    emailInput.focus();
    return false;
  }

  if(!password){
    showMessage("Please enter your password.", true);
    passwordInput.focus();
    return false;
  }

  if(password.length < 6){
    showMessage("Password must be at least 6 characters.", true);
    passwordInput.focus();
    return false;
  }

  return true;
}

/*
   Create/update the user's profile.

   IMPORTANT:
   With email confirmation enabled, a new signup may not have
   an authenticated database session yet. Therefore the role
   is also stored in Auth user metadata during signup.

   After verification + login, this function safely creates
   the profiles row.
*/
async function ensureProfile(user){

  if(!user) return false;

  const metadataRole = user.user_metadata?.role;

  const savedRole =
    localStorage.getItem("zep_selected_role");

  const role =
    metadataRole ||
    savedRole ||
    "customer";

  const cleanRole =
    ["customer","provider","business"].includes(role)
      ? role
      : "customer";

  const {error} = await db
    .from("profiles")
    .upsert({
      id:user.id,
      email:user.email || "",
      role:cleanRole
    });

  if(error){
    console.error("Profile error:", error);

    showMessage(
      "Your account is active, but your profile could not be saved.",
      true
    );

    return false;
  }

  localStorage.removeItem("zep_selected_role");

  return true;
}

/* =========================================================
   SIGN UP
   ========================================================= */

async function signup(){

  if(!validateForm()) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  localStorage.setItem("zep_selected_role", selectedRole);

  setLoading(
    signupBtn,
    true,
    "Creating...",
    "Create Account"
  );

  showMessage("Creating your Zep Swipe account...");

  const {data,error} = await db.auth.signUp({
    email,
    password,

    options:{
      emailRedirectTo:AUTH_REDIRECT_URL,

      data:{
        role:selectedRole
      }
    }
  });

  if(error){

    console.error(error);

    showMessage(error.message, true);

    setLoading(
      signupBtn,
      false,
      "",
      "Create Account"
    );

    return;
  }

  /*
     If email confirmation is disabled, a session may be
     returned immediately.
  */
  if(data.session && data.user){

    const profileOK =
      await ensureProfile(data.user);

    if(profileOK){
      showMessage("Account created. Redirecting...");
      redirectByRole(selectedRole);
    }

    setLoading(
      signupBtn,
      false,
      "",
      "Create Account"
    );

    return;
  }

  /*
     Email confirmation is enabled.
  */
  showMessage(
    "Account created. Check your email and verify your account before logging in."
  );

  setLoading(
    signupBtn,
    false,
    "",
    "Create Account"
  );
}

/* =========================================================
   LOGIN
   ========================================================= */

async function login(){

  if(!validateForm()) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  setLoading(
    loginBtn,
    true,
    "Signing in...",
    "Login"
  );

  showMessage("Signing you in...");

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    console.error(error);

    showMessage(error.message, true);

    setLoading(
      loginBtn,
      false,
      "",
      "Login"
    );

    return;
  }

  if(!data.user){

    showMessage(
      "Login succeeded, but no user session was returned.",
      true
    );

    setLoading(
      loginBtn,
      false,
      "",
      "Login"
    );

    return;
  }

  /*
     Ensure the profile exists.
  */
  const profileOK =
    await ensureProfile(data.user);

  if(!profileOK){

    setLoading(
      loginBtn,
      false,
      "",
      "Login"
    );

    return;
  }

  /*
     Get the authoritative role from the database.
  */
  const {
    data:profile,
    error:profileError
  } = await db
    .from("profiles")
    .select("role")
    .eq("id",data.user.id)
    .maybeSingle();

  if(profileError){

    console.error(profileError);

    showMessage(
      "Logged in, but your profile could not be loaded.",
      true
    );

    setLoading(
      loginBtn,
      false,
      "",
      "Login"
    );

    return;
  }

  const role =
    profile?.role ||
    data.user.user_metadata?.role ||
    "customer";

  showMessage("Login successful. Redirecting...");

  redirectByRole(role);
}

/* =========================================================
   ROLE REDIRECTS
   ========================================================= */

function redirectByRole(role){

  if(role === "provider"){
    location.replace("provider.html");
    return;
  }

  if(role === "business"){
    location.replace("business-deals.html");
    return;
  }

  location.replace("customer.html");
}

/* =========================================================
   BUTTONS
   ========================================================= */

signupBtn.addEventListener("click", signup);
loginBtn.addEventListener("click", login);

[emailInput,passwordInput].forEach(input => {

  input.addEventListener("keydown", event => {

    if(event.key === "Enter"){
      login();
    }

  });

});

/* =========================================================
   AUTH STATE
   ========================================================= */

db.auth.onAuthStateChange((event) => {

  if(event === "SIGNED_OUT"){
    localStorage.removeItem("zep_selected_role");
  }

});

/* =========================================================
   CHECK CURRENT SESSION
   ========================================================= */

async function checkSession(){

  const {data,error} =
    await db.auth.getSession();

  if(error){
    console.error("Session check error:",error);
    return;
  }

  if(data.session){
    console.log(
      "Zep Swipe session active:",
      data.session.user.id
    );
  }

}

checkSession();
</script>

</body>
</html>
