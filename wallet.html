<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zep Wallet AI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background:#050012;
  color:white;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:linear-gradient(90deg,#00f0ff,#9b5cff);
  color:#000;
  font-weight:bold;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:15px;
}

.card{
  background:rgba(255,255,255,0.06);
  padding:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.1);
}

.big{
  font-size:22px;
  font-weight:bold;
  color:#00ff9d;
}

/* AI BOX */
.ai-box{
  margin-top:15px;
  padding:16px;
  border-radius:14px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.3);
}

/* TRANSACTIONS */
.tx{
  background:rgba(255,255,255,0.05);
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  font-size:14px;
}

.pending{color:yellow;}
.released{color:#00ff9d;}
.disputed{color:#ff4d4d;}

h2,h3{margin:0;}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h2>💳 Zep Wallet AI</h2>
    <button onclick="loadWallet()">Refresh</button>
  </div>

  <!-- AI INSIGHT PANEL -->
  <div class="ai-box">
    <h3>🤖 Zep AI Financial Agent</h3>
    <p id="aiInsight">Analyzing your wallet activity...</p>
  </div>

  <!-- BALANCE -->
  <div class="card">
    <div class="grid">

      <div class="card">
        <p>ZAC Balance</p>
        <div class="big" id="zacBalance">0</div>
      </div>

      <div class="card">
        <p>Cash Balance</p>
        <div class="big" id="cashBalance">0</div>
      </div>

      <div class="card">
        <p>Escrow Locked</p>
        <div class="big" id="pendingEscrow">0</div>
      </div>

    </div>
  </div>

  <!-- TRANSACTIONS -->
  <div class="card">
    <h3>📜 Transactions</h3>
    <div id="transactions"></div>
  </div>

</div>

<script>

/* =========================
   SUPABASE SETUP
========================= */
const supabaseUrl = "https://sqlisgobnayfpzamdolf.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* =========================
   USER
========================= */
let user = null;

/* =========================
   LOAD WALLET
========================= */
async function loadWallet(){

  const { data } = await supabase.auth.getUser();
  user = data.user;

  if(!user){
    window.location.href = "login-signup.html";
    return;
  }

  /* USER WALLET */
  const { data: userData } = await supabase
    .from("users")
    .select("*")
    .eq("auth_id", user.id)
    .single();

  let zac = 0;
  let cash = 0;

  if(userData){
    zac = userData.zac_balance || 0;
    cash = userData.wallet_balance || 0;

    document.getElementById("zacBalance").innerText = zac;
    document.getElementById("cashBalance").innerText = cash;
  }

  /* ESCROW */
  const { data: escrow } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`);

  let pending = 0;

  escrow.forEach(e => {
    if(e.status === "locked" || e.status === "pending"){
      pending += Number(e.amount || 0);
    }
  });

  document.getElementById("pendingEscrow").innerText = pending;

  renderTransactions(escrow);
  runZepAI(zac, cash, pending);
}

/* =========================
   TRANSACTIONS UI
========================= */
function renderTransactions(data){
  const box = document.getElementById("transactions");
  box.innerHTML = "";

  data.forEach(tx => {
    box.innerHTML += `
      <div class="tx">
        <p><b>Amount:</b> ${tx.amount || 0}</p>
        <p><b>Status:</b> <span class="${tx.status}">${tx.status}</span></p>
      </div>
    `;
  });
}

/* =========================
   🤖 ZEP AI WALLET ENGINE
========================= */
function runZepAI(zac, cash, escrow){

  let insight = "";

  const total = Number(cash) + Number(zac);

  if(total === 0){
    insight = "No activity yet. Start applying for gigs to activate your wallet system.";
  }

  else if(escrow > cash){
    insight = "⚠️ High escrow lock detected. Focus on completing active jobs to unlock funds faster.";
  }

  else if(cash > 100){
    insight = "🔥 Strong cash flow detected. You are scaling well in the freelance marketplace.";
  }

  else {
    insight = "Your wallet is active. Keep applying for gigs to increase earnings consistency.";
  }

  document.getElementById("aiInsight").innerText = insight;
}

/* INIT */
loadWallet();

</script>

</body>
</html>
