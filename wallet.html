<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Zep OS 3.8 Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:radial-gradient(circle at 20% 10%, #14001f, #000);
  color:#fff;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:16px;
  margin:16px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
}

.header h2{
  font-family:Orbitron;
  background:linear-gradient(90deg,#00f0ff,#9c4dff,#ff4fd8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

button{
  border:none;
  border-radius:999px;
  padding:10px 14px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  color:#000;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  padding:0 16px;
}

.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  padding:16px;
  border-radius:14px;
}

.big{
  font-size:22px;
  font-weight:bold;
}

.usd{color:#00ff9d;}
.zac{color:#00f0ff;}
.escrow{color:#ffd000;}

.withdraw{
  margin:16px;
  padding:16px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
}

input,select{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.4);
  color:#fff;
}

.tx{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
}

.pending{color:yellow;}
.processing{color:orange;}
.completed{color:#00ff9d;}
.failed{color:red;}
</style>
</head>

<body>

<div class="header">
  <h2>💳 Zep Wallet OS 3.8</h2>
  <button onclick="loadWallet()">Refresh</button>
</div>

<!-- AI -->
<div style="margin:16px;padding:14px;border-radius:14px;background:rgba(255,79,216,0.08);">
  🤖 <span id="ai">Analyzing wallet flow...</span>
</div>

<!-- BALANCES -->
<div class="grid">

  <div class="card">
    <p>USD Balance</p>
    <div class="big usd" id="usd">0</div>
  </div>

  <div class="card">
    <p>ZAC Balance</p>
    <div class="big zac" id="zac">0</div>
  </div>

  <div class="card">
    <p>Escrow</p>
    <div class="big escrow" id="escrow">0</div>
  </div>

</div>

<!-- WITHDRAW -->
<div class="withdraw">

  <h3>Withdraw USD</h3>

  <input type="number" id="amount" placeholder="Amount">

  <select id="country" onchange="setMethods()">
    <option value="">Select Country</option>
    <option value="ZM">Zambia</option>
    <option value="ZA">South Africa</option>
    <option value="GH">Ghana</option>
  </select>

  <select id="method"></select>

  <input id="accName" placeholder="Account Name">
  <input id="accNumber" placeholder="Account Number">

  <button onclick="withdraw()">Withdraw</button>
</div>

<!-- TX -->
<div style="padding:16px;">
  <h3>Transactions</h3>
  <div id="tx"></div>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://zazbdbkoqjxdzisfszeg.supabase.co",
  "YOUR_ANON_KEY"
);

let user = null;

/* SESSION */
async function getUser(){
  const { data } = await supabase.auth.getUser();
  user = data.user;

  if(!user){
    window.location.href = "login-signup.html";
  }
}

/* LOAD WALLET */
async function loadWallet(){

  await getUser();

  const { data: wallet } = await supabase
    .from("users")   // ✅ REQUIRED FIX
    .select("*")
    .eq("id", user.id)
    .single();

  if(!wallet) return;

  document.getElementById("usd").innerText = wallet.usd_balance || 0;
  document.getElementById("zac").innerText = wallet.zac_balance || 0;

  const { data: escrow } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`);

  let total = 0;
  (escrow || []).forEach(e=>{
    if(e.status === "locked" || e.status === "pending"){
      total += Number(e.amount);
    }
  });

  document.getElementById("escrow").innerText = total;

  renderTx(escrow || []);
  aiEngine(wallet.usd_balance, wallet.zac_balance, total);
}

/* METHODS */
function setMethods(){
  const c = document.getElementById("country").value;
  const m = document.getElementById("method");

  m.innerHTML = "";

  if(c === "ZA"){
    m.innerHTML = `
      <option>Capitec</option>
      <option>FNB</option>
      <option>Standard Bank</option>
    `;
  }

  if(c === "ZM"){
    m.innerHTML = `
      <option>MTN Money</option>
      <option>Airtel Money</option>
    `;
  }

  if(c === "GH"){
    m.innerHTML = `
      <option>MTN MoMo</option>
      <option>Vodafone Cash</option>
    `;
  }
}

/* WITHDRAW */
async function withdraw(){

  const amount = Number(document.getElementById("amount").value);

  if(amount < 5){
    alert("Minimum $5");
    return;
  }

  await supabase.from("withdrawals").insert([{
    user_id: user.id,
    amount_usd: amount,
    country: country.value,
    provider: method.value,
    account_name: accName.value,
    account_number: accNumber.value,
    status: "pending"
  }]);

  alert("Withdrawal submitted 🚀");
  loadWallet();
}

/* TX */
function renderTx(data){

  const box = document.getElementById("tx");
  box.innerHTML = "";

  data.forEach(t=>{
    box.innerHTML += `
      <div class="tx">
        <b>$${t.amount}</b> - 
        <span class="${t.status}">${t.status}</span>
      </div>
    `;
  });
}

/* AI */
function aiEngine(usd,zac,escrow){

  let msg = "";

  if(usd > 100){
    msg = "High liquidity detected — fast withdrawal enabled.";
  }
  else if(escrow > usd){
    msg = "Funds locked in escrow — pending release.";
  }
  else{
    msg = "Stable financial activity.";
  }

  document.getElementById("ai").innerText = msg;
}

/* INIT */
loadWallet();
</script>

</body>
</html>
