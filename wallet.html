<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Zep Wallet AI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff9d;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.1);
}

body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:#fff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.header h2{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  font-weight:bold;
}

/* AI BOX */
.ai-box{
  margin:15px 0;
  padding:16px;
  border-radius:14px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.3);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.card{
  background:var(--glass);
  padding:16px;
  border-radius:14px;
  border:1px solid var(--border);
}

.big{
  font-size:22px;
  font-weight:bold;
  color:var(--green);
}

/* TRANSACTIONS */
.tx{
  background:rgba(255,255,255,0.05);
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}

.pending{color:yellow;}
.released{color:var(--green);}
.disputed{color:#ff4d4d;}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h2>💳 Zep Wallet AI</h2>
    <button onclick="loadWallet()">Refresh</button>
  </div>

  <!-- AI -->
  <div class="ai-box">
    <h3>🤖 Zep AI Financial Agent</h3>
    <p id="aiInsight">Analyzing your wallet activity...</p>
  </div>

  <!-- BALANCES -->
  <div class="grid">

    <div class="card">
      <p>ZAC Balance</p>
      <div class="big" id="zacBalance">0</div>
    </div>

    <div class="card">
      <p>Cash Balance</p>
      <div class="big" id="cashBalance">0</div>
    </div>

    <div class="card">
      <p>Escrow Locked</p>
      <div class="big" id="pendingEscrow">0</div>
    </div>

  </div>

  <!-- TRANSACTIONS -->
  <div class="card" style="margin-top:15px;">
    <h3>📜 Transactions</h3>
    <div id="transactions"></div>
  </div>

</div>

<script>
/* ================= SUPABASE ================= */
const supabaseUrl = "https://sqlisgobnayfpzamdolf.supabase.co";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY"; // keep safe in production

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* ================= STATE ================= */
let user = null;

/* ================= LOAD WALLET ================= */
async function loadWallet(){

  const { data: auth } = await supabase.auth.getUser();
  user = auth?.user;

  if(!user){
    window.location.href = "login-signup.html";
    return;
  }

  /* ================= USER DATA ================= */
  const { data: userData } = await supabase
    .from("users")
    .select("*")
    .eq("auth_id", user.id)
    .maybeSingle();

  const zac = userData?.zac_balance || 0;
  const cash = userData?.wallet_balance || 0;

  document.getElementById("zacBalance").innerText = zac;
  document.getElementById("cashBalance").innerText = cash;

  /* ================= ESCROW ================= */
  const { data: escrowData } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`);

  let pending = 0;
  const safeEscrow = escrowData || [];

  safeEscrow.forEach(e=>{
    if(e.status === "locked" || e.status === "pending"){
      pending += Number(e.amount || 0);
    }
  });

  document.getElementById("pendingEscrow").innerText = pending;

  renderTransactions(safeEscrow);
  runZepAI(zac, cash, pending);
}

/* ================= TRANSACTIONS ================= */
function renderTransactions(data){

  const box = document.getElementById("transactions");
  box.innerHTML = "";

  if(!data.length){
    box.innerHTML = "<p>No transactions yet</p>";
    return;
  }

  data.forEach(tx=>{
    box.innerHTML += `
      <div class="tx">
        <p><b>Amount:</b> ${tx.amount || 0}</p>
        <p><b>Status:</b> <span class="${tx.status}">${tx.status}</span></p>
      </div>
    `;
  });
}

/* ================= AI ENGINE ================= */
function runZepAI(zac, cash, escrow){

  const total = Number(zac) + Number(cash);
  let msg = "";

  if(total === 0){
    msg = "No activity yet. Start working to activate your wallet.";
  }
  else if(escrow > cash){
    msg = "⚠️ High escrow detected. Complete jobs to unlock funds faster.";
  }
  else if(cash > 100){
    msg = "🔥 Strong cash flow detected. You're scaling well!";
  }
  else{
    msg = "Your wallet is active. Keep building consistency.";
  }

  document.getElementById("aiInsight").innerText = msg;
}

/* INIT */
loadWallet();
</script>

</body>
</html>
