<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zep Wallet Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .box {
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .big {
      font-size: 22px;
      font-weight: bold;
      color: #22c55e;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      margin-top: 10px;
      width: 100%;
    }

    .tx {
      background: #111827;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .pending { color: yellow; }
    .released { color: #22c55e; }
    .disputed { color: #ef4444; }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>💳 Zep Wallet</h2>
    <button onclick="loadWallet()">Refresh</button>
  </div>

  <!-- BALANCE CARDS -->
  <div class="card">
    <div class="grid">

      <div class="box">
        <p>ZAC Balance</p>
        <div class="big" id="zacBalance">0</div>
      </div>

      <div class="box">
        <p>Cash Balance</p>
        <div class="big" id="cashBalance">0</div>
      </div>

      <div class="box">
        <p>Pending Escrow</p>
        <div class="big" id="pendingEscrow">0</div>
      </div>

    </div>
  </div>

  <!-- TRANSACTIONS -->
  <div class="card">
    <h3>📜 Recent Transactions</h3>
    <div id="transactions"></div>
  </div>

</div>

<script>

const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let user = null;

/* =========================
   GET USER
========================= */
async function getUser() {
  const { data } = await supabase.auth.getUser();
  return data.user;
}

/* =========================
   LOAD WALLET DATA
========================= */
async function loadWallet() {

  user = await getUser();
  if (!user) {
    window.location.href = "/login-signup.html";
    return;
  }

  // GET USER WALLET
  const { data: userData } = await supabase
    .from("users")
    .select("*")
    .eq("auth_id", user.id)
    .single();

  if (userData) {
    document.getElementById("zacBalance").innerText = userData.zac_balance || 0;
    document.getElementById("cashBalance").innerText = userData.wallet_balance || 0;
  }

  // GET ESCROW DATA
  const { data: escrow } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`);

  let pending = 0;

  escrow.forEach(e => {
    if (e.status === "pending") {
      pending += Number(e.amount);
    }
  });

  document.getElementById("pendingEscrow").innerText = pending;

  renderTransactions(escrow);
}

/* =========================
   TRANSACTION UI
========================= */
function renderTransactions(data) {
  const box = document.getElementById("transactions");
  box.innerHTML = "";

  data.forEach(tx => {
    box.innerHTML += `
      <div class="tx">
        <p><b>Amount:</b> ${tx.amount} ZAC</p>
        <p><b>Status:</b> <span class="${tx.status}">${tx.status}</span></p>
      </div>
    `;
  });
}

/* INIT */
loadWallet();

</script>

</body>
</html>
