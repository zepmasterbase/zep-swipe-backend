<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Zep Finance OS 3.3 Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --pink:#ff4fd8;
  --green:#00ff9d;
  --bg:radial-gradient(circle at 25% 10%, #14001f, #000);
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --yellow:#ffd000;
}

body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:#fff;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  margin:16px;
  border-radius:16px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  backdrop-filter:blur(14px);
}

.header h2{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--pink),var(--violet),var(--blue));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  font-weight:bold;
}

/* AI BOX */
.ai-box{
  margin:15px;
  padding:16px;
  border-radius:14px;
  background:rgba(255,79,216,0.08);
  border:1px solid rgba(255,79,216,0.25);
  font-size:13px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  padding:0 16px;
}

.card{
  background:var(--glass);
  padding:16px;
  border-radius:14px;
  border:1px solid var(--border);
}

.big{
  font-size:22px;
  font-weight:bold;
}

.usd{ color:var(--green); }
.zac{ color:var(--blue); }
.escrow{ color:var(--yellow); }

/* WITHDRAW */
.withdraw{
  margin:16px;
  padding:16px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
}

input,select{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.3);
  color:#fff;
}

.withdraw-btn{
  margin-top:10px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--pink),var(--violet),var(--blue));
  color:#000;
  font-weight:bold;
}

/* TX */
.tx{
  background:rgba(255,255,255,0.05);
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
}

.pending{color:yellow;}
.processing{color:orange;}
.completed{color:var(--green);}
.failed{color:#ff4d4d;}
</style>
</head>

<body>

<div class="header">
  <h2>💳 Zep Finance</h2>
  <button onclick="loadWallet()">Refresh</button>
</div>

<!-- AI ENGINE -->
<div class="ai-box">
  <h3>🤖 AI Finance Engine</h3>
  <p id="aiInsight">Analyzing USD flow, escrow, and withdrawal readiness...</p>
</div>

<!-- BALANCES -->
<div class="grid">

  <div class="card">
    <p>💵 USD Balance</p>
    <div class="big usd" id="usdBalance">0</div>
  </div>

  <div class="card">
    <p>🪙 ZAC Balance</p>
    <div class="big zac" id="zacBalance">0</div>
  </div>

  <div class="card">
    <p>🧾 USD Escrow</p>
    <div class="big escrow" id="escrowBalance">0</div>
  </div>

</div>

<!-- WITHDRAW SECTION -->
<div class="withdraw">

  <h3>💸 Withdraw USD</h3>

  <input type="number" id="amount" placeholder="Amount in USD">

  <select id="country" onchange="updateMethods()">
    <option value="">Select Country</option>
    <option value="ZM">Zambia</option>
    <option value="ZA">South Africa</option>
  </select>

  <select id="method"></select>

  <input type="text" id="accountName" placeholder="Account Name / Mobile Name">
  <input type="text" id="accountNumber" placeholder="Account / Mobile Number">

  <button class="withdraw-btn" onclick="withdraw()">Withdraw Now</button>

</div>

<!-- TRANSACTIONS -->
<div class="card" style="margin:16px;">
  <h3>📜 Transactions</h3>
  <div id="transactions"></div>
</div>

<script>

const supabaseUrl = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let user = null;

/* LOAD WALLET */
async function loadWallet(){

  const { data: auth } = await supabase.auth.getUser();
  user = auth?.user;

  if(!user){
    window.location.href = "login.html";
    return;
  }

  const { data: userData } = await supabase
    .from("users")
    .select("*")
    .eq("auth_id", user.id)
    .maybeSingle();

  const usd = userData?.usd_balance || 0;
  const zac = userData?.zac_balance || 0;

  document.getElementById("usdBalance").innerText = usd;
  document.getElementById("zacBalance").innerText = zac;

  const { data: escrow } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`);

  let totalEscrow = 0;

  (escrow || []).forEach(e=>{
    if(e.status === "pending" || e.status === "locked"){
      totalEscrow += Number(e.amount || 0);
    }
  });

  document.getElementById("escrowBalance").innerText = totalEscrow;

  renderTx(escrow || []);
  runAI(usd, zac, totalEscrow);
}

/* WITHDRAW METHODS */
function updateMethods(){

  const country = document.getElementById("country").value;
  const method = document.getElementById("method");

  method.innerHTML = "";

  if(country === "ZM"){
    method.innerHTML = `
      <option>Airtel Money</option>
      <option>MTN Money</option>
      <option>Zamtel Money</option>
    `;
  }

  if(country === "ZA"){
    method.innerHTML = `
      <option>Capitec Bank</option>
      <option>FNB</option>
      <option>Standard Bank</option>
      <option>Absa</option>
    `;
  }
}

/* WITHDRAW */
async function withdraw(){

  const amount = Number(document.getElementById("amount").value);
  const country = document.getElementById("country").value;
  const method = document.getElementById("method").value;
  const accountName = document.getElementById("accountName").value;
  const accountNumber = document.getElementById("accountNumber").value;

  if(amount < 5){
    alert("Minimum withdrawal is $5");
    return;
  }

  await supabase.from("withdrawals").insert([{
    user_id: user.id,
    amount_usd: amount,
    country,
    provider: method,
    account_name: accountName,
    account_number: accountNumber,
    status: "pending",
    created_at: new Date().toISOString()
  }]);

  alert("Withdrawal submitted 🚀 Processing...");
  loadWallet();
}

/* TRANSACTIONS */
function renderTx(data){

  const box = document.getElementById("transactions");
  box.innerHTML = "";

  if(!data.length){
    box.innerHTML = "<p>No transactions yet</p>";
    return;
  }

  data.forEach(tx=>{
    box.innerHTML += `
      <div class="tx">
        <p><b>USD:</b> $${tx.amount || 0}</p>
        <p><b>Status:</b> <span class="${tx.status}">${tx.status}</span></p>
      </div>
    `;
  });
}

/* AI ENGINE */
function runAI(usd, zac, escrow){

  let msg = "";

  if(usd > 100){
    msg = "🔥 Strong USD income detected. Eligible for fast withdrawal.";
  }
  else if(escrow > usd){
    msg = "⚠️ High escrow detected. Wait for completion before withdrawing.";
  }
  else{
    msg = "Your financial flow is stable. Keep earning.";
  }

  document.getElementById("aiInsight").innerText = msg;
}

loadWallet();

</script>

</body>
</html>
