<!DOCTYPE html>
<html>
<head>
  <title>Zep Wallet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial; background:#0f172a; color:white; padding:20px; }
    .card { background:#1e293b; padding:15px; margin:10px 0; border-radius:10px; }
    .balance { font-size:30px; font-weight:bold; color:#22c55e; }
    .tx { border-bottom:1px solid #334155; padding:10px 0; }
    .credit { color:lime; }
    .debit { color:red; }
  </style>
</head>

<body>

<h2>💳 My Wallet</h2>

<div class="card">
  <p>Available Balance</p>
  <div class="balance" id="balance">0 ZAC</div>
</div>

<div class="card">
  <h3>📜 Transaction Ledger</h3>
  <div id="ledger"></div>
</div>

<script>

const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// GET USER
async function getUser() {
  const { data } = await supabase.auth.getUser();
  return data.user;
}

// LOAD WALLET BALANCE
async function loadWallet() {
  const user = await getUser();
  if (!user) return;

  const { data } = await supabase
    .from("users")
    .select("zac_balance")
    .eq("auth_id", user.id)
    .single();

  if (data) {
    document.getElementById("balance").innerText = data.zac_balance + " ZAC";
  }
}

// LOAD TRANSACTIONS (ESCROW + ACTIVITY)
async function loadLedger() {
  const user = await getUser();
  if (!user) return;

  const { data } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`)
    .order("created_at", { ascending: false });

  const ledger = document.getElementById("ledger");
  ledger.innerHTML = "";

  data.forEach(tx => {

    let type = "debit";

    if (tx.status === "released" && tx.seller_id === user.id) {
      type = "credit";
    }

    if (tx.status === "released" && tx.buyer_id === user.id) {
      type = "debit";
    }

    ledger.innerHTML += `
      <div class="tx">
        <p><b>Amount:</b> ${tx.amount} ZAC</p>
        <p><b>Status:</b> ${tx.status}</p>
        <p class="${type}">
          ${type === "credit" ? "+" : "-"} ${tx.amount} ZAC
        </p>
      </div>
    `;
  });
}

// REAL-TIME ESCROW UPDATE → WALLET AUTO REFRESH
function listenEscrowUpdates() {
  supabase
    .channel('escrow-channel')
    .on(
      'postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'escrow' },
      payload => {
        console.log("Escrow updated:", payload);
        loadWallet();
        loadLedger();
      }
    )
    .subscribe();
}

// INIT
async function init() {
  await loadWallet();
  await loadLedger();
  listenEscrowUpdates();
}

init();

</script>

</body>
</html>
