<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider Dashboard V4</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: system-ui;
  background: #070a09;
  color: white;
}

/* =========================
   HEADER
========================= */
header {
  position: sticky;
  top: 0;
  padding: 12px;
  background: rgba(10,14,12,0.95);
  border-bottom: 1px solid rgba(0,255,140,0.12);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo {
  color:#00ff8c;
  font-weight:700;
}

/* =========================
   CONTAINER
========================= */
.container {
  max-width: 900px;
  margin:auto;
  padding: 14px;
}

/* =========================
   CARD
========================= */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 14px;
  margin-top: 12px;
}

/* =========================
   BUTTONS
========================= */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #00ff8c;
  color: black;
}

.danger {
  background: rgba(255,0,0,0.2);
  color: white;
}

/* =========================
   GRID
========================= */
.grid {
  display:grid;
  grid-template-columns: repeat(2,1fr);
  gap:10px;
}

/* =========================
   METRICS
========================= */
.metric {
  background: rgba(0,255,140,0.05);
  border: 1px solid rgba(0,255,140,0.1);
  border-radius: 12px;
  padding: 12px;
}

.metric h2 {
  margin: 0;
  color: #00ff8c;
}

/* =========================
   STATUS
========================= */
.status-online {
  color:#00ff8c;
  font-weight:700;
}

.status-offline {
  color:#ff4d4d;
  font-weight:700;
}

/* =========================
   JOB LIST
========================= */
.job {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.small {
  font-size: 12px;
  opacity: 0.7;
}

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Provider Dashboard V4</div>
  <div id="statusText" class="status-online">ONLINE</div>
</header>

<div class="container">

  <!-- =========================
       SUMMARY
  ========================== -->
  <div class="card">

    <h3>💰 Earnings Overview</h3>

    <div class="grid">

      <div class="metric">
        <h2>R0</h2>
        <p class="small">Today</p>
      </div>

      <div class="metric">
        <h2>R0</h2>
        <p class="small">This Week</p>
      </div>

    </div>

  </div>

  <!-- =========================
       ONLINE/OFFLINE
  ========================== -->
  <div class="card">

    <h3>🟢 Availability</h3>

    <button id="toggleBtn" class="primary" onclick="toggleStatus()">
      Go Offline
    </button>

    <p class="small">
      When offline, you will not receive jobs.
    </p>

  </div>

  <!-- =========================
       ACTIVE JOBS
  ========================== -->
  <div class="card">

    <h3>📦 Active Jobs</h3>
    <div id="activeJobs" class="small">No active jobs</div>

  </div>

  <!-- =========================
       COMPLETED JOBS
  ========================== -->
  <div class="card">

    <h3>✅ Completed Jobs</h3>
    <div id="completedJobs" class="small">No completed jobs yet</div>

  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isOnline = true;

/* =========================
   TOGGLE STATUS
========================= */
async function toggleStatus(){

  isOnline = !isOnline;

  const statusText = document.getElementById("statusText");
  const btn = document.getElementById("toggleBtn");

  if(isOnline){

    statusText.innerText = "ONLINE";
    statusText.className = "status-online";

    btn.innerText = "Go Offline";
    btn.className = "primary";

  } else {

    statusText.innerText = "OFFLINE";
    statusText.className = "status-offline";

    btn.innerText = "Go Online";
    btn.className = "danger";
  }

  // Update DB (optional)
  await client
    .from("service_profiles")
    .update({ online: isOnline })
    .eq("phone", getPhone());
}

/* =========================
   GET PHONE (TEMP ID)
========================= */
function getPhone(){
  return localStorage.getItem("provider_phone") || "";
}

/* =========================
   LOAD JOBS
========================= */
async function loadJobs(){

  const phone = getPhone();

  const { data } = await client
    .from("service_requests")
    .select("*")
    .eq("matched_provider", phone);

  const active = data?.filter(j => j.status !== "completed") || [];
  const completed = data?.filter(j => j.status === "completed") || [];

  renderJobs(active, completed);
}

/* =========================
   RENDER
========================= */
function renderJobs(active, completed){

  const activeBox = document.getElementById("activeJobs");
  const completedBox = document.getElementById("completedJobs");

  activeBox.innerHTML = active.length
    ? active.map(j => `
      <div class="job">
        <b>${j.category}</b><br>
        ${j.description}<br>
        <span class="small">${j.location}</span>
      </div>
    `).join("")
    : "No active jobs";

  completedBox.innerHTML = completed.length
    ? completed.map(j => `
      <div class="job">
        <b>${j.category}</b> - Completed
      </div>
    `).join("")
    : "No completed jobs yet";
}

/* =========================
   REAL TIME UPDATE
========================= */
client
  .channel('service_requests')
  .on('postgres_changes',
    { event: '*', schema: 'public', table: 'service_requests' },
    () => loadJobs()
  )
  .subscribe();

/* INIT */
loadJobs();

</script>

</body>
</html>
