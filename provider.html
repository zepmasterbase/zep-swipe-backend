<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Provider V42 Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--border:#262626;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px}
.header{position:sticky;top:0;background:#0b0b0bee;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(184,255,59,.15);display:flex;align-items:center;justify-content:center;color:#b8ff3b}
.actions{display:flex;gap:10px}
.iconbtn{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:#141414;color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;top:-4px;right:-4px;background:#ff3b30;color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center}
.hero,.card{background:#141414;border:1px solid var(--border);border-radius:20px;margin:16px;padding:16px}
.hero{background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.85)),url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:#101010;border:1px solid var(--border);border-radius:14px;padding:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px 0}
.nav a{display:flex;flex-direction:column;align-items:center;color:#fff;text-decoration:none;font-size:12px}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#b8ff3b;color:#000;font-weight:800;margin-top:10px}
</style>
</head>
<body>

<div class="header">
<div class="brand">
<div class="logo"><i data-lucide="zap"></i></div>
<div>
<b style="color:#b8ff3b">Zep Swipe</b>
<div style="font-size:12px;color:#aaa">Provider Dashboard</div>
</div>
</div>

<div class="actions">
<button class="iconbtn">
<i data-lucide="bell"></i>
<span class="badge">3</span>
</button>
<button class="iconbtn">
<i data-lucide="log-out"></i>
</button>
</div>
</div>

<div class="hero">
<h2>Welcome Back 👋</h2>
<p>Turn your skills into income today.</p>
<h1 style="color:#b8ff3b">R0.00</h1>
<button class="btn"><i data-lucide="banknote-arrow-up"></i> Withdraw Earnings</button>
</div>

<div class="card">
<h3><i data-lucide="rocket"></i> Refer & Earn MARI</h3>
<p>Earn 25 MARI per referral.</p>
<button class="btn"><i data-lucide="copy"></i> Copy Referral Link</button>
</div>

<div class="card">
<div class="grid">
<div class="stat"><i data-lucide="briefcase-business"></i><h3>0</h3><small>Services</small></div>
<div class="stat"><i data-lucide="clipboard-list"></i><h3>0</h3><small>Jobs</small></div>
<div class="stat"><i data-lucide="star"></i><h3>0</h3><small>Reviews</small></div>
<div class="stat"><i data-lucide="bell-ring"></i><h3>0</h3><small>Alerts</small></div>
</div>
</div>

<div class="nav">
<a href="index.html"><i data-lucide="layout-dashboard"></i><span>Home</span></a>
<a href="marketplace.html"><i data-lucide="store"></i><span>Marketplace</span></a>
<a href="#create"><i data-lucide="square-plus"></i><span>Create</span></a>
<a href="#wallet"><i data-lucide="landmark"></i><span>Withdraw</span></a>
<a href="#profile"><i data-lucide="circle-user-round"></i><span>Profile</span></a>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
