
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zep Swipe Provider Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#070707;color:#fff;font-family:Inter,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:24px}
.card{background:#121212;border:1px solid #2a2a2a;border-radius:18px;padding:20px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
input,select{width:100%;padding:12px;margin:8px 0;background:#0f0f0f;color:#fff;border:1px solid #2a2a2a;border-radius:10px}
button{background:#b8ff3b;color:#000;border:none;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Zep Swipe Provider Dashboard</h1>

<div class="grid">
<div class="card">
<h2>Wallet</h2>
<h1>R <span id="balance">0.00</span></h1>
<button onclick="showWithdraw()">Withdraw Funds</button>
</div>

<div class="card">
<h2>Bank Account Management</h2>

<input id="holder" placeholder="Account Holder Name">
<select id="bank">
<option value="">Select Bank</option>
<option>ABSA</option>
<option>Capitec</option>
<option>FNB</option>
<option>Nedbank</option>
<option>Standard Bank</option>
<option>TymeBank</option>
<option>Discovery Bank</option>
</select>

<input id="account_number" placeholder="Account Number">
<select id="account_type">
<option>Savings</option>
<option>Cheque</option>
<option>Business</option>
</select>

<input id="branch_code" placeholder="Branch Code (Optional)">
<button onclick="saveBank()">Save Bank Details</button>

<p class="small">Your bank details are securely stored and used for withdrawals.</p>
</div>
</div>

<div class="card">
<h2>Withdrawal History</h2>
<table width="100%">
<thead><tr><th align="left">Date</th><th align="left">Amount</th><th align="left">Status</th></tr></thead>
<tbody id="history"></tbody>
</table>
</div>
</div>

<div id="withdrawModal" style="display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center">
<div style="background:#121212;padding:20px;border-radius:16px;max-width:450px;width:90%">
<h2>Withdrawal Request</h2>
<p id="savedBank">Loading bank...</p>
<input id="amount" type="number" placeholder="Withdrawal Amount">
<input id="reference" placeholder="Reference (optional)">
<button onclick="submitWithdrawal()">Submit Withdrawal</button>
<button onclick="hideWithdraw()">Cancel</button>
</div>
</div>

<script>
const db=supabase.createClient("YOUR_SUPABASE_URL","YOUR_SUPABASE_ANON_KEY");
let sessionUser=null;
let bankId=null;

async function init(){
 const {data:{session}}=await db.auth.getSession();
 if(!session)return;
 sessionUser=session.user;
 await loadProfile();
 await loadBank();
 await loadHistory();
}

async function loadProfile(){
 const {data}=await db.from("profiles").select("balance").eq("id",sessionUser.id).single();
 document.getElementById("balance").textContent=(data?.balance||0).toFixed(2);
}

async function saveBank(){
 const payload={
 user_id:sessionUser.id,
 holder_name:holder.value,
 bank_name:bank.value,
 account_number:account_number.value,
 account_type:account_type.value,
 branch_code:branch_code.value
 };
 if(bankId){
   await db.from("bank_accounts").update(payload).eq("id",bankId);
 }else{
   const {data,error}=await db.from("bank_accounts").insert(payload).select().single();
   if(error){alert(error.message);return;}
   bankId=data.id;
 }
 alert("Bank details saved.");
}

async function loadBank(){
 const {data}=await db.from("bank_accounts").select("*").eq("user_id",sessionUser.id).maybeSingle();
 if(!data)return;
 bankId=data.id;
 holder.value=data.holder_name||"";
 bank.value=data.bank_name||"";
 account_number.value=data.account_number||"";
 account_type.value=data.account_type||"Savings";
 branch_code.value=data.branch_code||"";
 savedBank.innerHTML="<b>"+data.bank_name+"</b><br>"+data.account_number;
}

function showWithdraw(){withdrawModal.style.display="flex";}
function hideWithdraw(){withdrawModal.style.display="none";}

async function submitWithdrawal(){
 if(!bankId){alert("Please save your bank account first.");return;}
 const amt=Number(amount.value);
 if(amt<50){alert("Minimum withdrawal is R50");return;}
 const {error}=await db.from("withdrawals").insert({
 user_id:sessionUser.id,
 bank_account_id:bankId,
 amount:amt,
 reference:reference.value,
 status:"pending"
 });
 if(error){alert(error.message);return;}
 alert("Withdrawal submitted.");
 hideWithdraw();
 loadHistory();
}

async function loadHistory(){
 const {data}=await db.from("withdrawals").select("*").eq("user_id",sessionUser.id).order("created_at",{ascending:false});
 history.innerHTML="";
 (data||[]).forEach(w=>{
 history.innerHTML+=`<tr><td>${new Date(w.created_at).toLocaleDateString()}</td><td>R ${Number(w.amount).toFixed(2)}</td><td>${w.status}</td></tr>`;
 });
}
init();
</script>
</body>
</html>
