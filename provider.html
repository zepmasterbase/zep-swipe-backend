<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   DESIGN SYSTEM (MATCH MARKETPLACE)
========================= */
:root{
  --bg:#070707;
  --card:#141414;
  --accent:#b8ff3b;
  --text:#ffffff;
  --muted:#aaa;
  --border:#262626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  padding-bottom:80px;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:var(--accent);
  font-weight:800;
}

/* CONTAINER */
.wrap{
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* CARDS */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-top:14px;
}

/* INPUTS */
input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0b0b;
  color:#fff;
  outline:none;
}

/* BUTTONS */
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:var(--accent);
  color:black;
}

.danger{
  background:#ff3b3b33;
  color:#fff;
}

/* DASHBOARD */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.metric{
  background:rgba(184,255,59,.06);
  border:1px solid rgba(184,255,59,.15);
  padding:12px;
  border-radius:12px;
}

.metric h2{
  color:var(--accent);
}

/* STATUS */
.status-online{
  color:var(--accent);
  font-weight:700;
}

.status-offline{
  color:#ff4d4d;
  font-weight:700;
}

.hidden{display:none}

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Provider Dashboard</div>
  <div id="statusText" class="status-online">ONLINE</div>
</header>

<div class="wrap">

<!-- =========================
     SIGNUP / PROFILE SETUP
========================= -->
<div class="card" id="setupBox">

  <h2>🚀 Become a Provider</h2>
  <p style="color:#aaa;font-size:13px;">Set up your earning profile</p>

  <input id="name" placeholder="Full Name">
  <input id="service" placeholder="Service (e.g Tutoring)">
  <input id="description" placeholder="Short Description">

  <select id="price">
    <option>R50</option>
    <option>R100</option>
    <option>R200</option>
    <option>Negotiable</option>
  </select>

  <input id="location" placeholder="Location">
  <input id="whatsapp" placeholder="WhatsApp Number">

  <button class="primary" onclick="createProvider()">
    Go Live
  </button>

</div>

<!-- =========================
     DASHBOARD
========================= -->
<div class="card hidden" id="dashboard">

  <h2>💰 Earnings Overview</h2>

  <div class="grid">

    <div class="metric">
      <h2 id="totalEarnings">R0</h2>
      <p style="color:#aaa;font-size:12px;">Total Earnings</p>
    </div>

    <div class="metric">
      <h2 id="pendingEarnings">R0</h2>
      <p style="color:#aaa;font-size:12px;">Pending</p>
    </div>

  </div>
</div>

<!-- =========================
     ONLINE/OFFLINE
========================= -->
<div class="card hidden" id="statusBox">

  <h3>🟢 Availability</h3>

  <button id="toggleBtn" class="primary" onclick="toggleStatus()">
    Go Offline
  </button>

</div>

<!-- =========================
     JOBS
========================= -->
<div class="card hidden" id="jobsBox">

  <h3>📦 Incoming Jobs</h3>
  <p style="color:#aaa;font-size:13px;">No jobs yet</p>

</div>

</div>

<script>

/* =========================
   SUPABASE CONFIG
========================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* STATE */
let isOnline = true;

/* =========================
   CREATE PROVIDER PROFILE
========================= */
async function createProvider(){

const data = {
  name: name.value,
  service: service.value,
  description: description.value,
  price: price.value,
  location: location.value,
  whatsapp: whatsapp.value,
  online: true,
  created_at: new Date()
};

const {error} = await client
.from("providers")
.insert([data]);

if(error){
alert("Error creating provider");
return;
}

/* SAVE SESSION */
localStorage.setItem("provider", JSON.stringify(data));

showDashboard();
}

/* =========================
   SHOW DASHBOARD
========================= */
function showDashboard(){

setupBox.classList.add("hidden");
dashboard.classList.remove("hidden");
statusBox.classList.remove("hidden");
jobsBox.classList.remove("hidden");
}

/* =========================
   TOGGLE STATUS
========================= */
async function toggleStatus(){

isOnline = !isOnline;

const statusText = document.getElementById("statusText");
const btn = document.getElementById("toggleBtn");

if(isOnline){
  statusText.innerText = "ONLINE";
  statusText.className = "status-online";
  btn.innerText = "Go Offline";
  btn.className = "danger";
} else {
  statusText.innerText = "OFFLINE";
  statusText.className = "status-offline";
  btn.innerText = "Go Online";
  btn.className = "primary";
}

}

</script>

</body>
</html>
