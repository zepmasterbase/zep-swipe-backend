<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Provider V90</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--line:#262626;--accent:#b8ff3b}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:var(--bg);color:#fff;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.hero{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.85)),url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:#101010;border:1px solid var(--line);border-radius:14px;padding:12px}
input,textarea,select{width:100%;padding:12px;margin-top:10px;background:#101010;color:#fff;border:1px solid var(--line);border-radius:10px}
button{width:100%;padding:12px;margin-top:10px;background:var(--accent);border:none;border-radius:10px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px}
nav a{color:#fff;text-decoration:none;font-size:12px}
</style>
</head>
<body>

<section class="card hero">
<h2 id="welcome">Welcome Provider</h2>
<p>Publish services, manage jobs and grow your earnings.</p>
<h1 id="cashBalance">R0.00</h1>
<p id="mariBalance">0 MARI</p>
</section>

<section class="card">
<div class="grid">
<div class="tile"><b id="activeJobs">0</b><br>Active Jobs</div>
<div class="tile"><b id="completedJobs">0</b><br>Completed</div>
<div class="tile"><b id="serviceCount">0</b><br>Services</div>
<div class="tile"><b id="rating">New</b><br>Rating</div>
</div>
</section>

<section class="card">
<h3>Profile</h3>
<input id="fullName" placeholder="Full Name">
<input id="university" placeholder="University">
<textarea id="bio" placeholder="Bio"></textarea>
<button id="saveProfile">Save Profile</button>
</section>

<section class="card">
<h3>Create Service</h3>
<select id="category">
<option>Graphic Design</option>
<option>Tutoring</option>
<option>Photography</option>
</select>
<input id="title" placeholder="Service Title">
<input id="price" type="number" placeholder="Price">
<textarea id="description" placeholder="Description"></textarea>
<button id="publishService">Publish Service</button>
</section>

<section class="card">
<h3>My Services</h3>
<div id="services"></div>
</section>

<nav>
<a href="index.html">Home</a>
<a href="marketplace.html">Marketplace</a>
<a href="#top">Profile</a>
</nav>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function init(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){ location.replace("auth.html"); return; }
 document.getElementById("welcome").textContent="Welcome, "+(session.user.email||"Provider");

 const {data:profile}=await db.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
 if(profile){
   fullName.value=profile.full_name||"";
   university.value=profile.university||"";
   bio.value=profile.bio||"";
 }

 loadServices(session.user.id);
}

async function loadServices(uid){
 const {data}=await db.from("services").select("*").eq("provider_id",uid).order("created_at",{ascending:false});
 serviceCount.textContent=(data||[]).length;
 services.innerHTML="";
 (data||[]).forEach(s=>{
   services.innerHTML+=`<div class="tile"><b>${s.title}</b><br>R${s.price}<br>${s.category||""}</div>`;
 });
}

init();
</script>
</body>
</html>
