<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider Dashboard V6</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #0b0f0d;
  color: white;
}

/* =========================
   HEADER
========================= */
header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  background: rgba(10,14,12,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,255,140,0.15);
}

.logo {
  font-weight: 700;
  color: #00ff8c;
}

/* =========================
   ONLINE TOGGLE
========================= */
.toggle {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 20px;
  cursor: pointer;
  background: rgba(255,255,255,0.08);
}

.online { color: #00ff8c; }
.offline { color: orange; }

/* =========================
   CONTAINER
========================= */
.container {
  max-width: 900px;
  margin: auto;
  padding: 12px;
}

/* =========================
   STATS
========================= */
.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 12px;
}

/* =========================
   HEADINGS
========================= */
h3 {
  margin: 14px 0 8px;
  font-size: 14px;
  color: #00ff8c;
}

/* =========================
   JOB CARD
========================= */
.job {
  background: rgba(255,255,255,0.03);
  border-radius: 14px;
  padding: 12px;
  margin-top: 10px;
  border: 1px solid rgba(255,255,255,0.06);
}

.meta {
  font-size: 12px;
  opacity: 0.7;
}

/* =========================
   BUTTONS
========================= */
button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-weight: 700;
  cursor: pointer;
}

.accept {
  background: #00ff8c;
  color: black;
}

.decline {
  background: rgba(255,255,255,0.08);
  color: white;
}

/* =========================
   RANK SYSTEM
========================= */
.rank {
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 20px;
  display: inline-block;
}

.bronze { background:#cd7f32; color:black; }
.silver { background:#c0c0c0; color:black; }
.gold { background:#ffd700; color:black; }
.founder { background:#00ff8c; color:black; }

/* =========================
   MOBILE
========================= */
@media(max-width:600px){
  .stats { grid-template-columns: 1fr 1fr; }
}

</style>
</head>

<body>

<header>
  <div class="logo">🧑‍💻 Provider Dashboard V6</div>

  <div class="toggle" onclick="toggleOnline()">
    Status: <span id="status" class="offline">OFFLINE</span>
  </div>
</header>

<div class="container">

  <!-- STATS -->
  <div class="stats">

    <div class="card">
      <h3>💰 Earnings</h3>
      <p>R 0.00</p>
    </div>

    <div class="card">
      <h3>⭐ Rank</h3>
      <p id="rank" class="rank bronze">BRONZE</p>
    </div>

    <div class="card">
      <h3>⚡ Points</h3>
      <p id="points">0</p>
    </div>

    <div class="card">
      <h3>📦 Jobs</h3>
      <p id="jobsDone">0</p>
    </div>

  </div>

  <!-- LIVE JOBS -->
  <h3>⚡ Live Jobs</h3>
  <div id="jobs"></div>

  <!-- MATCHED JOBS -->
  <h3>📍 Matched Jobs</h3>
  <div id="matched"></div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let provider = {
  id: "demo",
  available: false,
  points: 0,
  jobsDone: 0
};

/* =========================
   ONLINE/OFFLINE TOGGLE
========================= */
async function toggleOnline(){

  provider.available = !provider.available;

  await client
    .from("providers")
    .update({ available: provider.available })
    .eq("id", provider.id);

  const status = document.getElementById("status");

  if(provider.available){
    status.innerText = "ONLINE";
    status.className = "online";
  } else {
    status.innerText = "OFFLINE";
    status.className = "offline";
  }
}

/* =========================
   LOAD JOBS
========================= */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .eq("status","open")
    .order("created_at",{ascending:false});

  renderJobs(data || []);
}

/* =========================
   LOAD MATCHED JOBS
========================= */
async function loadMatched(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .eq("status","accepted")
    .eq("matched_provider", provider.id);

  renderMatched(data || []);
}

/* =========================
   RENDER JOBS
========================= */
function renderJobs(jobs){

  const box = document.getElementById("jobs");
  box.innerHTML = "";

  jobs.forEach(job => {

    box.innerHTML += `
      <div class="job">

        <b>${job.category}</b>
        <p>${job.description}</p>

        <div class="meta">📍 ${job.location}</div>

        <button class="accept" onclick="acceptJob('${job.id}')">
          Accept Job
        </button>

      </div>
    `;
  });
}

/* =========================
   RENDER MATCHED
========================= */
function renderMatched(jobs){

  const box = document.getElementById("matched");
  box.innerHTML = "";

  jobs.forEach(job => {

    box.innerHTML += `
      <div class="job">

        <b>${job.category}</b>
        <p>${job.description}</p>

        <div class="meta">📍 ${job.location}</div>

        <button class="decline" onclick="completeJob('${job.id}')">
          Mark Completed
        </button>

      </div>
    `;
  });
}

/* =========================
   ACCEPT JOB
========================= */
async function acceptJob(id){

  await client
    .from("service_requests")
    .update({
      status: "accepted",
      matched_provider: provider.id
    })
    .eq("id", id);

  provider.points += 10;
  provider.jobsDone += 1;

  updateUI();
  loadJobs();
  loadMatched();
}

/* =========================
   COMPLETE JOB
========================= */
async function completeJob(id){

  await client
    .from("service_requests")
    .update({
      status: "completed"
    })
    .eq("id", id);

  loadMatched();
}

/* =========================
   RANK SYSTEM
========================= */
function getRank(points){
  if(points >= 150) return "founder";
  if(points >= 80) return "gold";
  if(points >= 30) return "silver";
  return "bronze";
}

/* =========================
   UI UPDATE
========================= */
function updateUI(){

  document.getElementById("points").innerText = provider.points;
  document.getElementById("jobsDone").innerText = provider.jobsDone;

  let rank = getRank(provider.points);
  let el = document.getElementById("rank");

  el.className = "rank " + rank;
  el.innerText = rank.toUpperCase();
}

/* =========================
   INIT
========================= */
loadJobs();
loadMatched();
updateUI();

</script>

</body>
</html>
