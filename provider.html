<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider Dashboard V5</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* GLOBAL */
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #070b09;
  color: white;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: rgba(10,15,12,0.92);
  border-bottom: 1px solid rgba(0,255,140,0.15);
  backdrop-filter: blur(10px);
}

.logo {
  font-weight: 700;
  color: #00ff8c;
  font-size: 15px;
}

/* ONLINE TOGGLE */
.toggle {
  background: rgba(255,255,255,0.08);
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
}

.online { color: #00ff8c; }
.offline { color: orange; }

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 12px;
}

/* STATS GRID */
.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.card {
  background: #101814;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 12px;
}

/* HEADINGS */
h3 {
  margin: 0 0 8px 0;
  color: #00ff8c;
  font-size: 14px;
}

/* JOB CARD */
.job {
  background: #0f1412;
  border: 1px solid rgba(255,255,255,0.05);
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.meta {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 5px;
}

/* BUTTONS */
button {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
}

.accept { background: #00ff8c; color: black; }
.decline { background: #222; color: white; }

/* RANK BADGE */
.rank {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 11px;
}

.bronze { background:#cd7f32; color:black; }
.silver { background:#c0c0c0; color:black; }
.gold { background:#ffd700; color:black; }
.founder { background:#00ff8c; color:black; }

/* GRID */
.jobs {
  margin-top: 10px;
}

/* WALLET */
.wallet {
  font-size: 13px;
}

/* MOBILE */
@media(max-width:600px){
  .stats { grid-template-columns: 1fr 1fr; }
}

</style>
</head>

<body>

<header>
  <div class="logo">🧑‍💻 Provider Dashboard V5</div>
  <div class="toggle" onclick="toggleOnline()">
    Status: <span id="status" class="offline">OFFLINE</span>
  </div>
</header>

<div class="container">

  <!-- STATS -->
  <div class="stats">

    <div class="card">
      <h3>💰 Earnings</h3>
      <p>R 0.00</p>
    </div>

    <div class="card">
      <h3>⭐ Rank</h3>
      <p id="rank" class="rank bronze">BRONZE</p>
    </div>

    <div class="card">
      <h3>⚡ Zep Points</h3>
      <p id="points">0</p>
    </div>

    <div class="card">
      <h3>📦 Jobs Done</h3>
      <p id="jobsDone">0</p>
    </div>

  </div>

  <!-- WALLET -->
  <div class="card wallet">
    <h3>💳 Zep Wallet</h3>
    <p>Earn 10 points per job</p>
    <p>Bonus: Fast accept +5 pts</p>
  </div>

  <!-- LIVE JOBS -->
  <h3>⚡ Live Jobs</h3>
  <div id="jobs" class="jobs"></div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let provider = {
  online: false,
  points: 0,
  jobsDone: 0
};

/* RANK SYSTEM */
function getRank(points){
  if(points >= 150) return "founder";
  if(points >= 80) return "gold";
  if(points >= 30) return "silver";
  return "bronze";
}

/* UPDATE UI */
function updateUI(){

  document.getElementById("points").innerText = provider.points;
  document.getElementById("jobsDone").innerText = provider.jobsDone;

  let rank = getRank(provider.points);
  let el = document.getElementById("rank");

  el.className = "rank " + rank;
  el.innerText = rank.toUpperCase();
}

/* ONLINE TOGGLE */
function toggleOnline(){

  provider.online = !provider.online;

  const status = document.getElementById("status");

  if(provider.online){
    status.innerText = "ONLINE";
    status.className = "online";
  } else {
    status.innerText = "OFFLINE";
    status.className = "offline";
  }
}

/* LOAD JOBS */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .eq("status","open")
    .order("created_at",{ascending:false});

  renderJobs(data || []);
}

/* RENDER JOBS */
function renderJobs(jobs){

  const box = document.getElementById("jobs");
  box.innerHTML = "";

  if(jobs.length === 0){
    box.innerHTML = "<p>No jobs available</p>";
    return;
  }

  jobs.forEach(job => {

    box.innerHTML += `
      <div class="job">

        <b>${job.category}</b>
        <p>${job.description}</p>

        <div class="meta">📍 ${job.location}</div>

        <button class="accept" onclick="acceptJob('${job.id}')">
          Accept Job
        </button>

        <button class="decline" onclick="declineJob('${job.id}')">
          Decline
        </button>

      </div>
    `;
  });
}

/* ACCEPT JOB */
async function acceptJob(id){

  await client
    .from("service_requests")
    .update({
      status: "accepted"
    })
    .eq("id", id);

  provider.points += 10;
  provider.jobsDone += 1;

  updateUI();
  loadJobs();

  alert("Job accepted +10 points!");
}

/* DECLINE */
function declineJob(id){
  alert("Job skipped");
}

/* START */
loadJobs();
updateUI();

</script>

</body>
</html>
