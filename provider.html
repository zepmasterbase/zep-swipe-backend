<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider V7</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f0d;
  color: white;
}

/* HEADER */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  position: sticky;
  top:0;
  background: rgba(10,14,12,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,255,140,0.15);
}

.logo { color:#00ff8c; font-weight:700; }

.toggle {
  font-size:12px;
  cursor:pointer;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
}

/* LAYOUT */
.container {
  max-width:900px;
  margin:auto;
  padding:12px;
}

/* TABS */
.tabs {
  display:flex;
  gap:10px;
  margin-top:10px;
}

.tab {
  flex:1;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
  text-align:center;
  cursor:pointer;
}

.active {
  background:#00ff8c;
  color:black;
  font-weight:700;
}

/* CARDS */
.card {
  background:rgba(255,255,255,0.03);
  padding:12px;
  margin-top:10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.06);
}

/* INPUTS */
input, select, textarea {
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#0b0f0d;
  color:white;
}

/* BUTTON */
button {
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

.primary {
  background:#00ff8c;
  color:black;
}

/* JOBS */
.job {
  padding:12px;
  margin-top:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
}

.small {
  font-size:12px;
  opacity:0.7;
}

.rank {
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:12px;
  background:#00ff8c;
  color:black;
}

</style>
</head>

<body>

<header>
  <div class="logo">🧑‍💻 Provider V7</div>

  <div class="toggle" onclick="toggleStatus()">
    Status: <span id="status">OFFLINE</span>
  </div>
</header>

<div class="container">

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" onclick="showTab('profile')">Profile</div>
    <div class="tab" onclick="showTab('services')">Services</div>
    <div class="tab" onclick="showTab('jobs')">Jobs</div>
  </div>

  <!-- PROFILE -->
  <div id="profile" class="card">

    <h3>Create Provider Profile</h3>

    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="WhatsApp Number">
    <input id="location" placeholder="Location">

    <button class="primary" onclick="saveProfile()">
      Save Profile
    </button>

    <p class="small">Your profile will be visible in marketplace listings.</p>

  </div>

  <!-- SERVICES -->
  <div id="services" class="card" style="display:none;">

    <h3>Create Service Listing</h3>

    <select id="category">
      <option>Hair & Beauty</option>
      <option>Cleaning</option>
      <option>Repairs</option>
      <option>Tutoring</option>
      <option>Digital Services</option>
      <option>Food Services</option>
    </select>

    <textarea id="description" placeholder="Describe your service..."></textarea>

    <input id="price" placeholder="Price range (optional)">

    <button class="primary" onclick="saveService()">
      Publish Service
    </button>

    <p class="small">This will appear in the marketplace.</p>

  </div>

  <!-- JOBS -->
  <div id="jobs" style="display:none;">

    <div class="card">
      <h3>Live Jobs</h3>
      <div id="jobList"></div>
    </div>

    <div class="card">
      <h3>Matched Jobs</h3>
      <div id="matchedList"></div>
    </div>

    <div class="card">
      <h3>Rank</h3>
      <span class="rank" id="rank">BRONZE</span>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let provider = {
  id: "demo",
  available: false,
  points: 0,
  jobs: 0
};

/* =========================
   TOGGLE STATUS
========================= */
async function toggleStatus(){

  provider.available = !provider.available;

  document.getElementById("status").innerText =
    provider.available ? "ONLINE" : "OFFLINE";

  await client
    .from("providers")
    .update({ available: provider.available })
    .eq("id", provider.id);
}

/* =========================
   SAVE PROFILE
========================= */
async function saveProfile(){

  await client.from("providers").upsert({
    id: provider.id,
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    location: document.getElementById("location").value
  });

  alert("Profile saved!");
}

/* =========================
   SAVE SERVICE
========================= */
async function saveService(){

  await client.from("service_profiles").insert([{
    provider_id: provider.id,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value,
    price_range: document.getElementById("price").value,
    location: document.getElementById("location").value
  }]);

  alert("Service published to marketplace!");
}

/* =========================
   LOAD JOBS
========================= */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .eq("status","open");

  renderJobs(data || []);
}

/* =========================
   ACCEPT JOB
========================= */
async function acceptJob(id){

  await client
    .from("service_requests")
    .update({
      status:"accepted",
      matched_provider: provider.id
    })
    .eq("id", id);

  provider.points += 10;
  provider.jobs += 1;

  updateRank();
  loadJobs();
}

/* =========================
   RENDER JOBS
========================= */
function renderJobs(jobs){

  const box = document.getElementById("jobList");
  box.innerHTML = "";

  jobs.forEach(j => {

    box.innerHTML += `
      <div class="job">

        <b>${j.category}</b>
        <p>${j.description}</p>
        <div class="small">📍 ${j.location}</div>

        <button class="primary" onclick="acceptJob('${j.id}')">
          Accept Job
        </button>

      </div>
    `;
  });
}

/* =========================
   RANK SYSTEM
========================= */
function updateRank(){

  let rank = "BRONZE";

  if(provider.points >= 150) rank = "FOUNDERS";
  else if(provider.points >= 80) rank = "GOLD";
  else if(provider.points >= 30) rank = "SILVER";

  document.getElementById("rank").innerText = rank;
}

/* =========================
   TAB SWITCH
========================= */
function showTab(tab){

  document.getElementById("profile").style.display = "none";
  document.getElementById("services").style.display = "none";
  document.getElementById("jobs").style.display = "none";

  document.getElementById(tab).style.display = "block";
}

/* INIT */
loadJobs();

</script>

</body>
</html>
