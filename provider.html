<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider V11 Complete</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--text:#fff;--muted:#aaa;--border:#262626;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:100px}
header{position:sticky;top:0;background:#0b0b0b;border-bottom:1px solid var(--border);padding:16px;display:flex;justify-content:space-between}
.logo{color:var(--accent);font-weight:800}
.wrap{max-width:1100px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.box{background:rgba(184,255,59,.08);border:1px solid rgba(184,255,59,.15);padding:14px;border-radius:14px}
input,select,textarea{width:100%;padding:12px;margin-top:10px;border-radius:12px;border:1px solid var(--border);background:#0d0d0d;color:#fff}
.btn{padding:12px;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:10px}
.primary{background:var(--accent);color:#000}
.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.badge{padding:6px 10px;border-radius:999px;background:rgba(184,255,59,.15);color:var(--accent)}
.service{padding:12px;border:1px solid var(--border);border-radius:12px;margin-top:10px}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<header>
<div class="logo">⚡ Zep Swipe Provider V11</div>
<div class="badge">Backend Ready</div>
</header>

<div class="wrap">
<div class="card"><h2>🎓 Student Provider Dashboard</h2><p class="small">Supabase Connected</p></div>

<div class="grid">
<div class="box"><h2 id="availableBalance">R0</h2><p>Available Balance</p></div>
<div class="box"><h2 id="pendingBalance">R0</h2><p>Pending</p></div>
<div class="box"><h2 id="completedJobs">0</h2><p>Completed Jobs</p></div>
<div class="box"><h2 id="rating">5.0⭐</h2><p>Rating</p></div>
</div>

<div class="card">
<h3>🟢 Verification Profile</h3>
<input id="fullName" placeholder="Full Name">
<input id="university" placeholder="University / College">
<input id="studentNumber" placeholder="Student Number">
<input id="whatsapp" placeholder="WhatsApp Number">
<button class="btn primary" onclick="saveProfile()">Save Profile</button>
</div>

<div class="card">
<h3>➕ Create Service</h3>
<input id="serviceName" placeholder="Service Name">
<select id="serviceType">
<option>Hourly</option><option>Fixed Price</option><option>Package</option>
</select>
<input id="servicePrice" placeholder="Price">
<textarea id="serviceDesc" placeholder="Description"></textarea>
<button class="btn primary" onclick="publishService()">Publish Service</button>
</div>

<div class="card"><h3>🛠 My Services</h3><div id="servicesList"></div></div>
<div class="card"><h3>📥 Incoming Requests</h3><div id="requestsList"></div></div>
<div class="card"><h3>💰 Withdrawals</h3><input id="withdrawAmount" placeholder="Amount"><button class="btn primary" onclick="requestWithdrawal()">Request Withdrawal</button></div>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;

async function init(){
 const {data:{session}}=await client.auth.getSession();
 if(session){currentUser=session.user;loadServices();loadRequests();}
}
init();

async function saveProfile(){
 if(!currentUser) return alert("Login first");
 await client.from("providers").upsert([{
 user_id:currentUser.id,
 name:fullName.value,
 university:university.value,
 student_number:studentNumber.value,
 whatsapp:whatsapp.value
 }]);
 alert("Profile saved");
}

async function publishService(){
 if(!currentUser) return alert("Login first");
 await client.from("services").insert([{
 provider_id:currentUser.id,
 service_name:serviceName.value,
 service_type:serviceType.value,
 price:servicePrice.value,
 description:serviceDesc.value,
 active:true
 }]);
 loadServices();
}

async function loadServices(){
 const {data=[]}=await client.from("services").select("*").eq("provider_id",currentUser.id);
 servicesList.innerHTML=data.map(s=>`<div class='service'><b>${s.service_name}</b><br>${s.service_type} • R${s.price||0}</div>`).join("");
}

async function loadRequests(){
 const {data=[]}=await client.from("service_requests").select("*").eq("provider_id",currentUser.id);
 requestsList.innerHTML=data.map(r=>`<div class='service'><b>${r.service_name||"Request"}</b><br>R${r.amount||0}</div>`).join("");
}

async function requestWithdrawal(){
 if(!currentUser) return;
 await client.from("withdrawals").insert([{provider_id:currentUser.id,amount:withdrawAmount.value,status:"pending"}]);
 alert("Withdrawal requested");
}
</script>
</body>
</html>
