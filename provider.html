<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Dashboard V4</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f0d;
  color: white;
}

/* =========================
   HEADER
========================= */
header {
  position: sticky;
  top: 0;
  z-index: 10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background: rgba(10,14,12,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,255,140,0.12);
}

.logo {
  color:#00ff8c;
  font-weight:700;
}

.tabs span {
  font-size:12px;
  padding:6px 10px;
  border-radius:10px;
  background:rgba(255,255,255,0.06);
  cursor:pointer;
  margin-left:6px;
}

/* =========================
   LAYOUT
========================= */
.container {
  max-width: 900px;
  margin:auto;
  padding:14px;
}

/* =========================
   CARD
========================= */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px;
  margin-top: 10px;
}

/* =========================
   INPUTS
========================= */
input, select, textarea {
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#0b0f0d;
  color:white;
}

/* =========================
   BUTTONS
========================= */
button {
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.primary {
  background:#00ff8c;
  color:black;
}

/* =========================
   BADGE
========================= */
.badge {
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:rgba(0,255,140,0.1);
  color:#00ff8c;
  font-size:11px;
}

/* =========================
   HIDE
========================= */
.hidden { display:none; }

.small { font-size:12px; opacity:0.7; }

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Zep Swipe V4</div>

  <div class="tabs">
    <span onclick="show('dashboard')">Dashboard</span>
    <span onclick="show('market')">Market</span>
  </div>
</header>

<div class="container">

  <!-- =========================
       ONBOARDING
  ========================== -->
  <div id="onboard" class="card hidden">

    <h3>🚀 Join Zep Swipe</h3>

    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="WhatsApp Number">
    <input id="location" placeholder="Location">

    <select id="category">
      <option>Academic</option>
      <option>Digital</option>
      <option>Creative</option>
      <option>Technical</option>
      <option>Community</option>
    </select>

    <textarea id="bio" placeholder="What can you do?"></textarea>

    <button class="primary" onclick="createUser()">
      Join Ecosystem
    </button>

  </div>

  <!-- =========================
       DASHBOARD
  ========================== -->
  <div id="dashboard" class="hidden">

    <div class="card">
      <h3>💰 Provider Status</h3>

      <p>
        Status:
        <span class="badge" id="status">OFFLINE</span>
      </p>

      <button class="primary" onclick="toggleOnline()">
        Toggle Online / Offline
      </button>
    </div>

    <div class="card">
      <h3>📊 Stats</h3>
      <p>Jobs Completed: <span id="jobs">0</span></p>
      <p>Points: <span id="points">0</span></p>
    </div>

  </div>

  <!-- =========================
       MARKET
  ========================== -->
  <div id="market" class="hidden">

    <h3>⚡ Live Requests</h3>
    <div id="requests"></div>

    <h3>🛠 Active Providers</h3>
    <div id="providers"></div>

  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let profile = null;

/* =========================
   INIT
========================= */
async function init(){

  user = localStorage.getItem("zep_user");

  if(!user){
    show("onboard");
    return;
  }

  const { data } = await client
    .from("student_profiles")
    .select("*")
    .eq("phone", user)
    .single();

  profile = data;

  if(!profile){
    show("onboard");
  } else {
    show("dashboard");
    loadMarket();
  }
}

init();

/* =========================
   NAV
========================= */
function show(view){

  document.getElementById("onboard").classList.add("hidden");
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("market").classList.add("hidden");

  document.getElementById(view).classList.remove("hidden");
}

/* =========================
   CREATE USER
========================= */
async function createUser(){

  const phone = document.getElementById("phone").value;

  const data = {
    name: document.getElementById("name").value,
    phone,
    location: document.getElementById("location").value,
    category: document.getElementById("category").value,
    bio: document.getElementById("bio").value,
    online: false
  };

  await client.from("student_profiles").insert([data]);

  await client.from("service_profiles").insert([{
    provider_id: phone,
    category: data.category,
    description: data.bio,
    location: data.location,
    phone,
    online: false
  }]);

  localStorage.setItem("zep_user", phone);

  init();
}

/* =========================
   TOGGLE ONLINE
========================= */
async function toggleOnline(){

  profile.online = !profile.online;

  await client
    .from("student_profiles")
    .update({ online: profile.online })
    .eq("phone", user);

  document.getElementById("status").innerText =
    profile.online ? "ONLINE" : "OFFLINE";
}

/* =========================
   LOAD MARKET
========================= */
async function loadMarket(){

  const req = await client.from("service_requests").select("*");
  const prov = await client.from("service_profiles").select("*");

  render(req.data || [], prov.data || []);
}

/* =========================
   AUTO MATCH HOOK (V8 ENGINE READY)
========================= */
async function autoMatchTrigger(request){

  // Placeholder hook for V8 engine
  console.log("Auto matching triggered for:", request.id);
}

/* =========================
   RENDER
========================= */
function render(requests, providers){

  const rBox = document.getElementById("requests");
  const pBox = document.getElementById("providers");

  rBox.innerHTML = "";
  pBox.innerHTML = "";

  requests.forEach(r => {

    rBox.innerHTML += `
      <div class="card">
        <span class="badge">${r.category}</span>
        <p>${r.description}</p>
        <small>📍 ${r.location}</small>
      </div>
    `;
  });

  providers.forEach(p => {

    pBox.innerHTML += `
      <div class="card">
        <span class="badge">${p.category}</span>
        <p>${p.description}</p>
        <small>📍 ${p.location}</small>
      </div>
    `;
  });
}

</script>

</body>
</html>
