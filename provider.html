<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Activation V4</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f0d;
  color: white;
}

/* =========================
   HEADER
========================= */
header {
  padding: 14px;
  text-align: center;
  font-weight: 700;
  color: #00ff8c;
  border-bottom: 1px solid rgba(0,255,140,0.12);
}

/* =========================
   CONTAINER
========================= */
.container {
  max-width: 500px;
  margin: auto;
  padding: 16px;
}

/* =========================
   CARD STYLE
========================= */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 16px;
}

/* =========================
   INPUTS
========================= */
input, select {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #0b0f0d;
  color: white;
}

/* =========================
   BUTTON
========================= */
button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #00ff8c;
  color: black;
}

/* =========================
   SUCCESS SCREEN
========================= */
.success {
  display: none;
  text-align: center;
  padding: 40px 20px;
}

.big {
  font-size: 22px;
  font-weight: 700;
  color: #00ff8c;
}

/* =========================
   HIDE
========================= */
.hidden { display:none; }

.small {
  font-size: 12px;
  opacity: 0.7;
  margin-top: 6px;
}

</style>
</head>

<body>

<header>
  ⚡ Become a Provider in 60 Seconds
</header>

<div class="container">

  <!-- =========================
       FORM
  ========================== -->
  <div id="formCard" class="card">

    <h3>Start Earning in Your Community</h3>

    <p class="small">
      Your profile will appear instantly in the marketplace.
    </p>

    <input id="name" placeholder="Full Name">
    <input id="phone" placeholder="WhatsApp Number">
    <input id="location" placeholder="Location">

    <select id="category">
      <option>Academic Services</option>
      <option>Digital Services</option>
      <option>Creative Services</option>
      <option>Technical Services</option>
      <option>Community Services</option>
    </select>

    <input id="bio" placeholder="What can you do? (e.g Logo design, tutoring)">

    <button class="primary" onclick="goLive()">
      🚀 Go Live Now
    </button>

    <p class="small">
      No approval needed — you go live instantly.
    </p>

  </div>

  <!-- =========================
       SUCCESS
  ========================== -->
  <div id="success" class="success">

    <div class="big">🟢 YOU ARE LIVE!</div>

    <p>Your services are now visible in the marketplace.</p>

    <button class="primary" onclick="window.location.href='marketplace.html'">
      View Marketplace
    </button>

  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   GO LIVE FUNCTION
========================= */
async function goLive(){

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    location: document.getElementById("location").value,
    category: document.getElementById("category").value,
    description: document.getElementById("bio").value,
    online: true,
    rating: 5,
    completed_jobs: 0
  };

  /* SAVE PROFILE */
  await client.from("service_profiles").insert([data]);

  /* SAVE USER PROFILE (optional tracking) */
  await client.from("student_profiles").insert([{
    name: data.name,
    phone: data.phone,
    location: data.location,
    category: data.category,
    bio: data.description,
    online: true
  }]);

  /* SHOW SUCCESS SCREEN */
  document.getElementById("formCard").style.display = "none";
  document.getElementById("success").style.display = "block";
}

</script>

</body>
</html>
