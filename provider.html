<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider V7 Ecosystem</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#070707;
  --card:#141414;
  --accent:#b8ff3b;
  --text:#fff;
  --muted:#aaa;
  --border:#262626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.9);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  color:var(--accent);
  font-weight:800;
}

/* WRAP */
.wrap{
  max-width:720px;
  margin:auto;
  padding:16px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-top:12px;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b0b0b;
  color:white;
  outline:none;
}

/* BUTTON */
.btn{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:var(--accent);
  color:black;
}

.secondary{
  background:transparent;
  border:1px solid var(--accent);
  color:var(--accent);
}

/* DASHBOARD */
.hidden{display:none;}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  background:rgba(184,255,59,0.08);
  border:1px solid rgba(184,255,59,0.2);
  padding:12px;
  border-radius:12px;
}

.status-online{color:var(--accent);font-weight:700;}
.status-offline{color:#ff4d4d;font-weight:700;}

.small{font-size:12px;opacity:0.7;}

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Zep Swipe Provider V7</div>
  <div id="status" class="status-online">ONLINE</div>
</header>

<div class="wrap">

<!-- AUTH -->
<div id="authBox" class="card">

  <h2>Provider Access</h2>
  <p class="small">Login or create your earning profile</p>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="btn primary" onclick="signup()">Create Account</button>
  <button class="btn secondary" onclick="login()">Login</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <div class="card">
    <h2>Provider Dashboard</h2>
    <p class="small">Earnings + Jobs + Services</p>
  </div>

  <!-- PROFILE -->
  <div class="card">

    <h3>📍 Provider Profile</h3>

    <input id="name" placeholder="Full Name">
    <input id="service" placeholder="Skill / Service">
    <input id="location" placeholder="City (e.g Johannesburg)">
    <input id="whatsapp" placeholder="WhatsApp Number">

    <button class="btn primary" onclick="saveProfile()">
      Save Profile
    </button>

  </div>

  <!-- WALLET -->
  <div class="card">

    <h3>💰 Wallet Overview</h3>

    <div class="grid">

      <div class="box">
        <h3 id="earned">R0</h3>
        <p class="small">Total Earned</p>
      </div>

      <div class="box">
        <h3 id="pending">R0</h3>
        <p class="small">Pending</p>
      </div>

    </div>

  </div>

  <!-- JOB STATUS -->
  <div class="card">

    <h3>📦 Job System</h3>
    <p class="small">Ready for incoming requests</p>

  </div>

</div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let sessionUser = null;

/* ================= AUTH ================= */

async function signup(){

  const email = email.value;
  const password = password.value;

  const { error } = await client.auth.signUp({ email, password });

  if(error) return alert(error.message);

  alert("Account created. Please login.");
}

async function login(){

  const { data, error } = await client.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if(error) return alert(error.message);

  sessionUser = data.user;

  sessionStorage.setItem("session", JSON.stringify(sessionUser));

  showDashboard();
}

/* RESTORE SESSION */
function init(){
  const saved = sessionStorage.getItem("session");
  if(saved){
    sessionUser = JSON.parse(saved);
    showDashboard();
  }
}

function showDashboard(){
  authBox.classList.add("hidden");
  dashboard.classList.remove("hidden");
}

/* ================= PROFILE ================= */

async function saveProfile(){

  const { error } = await client.from("providers").upsert([{
    user_id: sessionUser.id,
    name: name.value,
    service: service.value,
    location: location.value,
    whatsapp: whatsapp.value,
    updated_at: new Date()
  }]);

  if(error) return alert(error.message);

  alert("Profile saved successfully 🚀");
}

/* INIT */
init();

</script>

</body>
</html>
