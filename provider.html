<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider Dashboard V4</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050607;
  color: white;
}

/* HEADER */
header {
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:rgba(0,0,0,0.85);
  border-bottom:1px solid rgba(0,255,140,0.2);
}

h2 {
  color:#00ff8c;
}

/* GRID */
.container {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:20px;
}

/* CARD */
.card {
  background:#0b120e;
  border:1px solid rgba(0,255,140,0.15);
  border-radius:12px;
  padding:15px;
}

/* BUTTON */
button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.primary { background:#00ff8c; }
.dark { background:#222; color:white; }

/* STATUS */
.badge {
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  display:inline-block;
}

.open { background:orange; }
.accepted { background:#2196f3; }
.completed { background:gray; }

/* PROFILE */
.profile {
  text-align:center;
}

.avatar {
  width:70px;
  height:70px;
  border-radius:50%;
  background:linear-gradient(45deg,#00ff8c,#0066ff);
  margin:auto;
}

/* LIST */
.job {
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<header>
  <h2>🧑‍💻 Provider Dashboard V4</h2>
  <button onclick="loadJobs()">Refresh</button>
</header>

<div class="container">

  <!-- PROFILE -->
  <div class="card profile">

    <div class="avatar"></div>

    <h3 id="name">Provider</h3>

    <p id="points">Zep Points: 0</p>
    <p id="level">Level: 1</p>

    <button class="primary" onclick="toggleAvailability()">
      Toggle Availability
    </button>

    <button class="dark" onclick="loadJobs()">
      Refresh Jobs
    </button>

  </div>

  <!-- JOB FEED -->
  <div class="card">

    <h3 style="color:#00ff8c;">⚡ Available Jobs</h3>

    <div id="jobs"></div>

  </div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let provider = {
  id: null,
  name: "Demo Provider",
  points: 0,
  available: true
};

/* INIT DEMO PROFILE */
function initProvider(){

  provider.id = "demo-1";
  provider.name = "Student Provider";

  document.getElementById("name").innerText = provider.name;
  updateStats();
}

/* UPDATE STATS */
function updateStats(){

  document.getElementById("points").innerText =
    "Zep Points: " + provider.points;

  document.getElementById("level").innerText =
    "Level: " + Math.floor(provider.points / 50 + 1);
}

/* TOGGLE AVAILABILITY */
function toggleAvailability(){

  provider.available = !provider.available;

  alert(provider.available ? "You are ONLINE" : "You are OFFLINE");
}

/* LOAD JOBS */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .eq("status","open")
    .order("created_at",{ascending:false});

  renderJobs(data || []);
}

/* RENDER JOBS */
function renderJobs(jobs){

  const box = document.getElementById("jobs");
  box.innerHTML = "";

  if(jobs.length === 0){
    box.innerHTML = "<p>No jobs available</p>";
    return;
  }

  jobs.forEach(job => {

    box.innerHTML += `
      <div class="job">

        <b>${job.category}</b>
        <span class="badge open">${job.status}</span>

        <p>${job.description}</p>
        <small>📍 ${job.location}</small>

        <button class="primary" onclick="acceptJob('${job.id}')">
          Accept Job
        </button>

        <button class="dark" onclick="notify('${job.matched_phone}','${job.description}')">
          WhatsApp Alert
        </button>

      </div>
    `;
  });
}

/* ACCEPT JOB */
async function acceptJob(id){

  const { error } = await client
    .from("service_requests")
    .update({
      status: "accepted",
      matched_provider: provider.name
    })
    .eq("id", id);

  if(!error){

    provider.points += 10;
    updateStats();

    alert("Job accepted +10 Zep Points!");
    loadJobs();
  }
}

/* WHATSAPP */
function notify(phone, job){

  if(!phone) return;

  const msg = encodeURIComponent(
    "🚨 Zep Swipe Job:\n\n" + job
  );

  window.open(`https://wa.me/${phone}?text=${msg}`, "_blank");
}

/* START */
initProvider();
loadJobs();

</script>

</body>
</html>
