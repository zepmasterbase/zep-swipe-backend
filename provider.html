<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Provider Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#070707;--card:#121212;--line:#2a2a2a;--accent:#b8ff3b}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:var(--bg);color:#fff;padding-bottom:90px}
.container{max-width:1200px;margin:auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:800}
.hero{position:relative;border-radius:24px;overflow:hidden;background:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1600&auto=format&fit=crop') center/cover;height:360px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.content{position:relative;z-index:2;padding:24px}
.profile{display:flex;gap:18px;align-items:center}
.avatar{width:96px;height:96px;border-radius:50%;border:3px solid var(--accent);object-fit:cover}
.wallet{margin-top:20px;background:#111b;padding:18px;border:1px solid #365509;border-radius:18px;display:grid;grid-template-columns:2fr 1fr;gap:18px}
.balance{font-size:44px;font-weight:800}
.card{margin-top:20px;background:var(--card);padding:18px;border:1px solid var(--line);border-radius:18px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.action{background:#0f0f0f;border:1px solid var(--line);padding:18px;border-radius:14px;text-align:center;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:20px}
.sheet{width:100%;max-width:560px;background:#151515;border:1px solid var(--line);border-radius:18px;padding:20px}
input,textarea,select{width:100%;margin:8px 0;padding:12px;background:#101010;color:#fff;border:1px solid var(--line);border-radius:10px}
button{background:var(--accent);padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0b0b0b;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px}
.nav a{text-decoration:none;color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center}
@media(max-width:768px){.wallet{grid-template-columns:1fr}.profile{flex-wrap:wrap}.hero{height:auto}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="brand"><strong>ZEP SWIPE</strong></div><i data-lucide="bell"></i>
</div>
<section class="hero"><div class="overlay"></div><div class="content">
<div class="profile">
<img id="avatar" class="avatar" src="https://i.pravatar.cc/200?img=12">
<div><h3>Welcome back</h3><h1 id="providerName">Loading...</h1></div>
</div>
<div class="wallet">
<div><div>AVAILABLE BALANCE</div><div class="balance">R <span id="balance">0.00</span></div><button onclick="openWithdraw()">Withdraw Funds</button></div>
<div><h2><span id="mari">0</span> MARI</h2><p>Pending: R<span id="pending">0.00</span></p><p>Total: R<span id="earnings">0.00</span></p></div>
</div>
</div></section>

<div class="card"><h3>Quick Actions</h3>
<div class="actions">
<div class="action" onclick="openPublish()">Publish Service</div>
<div class="action" onclick="location.href='my-services.html'">My Services</div>
<div class="action" onclick="location.href='analytics.html'">Analytics</div>
<div class="action" onclick="openWithdraw()">Wallet</div>
</div></div>
</div>

<div class="modal" id="publishModal"><div class="sheet">
<h2>Publish Service</h2>
<input id="title" placeholder="Service title">
<select id="category"><option>Graphic Design</option><option>Web Development</option><option>Tutoring</option></select>
<textarea id="description" placeholder="Description"></textarea>
<input id="price" type="number" placeholder="Price">
<input id="location" placeholder="Location">
<input id="image" type="file" accept="image/*">
<button onclick="publishService()">Publish</button>
<button onclick="closePublish()">Close</button>
</div></div>

<div class="modal" id="withdrawModal"><div class="sheet">
<h2>Withdrawal Request</h2>
<input placeholder="Amount">
<button onclick="closeWithdraw()">Close</button>
</div></div>

<nav class="nav">
<a href="index.html"><i data-lucide="house"></i><span>Home</span></a>
<a href="marketplace.html"><i data-lucide="badge-percent"></i><span>Deals</span></a>
<a href="#" onclick="openPublish()"><i data-lucide="plus-circle"></i><span>Create</span></a>
<a href="#" onclick="openWithdraw()"><i data-lucide="wallet"></i><span>Wallet</span></a>
<a href="profile.html"><i data-lucide="user"></i><span>Profile</span></a>
</nav>

<script>
const db=supabase.createClient("YOUR_SUPABASE_URL","YOUR_SUPABASE_ANON_KEY");
function openPublish(){publishModal.style.display='flex'}
function closePublish(){publishModal.style.display='none'}
function openWithdraw(){withdrawModal.style.display='flex'}
function closeWithdraw(){withdrawModal.style.display='none'}
async function loadProfile(){
 const {data:{session}}=await db.auth.getSession();
 if(!session)return;
 const {data}=await db.from('profiles').select('*').eq('id',session.user.id).single();
 if(!data)return;
 providerName.textContent=data.full_name||'Provider';
 balance.textContent=(data.balance||0).toFixed(2);
 mari.textContent=data.mari_balance||0;
 pending.textContent=(data.pending_balance||0).toFixed(2);
 earnings.textContent=(data.total_earnings||0).toFixed(2);
 if(data.avatar_url)avatar.src=data.avatar_url;
}
async function publishService(){
 alert("Replace this stub with your services table insert after configuring Supabase.");
}
lucide.createIcons();loadProfile();
</script>
</body></html>
