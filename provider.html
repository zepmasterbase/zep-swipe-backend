<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider V6 (Production)</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   MARKETPLACE MATCH THEME
========================= */
:root{
  --bg:#070707;
  --card:#141414;
  --accent:#b8ff3b;
  --text:#ffffff;
  --muted:#aaaaaa;
  --border:#262626;
}

body {
  margin: 0;
  font-family: system-ui;
  background: var(--bg);
  color: var(--text);
}

/* =========================
   GLOW EFFECT
========================= */
.glow {
  position: fixed;
  width: 260px;
  height: 260px;
  background: var(--accent);
  filter: blur(140px);
  opacity: 0.08;
  border-radius: 50%;
  z-index: 0;
}

.glow:nth-child(1){ top:-120px; left:-80px; }
.glow:nth-child(2){ bottom:-120px; right:-100px; }

/* =========================
   CONTAINER
========================= */
.container {
  max-width: 520px;
  margin:auto;
  padding: 18px;
  position: relative;
  z-index: 2;
}

/* =========================
   CARD
========================= */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-top: 12px;
  transition: 0.3s;
}

.card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
}

/* =========================
   INPUTS
========================= */
input, select {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #0d0d0d;
  color: var(--text);
  outline: none;
}

input:focus, select:focus {
  border-color: var(--accent);
}

/* =========================
   BUTTONS
========================= */
button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s;
}

.primary {
  background: var(--accent);
  color: black;
}

.primary:hover {
  box-shadow: 0 10px 25px rgba(184,255,59,0.15);
  transform: translateY(-2px);
}

.danger {
  background: #2a0f0f;
  color: #ff4d4d;
  border: 1px solid #ff4d4d;
}

/* =========================
   HEADER TEXT
========================= */
h2,h3 {
  color: var(--accent);
}

.small {
  font-size: 12px;
  color: var(--muted);
}

.hidden { display:none; }

</style>
</head>

<body>

<div class="glow"></div>
<div class="glow"></div>

<div class="container">

<!-- =========================
   SIGNUP
========================= -->
<div id="signupBox" class="card">

  <h2>🚀 Become a Provider</h2>
  <p class="small">Production-ready Supabase marketplace onboarding</p>

  <input id="category" placeholder="Service (e.g Tutoring)">
  <input id="description" placeholder="What do you offer?">

  <select id="price">
    <option>R50</option>
    <option>R100</option>
    <option>R200</option>
    <option>Negotiable</option>
  </select>

  <input id="location" placeholder="Location">
  <input id="phone" placeholder="WhatsApp Number">

  <button class="primary" onclick="activateProvider()">
    🚀 Activate Provider Account
  </button>

</div>

<!-- =========================
   DASHBOARD
========================= -->
<div id="dashboardBox" class="hidden">

  <div class="card">
    <h2>🟢 Provider Active</h2>
    <p class="small">Your service is now live on the marketplace</p>
  </div>

  <div class="card">
    <h3>💰 Earnings (Live later)</h3>
    <p class="small">Tracking will activate once bookings start</p>
  </div>

  <div class="card">
    <h3>📦 Jobs</h3>
    <p class="small">Waiting for customer requests</p>
  </div>

  <button class="danger" onclick="logout()">
    Logout Provider
  </button>

</div>

</div>

<script>

// =========================
// SUPABASE INIT
// =========================
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// =========================
// CHECK AUTH
// =========================
async function getUser(){
  const { data } = await client.auth.getUser();
  return data.user;
}

// =========================
// ACTIVATE PROVIDER (PRODUCTION)
// =========================
async function activateProvider(){

  const user = await getUser();

  if(!user){
    alert("⚠️ Please log in first (Supabase Auth required)");
    return;
  }

  const payload = {
    user_id: user.id,
    category: category.value,
    description: description.value,
    price: price.value,
    location: location.value,
    whatsapp: phone.value,
    online: true,
    approved: false
  };

  const { error } = await client
    .from("service_profiles")
    .insert([payload]);

  if(error){
    alert("Error submitting provider profile");
    console.log(error);
    return;
  }

  alert("🚀 Provider submitted for approval!");

  signupBox.classList.add("hidden");
  dashboardBox.classList.remove("hidden");
}

// =========================
// LOGOUT
// =========================
async function logout(){
  await client.auth.signOut();
  location.reload();
}

</script>

</body>
</html>
