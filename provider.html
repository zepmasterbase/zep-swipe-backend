<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Provider V25 Production Ready</title>
<meta name="description" content="Zep Swipe Provider Dashboard">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--border:#262626;--text:#fff;--muted:#aaa}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:90px}
.hero{min-height:420px;padding:32px;border-radius:0 0 28px 28px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover}
.top{display:flex;align-items:center;gap:12px}
.avatar{width:60px;height:60px;border-radius:50%;border:2px solid #b8ff3b;object-fit:cover}
.glass{background:rgba(20,20,20,.55);backdrop-filter:blur(12px);border:1px solid rgba(184,255,59,.15);border-radius:20px;padding:18px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:16px}
.card{background:#141414;border:1px solid #262626;border-radius:18px;padding:16px}
.btn{padding:12px 16px;border:none;border-radius:12px;background:#b8ff3b;color:#000;font-weight:700;cursor:pointer}
.section{padding:0 16px 16px}
.item{padding:10px 0;border-bottom:1px solid #222}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid #262626;display:flex;justify-content:space-around;padding:12px}
</style>
</head>
<body>

<div class="hero">
<div class="top">
<img id="avatar" class="avatar" src="https://via.placeholder.com/60">
<div>
<h2 id="providerName">Welcome 👋</h2>
<div style="color:#aaa">Production Dashboard</div>
</div>
</div>

<div class="glass">
<div>AVAILABLE BALANCE</div>
<h1 id="balance" style="color:#b8ff3b">R0.00</h1>
<button class="btn">Withdraw</button>
</div>
</div>

<div class="grid">
<div class="card"><h3 id="jobsCount">0</h3><p>Jobs</p></div>
<div class="card"><h3 id="servicesCount">0</h3><p>Services</p></div>
<div class="card"><h3 id="reviewsCount">0</h3><p>Reviews</p></div>
<div class="card"><h3 id="notificationsCount">0</h3><p>Notifications</p></div>
</div>

<div class="section">
<div class="card">
<h3>Live Notifications</h3>
<div id="notifications"></div>
</div>
</div>

<div class="section">
<div class="card">
<h3>Booking Requests</h3>
<div id="requests"></div>
</div>
</div>

<div class="section">
<div class="card">
<h3>My Services</h3>
<div id="services"></div>
</div>
</div>

<div class="nav">
<div>🏠 Home</div>
<div>💼 Jobs</div>
<div>🏷 Deals</div>
<div>🏦 Withdraw</div>
<div>👤 Profile</div>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function init(){
 const {data:{session}}=await client.auth.getSession();
 if(!session) return;
 const uid=session.user.id;

 const {data:p}=await client.from('providers').select('*').eq('user_id',uid).single();
 if(p){
  providerName.textContent='Welcome '+(p.name||'Student')+' 👋';
  if(p.profile_image) avatar.src=p.profile_image;
 }

 const {data:wallet=[]}=await client.from('wallet_transactions').select('*').eq('user_id',uid);
 balance.textContent='R'+wallet.reduce((a,b)=>a+(Number(b.amount)||0),0).toFixed(2);

 const {data:servicesData=[]}=await client.from('services').select('*').eq('provider_id',uid);
 servicesCount.textContent=servicesData.length;
 services.innerHTML=servicesData.map(s=>`<div class="item">${s.service_name} - R${s.price||0}</div>`).join('');

 const {data:req=[]}=await client.from('service_requests').select('*').eq('provider_id',uid);
 jobsCount.textContent=req.length;
 requests.innerHTML=req.map(r=>`<div class="item">${r.status||'pending'} • R${r.amount||0}</div>`).join('');

 const {data:rev=[]}=await client.from('reviews').select('*').eq('provider_id',uid);
 reviewsCount.textContent=rev.length;

 const {data:noti=[]}=await client.from('notifications').select('*').eq('user_id',uid);
 notificationsCount.textContent=noti.length;
 notifications.innerHTML=noti.map(n=>`<div class="item">${n.title||'Notification'}</div>`).join('');

 client.channel('provider-live')
 .on('postgres_changes',{event:'*',schema:'public',table:'notifications'},()=>location.reload())
 .subscribe();
}
init();
</script>
</body>
</html>
