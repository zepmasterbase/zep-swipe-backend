<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Provider V8</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #0b0f0d;
  color: white;
  overflow-x: hidden;
}

/* =========================
   FLOATING BACKGROUND ICONS
========================= */
.bg-icons {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: 0;
  overflow: hidden;
}

.icon {
  position: absolute;
  font-size: 40px;
  opacity: 0.04;
  animation: float 18s infinite linear;
}

@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); }
  100% { transform: translateY(-10vh) rotate(360deg); }
}

/* RANDOM POSITIONS */
.i1 { left: 10%; animation-duration: 20s; }
.i2 { left: 25%; animation-duration: 25s; }
.i3 { left: 40%; animation-duration: 18s; }
.i4 { left: 60%; animation-duration: 22s; }
.i5 { left: 80%; animation-duration: 19s; }

/* =========================
   HEADER
========================= */
header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  background: rgba(10,14,12,0.7);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(0,255,140,0.12);
}

.logo {
  font-weight: 700;
  color: #00ff8c;
}

.status {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 20px;
  cursor: pointer;
  background: rgba(255,255,255,0.06);
}

/* =========================
   LAYOUT
========================= */
.container {
  position: relative;
  z-index: 2;
  max-width: 900px;
  margin: auto;
  padding: 14px;
}

/* =========================
   HERO
========================= */
.hero {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
}

.hero h1 {
  margin: 0;
  font-size: 20px;
}

.hero p {
  opacity: 0.7;
  font-size: 13px;
}

/* =========================
   STATS
========================= */
.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 12px;
}

.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 12px;
}

/* =========================
   JOB FEED
========================= */
h3 {
  margin-top: 16px;
  font-size: 14px;
  color: #00ff8c;
}

.job {
  background: rgba(255,255,255,0.03);
  border-radius: 14px;
  padding: 12px;
  margin-top: 10px;
  border: 1px solid rgba(255,255,255,0.06);
}

/* =========================
   BUTTONS
========================= */
button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #00ff8c;
  color: black;
}

/* =========================
   RANK BADGE
========================= */
.rank {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  background: #00ff8c;
  color: black;
}

/* =========================
   MOBILE
========================= */
@media(max-width:600px){
  .stats {
    grid-template-columns: 1fr 1fr;
  }
}

</style>
</head>

<body>

<!-- FLOATING BACKGROUND ICONS -->
<div class="bg-icons">
  <div class="icon i1">💇</div>
  <div class="icon i2">🔧</div>
  <div class="icon i3">📚</div>
  <div class="icon i4">🧼</div>
  <div class="icon i5">🚚</div>
</div>

<header>
  <div class="logo">⚡ Provider V8</div>

  <div class="status" onclick="toggleStatus()">
    🟡 <span id="statusText">OFFLINE</span>
  </div>
</header>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <h1>Earn in your community</h1>
    <p>Accept jobs • Build rank • Grow income</p>
  </div>

  <!-- STATS -->
  <div class="stats">

    <div class="card">
      <b>💰 Earnings</b>
      <p>R0.00</p>
    </div>

    <div class="card">
      <b>⭐ Rank</b>
      <p><span class="rank" id="rank">BRONZE</span></p>
    </div>

    <div class="card">
      <b>⚡ Points</b>
      <p id="points">0</p>
    </div>

    <div class="card">
      <b>📦 Jobs</b>
      <p id="jobs">0</p>
    </div>

  </div>

  <!-- JOBS -->
  <h3>⚡ Live Jobs</h3>
  <div id="jobFeed"></div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let provider = {
  id: "demo",
  available: false,
  points: 0,
  jobs: 0
};

/* =========================
   TOGGLE ONLINE/OFFLINE
========================= */
function toggleStatus(){

  provider.available = !provider.available;

  document.getElementById("statusText").innerText =
    provider.available ? "ONLINE" : "OFFLINE";
}

/* =========================
   LOAD JOBS
========================= */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .eq("status","open");

  renderJobs(data || []);
}

/* =========================
   ACCEPT JOB
========================= */
async function acceptJob(id){

  await client
    .from("service_requests")
    .update({
      status:"accepted",
      matched_provider: provider.id
    })
    .eq("id", id);

  provider.points += 10;
  provider.jobs += 1;

  updateUI();
  loadJobs();
}

/* =========================
   RENDER JOBS
========================= */
function renderJobs(jobs){

  const box = document.getElementById("jobFeed");
  box.innerHTML = "";

  jobs.forEach(j => {

    box.innerHTML += `
      <div class="job">

        <b>${j.category}</b>
        <p>${j.description}</p>

        <button class="primary" onclick="acceptJob('${j.id}')">
          Accept Job
        </button>

      </div>
    `;
  });
}

/* =========================
   RANK SYSTEM
========================= */
function updateUI(){

  document.getElementById("points").innerText = provider.points;
  document.getElementById("jobs").innerText = provider.jobs;

  let rank = "BRONZE";

  if(provider.points >= 100) rank = "GOLD";
  else if(provider.points >= 50) rank = "SILVER";

  document.getElementById("rank").innerText = rank;
}

/* INIT */
loadJobs();

</script>

</body>
</html>
