<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Provider V22 Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--border:#262626;--text:#fff;--muted:#aaa}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text);padding:16px;padding-bottom:90px}
.hero{border:1px solid var(--border);border-radius:28px;overflow:hidden;position:relative;min-height:520px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.7)),url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover}
.overlay{padding:32px}
.glass{background:rgba(20,20,20,.55);backdrop-filter:blur(12px);border:1px solid rgba(184,255,59,.15);border-radius:20px}
.wallet{padding:20px;width:330px;margin-top:20px}
.accent{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}
.scroll{display:flex;gap:12px;overflow:auto}
.item{padding:10px 0;border-bottom:1px solid #222}
.btn{padding:12px 16px;border:none;border-radius:14px;background:var(--accent);font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:12px}
</style>
</head>
<body>

<div class="hero">
<div class="overlay">
<h3>ZEP SWIPE • STUDENT DASHBOARD</h3>
<h1 style="font-size:56px">Good Morning,<br><span id="providerName" class="accent">Student 👋</span></h1>
<p>Learn skills. Earn money. Build your future.</p>

<div class="glass wallet">
<div>AVAILABLE BALANCE</div>
<h1 id="balance" class="accent">R0.00</h1>
<p id="pending">Pending: R0.00</p>
<p id="rating">Rating: 0 ⭐</p>
</div>
</div>
</div>

<div class="grid">
<div class="card"><h3>Jobs</h3><h2 id="jobCount">0</h2></div>
<div class="card"><h3>Reviews</h3><h2 id="reviewCount">0</h2></div>
<div class="card"><h3>Notifications</h3><h2 id="notificationCount">0</h2></div>
<div class="card"><h3>Services</h3><h2 id="serviceCount">0</h2></div>
</div>

<div class="card">
<h3>Recent Activity</h3>
<div id="activityList"></div>
</div>

<div class="card">
<h3>My Services</h3>
<div id="servicesList"></div>
</div>

<div class="card">
<h3>Student Deals</h3>
<div id="dealsList" class="scroll"></div>
</div>

<div class="nav">
<div>🏠 Home</div><div>💼 Jobs</div><div>🏷 Deals</div><div>💰 Wallet</div><div>👤 Profile</div>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function loadLiveData(){
 const {data:{session}} = await client.auth.getSession();
 if(!session) return;
 const user=session.user;

 const {data:provider}=await client.from('providers').select('*').eq('user_id',user.id).single();
 if(provider?.name) providerName.textContent=provider.name+' 👋';

 const {data:wallet=[]}=await client.from('wallet_transactions').select('*').eq('user_id',user.id);
 const balanceTotal=wallet.reduce((s,w)=>s+(Number(w.amount)||0),0);
 balance.textContent='R'+balanceTotal.toFixed(2);

 const {data:services=[]}=await client.from('services').select('*').eq('provider_id',user.id);
 serviceCount.textContent=services.length;
 servicesList.innerHTML=services.map(s=>`<div class="item">${s.service_name} • R${s.price||0}</div>`).join('');

 const {data:requests=[]}=await client.from('service_requests').select('*').eq('provider_id',user.id);
 jobCount.textContent=requests.length;
 activityList.innerHTML=requests.slice(0,10).map(r=>`<div class="item">${r.status||'Request'} • R${r.amount||0}</div>`).join('');

 const {data:reviews=[]}=await client.from('reviews').select('*').eq('provider_id',user.id);
 reviewCount.textContent=reviews.length;
 if(reviews.length){
   const avg=reviews.reduce((s,r)=>s+(Number(r.rating)||0),0)/reviews.length;
   rating.textContent='Rating: '+avg.toFixed(1)+' ⭐';
 }

 const {data:notices=[]}=await client.from('notifications').select('*').eq('user_id',user.id);
 notificationCount.textContent=notices.length;

 const {data:deals=[]}=await client.from('deals').select('*').eq('active',true).limit(10);
 dealsList.innerHTML=deals.map(d=>`<div class="card" style="min-width:220px"><b>${d.title||'Deal'}</b><p>${d.location||''}</p></div>`).join('');
}
loadLiveData();
</script>

</body>
</html>
