<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Commerce OS 3.0 — Merchant AI Deal Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050014;
  --glass:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.12);
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --red:#ff4d4d;
  --text:rgba(255,255,255,.88);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:radial-gradient(circle at 25% 10%, #070018, #000);
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  margin:14px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);
  backdrop-filter:blur(12px);
}

.brand{
  font-family:Orbitron;
  font-size:14px;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* AI PANEL */
.ai-box{
  margin:14px;
  padding:14px;
  border-radius:14px;
  background:rgba(0,240,255,.06);
  border:1px solid rgba(0,240,255,.2);
  font-size:13px;
}

/* CONTAINER */
.container{
  max-width:700px;
  margin:auto;
  padding:14px;
}

/* CARD */
.card{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

/* INPUTS */
input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,.4);
  color:white;
  outline:none;
}

/* LABEL */
label{
  font-size:12px;
  opacity:.8;
}

/* BUTTON */
.btn{
  padding:10px 16px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
}

.submit-btn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  font-weight:700;
}

/* STATUS */
.status-live{
  margin-top:10px;
  font-size:13px;
  color:var(--green);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
}

.modal-box{
  background:var(--glass);
  padding:20px;
  border-radius:14px;
  text-align:center;
  border:1px solid var(--stroke);
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep Swipe Merchant</div>
  <button class="btn" onclick="location.href='merchant-dashboard.html'">Dashboard</button>
</header>

<!-- AI ENGINE -->
<div class="ai-box">
  🤖 Zep AI Engine:
  <span id="aiStatus">Waiting for merchant submission...</span>
</div>

<div class="container">

  <div class="card">
    <h2>Submit Student Deal</h2>

    <form id="dealForm">

      <label>Business Name *</label>
      <input id="businessName" required>

      <label>Business Address *</label>
      <input id="businessAddress" required>

      <label>Deal Description *</label>
      <textarea id="dealDescription" required></textarea>

      <label>Deal Day *</label>
      <select id="dealDay" required>
        <option value="">Select</option>
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
      </select>

      <label>Deal Type *</label>
      <select id="dealType" required>
        <option value="">Select</option>
        <option>Discount %</option>
        <option>Free Item</option>
        <option>Bundle</option>
      </select>

      <div id="discountBox" style="display:none;">
        <label>Discount %</label>
        <input type="number" id="discountAmount">
      </div>

      <label>Location *</label>
      <select id="dealLocation">
        <option>In-store</option>
        <option>Online</option>
      </select>

      <label>Contact *</label>
      <input id="contactInfo" required>

      <label>Upload Logo *</label>
      <input type="file" id="dealLogo" required>

      <button class="submit-btn" type="submit">Submit Deal</button>
    </form>
  </div>

  <div class="card">
    <h3>📡 Live Deal Status</h3>
    <div id="liveStatus">No submissions yet</div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>🎉 Deal Submitted</h3>
    <p>AI is analyzing your deal...</p>
    <button class="btn" onclick="closeModal()">OK</button>
  </div>
</div>

<script>

const supabase = window.supabase.createClient(
  "https://zazbdbkoqjxdzisfszeg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphemJkYmtvcWp4ZHppc2ZzemVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTA4MzAsImV4cCI6MjA5MTQ4NjgzMH0.uTqieGXErIpooSUn0TMmYwYYJuo0yHYcAqdampHWRj4"
);

let lastDealId = null;

/* UI CONTROL */
document.getElementById("dealType").addEventListener("change",(e)=>{
  document.getElementById("discountBox").style.display =
    e.target.value === "Discount %" ? "block" : "none";
});

/* AI ENGINE */
function runAI(deal){

  const ai = document.getElementById("aiStatus");

  if(!deal){
    ai.innerText = "Waiting for merchant submission...";
    return;
  }

  if(deal.status === "pending"){
    ai.innerText = "🧠 AI analyzing student impact, clarity & value...";
  }

  if(deal.status === "approved"){
    ai.innerText = "✅ AI APPROVED — Live in marketplace";
  }

  if(deal.status === "rejected"){
    ai.innerText = "❌ Rejected — improve clarity & offer value";
  }
}

/* SUBMIT */
document.getElementById("dealForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const file = document.getElementById("dealLogo").files[0];
  if(!file) return alert("Logo required");

  const fileName = `${Date.now()}-${file.name}`;

  const { data: upload } = await supabase.storage
    .from("deal-logos")
    .upload(fileName, file);

  const { data: urlData } = supabase.storage
    .from("deal-logos")
    .getPublicUrl(fileName);

  const logoUrl = urlData.publicUrl;

  const { data, error } = await supabase
    .from("student_deals")
    .insert([{
      business_name: businessName.value,
      business_address: businessAddress.value,
      deal_description: dealDescription.value,
      deal_day: dealDay.value,
      deal_type: dealType.value,
      discount_amount: discountAmount.value || null,
      deal_location: dealLocation.value,
      contact_info: contactInfo.value,
      logo_url: logoUrl,
      status: "pending"
    }])
    .select()
    .single();

  if(error){
    console.error(error);
    return alert("Submission failed");
  }

  lastDealId = data.id;

  document.getElementById("modal").style.display="flex";

  runAI(data);
});

/* REALTIME */
supabase
  .channel("deal-os3-merchant")
  .on("postgres_changes",
    { event:"UPDATE", schema:"public", table:"student_deals" },
    (payload)=>{
      const deal = payload.new;

      if(deal.id === lastDealId){
        runAI(deal);

        document.getElementById("liveStatus").innerHTML =
          `Status: <b>${deal.status}</b>`;
      }
    }
  )
  .subscribe();

/* MODAL */
function closeModal(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
