<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Escrow Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,0.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Poppins,sans-serif;
}

body{
  background:var(--bg);
  color:#fff;
  min-height:100vh;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  margin:16px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(14px);
}

.brand{
  font-family:Orbitron;
  font-size:1.4rem;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.logout-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:rgba(255,255,255,0.1);
  color:#fff;
  font-size:16px;
}

.container{
  max-width:600px;
  margin:40px auto;
  padding:20px;
  background:var(--glass);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.1);
}

h2{
  text-align:center;
  font-family:Orbitron;
  margin-bottom:20px;
}

input, button{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border-radius:12px;
  border:none;
  outline:none;
}

button{
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  color:#050015;
  font-family:Orbitron;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(156,77,255,0.4);
}

.success{
  background:rgba(0,255,150,0.15);
  color:#00ff9d;
  padding:12px;
  border-radius:12px;
  text-align:center;
  display:none;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep Swipe</div>
  <button class="logout-btn" onclick="logout()">⎋</button>
</header>

<div class="container">
  <h2>Escrow Payment</h2>

  <form id="escrowForm">
    <input type="text" id="jobTitle" placeholder="Job Title" required>
    <input type="number" id="amountUSD" placeholder="Amount (USD)" required min="1">
    <input type="text" id="employerName" placeholder="Employer Name" required>
    <input type="text" id="studentName" placeholder="Student Name" required>

    <button type="submit">Deposit & Create Escrow</button>
  </form>

  <div class="success" id="successMsg"></div>
</div>

<script>
/* =========================
   SUPABASE INIT
========================= */
const supabaseUrl = "https://YOUR_PROJECT.supabase.co";
const supabaseKey = "YOUR_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* =========================
   AUTH CHECK
========================= */
let currentUser = null;

async function loadUser(){
  const { data, error } = await supabase.auth.getUser();

  if(error || !data.user){
    alert("Login required");
    window.location.href = "auth.html";
    return;
  }

  currentUser = data.user;
}
loadUser();

/* =========================
   LOGOUT
========================= */
async function logout(){
  await supabase.auth.signOut();
  window.location.href = "auth.html";
}

/* =========================
   FORM SUBMIT
========================= */
const form = document.getElementById("escrowForm");
const successMsg = document.getElementById("successMsg");

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  const jobTitle = document.getElementById("jobTitle").value;
  const amountUSD = parseFloat(document.getElementById("amountUSD").value);
  const employerName = document.getElementById("employerName").value;
  const studentName = document.getElementById("studentName").value;

  if(!jobTitle || !amountUSD || !employerName || !studentName){
    alert("Fill all fields");
    return;
  }

  /* =========================
     INSERT ESCROW JOB
  ========================= */
  const { error } = await supabase
    .from("escrow_jobs")
    .insert([{
      job_title: jobTitle,
      amount_usd: amountUSD,
      employer_name: employerName,
      student_name: studentName,
      status: "pending",
      created_by: currentUser.id
    }]);

  if(error){
    console.error(error);
    alert("Failed to create escrow job");
    return;
  }

  /* =========================
     REWARD SYSTEM (ZAC)
  ========================= */
  await supabase
    .from("profiles")
    .update({ zac: supabase.rpc('increment_zac', { amount: 25 }) })
    .eq("id", currentUser.id);

  /* =========================
     SUCCESS UI
  ========================= */
  successMsg.style.display = "block";
  successMsg.innerHTML = `
    Escrow created successfully!<br>
    +25 ZAC rewarded 🎉
  `;

  form.reset();
});
</script>

</body>
</html>
