<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zep Escrow AI System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --blue:#00f0ff;
  --violet:#9c4dff;
  --green:#00ff94;
  --red:#ff4d4d;
  --yellow:#ffcc00;
  --glass:rgba(255,255,255,0.07);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  background:var(--bg);
  color:#fff;
  padding:20px;
}

/* TITLE */
h2{
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

/* AI PANEL */
.ai-box{
  padding:12px;
  margin-bottom:15px;
  border-radius:14px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.25);
  font-size:13px;
}

/* CARDS */
.box{
  background:var(--glass);
  padding:15px;
  margin:10px 0;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.1);
}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.4);
  color:#fff;
  outline:none;
}

/* BUTTONS */
button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  font-weight:bold;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
}

/* DANGER BUTTON */
.danger{
  background:linear-gradient(90deg,var(--red),#ff0000);
  color:#fff;
}

/* STATUS COLORS */
.locked{color:var(--yellow);}
.released{color:var(--green);}
.disputed{color:var(--red);}
</style>
</head>

<body>

<h2>💼 Zep Escrow AI System</h2>

<!-- 🤖 AI PANEL -->
<div class="ai-box">
  🤖 <span id="aiInsight">Analyzing escrow system...</span>
</div>

<!-- CREATE ESCROW -->
<div class="box">
  <h3>Create Escrow</h3>

  <input id="buyer" placeholder="Buyer ID (auth_id)">
  <input id="seller" placeholder="Seller ID (auth_id)">
  <input id="amount" type="number" placeholder="Amount (ZAC)">

  <button onclick="createEscrow()">Create Escrow</button>
</div>

<!-- LIST -->
<div class="box">
  <h3>Escrow Transactions</h3>
  <div id="escrowList"></div>
</div>

<script>

/* ================= SUPABASE ================= */
const supabase = window.supabase.createClient(
  "https://zazbdbkoqjxdzisfszeg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphemJkYmtvcWp4ZHppc2ZzemVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTA4MzAsImV4cCI6MjA5MTQ4NjgzMH0.uTqieGXErIpooSUn0TMmYwYYJuo0yHYcAqdampHWRj4"
);

/* ================= USER ================= */
let currentUser = null;

async function getUser(){
  const { data } = await supabase.auth.getUser();
  currentUser = data.user;
  return currentUser;
}

/* ================= CREATE ESCROW ================= */
async function createEscrow(){

  const buyer_id = document.getElementById("buyer").value;
  const seller_id = document.getElementById("seller").value;
  const amount = Number(document.getElementById("amount").value);

  if(!buyer_id || !seller_id || !amount){
    alert("Fill all fields");
    return;
  }

  const { error } = await supabase.from("escrow").insert([{
    buyer_id,
    seller_id,
    amount,
    status: "locked"
  }]);

  if(error){
    console.log(error);
    alert("Error creating escrow");
    return;
  }

  alert("Escrow created & funds locked 🔒");
  loadEscrow();
}

/* ================= LOAD ESCROW ================= */
async function loadEscrow(){

  const user = await getUser();
  if(!user) return;

  const { data } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`)
    .order("created_at", { ascending:false });

  render(data || []);
  runZepAI(data || []);
}

/* ================= RENDER ================= */
function render(data){

  const box = document.getElementById("escrowList");
  box.innerHTML = "";

  data.forEach(item => {

    box.innerHTML += `
      <div class="box">
        <p><b>Amount:</b> ${item.amount} ZAC</p>
        <p><b>Status:</b> <span class="${item.status}">${item.status}</span></p>

        ${item.status === "locked" ? `
          <button onclick="release('${item.id}')">Release Funds</button>
          <button class="danger" onclick="dispute('${item.id}')">Raise Dispute</button>
        ` : ""}
      </div>
    `;
  });
}

/* ================= RELEASE FUNDS ================= */
async function release(id){

  await supabase
    .from("escrow")
    .update({ status:"released" })
    .eq("id", id);

  loadEscrow();
}

/* ================= DISPUTE ================= */
async function dispute(id){

  await supabase
    .from("escrow")
    .update({ status:"disputed" })
    .eq("id", id);

  loadEscrow();
}

/* ================= ZEP AI ENGINE ================= */
function runZepAI(data){

  let locked = 0;
  let released = 0;
  let disputed = 0;

  data.forEach(e => {
    if(e.status === "locked") locked++;
    if(e.status === "released") released++;
    if(e.status === "disputed") disputed++;
  });

  let insight = "";

  if(disputed > 0){
    insight = "⚠️ Disputes detected — immediate review recommended.";
  }
  else if(locked > 5){
    insight = "💰 High escrow volume — ensure fast delivery cycles.";
  }
  else if(released > locked){
    insight = "🔥 Healthy system — successful payouts dominating.";
  }
  else{
    insight = "Escrow system stable — monitoring active flows...";
  }

  document.getElementById("aiInsight").innerText = insight;
}

/* ================= INIT ================= */
loadEscrow();

</script>

</body>
</html>
