<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zep Escrow AI System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Poppins, sans-serif;
  background:#050012;
  color:white;
  padding:20px;
}

h2{margin-bottom:10px;}

.box{
  background:rgba(255,255,255,0.06);
  padding:15px;
  margin:10px 0;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.1);
}

input,button{
  padding:10px;
  margin:5px 0;
  width:100%;
  border-radius:10px;
  border:none;
}

button{
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  color:#000;
}

.danger{
  background:linear-gradient(90deg,#ff4d4d,#ff0000);
  color:#fff;
}

.pending{color:yellow;}
.released{color:#00ff9d;}
.disputed{color:#ff4d4d;}

/* AI PANEL */
.ai-box{
  padding:12px;
  margin-bottom:15px;
  border-radius:14px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.3);
  font-size:13px;
}
</style>
</head>

<body>

<h2>💼 Zep Escrow AI System</h2>

<!-- 🤖 AI PANEL -->
<div class="ai-box">
  🤖 <span id="aiInsight">Analyzing escrow system...</span>
</div>

<!-- CREATE ESCROW -->
<div class="box">
  <h3>Create Escrow</h3>

  <input id="buyer" placeholder="Buyer ID (auth_id)" />
  <input id="seller" placeholder="Seller ID (auth_id)" />
  <input id="amount" placeholder="Amount (ZAC)" type="number" />

  <button onclick="createEscrow()">Create Escrow</button>
</div>

<!-- LIST -->
<div class="box">
  <h3>Escrow Transactions</h3>
  <div id="escrowList"></div>
</div>

<script>

/* =========================
   SUPABASE INIT
========================= */
const supabaseUrl = "https://sqlisgobnayfpzamdolf.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* =========================
   USER
========================= */
let currentUser = null;

async function getUser(){
  const { data } = await supabase.auth.getUser();
  currentUser = data.user;
  return currentUser;
}

/* =========================
   CREATE ESCROW
========================= */
async function createEscrow(){

  const buyer_id = document.getElementById("buyer").value;
  const seller_id = document.getElementById("seller").value;
  const amount = document.getElementById("amount").value;

  if(!buyer_id || !seller_id || !amount){
    alert("Fill all fields");
    return;
  }

  const { error } = await supabase.from("escrow").insert([{
    buyer_id,
    seller_id,
    amount,
    status: "locked"
  }]);

  if(error){
    alert("Error creating escrow");
    return;
  }

  alert("Escrow created & funds locked");
  loadEscrow();
}

/* =========================
   LOAD ESCROW
========================= */
async function loadEscrow(){

  const user = await getUser();
  if(!user) return;

  const { data } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`)
    .order("created_at", { ascending:false });

  render(data || []);
  runZepAI(data || []);
}

/* =========================
   RENDER UI
========================= */
function render(data){

  const box = document.getElementById("escrowList");
  box.innerHTML = "";

  data.forEach(item => {

    box.innerHTML += `
      <div class="box">
        <p><b>Amount:</b> ${item.amount} ZAC</p>
        <p><b>Status:</b> <span class="${item.status}">${item.status}</span></p>

        ${item.status === "locked" ? `
          <button onclick="release('${item.id}')">Release Funds</button>
          <button class="danger" onclick="dispute('${item.id}')">Raise Dispute</button>
        ` : ""}
      </div>
    `;
  });
}

/* =========================
   RELEASE
========================= */
async function release(id){

  await supabase
    .from("escrow")
    .update({ status:"released" })
    .eq("id", id);

  loadEscrow();
}

/* =========================
   DISPUTE
========================= */
async function dispute(id){

  await supabase
    .from("escrow")
    .update({ status:"disputed" })
    .eq("id", id);

  loadEscrow();
}

/* =========================
   🤖 ZEP AI ESCROW ENGINE
========================= */
function runZepAI(data){

  let locked = 0;
  let disputed = 0;
  let released = 0;

  data.forEach(e => {
    if(e.status === "locked") locked++;
    if(e.status === "disputed") disputed++;
    if(e.status === "released") released++;
  });

  let insight = "";

  if(disputed > 0){
    insight = "⚠️ Disputes detected. Admin attention recommended immediately.";
  }

  else if(locked > 3){
    insight = "💰 High escrow activity. Ensure timely job completion to avoid delays.";
  }

  else if(released > locked){
    insight = "🔥 Healthy system flow. More funds are being successfully released.";
  }

  else {
    insight = "Escrow system stable. Monitoring active transactions...";
  }

  document.getElementById("aiInsight").innerText = insight;
}

/* =========================
   INIT
========================= */
loadEscrow();

</script>

</body>
</html>
