<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zep Escrow</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial; background:#0f172a; color:white; padding:20px; }
    .box { background:#1e293b; padding:15px; margin:10px 0; border-radius:10px; }
    input, button { padding:10px; margin:5px; width:100%; border-radius:6px; border:none; }
    button { cursor:pointer; background:#22c55e; color:white; }
    .danger { background:#ef4444; }
    .pending { color:yellow; }
    .released { color:lime; }
  </style>
</head>

<body>

<h2>💼 Zep Escrow System</h2>

<!-- CREATE ESCROW -->
<div class="box">
  <h3>Create Escrow</h3>

  <input id="buyer" placeholder="Buyer ID (auth_id)" />
  <input id="seller" placeholder="Seller ID (auth_id)" />
  <input id="amount" placeholder="Amount (ZAC)" type="number" />

  <button onclick="createEscrow()">Create Escrow</button>
</div>

<!-- ESCROW LIST -->
<div class="box">
  <h3>My Escrow Transactions</h3>
  <div id="escrowList"></div>
</div>

<script>
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// GET CURRENT USER
async function getUser() {
  const { data } = await supabase.auth.getUser();
  return data.user;
}

// CREATE ESCROW
async function createEscrow() {
  const buyer_id = document.getElementById("buyer").value;
  const seller_id = document.getElementById("seller").value;
  const amount = document.getElementById("amount").value;

  const { error } = await supabase.from("escrow").insert([
    {
      buyer_id,
      seller_id,
      amount,
      status: "pending"
    }
  ]);

  if (error) {
    alert("Error creating escrow");
    console.log(error);
    return;
  }

  alert("Escrow created");
  loadEscrow();
}

// LOAD ESCROW
async function loadEscrow() {
  const user = await getUser();
  if (!user) return;

  const { data, error } = await supabase
    .from("escrow")
    .select("*")
    .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`)
    .order("created_at", { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  render(data);
}

// RENDER ESCROW
function render(data) {
  const box = document.getElementById("escrowList");
  box.innerHTML = "";

  data.forEach(item => {
    box.innerHTML += `
      <div class="box">
        <p><b>Amount:</b> ${item.amount} ZAC</p>
        <p><b>Status:</b> <span class="${item.status}">${item.status}</span></p>

        ${item.status === "pending" ? `
          <button onclick="release('${item.id}')">Release</button>
          <button class="danger" onclick="dispute('${item.id}')">Dispute</button>
        ` : ""}
      </div>
    `;
  });
}

// RELEASE FUNDS
async function release(id) {
  const { error } = await supabase
    .from("escrow")
    .update({ status: "released" })
    .eq("id", id);

  if (error) {
    alert("Failed to release");
    return;
  }

  loadEscrow();
}

// DISPUTE
async function dispute(id) {
  const { error } = await supabase
    .from("escrow")
    .update({ status: "disputed" })
    .eq("id", id);

  if (error) {
    alert("Failed to dispute");
    return;
  }

  loadEscrow();
}

// INIT
loadEscrow();

</script>

</body>
</html>
