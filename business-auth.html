<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Business Auth</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--border:#262626}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;background:radial-gradient(circle at top,#121212,#070707);display:flex;justify-content:center;align-items:center;min-height:100vh;color:#fff;padding:20px}
.card{width:100%;max-width:430px;background:#141414;border:1px solid #262626;border-radius:22px;padding:24px}
.logo{text-align:center;color:#b8ff3b;font-size:28px;font-weight:800}
small{display:block;text-align:center;color:#aaa;margin:8px 0 20px}
input{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid #262626;background:#101010;color:#fff}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.primary{background:#b8ff3b;color:#000}.secondary{background:transparent;color:#b8ff3b;border:1px solid #b8ff3b}
#msg{text-align:center;margin-top:14px;color:#b8ff3b;min-height:20px}
a{color:#b8ff3b;text-decoration:none;display:block;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
<div class="logo">🏪 Zep Swipe Business</div>
<small>Create an account or sign in.</small>
<input id="businessName" placeholder="Business Name">
<input id="ownerName" placeholder="Owner Name">
<input id="location" placeholder="Location">
<input id="whatsapp" placeholder="WhatsApp">
<input id="email" type="email" placeholder="Business Email">
<input id="password" type="password" placeholder="Password">
<button id="signupBtn" class="primary" onclick="signup()">Create Business Account</button>
<button id="loginBtn" class="secondary" onclick="login()">Login</button>
<a href="#" onclick="resetPassword();return false;">Forgot password?</a>
<div id="msg"></div>
</div>
<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

db.auth.getSession().then(({data})=>{
 if(data.session){location.replace("business-deals.html");}
});

function setBusy(v){
 signupBtn.disabled=v; loginBtn.disabled=v;
}
function msg(t){document.getElementById("msg").textContent=t;}
function v(id){return document.getElementById(id).value.trim();}

async function signup(){
 setBusy(true); msg("Creating account...");
 const {data,error}=await db.auth.signUp({email:v("email"),password:v("password")});
 if(error){msg(error.message);setBusy(false);return;}
 const uid=data.user?.id;
 if(uid){
   const {error:dbErr}=await db.from("businesses").upsert({
      user_id:uid,
      business_name:v("businessName"),
      owner_name:v("ownerName"),
      location:v("location"),
      whatsapp:v("whatsapp"),
      email:v("email")
   });
   if(dbErr){msg(dbErr.message);setBusy(false);return;}
 }
 if(!data.session){
   msg("Account created. Check your email to verify before logging in.");
   setBusy(false);
   return;
 }
 location.replace("business-deals.html");
}

async function login(){
 setBusy(true); msg("Signing in...");
 const {error}=await db.auth.signInWithPassword({email:v("email"),password:v("password")});
 if(error){msg(error.message);setBusy(false);return;}
 location.replace("business-deals.html");
}

async function resetPassword(){
 if(!v("email")){msg("Enter your email first.");return;}
 const {error}=await db.auth.resetPasswordForEmail(v("email"),{redirectTo:location.origin+"/business-auth.html"});
 msg(error?error.message:"Password reset email sent.");
}
</script>
</body>
</html>
