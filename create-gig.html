<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe — Create Gig</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --zep-blue:#00f0ff;
  --zep-violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,0.08);
  --text-light:rgba(255,255,255,0.85);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}

body{
  background:var(--bg);
  color:#fff;
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  margin:16px;
  border-radius:16px;
  background:radial-gradient(circle at center, rgba(0,240,255,.2), rgba(156,77,255,.2));
  backdrop-filter:blur(14px);
}

.brand{
  font-family:Orbitron;
  font-size:1.5rem;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.logout-btn{
  background:rgba(255,255,255,.1);
  border:none;
  border-radius:50%;
  width:38px;
  height:38px;
  cursor:pointer;
  color:#fff;
}

/* FORM */
.container{
  max-width:600px;
  margin:30px auto;
  background:var(--glass);
  border-radius:16px;
  padding:20px;
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  flex-direction:column;
  gap:14px;
}

input, textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  background:rgba(255,255,255,.05);
  color:#fff;
}

textarea{height:100px; resize:none;}

button{
  padding:14px;
  border:none;
  border-radius:999px;
  background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
  color:#050015;
  font-family:Orbitron;
  cursor:pointer;
}

.total-card{
  background:rgba(255,255,255,.05);
  padding:12px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep Swipe</div>
  <button class="logout-btn" onclick="logout()">⎋</button>
</header>

<div class="container">
  <h2>Create a New Gig</h2>

  <input type="text" id="title" placeholder="Job Title">
  <textarea id="desc" placeholder="Job Description"></textarea>

  <input type="number" id="rate" placeholder="Rate per Hour (USD)">
  <input type="number" id="duration" placeholder="Duration (Hours)">

  <div class="total-card">
    <span>Total + $25 fee:</span>
    <span id="totalAmount">$0</span>
  </div>

  <button onclick="createGig()">Create Gig & Pay $25</button>
</div>

<script>
/* =========================
   SUPABASE INIT
========================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   AUTH CHECK (SUPABASE)
========================= */
let user = null;

async function loadUser(){
  const { data } = await supabaseClient.auth.getUser();
  user = data?.user;

  if(!user){
    alert("Please login to create a gig.");
    window.location.href = "employer-auth.html";
  }
}

loadUser();

/* =========================
   TOTAL CALCULATION
========================= */
const rateInput = document.getElementById("rate");
const durationInput = document.getElementById("duration");
const totalEl = document.getElementById("totalAmount");

function updateTotal(){
  const rate = parseFloat(rateInput.value) || 0;
  const duration = parseFloat(durationInput.value) || 0;
  totalEl.innerText = `$${(rate * duration + 25).toFixed(2)}`;
}

rateInput.addEventListener("input", updateTotal);
durationInput.addEventListener("input", updateTotal);

/* =========================
   CREATE GIG (SUPABASE)
========================= */
async function createGig(){

  const title = document.getElementById("title").value.trim();
  const desc = document.getElementById("desc").value.trim();
  const rate = parseFloat(rateInput.value);
  const duration = parseFloat(durationInput.value);

  if(!title || !desc || !rate || !duration){
    alert("Fill all fields properly");
    return;
  }

  const totalAmount = rate * duration + 25;

  const { data, error } = await supabaseClient
    .from("gigs")
    .insert([
      {
        employer_id: user.id,
        title,
        description: desc,
        rate,
        duration,
        total_amount: totalAmount,
        listing_fee: 25,
        escrow_paid: true,
        escrow_released: false,
        applicants: []
      }
    ])
    .select();

  if(error){
    console.error(error);
    alert("Error creating gig");
    return;
  }

  alert("Gig created successfully! $25 escrow recorded.");
  window.location.href = "employer-dashboard.html";
}

/* =========================
   LOGOUT
========================= */
async function logout(){
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
}
</script>

</body>
</html>
