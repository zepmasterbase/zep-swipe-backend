<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep AI Gig OS — Create Gig</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --bg:radial-gradient(circle at 30% 10%, #050018, #00000c);
  --glass:rgba(255,255,255,0.06);
  --text:rgba(255,255,255,0.92);
  --muted:rgba(255,255,255,0.6);
  --shadow:0 0 40px rgba(156,77,255,0.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  margin:16px;
  border-radius:16px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}

.brand{
  font-family:Orbitron;
  font-size:1.4rem;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* CONTAINER */
.container{
  max-width:650px;
  margin:30px auto;
  padding:20px;
  background:var(--glass);
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* INPUTS */
input, textarea{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.05);
  color:var(--text);
}

textarea{
  height:120px;
  resize:none;
}

input::placeholder,
textarea::placeholder{
  color:var(--muted);
}

/* AI PANEL */
.ai-box{
  padding:12px;
  border-radius:12px;
  background:rgba(0,240,255,0.06);
  border:1px solid rgba(0,240,255,0.2);
  font-size:13px;
}

/* TOTAL */
.total{
  display:flex;
  justify-content:space-between;
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  font-size:14px;
}

/* BUTTON */
button{
  padding:14px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-family:Orbitron;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#050015;
  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
}

/* LOADING */
.loading{
  opacity:0.6;
  pointer-events:none;
}
</style>
</head>

<body>

<header>
  <div class="brand">Zep AI Gig OS</div>
  <button onclick="logout()">⎋</button>
</header>

<div class="container">

  <h2>Create a Gig</h2>

  <!-- AI PREVIEW -->
  <div class="ai-box" id="aiPreview">
    🤖 AI: Waiting for gig input...
  </div>

  <input type="text" id="title" placeholder="Gig Title">
  <textarea id="desc" placeholder="Gig Description"></textarea>

  <input type="number" id="rate" placeholder="Rate per Hour (USD)">
  <input type="number" id="duration" placeholder="Duration (Hours)">

  <!-- TOTAL -->
  <div class="total">
    <span>Total (includes $25 listing fee)</span>
    <span id="totalAmount">$0</span>
  </div>

  <button id="createBtn" onclick="createGig()">
    Create Gig & Pay $25
  </button>

</div>

<script>

/* =========================
   SUPABASE INIT
========================= */
const SUPABASE_URL = "https://sqlisgobnayfpzamdolf.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_KEY";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================
   USER
========================= */
let user = null;

async function loadUser(){
  const { data } = await supabaseClient.auth.getUser();
  user = data?.user;

  if(!user){
    alert("Please login first");
    window.location.href = "employer-auth.html";
  }
}
loadUser();

/* =========================
   AI PREVIEW ENGINE
========================= */
function updateAIPreview(){

  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;
  const rate = parseFloat(document.getElementById("rate").value) || 0;
  const duration = parseFloat(document.getElementById("duration").value) || 0;

  let score = 50;

  if(title.length > 5) score += 10;
  if(desc.length > 20) score += 20;
  if(rate > 20) score += 10;
  if(duration > 2) score += 10;

  if(rate * duration > 200) score += 10;

  let status =
    score > 80 ? "🔥 HIGH QUALITY GIG" :
    score > 60 ? "⚡ GOOD GIG" :
    "⚠️ LOW VISIBILITY GIG";

  document.getElementById("aiPreview").innerText =
    `🤖 AI Score: ${score}/100 — ${status}`;
}

/* LIVE LISTENERS */
["title","desc","rate","duration"].forEach(id=>{
  document.getElementById(id).addEventListener("input", ()=>{
    updateAIPreview();
    updateTotal();
  });
});

/* =========================
   TOTAL CALCULATION
========================= */
function updateTotal(){
  const rate = parseFloat(document.getElementById("rate").value) || 0;
  const duration = parseFloat(document.getElementById("duration").value) || 0;

  const total = (rate * duration) + 25;

  document.getElementById("totalAmount").innerText =
    `$${total.toFixed(2)}`;
}

/* =========================
   CREATE GIG (BACKEND READY)
========================= */
async function createGig(){

  const btn = document.getElementById("createBtn");
  btn.classList.add("loading");
  btn.innerText = "Processing...";

  const title = document.getElementById("title").value.trim();
  const desc = document.getElementById("desc").value.trim();
  const rate = parseFloat(document.getElementById("rate").value);
  const duration = parseFloat(document.getElementById("duration").value);

  if(!title || !desc || !rate || !duration){
    alert("Fill all fields");
    btn.classList.remove("loading");
    btn.innerText = "Create Gig & Pay $25";
    return;
  }

  const totalAmount = (rate * duration) + 25;

  // AI SCORE
  const ai_score =
    Math.min(100,
      (title.length * 2) +
      (desc.length * 0.5) +
      (rate * 0.2) +
      (duration * 3)
    );

  const { error } = await supabaseClient
    .from("gigs")
    .insert([{
      employer_id: user.id,
      title,
      description: desc,
      rate,
      duration,
      total_amount: totalAmount,
      listing_fee: 25,
      escrow_paid: true,
      escrow_released: false,
      ai_score: Math.round(ai_score),
      status: "active",
      created_at: new Date().toISOString()
    }]);

  btn.classList.remove("loading");
  btn.innerText = "Create Gig & Pay $25";

  if(error){
    console.error(error);
    alert("Error creating gig");
    return;
  }

  alert("Gig created successfully 🚀");
  window.location.href = "employer-dashboard.html";
}

/* =========================
   LOGOUT
========================= */
async function logout(){
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
}

</script>

</body>
</html>
