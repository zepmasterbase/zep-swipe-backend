<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Success</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #0b0f1a, #05070d);
  color: white;
  overflow-x: hidden;
}

.glow {
  position: absolute;
  width: 450px;
  height: 450px;
  background: #00f0ff;
  filter: blur(130px);
  opacity: 0.15;
  top: -120px;
  left: -120px;
}

.container {
  max-width: 450px;
  margin: auto;
  padding: 20px;
  position: relative;
}

.header {
  text-align: center;
  margin-top: 20px;
}

.check {
  width: 70px;
  height: 70px;
  margin: auto;
  color: #00f0ff;
  filter: drop-shadow(0 0 20px #00f0ff);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 0.7; }
}

.title {
  font-size: 22px;
  font-weight: 700;
  margin-top: 10px;
}

.subtitle {
  font-size: 13px;
  opacity: 0.7;
}

.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,255,255,0.2);
  border-radius: 16px;
  padding: 15px;
  margin-top: 15px;
  backdrop-filter: blur(12px);
}

.xp {
  font-size: 26px;
  font-weight: 800;
  color: #00f0ff;
}

.ref-link {
  background: rgba(0,0,0,0.4);
  padding: 10px;
  border-radius: 12px;
  font-size: 12px;
  word-break: break-all;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
  border: none;
}

.btn-primary {
  background: linear-gradient(90deg, #00f0ff, #6a5cff);
  color: black;
}

.btn-outline {
  background: transparent;
  border: 1px solid rgba(0,255,255,0.4);
  color: #00f0ff;
}

.badge {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 20px;
  background: rgba(0,255,255,0.1);
  border: 1px solid rgba(0,255,255,0.3);
  font-size: 11px;
  margin-top: 8px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

  <div class="header">
    <i data-lucide="check-circle" class="check"></i>
    <div class="title">You're In, Pioneer 🚀</div>
    <div class="subtitle">Welcome to Zep Swipe Web3 Economy</div>
  </div>

  <!-- XP -->
  <div class="card">
    <div style="font-size:13px; opacity:0.7;">Your ZAC XP Balance</div>
    <div class="xp" id="xp">Loading...</div>
    <div class="badge">+25 ZAC per referral</div>
  </div>

  <!-- COUNTRY -->
  <div class="card">
    <div style="font-size:13px; opacity:0.7;">Your Country</div>
    <div style="font-size:18px; font-weight:700;" id="country">Loading...</div>
    <div class="badge">🌍 Pilot Region</div>
  </div>

  <!-- REFERRAL -->
  <div class="card">
    <div style="font-size:13px; opacity:0.7;">Referral Link</div>

    <div class="ref-link" id="refLink">Loading...</div>

    <button class="btn-primary" onclick="copyLink()">Copy Link</button>
    <button class="btn-outline" onclick="shareWhatsApp()">WhatsApp</button>
    <button class="btn-outline" onclick="shareTelegram()">Telegram</button>

    <!-- KEEP THIS -->
    <button class="btn-outline" onclick="goLeaderboard()">🏆 Leaderboard</button>
  </div>

</div>

<script>
lucide.createIcons();

/* ---------------- SUPABASE INIT ---------------- */
const supabaseUrl = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGlzZ29ibmF5ZnB6YW1kb2xmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNDg5ODcsImV4cCI6MjA5MDYyNDk4N30.Ou4IuIGcA2JrVuXlhb8ii2P8aAE-VUuYUI4uZ8_5B28";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

/* ---------------- GET USER (ANTI FAKE READY) ---------------- */
let userId = localStorage.getItem("zep_user_id");

async function loadUser() {
  if (!userId) {
    alert("Invalid session. Please rejoin waitlist.");
    return;
  }

  let { data, error } = await supabase
    .from("users")
    .select("*")
    .eq("id", userId)
    .single();

  if (error || !data) {
    alert("User not found or invalid referral.");
    return;
  }

  // Anti-fake check (basic)
  if (data.is_banned) {
    alert("Account flagged.");
    return;
  }

  renderUser(data);
}

/* ---------------- RENDER USER ---------------- */
function renderUser(user) {

  document.getElementById("xp").innerText = user.xp + " ZAC";
  document.getElementById("country").innerText = user.country;

  const link = `https://zepswipe.com?ref=${user.ref_code}`;
  document.getElementById("refLink").innerText = link;

  window.refLink = link;
}

/* ---------------- COPY ---------------- */
function copyLink() {
  navigator.clipboard.writeText(window.refLink);
  alert("Copied!");
}

/* ---------------- SHARE ---------------- */
function shareWhatsApp() {
  let msg = `Join Zep Swipe 🚀 ${window.refLink}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
}

function shareTelegram() {
  window.open(`https://t.me/share/url?url=${encodeURIComponent(window.refLink)}`, "_blank");
}

/* ---------------- LEADERBOARD ---------------- */
function goLeaderboard() {
  window.location.href = "leaderboard.html";
}

/* ---------------- START ---------------- */
loadUser();
</script>

</body>
</html>
