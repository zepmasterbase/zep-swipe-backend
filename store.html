<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zep Swipe — Campus Store Details</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --zep-blue:#00f0ff;
    --zep-violet:#9c4dff;
    --bg:radial-gradient(circle at 25% 10%, #050018 0%, #00000c 100%);
    --glass:rgba(255,255,255,0.08);
  }

  body{
    margin:0;
    font-family:Poppins,sans-serif;
    background:var(--bg);
    color:#fff;
    min-height:100vh;
    padding:20px;
  }

  .container{
    max-width:700px;
    margin:0 auto;
    background:var(--glass);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:24px;
    backdrop-filter:blur(12px);
    box-shadow:0 0 40px rgba(0,240,255,.25);
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }

  header h1{
    font-family:Orbitron;
    font-size:1.6rem;
    background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .home-btn{
    background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
    color:#050015;
    padding:8px 16px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    font-family:Orbitron;
    font-weight:700;
  }

  .store-logo{
    width:100%;
    max-height:200px;
    object-fit:contain;
    border-radius:12px;
    margin-bottom:16px;
  }

  .deals-list li{
    margin-bottom:8px;
    padding:10px;
    border-radius:12px;
    background:rgba(0,0,0,0.25);
  }

  .info{
    margin-bottom:12px;
    font-size:14px;
  }

  .distance{
    font-weight:700;
    color:var(--zep-blue);
  }

  .back-btn{
    display:inline-block;
    padding:12px 28px;
    border-radius:999px;
    font-family:Orbitron;
    font-weight:700;
    text-decoration:none;
    background:linear-gradient(90deg,var(--zep-blue),var(--zep-violet));
    color:#050015;
    box-shadow:0 0 28px rgba(0,240,255,.35);
    margin-top:16px;
  }
</style>
</head>

<body>

<div class="container">
  <header>
    <h1 id="storeName">Loading...</h1>
    <button class="home-btn" onclick="location.href='deals.html'">Home</button>
  </header>

  <img id="storeLogo" class="store-logo" />

  <div class="info" id="storeAddress"></div>
  <div class="info" id="storeHours"></div>
  <div class="info" id="storeContact"></div>
  <div class="info" id="studentInstructions">Show your student ID at checkout</div>
  <div class="info distance" id="distanceDisplay">Distance: calculating...</div>

  <h3>Available Deals</h3>
  <ul class="deals-list" id="dealsList"></ul>

  <a href="deals.html" class="back-btn">Back to Deals</a>
</div>

<script>
/* ================= SUPABASE INIT ================= */
const supabase = window.supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_ANON_KEY"
);

/* ================= GET STORE ID FROM URL ================= */
const urlParams = new URLSearchParams(window.location.search);
const storeId = urlParams.get("id");

/* ================= LOAD STORE ================= */
async function loadStore(){

  if(!storeId){
    document.querySelector(".container").innerHTML =
      "<p>No store ID provided</p>";
    return;
  }

  const { data: store, error } = await supabase
    .from("stores")
    .select("*")
    .eq("id", storeId)
    .single();

  if(error || !store){
    document.querySelector(".container").innerHTML =
      "<p>Store not found</p>";
    return;
  }

  // UI populate
  document.getElementById("storeName").textContent = store.name;
  document.getElementById("storeLogo").src = store.logo || "";

  document.getElementById("storeAddress").innerHTML =
    `Address: <a target="_blank"
     href="https://www.google.com/maps/search/?api=1&query=${store.lat},${store.lng}">
     ${store.address}</a>`;

  document.getElementById("storeHours").textContent =
    `Opening Hours: ${store.hours}`;

  document.getElementById("storeContact").textContent =
    store.contact || "";

  const dealsUl = document.getElementById("dealsList");
  dealsUl.innerHTML = "";

  (store.deals || []).forEach(deal=>{
    const li = document.createElement("li");
    li.textContent = deal;
    dealsUl.appendChild(li);
  });

  loadDistance(store.lat, store.lng);
}

/* ================= DISTANCE CALC ================= */
function loadDistance(lat2, lon2){

  if(!navigator.geolocation){
    document.getElementById("distanceDisplay").textContent =
      "Distance: not supported";
    return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat1 = pos.coords.latitude;
    const lon1 = pos.coords.longitude;

    function calc(lat1,lon1,lat2,lon2){
      const R=6371;
      const dLat=(lat2-lat1)*Math.PI/180;
      const dLon=(lon2-lon1)*Math.PI/180;
      const a=
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

      return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }

    const d = calc(lat1,lon1,lat2,lon2).toFixed(2);

    document.getElementById("distanceDisplay").textContent =
      `Distance: ${d} km`;

  },()=>{
    document.getElementById("distanceDisplay").textContent =
      "Distance unavailable";
  });
}

loadStore();
</script>

</body>
</html>
