<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Zep Swipe — Store Intelligence</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#00f0ff;
  --violet:#9c4dff;
  --bg: radial-gradient(circle at 20% 10%, #050018, #00000c);
  --glass: rgba(255,255,255,0.06);
  --stroke: rgba(255,255,255,0.12);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body{
  background:var(--bg);
  color:#fff;
  min-height:100vh;
  padding:20px;
}

/* CONTAINER */
.container{
  max-width:760px;
  margin:auto;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:22px;
  padding:22px;
  backdrop-filter:blur(20px);
  box-shadow:0 0 60px rgba(0,240,255,0.15);
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-family:Orbitron;
  font-size:1.4rem;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.btn{
  padding:8px 14px;
  border-radius:999px;
  border:none;
  font-family:Orbitron;
  cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#050015;
}

/* STORE CARD */
.store-img{
  width:100%;
  max-height:220px;
  border-radius:16px;
  object-fit:cover;
  margin-top:14px;
}

/* INFO */
.info{
  margin-top:10px;
  font-size:13px;
  opacity:0.9;
}

.distance{
  color:var(--blue);
  font-weight:700;
}

/* AI PANEL */
.ai-box{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(0,240,255,0.2);
  background:rgba(0,0,0,0.35);
}

.ai-title{
  font-family:Orbitron;
  font-size:0.8rem;
  color:var(--blue);
}

/* SCORE BAR */
.bar{
  width:100%;
  height:8px;
  background:#111;
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}

.bar-fill{
  height:100%;
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  width:0%;
}

/* DEALS */
.deal{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tag{
  font-size:10px;
  padding:4px 8px;
  border-radius:999px;
  background:#111;
  color:#00f0ff;
}

.action-btn{
  font-size:10px;
  padding:6px 10px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#000;
}

</style>
</head>

<body>

<div class="container">

<header>
  <h1 id="storeName">Loading...</h1>
  <button class="btn" onclick="location.href='deals.html'">Back</button>
</header>

<img id="storeLogo" class="store-img"/>

<div class="info" id="storeAddress"></div>
<div class="info" id="storeHours"></div>
<div class="info" id="storeContact"></div>

<div class="info distance" id="distanceDisplay">Calculating distance...</div>

<!-- AI INTELLIGENCE -->
<div class="ai-box">
  <div class="ai-title">🧠 AI Commerce Intelligence</div>
  <p id="aiInsight" class="info"></p>

  <div class="bar">
    <div id="scoreBar" class="bar-fill"></div>
  </div>

  <p id="scoreText" class="info"></p>
</div>

<!-- DEALS -->
<h3 style="margin-top:16px;font-family:Orbitron;color:var(--blue)">
  Store Deals
</h3>

<div id="dealsList"></div>

</div>

<script>

const supabase = window.supabase.createClient(
  "https://sqlisgobnayfpzamdolf.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
);

const storeId = new URLSearchParams(location.search).get("id");

/* LOAD STORE */
async function loadStore(){

  const { data: store } = await supabase
    .from("stores")
    .select("*")
    .eq("id", storeId)
    .single();

  if(!store) return;

  document.getElementById("storeName").innerText = store.name;
  document.getElementById("storeLogo").src = store.logo;
  document.getElementById("storeAddress").innerText = store.address;
  document.getElementById("storeHours").innerText = "Hours: " + store.hours;
  document.getElementById("storeContact").innerText = store.contact;

  renderDeals(store.deals || []);
  runAI(store);
  getDistance(store.lat, store.lng);
}

/* AI ENGINE 3.0 */
function runAI(store){

  let score = 60;

  if(store.deals?.length > 2) score += 15;
  if(store.hours?.includes("24")) score += 15;
  if(store.name?.length > 5) score += 10;

  let insight = "";

  if(score > 85){
    insight = "🔥 Prime campus store — high student value + strong deals.";
  } else if(score > 70){
    insight = "⚡ Good store — worth visiting for student savings.";
  } else {
    insight = "📌 Average store — check deals before visiting.";
  }

  document.getElementById("aiInsight").innerText = insight;
  document.getElementById("scoreText").innerText = "Store Score: " + score + "/100";
  document.getElementById("scoreBar").style.width = score + "%";
}

/* DEALS RENDER */
function renderDeals(deals){

  const wrap = document.getElementById("dealsList");
  wrap.innerHTML = "";

  deals.forEach(d => {

    let tag = "Budget Saver";
    if(d.includes("50") || d.includes("%")) tag = "🔥 Hot Deal";
    if(d.includes("premium")) tag = "Premium";

    const div = document.createElement("div");
    div.className = "deal";

    div.innerHTML = `
      <span>${d}</span>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="tag">${tag}</span>
        <button class="action-btn">Go</button>
      </div>
    `;

    wrap.appendChild(div);
  });
}

/* DISTANCE */
function getDistance(lat2, lon2){

  navigator.geolocation.getCurrentPosition(pos => {

    const lat1 = pos.coords.latitude;
    const lon1 = pos.coords.longitude;

    const R = 6371;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;

    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(lat1*Math.PI/180) *
      Math.cos(lat2*Math.PI/180) *
      Math.sin(dLon/2)**2;

    const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    document.getElementById("distanceDisplay").innerText =
      `📍 ${d.toFixed(2)} km away`;

  });

}

loadStore();

</script>

</body>
</html>
