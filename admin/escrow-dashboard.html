<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escrow Admin Dashboard — Zep Swipe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  font-family:Poppins;
  background:#050018;
  color:#fff;
}

header {
  padding:16px;
  text-align:center;
  font-family:Orbitron;
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  color:#000;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}

.card {
  background:rgba(255,255,255,0.06);
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.1);
}

button {
  padding:10px 14px;
  border:none;
  border-radius:999px;
  margin-top:8px;
  cursor:pointer;
  font-family:Orbitron;
}

.approve { background:#00ff94; }
.reject { background:#ff4d4d; }
.view { background:#00f0ff; }

.status {
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
  display:inline-block;
  margin-top:6px;
}

.pending { background:#ffcc00; color:#000; }
.escrowed { background:#00f0ff; color:#000; }
.released { background:#00ff94; color:#000; }
.cancelled { background:#ff4d4d; }
</style>
</head>

<body>

<header>
ESCROW ADMIN DASHBOARD
</header>

<div class="container">

<h3>All Invoices</h3>
<div id="invoiceList" class="grid"></div>

</div>

<script>

/* ================= SUPABASE INIT ================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= LOAD INVOICES ================= */
async function loadInvoices(){

  const { data, error } = await supabase
    .from("invoices")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    console.log(error);
    return;
  }

  render(data);
}

function render(invoices){

  const box = document.getElementById("invoiceList");
  box.innerHTML = "";

  invoices.forEach(inv=>{

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>Invoice: ${inv.id}</h3>
      <p>Amount: $${inv.amount}</p>
      <p>User: ${inv.student_id}</p>

      <span class="status ${inv.status}">
        ${inv.status.toUpperCase()}
      </span>

      <br>

      ${inv.status === "escrowed" ? `
        <button class="approve" onclick="release('${inv.id}','${inv.student_id}',${inv.amount})">
          Release Funds
        </button>
      ` : ""}

      ${inv.status !== "released" ? `
        <button class="reject" onclick="cancelInvoice('${inv.id}')">
          Cancel
        </button>
      ` : ""}
    `;

    box.appendChild(div);
  });
}

/* ================= RELEASE FUNDS ================= */
async function release(invoiceId, userId, amount){

  // 1. update invoice
  await supabase
    .from("invoices")
    .update({ status:"released" })
    .eq("id", invoiceId);

  // 2. credit wallet safely via RPC
  await supabase.rpc("add_balance", {
    uid: userId,
    amt: amount
  });

  // 3. notification
  await supabase.from("notifications").insert({
    user_id:userId,
    type:"released",
    text:`Invoice ${invoiceId} released: $${amount}`
  });

  alert("Funds released");
  loadInvoices();
}

/* ================= CANCEL INVOICE ================= */
async function cancelInvoice(id){

  await supabase
    .from("invoices")
    .update({ status:"cancelled" })
    .eq("id", id);

  alert("Invoice cancelled");
  loadInvoices();
}

/* ================= REALTIME UPDATES ================= */
supabase
  .channel("admin-invoices")
  .on("postgres_changes",
    { event:"*", schema:"public", table:"invoices" },
    payload => {
      loadInvoices();
    }
  )
  .subscribe();

/* ================= INIT ================= */
loadInvoices();

</script>

</body>
</html>
