<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Escrow Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }

    .release { background: #22c55e; }
    .dispute { background: #ef4444; }
    .refresh { background: #3b82f6; }
  </style>
</head>

<body>

<h2>👑 Admin Escrow Dashboard</h2>

<button class="refresh" onclick="loadEscrow()">Refresh</button>

<div id="escrowContainer"></div>

<script>
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;

/* =========================
   ADMIN AUTH CHECK
========================= */
async function checkAdmin() {
  const { data: { user } } = await supabase.auth.getUser();

  if (!user) {
    window.location.href = "/login-signup.html";
    return;
  }

  currentUser = user;

  const { data, error } = await supabase
    .from("users")
    .select("role")
    .eq("auth_id", user.id)
    .single();

  if (error || data.role !== "admin") {
    alert("Access denied: Admins only");
    window.location.href = "/login-signup.html";
  }
}

/* =========================
   LOAD ALL ESCROW (ADMIN)
========================= */
async function loadEscrow() {
  const { data, error } = await supabase
    .from("escrow")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.log(error);
    return;
  }

  render(data);
}

/* =========================
   RENDER DASHBOARD
========================= */
function render(data) {
  const container = document.getElementById("escrowContainer");
  container.innerHTML = "";

  data.forEach(item => {
    container.innerHTML += `
      <div class="card">
        <p><b>ID:</b> ${item.id}</p>
        <p><b>Buyer:</b> ${item.buyer_id}</p>
        <p><b>Seller:</b> ${item.seller_id}</p>
        <p><b>Amount:</b> ${item.amount} ZAC</p>
        <p><b>Status:</b> ${item.status}</p>

        <button class="release" onclick="releaseFunds('${item.id}')">
          Release Funds
        </button>

        <button class="dispute" onclick="markDispute('${item.id}')">
          Mark Dispute
        </button>
      </div>
    `;
  });
}

/* =========================
   RELEASE FUNDS
========================= */
async function releaseFunds(id) {
  const { error } = await supabase
    .from("escrow")
    .update({ status: "released" })
    .eq("id", id);

  if (error) {
    alert("Error releasing funds");
    return;
  }

  loadEscrow();
}

/* =========================
   MARK DISPUTE
========================= */
async function markDispute(id) {
  const { error } = await supabase
    .from("escrow")
    .update({ status: "disputed" })
    .eq("id", id);

  if (error) {
    alert("Error marking dispute");
    return;
  }

  loadEscrow();
}

/* =========================
   INIT
========================= */
checkAdmin().then(loadEscrow);

</script>

</body>
</html>
