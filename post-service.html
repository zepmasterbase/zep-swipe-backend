<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zep Swipe — Post Service</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#050816;
      color:white;
      min-height:100vh;
      background-image:
      radial-gradient(circle at top left, rgba(0,255,200,0.12), transparent 25%),
      radial-gradient(circle at bottom right, rgba(0,140,255,0.12), transparent 30%);
    }

    .container{
      max-width:800px;
      margin:auto;
      padding:30px 20px 100px;
    }

    /* HEADER */

    .header{
      text-align:center;
      margin-bottom:30px;
    }

    .logo{
      width:70px;
      margin-bottom:15px;
      filter:drop-shadow(0 0 18px rgba(0,255,255,0.4));
    }

    .title{
      font-size:2.2rem;
      font-weight:800;
      margin-bottom:10px;
    }

    .subtitle{
      color:#9fb0d5;
      line-height:1.6;
    }

    /* FORM CARD */

    .card{
      margin-top:30px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:28px;
      padding:30px;
      backdrop-filter:blur(18px);
      box-shadow:0 0 40px rgba(0,255,255,0.08);
    }

    /* UPLOAD */

    .upload-box{
      border:2px dashed rgba(0,255,255,0.3);
      border-radius:20px;
      padding:35px;
      text-align:center;
      margin-bottom:25px;
      cursor:pointer;
      transition:0.3s;
      background:rgba(0,255,255,0.03);
    }

    .upload-box:hover{
      border-color:#00ffe1;
      background:rgba(0,255,255,0.06);
    }

    .upload-box p{
      color:#9fb0d5;
      margin-top:10px;
      font-size:0.95rem;
    }

    input[type="file"]{
      display:none;
    }

    /* INPUTS */

    label{
      display:block;
      margin-top:18px;
      margin-bottom:8px;
      font-weight:600;
      color:#cfe3ff;
    }

    input, textarea, select{
      width:100%;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.05);
      color:white;
      outline:none;
      font-size:0.95rem;
    }

    textarea{
      min-height:90px;
      resize:none;
    }

    /* CATEGORIES */

    .categories{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:10px;
    }

    .chip{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.05);
      cursor:pointer;
      font-size:0.85rem;
      transition:0.3s;
    }

    .chip:hover{
      border-color:#00ffe1;
      background:rgba(0,255,225,0.1);
    }

    /* BUTTON */

    .btn{
      margin-top:25px;
      width:100%;
      padding:16px;
      border:none;
      border-radius:18px;
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      background:linear-gradient(90deg,#00ffe1,#00a2ff);
      color:#03111f;
      box-shadow:0 0 30px rgba(0,255,255,0.3);
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    /* FOOTNOTE */

    .note{
      text-align:center;
      margin-top:20px;
      color:#8fa2c7;
      font-size:0.9rem;
    }

    /* QUICK TIP */

    .tip{
      margin-top:15px;
      font-size:0.85rem;
      color:#7df9ff;
      text-align:center;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <img
        src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jpitama61nopisi19aqb041vvo15.png"
        class="logo"
        alt="Zep Swipe Logo"
      />

      <div class="title">
        Start Earning Today
      </div>

      <div class="subtitle">
        Post your service and connect instantly with students & locals in Randfontein.
      </div>

    </div>

    <!-- FORM -->

    <div class="card">

      <!-- IMAGE UPLOAD -->
      <label>Service Photo</label>

      <label class="upload-box">
        📸 Click to upload image
        <p>Add a clear photo of your service or work</p>
        <input type="file" />
      </label>

      <!-- TITLE -->
      <label>Service Title</label>
      <input type="text" placeholder="e.g. Maths Tutoring, Food Delivery, CV Design" />

      <!-- CATEGORY -->
      <label>Category</label>
      <div class="categories">

        <div class="chip">🍔 Food</div>
        <div class="chip">📚 Tutoring</div>
        <div class="chip">💻 Digital</div>
        <div class="chip">🚚 Errands</div>
        <div class="chip">📸 Photography</div>
        <div class="chip">🛠 Repairs</div>

      </div>

      <!-- DESCRIPTION -->
      <label>Description</label>
      <textarea placeholder="Describe your service in a few words..."></textarea>

      <!-- PRICE -->
      <label>Starting Price (Optional)</label>
      <input type="text" placeholder="e.g. R50, R100..." />

      <!-- LOCATION -->
      <label>Location</label>
      <input type="text" value="Randfontein" />

      <!-- WHATSAPP -->
      <label>WhatsApp Number</label>
      <input type="text" placeholder="e.g. +27..." />

      <!-- BUTTON -->
      <button class="btn">
        🚀 Post My Service
      </button>

      <div class="tip">
        ⚡ Most students start getting messages within minutes after posting
      </div>

    </div>

    <div class="note">
      Built for the Randfontein Student Economy • Zep Swipe Beta
    </div>

  </div>

</body>
</html>
