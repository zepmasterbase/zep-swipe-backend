<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--text:#fff;--muted:#aaa;--border:#262626;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px}
header{position:sticky;top:0;background:#090909;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:800}
.logo img{width:32px;height:32px}
.search{padding:16px}
.search input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:#fff}
.hero{margin:0 16px 16px;background:linear-gradient(135deg,#141414,#102010);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex}
.hero img{width:42%;object-fit:cover}
.hero-content{padding:16px}
.btn{display:inline-block;background:var(--accent);color:#000;padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:700;margin-top:10px;border:none}
.section{padding:16px}
.scroll{display:flex;overflow:auto;gap:10px;padding:0 16px 16px}
.scroll-card,.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
.scroll-card{min-width:220px;padding:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;padding:0 16px}
.card img{width:100%;height:180px;object-fit:cover;border-radius:16px 16px 0 0}
.content{padding:14px}
.badge{display:inline-block;padding:5px 10px;background:rgba(184,255,59,.15);color:var(--accent);border-radius:999px;font-size:11px}
footer{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px}
footer a{color:#fff;text-decoration:none;text-align:center;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:420px;width:100%}
.modal-box input,.modal-box textarea{width:100%;margin-top:10px;padding:12px;background:#0b0b0b;color:#fff;border:1px solid var(--border);border-radius:10px}
</style>
</head>
<body>

<header>
<div class="logo">
<img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jpitama61nopisi19aqb041vvo15.png">
<span>Zep Swipe</span>
</div>
<div>🔔</div>
</header>

<div class="search"><input id="search" placeholder="Search services, tutors, deals..."></div>

<div class="hero">
<img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jrg40d1f1srq1v5l1m4omlrpjt1a.png">
<div class="hero-content">
<h2 style="color:#b8ff3b">💰 Earn on the Side</h2>
<p>Offer your skills. Make money. Help your community.</p>
<a class="btn" href="login.html">Start Earning</a>
</div>
</div>

<div class="section"><h2>🔥 Popular Near You</h2></div>
<div class="scroll" id="popular"></div>

<div class="section"><h2>🛠️ Services</h2></div>
<div class="cards" id="services"></div>

<div class="section"><h2>🏷️ Deals</h2></div>
<div class="cards" id="deals"></div>

<footer>
<a href="index.html">🏠<br>Home</a>
<a href="marketplace.html">🛠️<br>Services</a>
<a href="login.html">💲<br>Earn</a>
<a href="business-deals.html">➕<br>List Deal</a>
<a href="waitlist.html">👤<br>Waitlist</a>
</footer>

<div class="modal" id="bookingModal">
<div class="modal-box">
<h3>Request Service</h3>
<input id="customerName" placeholder="Your Name">
<textarea id="jobDetails" placeholder="Describe what you need"></textarea>
<button class="btn" onclick="payNow()">Continue to Payment</button>
<button class="btn" style="background:#333;color:#fff" onclick="closeModal()">Close</button>
</div>
</div>

<script>
const COMMISSION_RATE=0.10;
let currentProvider=null;

const providers=[
{name:"Math Tutor",service:"Math Tutoring",price:200,hires:48,image:"https://payhip.com/cdn-cgi/image/format=auto,width=1500/https://pe56d.s3.amazonaws.com/o_1jrg40ll0rmnvj215qr12o2331g.png"},
{name:"Graphic Designer",service:"Graphic Design",price:250,hires:32,image:"https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jrg40d1f1srq1v5l1m4omlrpjt1a.png"}
];

const deals=[{title:"50% Student Meal",description:"Limited student special"}];

function render(){
popular.innerHTML=providers.map(p=>`<div class='scroll-card'><b>${p.service}</b><br>${p.hires} hires</div>`).join("");
services.innerHTML=providers.map((p,i)=>`<div class='card'><img src='${p.image}'><div class='content'><span class='badge'>Featured</span><h3>${p.service}</h3><p>From R${p.price}</p><button class='btn' onclick='openBooking(${i})'>Request Service</button></div></div>`).join("");
deals.innerHTML=dealsData();
}
function dealsData(){return deals.map(d=>`<div class='card'><div class='content'><span class='badge'>Featured Deal 🔥</span><h3>${d.title}</h3><p>${d.description}</p></div></div>`).join("")}
function openBooking(i){currentProvider=providers[i];bookingModal.style.display='flex';}
function closeModal(){bookingModal.style.display='none';}
function payNow(){
const fee=currentProvider.price*COMMISSION_RATE;
const student=currentProvider.price-fee;
alert(`Paystack Checkout\nCustomer Pays: R${currentProvider.price}\nPlatform Fee: R${fee.toFixed(2)}\nStudent Receives: R${student.toFixed(2)}\n\nConnect Paystack here.`);
}
render();
</script>

</body>
</html>
