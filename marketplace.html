<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui,sans-serif;
background:radial-gradient(circle at top,#0a1510,#050807);
color:#fff;
padding-bottom:95px;
}
header{
position:sticky;top:0;z-index:100;
background:rgba(5,8,7,.92);
backdrop-filter:blur(20px);
padding:14px;
border-bottom:1px solid rgba(0,255,140,.12);
display:flex;justify-content:space-between;align-items:center;
}
.logo{font-weight:800;color:#00ff8c}
.container{max-width:600px;margin:auto;padding:14px}
.search{
margin:14px 0;
background:rgba(255,255,255,.05);
border:1px solid rgba(0,255,140,.12);
border-radius:18px;padding:14px
}
.search input{
width:100%;background:none;border:none;color:#fff;
outline:none;font-size:15px
}
.stories{display:flex;gap:12px;overflow:auto;padding-bottom:10px}
.story{text-align:center;min-width:72px}
.story img{
width:62px;height:62px;border-radius:50%;
border:2px solid #00ff8c;object-fit:cover
}
.story span{display:block;font-size:11px;margin-top:6px}
.chips{display:flex;gap:8px;overflow:auto;margin:14px 0}
.chip{
padding:10px 14px;border-radius:999px;
background:rgba(0,255,140,.08);
border:1px solid rgba(0,255,140,.15);
white-space:nowrap
}
.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:14px;margin-top:14px
}
.featured{
background:linear-gradient(135deg,rgba(0,255,140,.18),rgba(0,194,255,.12));
}
.badge{
display:inline-block;
padding:5px 10px;border-radius:999px;
background:rgba(0,255,140,.12);
color:#00ff8c;font-size:12px
}
.service-top{display:flex;gap:12px;align-items:center}
.avatar{
width:64px;height:64px;border-radius:50%;object-fit:cover
}
.meta h3{margin:0}
.small{opacity:.75;font-size:13px}
.price{
color:#00ff8c;font-weight:700;margin-top:6px
}
.btn{
width:100%;border:none;border-radius:14px;
padding:13px;margin-top:12px;font-weight:700;
background:linear-gradient(90deg,#00ff8c,#00c2ff);
color:#000;cursor:pointer
}
.deal-img{
width:100%;height:180px;object-fit:cover;
border-radius:16px;margin-bottom:10px
}
.tabs{
display:flex;margin-top:16px;
background:rgba(255,255,255,.04);
border-radius:14px;overflow:hidden
}
.tab{
flex:1;padding:12px;text-align:center;cursor:pointer
}
.active{
background:rgba(0,255,140,.12);
color:#00ff8c
}
.hidden{display:none}
.bottom-nav{
position:fixed;bottom:0;left:0;right:0;
height:78px;background:rgba(5,8,7,.95);
display:flex;justify-content:space-around;align-items:center;
border-top:1px solid rgba(0,255,140,.12)
}
.nav-item{
display:flex;flex-direction:column;
align-items:center;font-size:11px;color:#fff;text-decoration:none
}
.nav-main{
width:62px;height:62px;border-radius:50%;
background:linear-gradient(90deg,#00ff8c,#00c2ff);
color:#000;justify-content:center;margin-top:-26px
}
</style>
</head>
<body>

<header>
<div class="logo">⚡ Zep Swipe</div>
<div>🟢 Live</div>
</header>

<div class="container">

<h2>Find Student Talent Near You</h2>

<div class="search">
<input id="searchInput" placeholder="Search students, skills or deals...">
</div>

<div class="stories">
<div class="story"><img src="https://picsum.photos/100?1"><span>Tutors</span></div>
<div class="story"><img src="https://picsum.photos/100?2"><span>Designers</span></div>
<div class="story"><img src="https://picsum.photos/100?3"><span>Developers</span></div>
<div class="story"><img src="https://picsum.photos/100?4"><span>Deals</span></div>
<div class="story"><img src="https://picsum.photos/100?5"><span>Jobs</span></div>
</div>

<div class="chips">
<div class="chip">🎨 Design</div>
<div class="chip">💻 Tech</div>
<div class="chip">📚 Tutors</div>
<div class="chip">📸 Media</div>
<div class="chip">📈 Marketing</div>
</div>

<div class="card featured">
<span class="badge">🏆 Student Marketplace</span>
<h3>Discover • Hire • Earn</h3>
<p class="small">Premium student-powered marketplace for services and deals.</p>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('services',this)">Services</div>
<div class="tab" onclick="showTab('deals',this)">Deals</div>
</div>

<div id="services"></div>
<div id="deals" class="hidden"></div>

</div>

<nav class="bottom-nav">
<a href="#" class="nav-item"><i data-lucide="home"></i><span>Home</span></a>
<a href="#" class="nav-item"><i data-lucide="search"></i><span>Discover</span></a>
<a href="#" class="nav-item nav-main"><i data-lucide="plus"></i></a>
<a href="#" class="nav-item"><i data-lucide="message-circle"></i><span>Messages</span></a>
<a href="#" class="nav-item"><i data-lucide="user"></i><span>Profile</span></a>
</nav>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showTab(tab,el){
document.getElementById('services').classList.toggle('hidden',tab!=='services');
document.getElementById('deals').classList.toggle('hidden',tab!=='deals');
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
}

function contact(phone){
window.open(`https://wa.me/${phone}`,'_blank');
}

async function loadServices(){
const {data}=await client.from('service_profiles').select('*').eq('online',true);

document.getElementById('services').innerHTML=(data||[]).map(s=>`
<div class="card service-card">
<div class="service-top">
<img class="avatar" src="${s.avatar_url||'https://picsum.photos/100'}">
<div class="meta">
<h3>${s.name||'Student'}</h3>
<div class="small">⭐ ${s.rating||'New'} • ✓ Verified Student</div>
<div class="small">📍 ${s.location||''}</div>
</div>
</div>
<p>${s.description||''}</p>
<div class="price">💰 ${s.price||''}</div>
<button class="btn" onclick="contact('${s.phone||''}')">Hire via WhatsApp</button>
</div>`).join('');
}

async function loadDeals(){
const {data}=await client.from('deals').select('*');

document.getElementById('deals').innerHTML=(data||[]).map(d=>`
<div class="card">
<img class="deal-img" src="${d.image_url||'https://picsum.photos/600/300'}">
<span class="badge">🔥 Deal</span>
<h3>${d.title||''}</h3>
<p><strong>${d.business_name||''}</strong></p>
<p>${d.description||''}</p>
<p class="small">📍 ${d.location||''}</p>
<p class="small">⏰ ${d.valid_until||'Limited Time'}</p>
<button class="btn" onclick="contact('${d.phone||''}')">Claim Deal</button>
</div>`).join('');
}

client.channel('marketplace')
.on('postgres_changes',{event:'*',schema:'public'},()=>{
loadServices();loadDeals();
}).subscribe();

loadServices();
loadDeals();
lucide.createIcons();
</script>
</body>
</html>
