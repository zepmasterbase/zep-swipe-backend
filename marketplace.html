<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V4</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f0d;
  color: white;
}

header {
  position: sticky;
  top: 0;
  padding: 12px;
  display:flex;
  justify-content:space-between;
  background: rgba(10,14,12,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,255,140,0.12);
}

.logo {
  color:#00ff8c;
  font-weight:700;
}

.container {
  max-width: 900px;
  margin:auto;
  padding: 14px;
}

/* =========================
   CARD
========================= */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 14px;
  margin-top: 12px;
}

/* =========================
   BUTTONS
========================= */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
}

.accept {
  background: #00ff8c;
  color: black;
}

.skip {
  background: rgba(255,255,255,0.08);
  color: white;
}

/* =========================
   BADGE
========================= */
.badge {
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:rgba(0,255,140,0.1);
  color:#00ff8c;
  font-size:11px;
}

/* STATUS */
.status-open { color: #ffcc00; }
.status-broadcast { color: #00bfff; }
.status-matched { color: #00ff8c; }

.small {
  font-size: 12px;
  opacity: 0.7;
}

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Marketplace V4 Live</div>
</header>

<div class="container">

  <h3>🔥 Live Job Feed</h3>

  <div id="feed"></div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   LOAD JOBS
========================= */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .order("created_at", { ascending: false });

  render(data || []);
}

/* =========================
   RENDER
========================= */
function render(jobs){

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  jobs.forEach(job => {

    feed.innerHTML += `
      <div class="card">

        <span class="badge">${job.category}</span>

        <h3>${job.description}</h3>

        <p class="small">📍 ${job.location}</p>

        <p class="status-${job.status}">
          Status: ${job.status}
        </p>

        ${job.status === "open" ? `
          <button class="accept" onclick="acceptJob('${job.id}')">
            ⚡ Accept Job
          </button>

          <button class="skip" onclick="skipJob()">
            Skip
          </button>
        ` : ""}

        ${job.status === "broadcast" ? `
          <p class="small">📡 Broadcasting to providers...</p>
        ` : ""}

        ${job.status === "matched" ? `
          <p class="small">👤 Assigned: ${job.matched_provider}</p>
        ` : ""}

      </div>
    `;
  });
}

/* =========================
   ACCEPT JOB
========================= */
async function acceptJob(jobId){

  const phone = prompt("Enter your provider WhatsApp number");

  const { data: job } = await client
    .from("service_requests")
    .select("*")
    .eq("id", jobId)
    .single();

  if(job.status === "matched"){
    return alert("Job already taken");
  }

  await client
    .from("service_requests")
    .update({
      status: "matched",
      matched_provider: phone
    })
    .eq("id", jobId);

  loadJobs();
}

/* =========================
   SKIP
========================= */
function skipJob(){
  alert("Skipped");
}

/* =========================
   AUTO RE-DISPATCH ENGINE V4
========================= */
async function retryUnmatchedJobs(){

  const { data: jobs } = await client
    .from("service_requests")
    .select("*")
    .eq("status", "broadcast");

  if(!jobs) return;

  jobs.forEach(async (job) => {

    const created = new Date(job.created_at);
    const now = new Date();

    const diff = (now - created) / 1000;

    // if 45 seconds passed → retry dispatch
    if(diff > 45){

      console.log("Retrying job:", job.id);

      await client
        .from("service_requests")
        .update({ status: "open" })
        .eq("id", job.id);
    }
  });
}

/* =========================
   REAL-TIME ENGINE
========================= */
client
  .channel('service_requests')
  .on('postgres_changes',
    { event: '*', schema: 'public', table: 'service_requests' },
    () => {
      loadJobs();
    }
  )
  .subscribe();

/* LOOP */
setInterval(retryUnmatchedJobs, 15000);

/* INIT */
loadJobs();

</script>

</body>
</html>
