<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V5</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* GLOBAL */
body {
  margin: 0;
  font-family: system-ui, -apple-system, Arial;
  background: #0b0f0d;
  color: #fff;
}

/* HEADER (UBER STYLE) */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: rgba(10, 14, 12, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,255,140,0.15);
}

/* LOGO AREA */
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  color: #00ff8c;
  font-size: 16px;
}

.dot {
  width: 8px;
  height: 8px;
  background: #00ff8c;
  border-radius: 50%;
  box-shadow: 0 0 10px #00ff8c;
}

/* BUTTONS */
.btn {
  background: #00ff8c;
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  font-size: 13px;
}

.btn.dark {
  background: rgba(255,255,255,0.08);
  color: white;
}

/* PAGE WRAPPER */
.container {
  padding: 14px;
  max-width: 900px;
  margin: auto;
}

/* SECTION TITLE */
h2 {
  font-size: 16px;
  margin: 10px 0;
  color: #00ff8c;
}

/* JOB CARD (UBER STYLE) */
.card {
  background: #111715;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-2px);
  border-color: rgba(0,255,140,0.3);
}

/* JOB HEADER */
.job-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* CATEGORY BADGE */
.badge {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 20px;
  background: rgba(0,255,140,0.15);
  color: #00ff8c;
}

/* STATUS */
.status {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 20px;
}

.open { background: orange; color: black; }
.matched { background: #00ff8c; color: black; }
.accepted { background: #2b6fff; color: white; }

/* JOB INFO */
.job-desc {
  margin-top: 8px;
  font-size: 14px;
  opacity: 0.9;
}

.meta {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 6px;
}

/* ACTIONS */
.actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.actions button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}

.accept {
  background: #00ff8c;
  color: black;
}

.whatsapp {
  background: rgba(255,255,255,0.08);
  color: white;
}

/* FLOAT WAITLIST */
.fab {
  position: fixed;
  bottom: 18px;
  right: 18px;
  background: #00ff8c;
  color: black;
  padding: 14px 16px;
  border-radius: 50px;
  font-weight: 700;
  box-shadow: 0 0 20px rgba(0,255,140,0.3);
  cursor: pointer;
}

/* MOBILE OPTIMIZATION */
@media(max-width:600px){
  .container { padding: 10px; }
  header { padding: 10px; }
  .btn { font-size: 12px; padding: 7px 10px; }
}

</style>
</head>

<body>

<header>

  <div class="logo">
    <div class="dot"></div>
    Zep Swipe
  </div>

  <div style="display:flex;gap:8px;">
    <button class="btn dark" onclick="loadJobs()">Refresh</button>
    <button class="btn" onclick="window.location.href='waitlists.html'">Join</button>
  </div>

</header>

<div class="container">

  <h2>⚡ Live Jobs (Randfontein)</h2>

  <div id="jobs"></div>

</div>

<div class="fab" onclick="window.location.href='waitlists.html'">
  Join Waitlist
</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* LOAD JOBS */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .order("created_at",{ascending:false});

  render(data || []);
}

/* RENDER */
function render(jobs){

  const box = document.getElementById("jobs");
  box.innerHTML = "";

  jobs.forEach(job => {

    box.innerHTML += `
      <div class="card">

        <div class="job-top">
          <span class="badge">${job.category}</span>
          <span class="status ${job.status}">${job.status}</span>
        </div>

        <div class="job-desc">
          ${job.description}
        </div>

        <div class="meta">
          📍 ${job.location}
        </div>

        <div class="actions">

          <button class="accept" onclick="acceptJob('${job.id}')">
            Accept
          </button>

          <button class="whatsapp" onclick="wa('${job.matched_phone}','${job.description}')">
            WhatsApp
          </button>

        </div>

      </div>
    `;
  });
}

/* ACCEPT */
async function acceptJob(id){

  await client
    .from("service_requests")
    .update({ status:"accepted" })
    .eq("id", id);

  loadJobs();
}

/* WHATSAPP */
function wa(phone, msg){

  if(!phone) return;

  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
    "_blank"
  );
}

/* INIT */
loadJobs();

</script>

</body>
</html>
