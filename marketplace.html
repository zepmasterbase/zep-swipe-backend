<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#070707;--card:#151515;--line:#2b2b2b;--accent:#b8ff3b}
*{box-sizing:border-box;font-family:Inter,sans-serif}body{margin:0;background:var(--bg);color:#fff;padding-bottom:84px}
header{position:sticky;top:0;background:#0b0b0b;border-bottom:1px solid var(--line);z-index:10}
.header{max-width:1400px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--accent)}
.logo img{width:38px;height:38px;border-radius:10px}
.icon{position:relative}.dot{position:absolute;right:-2px;top:-2px;width:10px;height:10px;background:#ff3b30;border-radius:50%}
.wrap{max-width:1400px;margin:auto;padding:16px}
.hero{border-radius:24px;padding:42px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.8)),url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover}
.btn{display:inline-block;background:var(--accent);color:#000;text-decoration:none;padding:14px 20px;border-radius:12px;font-weight:800;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.stat{text-align:center;padding:16px}
.search input{width:100%;padding:14px;background:#111;color:#fff;border:1px solid var(--line);border-radius:12px}
.row{display:flex;gap:14px;overflow:auto;padding:8px 0}
.card{min-width:220px;overflow:hidden}
.card img{width:100%;height:130px;object-fit:cover}.c{padding:12px}
button{width:100%;padding:10px;border:none;border-radius:10px;background:var(--accent);font-weight:700}
footer{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px}
footer a{text-decoration:none;color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center}
</style></head>
<body>
<header><div class="header">
<div class="logo">
<img src="https://payhip.com/cdn-cgi/image/format=auto,width=1500/https://pe56d.s3.amazonaws.com/o_1jrl9bj473pej4dqgtbqh12315.png">
<span>ZEP SWIPE</span>
</div>
<div class="icon"><i data-lucide="bell"></i><span class="dot"></span></div>
</div></header>

<div class="wrap">
<section class="hero">
<h1>Hire trusted student talent.</h1>
<p>Verified providers • Escrow protected • Student deals.</p>
<a class="btn" href="auth.html">Post Job / Hire Now</a>
</section>

<div class="stats">
<div class="stat"><h2 id="servicesCount">0</h2><small>Services</small></div>
<div class="stat"><h2 id="providersCount">0</h2><small>Providers</small></div>
<div class="stat"><h2 id="businessCount">0</h2><small>Businesses</small></div>
<div class="stat"><h2 id="dealsCount">0</h2><small>Deals</small></div>
</div>

<div class="search"><input id="search" placeholder="Search services or providers"></div>

<h2>Popular Services</h2>
<div id="services" class="row"></div>

<h2>Top Providers</h2>
<div id="providers" class="row"></div>
</div>

<footer>
<a href="index.html"><i data-lucide="home"></i>Home</a>
<a href="marketplace.html"><i data-lucide="briefcase"></i>Services</a>
<a href="auth.html"><i data-lucide="ticket-percent"></i>Deals</a>
<a href="auth.html"><i data-lucide="coins"></i>Earn</a>
<a href="auth.html"><i data-lucide="user"></i>Account</a>
</footer>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function loadMarketplace(q=""){
 const {data:services=[]}=await db.from("services").select("*").ilike("title","%"+q+"%");
 servicesCount.textContent=services.length;
 providersCount.textContent=new Set(services.map(s=>s.provider_name)).size;
 services.innerHTML="";
 providers.innerHTML="";
 services.forEach(s=>{
   services.insertAdjacentHTML("beforeend",`
   <div class="card">
   <img src="${s.image_url||'https://picsum.photos/400/240'}">
   <div class="c">
   <h3>${s.title}</h3>
   <p>R${s.price}</p>
   <button onclick="bookService('${s.id}')">Book Service</button>
   </div></div>`);
   providers.insertAdjacentHTML("beforeend",`
   <div class="card">
   <img src="${s.image_url||'https://picsum.photos/400/240'}">
   <div class="c">
   <h3>${s.provider_name||'Student Provider'}</h3>
   <p>⭐ ${s.rating||'New'}</p>
   </div></div>`);
 });
}
async function bookService(id){
 const {data}=await db.auth.getSession();
 if(!data.session){
   localStorage.setItem("zep_booking_service",id);
   location.href="auth.html";
   return;
 }
 location.href="customer.html?service="+encodeURIComponent(id);
}
search.addEventListener("input",e=>loadMarketplace(e.target.value));
loadMarketplace();
lucide.createIcons();
</script>
</body></html>
