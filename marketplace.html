<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V6</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* GLOBAL */
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #070b09;
  color: white;
  overflow-x: hidden;
}

/* FLOATING BACKGROUND ICONS */
.bg-icons {
  position: fixed;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
}

.icon {
  position: absolute;
  font-size: 24px;
  opacity: 0.08;
  animation: float 12s infinite linear;
  color: #00ff8c;
}

@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); }
  100% { transform: translateY(-10vh) rotate(360deg); }
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: rgba(10,15,12,0.9);
  border-bottom: 1px solid rgba(0,255,140,0.15);
  backdrop-filter: blur(10px);
}

.logo {
  font-weight: 700;
  color: #00ff8c;
}

/* BUTTONS */
.btn {
  padding: 8px 10px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  font-size: 12px;
}

.primary { background:#00ff8c; color:black; }
.dark { background:rgba(255,255,255,0.08); color:white; }

/* CONTAINER */
.container {
  position: relative;
  z-index: 2;
  padding: 14px;
  max-width: 900px;
  margin: auto;
}

/* JOB CARD */
.card {
  background: #101814;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-2px);
  border-color: rgba(0,255,140,0.3);
}

/* TOP ROW */
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* BADGES */
.category {
  font-size:11px;
  background:rgba(0,255,140,0.15);
  color:#00ff8c;
  padding:4px 8px;
  border-radius:20px;
}

/* STATUS */
.status {
  font-size:11px;
  padding:4px 8px;
  border-radius:20px;
}

.open { background:orange; color:black; }
.accepted { background:#2b6fff; }
.completed { background:gray; }

/* PROVIDER RANK BADGE */
.rank {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 20px;
  font-weight: 700;
}

.bronze { background:#cd7f32; color:black; }
.silver { background:#c0c0c0; color:black; }
.gold { background:#ffd700; color:black; }
.founder { background:#00ff8c; color:black; }

/* DESCRIPTION */
.desc {
  margin-top: 8px;
  font-size: 14px;
  opacity: 0.9;
}

/* META */
.meta {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 6px;
}

/* ACTIONS */
.actions {
  display:flex;
  gap:8px;
  margin-top:10px;
}

.actions button {
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.accept { background:#00ff8c; color:black; }
.wa { background:#222; color:white; }

/* FLOAT BUTTON */
.fab {
  position:fixed;
  bottom:18px;
  right:18px;
  background:#00ff8c;
  color:black;
  padding:14px 16px;
  border-radius:50px;
  font-weight:700;
  box-shadow:0 0 20px rgba(0,255,140,0.3);
}

/* MOBILE */
@media(max-width:600px){
  .btn { font-size:11px; }
}

</style>
</head>

<body>

<!-- BACKGROUND ICONS -->
<div class="bg-icons">
  <div class="icon" style="left:10%; animation-delay:0s;">💼</div>
  <div class="icon" style="left:20%; animation-delay:2s;">📱</div>
  <div class="icon" style="left:40%; animation-delay:4s;">🔧</div>
  <div class="icon" style="left:60%; animation-delay:1s;">🎓</div>
  <div class="icon" style="left:80%; animation-delay:3s;">🚚</div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">⚡ Zep Swipe</div>

  <div style="display:flex;gap:6px;">
    <button class="btn dark" onclick="window.location.href='provider.html'">
      Join Provider
    </button>

    <button class="btn primary" onclick="window.location.href='waitlists.html'">
      Join Waitlist
    </button>
  </div>
</header>

<!-- MAIN -->
<div class="container">

  <h3 style="color:#00ff8c;">📍 Live Jobs (Randfontein)</h3>

  <div id="jobs"></div>

</div>

<!-- FLOAT -->
<div class="fab" onclick="window.location.href='waitlists.html'">
  Join Now
</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* LOAD JOBS */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .order("created_at",{ascending:false});

  render(data || []);
}

/* RANK SYSTEM */
function getRank(points){

  if(points >= 150) return "founder";
  if(points >= 80) return "gold";
  if(points >= 30) return "silver";
  return "bronze";
}

/* RENDER */
function render(jobs){

  const box = document.getElementById("jobs");
  box.innerHTML = "";

  jobs.forEach(job => {

    // fake provider rank (replace later with real provider table)
    const rank = getRank(Math.floor(Math.random()*200));

    box.innerHTML += `
      <div class="card">

        <div class="top">
          <span class="category">${job.category}</span>
          <span class="status ${job.status}">${job.status}</span>
        </div>

        <div class="desc">
          ${job.description}
        </div>

        <div class="meta">
          📍 ${job.location}
        </div>

        <div style="margin-top:8px;">
          <span class="rank ${rank}">
            Provider Rank: ${rank.toUpperCase()}
          </span>
        </div>

        <div class="actions">

          <button class="accept" onclick="acceptJob('${job.id}')">
            Accept
          </button>

          <button class="wa" onclick="wa('${job.matched_phone}','${job.description}')">
            WhatsApp
          </button>

        </div>

      </div>
    `;
  });
}

/* ACCEPT */
async function acceptJob(id){

  await client
    .from("service_requests")
    .update({ status:"accepted" })
    .eq("id", id);

  loadJobs();
}

/* WHATSAPP */
function wa(phone, msg){

  if(!phone) return;

  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,
    "_blank"
  );
}

/* INIT */
loadJobs();

</script>

</body>
</html>
