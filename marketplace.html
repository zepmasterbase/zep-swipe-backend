<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Marketplace V28</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--border:#262626;--text:#fff;--muted:#aaa;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px}
header{position:sticky;top:0;background:#0b0b0b;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;color:var(--accent)}
.search{padding:16px}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:#111;color:#fff}
.hero,.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
.hero{margin:16px;padding:16px}
.btn{background:var(--accent);color:#000;border:none;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:16px}
.card{padding:14px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(184,255,59,.15);color:var(--accent);font-size:12px}
.section-title{padding:0 16px 12px;color:var(--accent)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);padding:20px;overflow:auto}
.modalbox{max-width:560px;margin:40px auto;background:#141414;border:1px solid var(--border);border-radius:16px;padding:20px}
footer{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px}
footer a{text-decoration:none;color:#fff;font-size:12px;text-align:center}
</style>
</head>
<body>

<header>
<div class="logo">⚡ Zep Swipe V28</div>
<div>🔔</div>
</header>

<div class="search">
<input id="search" placeholder="Search services, tutors, designers...">
</div>

<div class="hero">
<h2>💰 Earn on the Side</h2>
<p>Offer your skills. Make money. Help your community.</p><br>
<a href="login.html"><button class="btn">Start Earning</button></a>
</div>

<h3 class="section-title">🔥 Featured Providers</h3>
<div class="grid" id="featured"></div>

<h3 class="section-title">🛠 Services</h3>
<div class="grid" id="services"></div>

<h3 class="section-title">🏷️ Deals</h3>
<div class="grid" id="deals"></div>

<div class="modal" id="bookingModal">
<div class="modalbox">
<h2>Book Service</h2>
<input id="customerName" placeholder="Full Name">
<input id="customerPhone" placeholder="Phone Number">
<input id="quantity" type="number" value="1" min="1">
<textarea id="jobDetails" placeholder="Describe your requirements"></textarea>
<p id="pricePreview">Total: R0</p>
<button class="btn" onclick="createBooking()">Continue to Payment</button>
<button class="btn" style="margin-top:10px" onclick="closeModal()">Close</button>
</div>
</div>

<footer>
<a href="index.html">🏠<br>Home</a>
<a href="marketplace.html">🛠️<br>Services</a>
<a href="login.html">💰<br>Earn</a>
<a href="business-deals.html">🏷️<br>Deals</a>
<a href="provider.html">👤<br>Profile</a>
</footer>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const PLATFORM_FEE=0.10;
let selectedService=null;

async function loadMarketplace(){
document.getElementById("featured").innerHTML=`
<div class="card"><span class="badge">Featured</span><h3>Math Tutor</h3><p>4.9⭐ Rating</p></div>`;

document.getElementById("services").innerHTML=`
<div class="card">
<span class="badge">Hourly</span>
<h3>Math Tutor</h3>
<p>R200/hour</p>
<button class="btn" onclick='openBooking({id:"provider1",name:"Math Tutor",price:200,type:"hourly"})'>Book Service</button>
</div>
<div class="card">
<span class="badge">Fixed</span>
<h3>Graphic Design</h3>
<p>R350</p>
<button class="btn" onclick='openBooking({id:"provider2",name:"Graphic Design",price:350,type:"fixed"})'>Book Service</button>
</div>`;

document.getElementById("deals").innerHTML=`
<div class="card"><span class="badge">Deal</span><h3>50% Student Meal</h3></div>`;
}

function openBooking(service){
selectedService=service;
document.getElementById("bookingModal").style.display="block";
updatePrice();
}

function closeModal(){
document.getElementById("bookingModal").style.display="none";
}

document.addEventListener("input",updatePrice);

function updatePrice(){
if(!selectedService) return;
const qty=parseInt(document.getElementById("quantity").value||1);
const subtotal=selectedService.type==="hourly" ? selectedService.price*qty : selectedService.price;
const fee=subtotal*PLATFORM_FEE;
const total=subtotal+fee;
document.getElementById("pricePreview").innerHTML=
`Subtotal: R${subtotal}<br>Platform Fee: R${fee.toFixed(2)}<br>Total: R${total.toFixed(2)}`;
}

async function createBooking(){
const qty=parseInt(document.getElementById("quantity").value||1);
const subtotal=selectedService.type==="hourly" ? selectedService.price*qty : selectedService.price;

const booking={
provider_id:selectedService.id,
customer_name:customerName.value,
customer_phone:customerPhone.value,
service_name:selectedService.name,
quantity:qty,
amount:subtotal,
status:"pending"
};

// await client.from("service_requests").insert([booking]);
// await client.from("notifications").insert([{message:"New booking"}]);
// Paystack initialization goes here

alert("V28 booking created architecture ready for Supabase + Paystack.");
closeModal();
}

loadMarketplace();
</script>

</body>
</html>
