<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Marketplace V60 Backend Ready</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--border:#262626}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:#fff;padding-bottom:90px}
header{padding:14px 16px;background:#0b0b0b;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:42px;height:42px}
.hero,.card{margin:16px;background:#141414;border:1px solid #262626;border-radius:20px}
.hero{padding:30px}
.card{padding:16px}
.search input{width:100%;padding:12px;background:#101010;border:1px solid #262626;color:#fff;border-radius:12px}
.row{display:flex;gap:16px;overflow:auto;padding:16px}
.item{min-width:280px;background:#101010;border:1px solid #262626;border-radius:16px;padding:12px}
.btn{width:100%;padding:12px;margin-top:10px;border:none;border-radius:12px;background:#b8ff3b;color:#000;font-weight:800}
.footer{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid #262626;display:flex;justify-content:space-around;padding:12px}
.footer a{color:#fff;text-decoration:none}
</style>
</head>
<body>

<header>
<div class="brand">
<img src="https://pe56d.s3.amazonaws.com/o_1jrl9bj473pej4dqgtbqh12315.png">
<h3 style="color:#b8ff3b">Zep Swipe Marketplace</h3>
</div>
</header>

<div class="hero">
<h1>Hire. Save. Earn.</h1>
<p>Backend-ready marketplace for student services and deals.</p>
</div>

<div class="card search">
<input placeholder="Search services, providers or deals">
</div>

<div class="card">
<h3>Featured Providers</h3>
<div class="row" id="providers"></div>
</div>

<div class="card">
<h3>Student Deals</h3>
<div class="row" id="deals"></div>
</div>

<div class="card">
<h3>Backend Workflow</h3>
<p>Client → Book Service → Pay → Provider Accepts → Work Completed → Client Approves → Wallet Credit → MARI Reward</p>
</div>

<div class="footer">
<a href="index.html">Home</a>
<a href="marketplace.html">Services</a>
<a href="business-deals.html">Deals</a>
<a href="provider.html">Earn</a>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

// Expected tables:
// profiles, services, bookings, messages,
// wallets, transactions, referrals, deals

for(let i=1;i<=6;i++){
providers.innerHTML += `<div class="item"><h4>Provider ${i}</h4><p>Service from R250</p><button class="btn">Hire Now</button></div>`;
deals.innerHTML += `<div class="item"><h4>Student Deal ${i}</h4><button class="btn">Claim Deal</button></div>`;
}
</script>

</body>
</html>
