<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V9</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f0d;
  color: white;
}

/* =========================
   HEADER
========================= */
header {
  position: sticky;
  top: 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background: rgba(10,14,12,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,255,140,0.12);
}

.logo {
  color:#00ff8c;
  font-weight:700;
}

/* =========================
   LAYOUT
========================= */
.container {
  max-width: 900px;
  margin:auto;
  padding:14px;
}

/* =========================
   CARD (UBER STYLE)
========================= */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px;
  margin-top: 10px;
}

/* =========================
   BUTTONS
========================= */
button {
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.primary {
  background:#00ff8c;
  color:black;
}

.secondary {
  background:rgba(255,255,255,0.08);
  color:white;
}

/* =========================
   BADGE
========================= */
.badge {
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:rgba(0,255,140,0.1);
  color:#00ff8c;
  font-size:11px;
}

/* =========================
   STATUS
========================= */
.status-open { color: #ffcc00; }
.status-progress { color: #00ff8c; }
.status-done { color: #aaa; }

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Zep Marketplace V9</div>
</header>

<div class="container">

  <h3>🚀 Live Jobs (Uber Feed)</h3>
  <div id="jobs"></div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   LOAD JOBS
========================= */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .order("created_at", { ascending: false });

  renderJobs(data || []);
}

/* =========================
   RENDER JOBS
========================= */
function renderJobs(jobs){

  const box = document.getElementById("jobs");
  box.innerHTML = "";

  jobs.forEach(j => {

    box.innerHTML += `
      <div class="card">

        <span class="badge">${j.category}</span>

        <h4>${j.description}</h4>

        <p>📍 ${j.location}</p>

        <p class="status-${j.status}">
          Status: ${j.status}
        </p>

        ${j.status === "matched" ? `
          <button class="primary" onclick="completeJob('${j.id}')">
            Mark Completed
          </button>
        ` : ""}

        ${j.status === "completed" ? `
          <button class="secondary" onclick="confirmJob('${j.id}')">
            Confirm Payment
          </button>
        ` : ""}

      </div>
    `;
  });
}

/* =========================
   COMPLETE JOB
========================= */
async function completeJob(id){

  await client
    .from("service_requests")
    .update({ status: "completed" })
    .eq("id", id);

  loadJobs();
}

/* =========================
   CONFIRM JOB
========================= */
async function confirmJob(id){

  alert("Payment confirmed (manual MVP flow)");
}

/* INIT */
loadJobs();

</script>

</body>
</html>
