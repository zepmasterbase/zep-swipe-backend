<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V11</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: system-ui;
  background: radial-gradient(circle at top, #070a09, #050807);
  color: white;
}

/* =========================
   HEADER
========================= */
header {
  position: sticky;
  top: 0;
  background: rgba(10,14,12,0.95);
  border-bottom: 1px solid rgba(0,255,140,0.12);
  padding: 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo {
  font-weight: 700;
  color:#00ff8c;
}

/* =========================
   TABS
========================= */
.tabs {
  display:flex;
  justify-content:space-around;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.tab {
  flex:1;
  text-align:center;
  padding: 12px;
  cursor:pointer;
  font-weight:600;
  opacity:0.6;
}

.tab.active {
  opacity:1;
  border-bottom: 2px solid #00ff8c;
  color:#00ff8c;
}

/* =========================
   CONTAINER
========================= */
.container {
  max-width: 520px;
  margin:auto;
  padding: 12px;
}

/* =========================
   CARD
========================= */
.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 12px;
  margin-top: 10px;
}

/* =========================
   BADGES
========================= */
.badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  background: rgba(0,255,140,0.15);
  color:#00ff8c;
}

/* =========================
   BUTTONS
========================= */
button {
  width:100%;
  padding: 12px;
  margin-top: 10px;
  border:none;
  border-radius: 10px;
  font-weight:700;
  cursor:pointer;
}

.primary {
  background: linear-gradient(90deg,#00ff8c,#00c2ff);
  color:black;
}

/* =========================
   DEAL CARD STYLE
========================= */
.deal {
  border-left: 3px solid #00ff8c;
}

/* =========================
   SMALL TEXT
========================= */
.small {
  font-size: 12px;
  opacity: 0.7;
}

/* =========================
   HIDDEN
========================= */
.hidden {
  display:none;
}

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Zep Market 🛒</div>
  <div class="small">Live</div>
</header>

<!-- =========================
     TABS
========================= -->
<div class="tabs">
  <div class="tab active" onclick="showTab('earn')">💼 Hire a Student</div>
  <div class="tab" onclick="showTab('deals')">🏷️ Student Deals</div>
</div>

<div class="container">

<!-- =========================
     EARN TAB
========================= -->
<div id="earnTab">

  <h3>💼 Hire Student Services</h3>
  <p class="small">Find students offering skills near you</p>

  <div id="services"></div>

</div>

<!-- =========================
     DEALS TAB
========================= -->
<div id="dealTab" class="hidden">

  <h3>🏷️ Student Deals Near You</h3>
  <p class="small">Exclusive discounts from businesses</p>

  <div id="deals"></div>

</div>

</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   TAB SWITCH
========================= */
function showTab(tab){

  document.getElementById("earnTab").classList.add("hidden");
  document.getElementById("dealTab").classList.add("hidden");

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

  if(tab === "earn"){
    document.getElementById("earnTab").classList.remove("hidden");
    document.querySelectorAll(".tab")[0].classList.add("active");
  }

  if(tab === "deals"){
    document.getElementById("dealTab").classList.remove("hidden");
    document.querySelectorAll(".tab")[1].classList.add("active");
  }
}

/* =========================
   LOAD SERVICES (EARN TAB)
========================= */
async function loadServices(){

  const { data } = await client
    .from("service_profiles")
    .select("*")
    .eq("online", true);

  document.getElementById("services").innerHTML =
    data?.map(s => `
      <div class="card">
        <span class="badge">${s.category}</span>
        <h4>${s.description}</h4>
        <p class="small">${s.location}</p>
        <p class="small">💰 ${s.price}</p>

        <button class="primary" onclick="contact('${s.phone}')">
          💬 Hire via WhatsApp
        </button>
      </div>
    `).join("") || "<p class='small'>No providers online</p>";
}

/* =========================
   LOAD DEALS (DEALS TAB)
========================= */
async function loadDeals(){

  const { data } = await client
    .from("deals")
    .select("*");

  document.getElementById("deals").innerHTML =
    data?.map(d => `
      <div class="card deal">
        <span class="badge">🔥 Deal</span>
        <h4>${d.title}</h4>
        <p class="small">${d.description}</p>
        <p class="small">📍 ${d.location}</p>
        <p class="small">⏰ ${d.valid_until || "Limited time"}</p>

        <button class="primary" onclick="contact('${d.phone}')">
          📲 Claim Deal
        </button>
      </div>
    `).join("") || "<p class='small'>No deals available</p>";
}

/* =========================
   WHATSAPP CONTACT
========================= */
function contact(phone){
  window.open(`https://wa.me/${phone}`, "_blank");
}

/* =========================
   REALTIME (optional upgrade)
========================= */
client
  .channel('marketplace')
  .on('postgres_changes',
    { event: '*', schema: 'public', tables: ['service_profiles','deals'] },
    () => {
      loadServices();
      loadDeals();
    }
  )
  .subscribe();

/* INIT */
loadServices();
loadDeals();

</script>

</body>
</html>
