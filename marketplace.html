<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050607;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(0,0,0,0.85);
  border-bottom: 1px solid rgba(0,255,140,0.2);
  position: sticky;
  top: 0;
}

header h2 {
  color: #00ff8c;
}

button {
  background: #00ff8c;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* FILTERS */
.filters {
  display: flex;
  gap: 10px;
  padding: 15px;
  overflow-x: auto;
}

.filters button {
  background: transparent;
  border: 1px solid #00ff8c;
  color: #00ff8c;
  padding: 8px 12px;
  border-radius: 20px;
  white-space: nowrap;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: #0b120e;
  border: 1px solid rgba(0,255,140,0.15);
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #00ff8c;
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.card-content {
  padding: 12px;
}

.category {
  color: #00ff8c;
  font-size: 12px;
}

.price {
  margin-top: 5px;
  font-weight: bold;
}

/* REQUEST BUTTON */
.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #00ff8c;
  color: black;
  padding: 15px 18px;
  border-radius: 50px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,255,140,0.4);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #0b120e;
  padding: 20px;
  width: 90%;
  max-width: 420px;
  border-radius: 12px;
  border: 1px solid rgba(0,255,140,0.2);
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
  outline: none;
}

textarea {
  height: 80px;
}

/* ACTION BUTTONS */
.actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.small-btn {
  flex: 1;
  padding: 8px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h2>Zep Swipe Marketplace</h2>
  <button onclick="loadServices()">Refresh</button>
</header>

<!-- FILTERS -->
<div class="filters">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('Academic')">Academic</button>
  <button onclick="filter('Digital')">Digital</button>
  <button onclick="filter('Technical')">Technical</button>
  button onclick="filter('Creative')">Creative</button>
  <button onclick="filter('Community')">Community</button>
</div>

<!-- SERVICES -->
<div class="grid" id="services"></div>

<!-- FLOAT BUTTON -->
<div class="fab" onclick="openModal()">
  + Request Service
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 style="color:#00ff8c;">Request a Service</h3>

    <input id="name" placeholder="Your Name">
    <input id="phone" placeholder="Phone Number">

    <select id="category">
      <option>Academic</option>
      <option>Digital</option>
      <option>Technical</option>
      <option>Creative</option>
      <option>Community</option>
    </select>

    <textarea id="description" placeholder="What do you need?"></textarea>

    <input id="location" placeholder="Location (default Randfontein)">
    <input id="budget" placeholder="Budget (optional)">

    <div class="actions">
      <button class="small-btn" onclick="submitRequest()">Submit</button>
      <button class="small-btn" style="background:red;color:white;" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allServices = [];

/* LOAD SERVICES */
async function loadServices() {
  const { data } = await client.from("services").select("*");
  allServices = data || [];
  render(allServices);
}

/* RENDER */
function render(data) {
  const box = document.getElementById("services");
  box.innerHTML = "";

  data.forEach(s => {
    box.innerHTML += `
      <div class="card">
        <img src="${s.image_url || 'https://images.unsplash.com/photo-1521737604893-d14cc237f11d'}">
        <div class="card-content">
          <div class="category">${s.category}</div>
          <h3>${s.title}</h3>
          <p>${s.description}</p>
          <div class="price">${s.price}</div>
        </div>
      </div>
    `;
  });
}

/* FILTER */
function filter(cat) {
  if (cat === "all") render(allServices);
  else render(allServices.filter(s => s.category === cat));
}

/* MODAL */
function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* SUBMIT REQUEST */
async function submitRequest() {

  const request = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value,
    location: document.getElementById("location").value || "Randfontein",
    budget: document.getElementById("budget").value,
    status: "open"
  };

  const { error } = await client
    .from("service_requests")
    .insert([request]);

  if (error) {
    alert("Error submitting request");
    console.log(error);
  } else {
    alert("Request submitted successfully!");
    closeModal();
  }
}

loadServices();
</script>

</body>
</html>
