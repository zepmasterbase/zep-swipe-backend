<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Marketplace V63</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--border:#262626}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:var(--bg);color:#fff;padding-bottom:90px}
header{position:sticky;top:0;background:#0b0b0b;padding:14px;border-bottom:1px solid var(--border)}
.hero{margin:16px;padding:36px;border-radius:28px;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.85)),url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover}
.card{background:#141414;border:1px solid #262626;border-radius:20px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
.slider{display:flex;overflow:auto;gap:16px;padding:16px}
.item{min-width:280px;background:#141414;border:1px solid #262626;border-radius:20px;overflow:hidden}
.item img{width:100%;height:180px;object-fit:cover}
.content{padding:16px}
.btn{width:100%;padding:12px;background:#b8ff3b;border:none;border-radius:12px;font-weight:800}
.footer{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid #262626;display:flex;justify-content:space-around;padding:12px}
.footer a{color:#fff;text-decoration:none;font-size:12px;display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<header>
<h3 style="color:#b8ff3b">Zep Swipe Marketplace</h3>
</header>

<div class="hero">
<h1>Find Student Talent. Hire With Confidence.</h1>
<p>Tutors, designers, photographers and tech support.</p>
</div>

<div class="stats">
<div class="card"><h3 id="servicesCount">0</h3><small>Services</small></div>
<div class="card"><h3 id="providersCount">0</h3><small>Providers</small></div>
<div class="card"><h3 id="dealsCount">0</h3><small>Deals</small></div>
<div class="card"><h3>100</h3><small>MARI Reward</small></div>
</div>

<h3 style="padding:16px;color:#b8ff3b">Featured Providers</h3>
<div class="slider" id="servicesContainer"></div>

<footer class="footer">
<a href="index.html"><i data-lucide="home"></i><span>Home</span></a>
<a href="marketplace.html"><i data-lucide="briefcase"></i><span>Services</span></a>
<a href="business-deals.html"><i data-lucide="ticket-percent"></i><span>Deals</span></a>
<a href="provider.html"><i data-lucide="coins"></i><span>Earn</span></a>
<a href="#"><i data-lucide="user"></i><span>Profile</span></a>
</footer>

<script>
const SUPABASE_URL="https://lysepsmhaepxecngoybt.supabase.co";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function loadServices(){
try{
const {data}=await supabaseClient.from('services').select('*');
const container=document.getElementById('servicesContainer');
if(!data) return;
document.getElementById('servicesCount').innerText=data.length;

data.forEach(service=>{
container.innerHTML += `
<div class="item">
<img src="${service.image_url || 'https://picsum.photos/400/250'}">
<div class="content">
<h4>${service.title || 'Service'}</h4>
<p>R${service.price || 0}</p>
<button class="btn">Hire Now</button>
</div>
</div>`;
});
}catch(e){
console.log(e);
}
}
loadServices();
lucide.createIcons();
</script>
</body>
</html>
