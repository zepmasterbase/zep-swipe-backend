<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#070707;
  --card:#141414;
  --accent:#b8ff3b;
  --text:#fff;
  --muted:#aaa;
  --border:#262626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  z-index:100;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(12px);
  padding:14px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.logo{
  color:var(--accent);
  font-weight:800;
}

/* SWIPE AREA */
.swipe-area{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding-top:60px;
}

/* CARD */
.card{
  position:absolute;
  width:320px;
  height:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  transition:transform .3s ease;
}

.card img{
  width:100%;
  height:55%;
  object-fit:cover;
}

.content{
  padding:14px;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  font-size:11px;
  border-radius:999px;
  background:rgba(184,255,59,.15);
  color:var(--accent);
}

.btn{
  margin-top:10px;
  display:inline-block;
  width:100%;
  text-align:center;
  padding:10px;
  border-radius:10px;
  background:var(--accent);
  color:#000;
  font-weight:700;
  text-decoration:none;
}

/* ACTION LABEL */
.action{
  position:absolute;
  top:20px;
  font-size:22px;
  font-weight:800;
  opacity:0;
}

.like{left:20px;color:#00ff8c;}
.nope{right:20px;color:#ff4d4d;}

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Zep Swipe V18</div>
  <div>🔥 Swipe Mode</div>
</header>

<div class="swipe-area" id="swipeArea">

  <div class="action like" id="like">LIKE</div>
  <div class="action nope" id="nope">SKIP</div>

</div>

<script>

/* =========================
   SUPABASE
========================= */
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let stack=[];
let index=0;

/* INIT */
load();

/* =========================
   LOAD DATA
========================= */
async function load(){

const p = await client.from("providers").select("*").eq("approved", true);
const d = await client.from("deals").select("*").eq("active", true);

/* MIX STACK */
stack = [
  ...(p.data || []).map(x => ({...x,type:"service"})),
  ...(d.data || []).map(x => ({...x,type:"deal"}))
];

renderCard();
}

/* =========================
   RENDER CARD
========================= */
function renderCard(){

const area = document.getElementById("swipeArea");
area.innerHTML = "";

if(index >= stack.length){
area.innerHTML = "<h2>No more cards</h2>";
return;
}

const item = stack[index];

const card = document.createElement("div");
card.className = "card";

if(item.type === "deal"){
card.innerHTML = `
<img src="${item.image_url || 'https://via.placeholder.com/400'}">
<div class="content">
<span class="badge">🏷️ Deal</span>
<h3>${item.title}</h3>
<p>${item.description||""}</p>
<a class="btn">Claim Deal</a>
</div>`;
} else {
card.innerHTML = `
<img src="${item.image_url || 'https://via.placeholder.com/400'}">
<div class="content">
<span class="badge">🛠️ Service</span>
<h3>${item.service}</h3>
<p>${item.location||""}</p>
<a class="btn">Hire</a>
</div>`;
}

addSwipe(card);
area.appendChild(card);
}

/* =========================
   SWIPE ENGINE
========================= */
function addSwipe(card){

let startX=0;
let moveX=0;

card.onmousedown = start;
card.ontouchstart = start;

function start(e){
startX = e.touches ? e.touches[0].clientX : e.clientX;

document.onmousemove = move;
document.ontouchmove = move;

document.onmouseup = end;
document.ontouchend = end;
}

function move(e){
moveX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
card.style.transform = `translateX(${moveX}px) rotate(${moveX/10}deg)`;

if(moveX > 80) showLike();
if(moveX < -80) showNope();
}

function end(){

document.onmousemove = null;
document.ontouchmove = null;

document.onmouseup = null;
document.ontouchend = null;

if(moveX > 120){
next();
}
else if(moveX < -120){
next();
}
else{
card.style.transform = "translateX(0)";
hideActions();
}

moveX=0;
}

}

/* =========================
   ACTIONS
========================= */
function showLike(){
document.getElementById("like").style.opacity=1;
document.getElementById("nope").style.opacity=0;
}

function showNope(){
document.getElementById("like").style.opacity=0;
document.getElementById("nope").style.opacity=1;
}

function hideActions(){
document.getElementById("like").style.opacity=0;
document.getElementById("nope").style.opacity=0;
}

/* NEXT CARD */
function next(){
index++;
renderCard();
}

</script>

</body>
</html>
