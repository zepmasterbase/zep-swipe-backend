<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V3</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050607;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: rgba(0,0,0,0.85);
  border-bottom: 1px solid rgba(0,255,140,0.2);
  position: sticky;
  top: 0;
}

h2 {
  color: #00ff8c;
}

button {
  background: #00ff8c;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: #0b120e;
  border: 1px solid rgba(0,255,140,0.15);
  border-radius: 12px;
  padding: 15px;
}

/* REQUEST BUTTON */
.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #00ff8c;
  color: black;
  padding: 15px 18px;
  border-radius: 50px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,255,140,0.4);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #0b120e;
  padding: 20px;
  width: 90%;
  max-width: 420px;
  border-radius: 12px;
  border: 1px solid rgba(0,255,140,0.2);
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
}

/* STATUS BADGES */
.badge {
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 6px;
  display: inline-block;
}

.open { background: orange; }
.matched { background: #00ff8c; color: black; }
.completed { background: gray; }

/* MATCH CARD */
.match-box {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid rgba(0,255,140,0.2);
  border-radius: 10px;
  background: rgba(0,255,140,0.05);
}
</style>
</head>

<body>

<header>
  <h2>Marketplace V3</h2>
  <button onclick="loadServices()">Refresh</button>
</header>

<div class="grid" id="services"></div>

<!-- FLOAT BUTTON -->
<div class="fab" onclick="openModal()">
  + Request Service
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 style="color:#00ff8c;">Request Service</h3>

    <input id="name" placeholder="Your Name">
    <input id="phone" placeholder="Phone Number">

    <select id="category">
      <option>Academic</option>
      <option>Digital</option>
      <option>Technical</option>
      <option>Creative</option>
      <option>Community</option>
    </select>

    <textarea id="description" placeholder="What do you need?"></textarea>

    <input id="location" placeholder="Location (Randfontein default)">
    <input id="budget" placeholder="Budget (optional)">

    <button onclick="submitRequest()">Submit Request</button>
    <button style="background:red;color:white;margin-top:10px;" onclick="closeModal()">Close</button>
  </div>
</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let services = [];

/* LOAD SERVICES */
async function loadServices() {

  const { data } = await client
    .from("service_requests")
    .select("*")
    .order("created_at", { ascending: false });

  services = data || [];
  render(services);
}

/* RENDER */
function render(list) {

  const box = document.getElementById("services");
  box.innerHTML = "";

  list.forEach(s => {

    box.innerHTML += `
      <div class="card">

        <b>${s.category}</b>
        <span class="badge ${s.status}">${s.status}</span>

        <p>${s.description}</p>

        <small>📍 ${s.location}</small>

        ${s.matched_provider ? `
          <div class="match-box">
            <b>Matched Provider:</b><br>
            ${s.matched_provider}<br>
            ${s.matched_phone}
          </div>
        ` : ""}

      </div>
    `;
  });
}

/* MODAL */
function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* SUBMIT REQUEST */
async function submitRequest() {

  const request = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value,
    location: document.getElementById("location").value || "Randfontein",
    budget: document.getElementById("budget").value,
    status: "open"
  };

  const { error } = await client
    .from("service_requests")
    .insert([request]);

  if (error) {
    alert("Error submitting request");
    return;
  }

  alert("Request submitted successfully!");
  closeModal();
  loadServices();
}

loadServices();

</script>

</body>
</html>
