<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V19</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   DESIGN SYSTEM
========================= */
:root{
  --bg:#070707;
  --card:#141414;
  --accent:#b8ff3b;
  --text:#fff;
  --muted:#aaa;
  --border:#262626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
}

/* =========================
   HEADER
========================= */
header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  color:var(--accent);
}

.logo img{
  width:28px;
  height:28px;
  border-radius:6px;
}

/* =========================
   SEARCH
========================= */
.search{
  padding:14px 16px;
}

.search input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:#fff;
  outline:none;
}

/* =========================
   HERO CARD
========================= */
.hero{
  margin:10px 16px;
  background:linear-gradient(135deg,#141414,#0f1a10);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  gap:12px;
}

.hero img{
  width:120px;
  height:120px;
  object-fit:cover;
}

.hero div{
  padding:12px;
}

.hero h2{
  color:var(--accent);
  font-size:16px;
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px 14px;
  border-radius:10px;
  background:var(--accent);
  color:#000;
  font-weight:700;
  text-decoration:none;
}

/* =========================
   SWIPE ROW
========================= */
.scrollRow{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px 16px;
  scroll-snap-type:x mandatory;
}

.scrollCard{
  min-width:220px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  scroll-snap-align:start;
}

/* =========================
   GRID
========================= */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px;
  padding:0 16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.content{
  padding:14px;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  font-size:11px;
  border-radius:999px;
  background:rgba(184,255,59,.15);
  color:var(--accent);
  margin-bottom:8px;
}

/* =========================
   FOOTER
========================= */
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0b0b0b;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  padding:10px;
  font-size:12px;
}

footer a{
  color:#fff;
  text-decoration:none;
  text-align:center;
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jpitama61nopisi19aqb041vvo15.png">
    Zep Swipe
  </div>
</header>

<!-- SEARCH -->
<div class="search">
  <input id="search" placeholder="Search services, tutors, deals...">
</div>

<!-- HERO -->
<div class="hero">
  <img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jrg40d1f1srq1v5l1m4omlrpjt1a.png">
  <div>
    <h2>Earn on the Side</h2>
    <p style="color:#aaa;font-size:13px;">
      Offer your skills. Make money. Help your community.
    </p>
    <a class="btn" href="login.html">Start Earning</a>
  </div>
</div>

<!-- POPULAR -->
<h3 style="padding:10px 16px;">🔥 Popular Near You</h3>
<div class="scrollRow" id="popular"></div>

<!-- SERVICES -->
<h3 style="padding:10px 16px;">🛠️ Services</h3>
<div class="cards" id="services"></div>

<!-- DEALS -->
<h3 style="padding:10px 16px;">🏷️ Deals</h3>
<div class="cards" id="deals"></div>

<!-- FOOTER -->
<footer>
  <a href="index.html">🏠<br>Home</a>
  <a href="marketplace.html">🛠️<br>Services</a>
  <a href="business-deals.html">💲<br>Earn</a>
  <a href="login.html">➕<br>List Deal</a>
  <a href="waitlist.html">👤<br>Waitlist</a>
</footer>

<script>

/* =========================
   SUPABASE
========================= */
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let providers=[];
let deals=[];

load();

async function load(){

const p=await client.from("providers").select("*").eq("approved",true);
const d=await client.from("deals").select("*").eq("active",true);

providers=p.data||[];
deals=d.data||[];

render();
}

function render(){
renderPopular();
renderServices();
renderDeals();
}

/* SEARCH */
document.getElementById("search").addEventListener("input",renderServices);

/* POPULAR */
function renderPopular(){

const container=document.getElementById("popular");

const top=[...providers]
.sort((a,b)=>(b.hired_count||0)-(a.hired_count||0))
.slice(0,8);

container.innerHTML=top.map(p=>`
<div class="scrollCard">
<b>${p.service}</b>
<p style="color:#aaa;font-size:12px">${p.hired_count||0} hires</p>
</div>
`).join("");
}

/* SERVICES */
function renderServices(){

const q=document.getElementById("search").value.toLowerCase();
const container=document.getElementById("services");

container.innerHTML=providers
.filter(p=>(p.service||"").toLowerCase().includes(q))
.map(p=>`
<div class="card">
<img src="${p.image_url||''}">
<div class="content">
<span class="badge">${p.category||"Service"}</span>
<h3>${p.service}</h3>
<p>${p.location||""}</p>
<a class="btn" href="https://wa.me/${p.whatsapp}">Hire</a>
</div>
</div>
`).join("");
}

/* DEALS */
function renderDeals(){

const q=document.getElementById("search").value.toLowerCase();
const container=document.getElementById("deals");

container.innerHTML=deals
.filter(d=>(d.title||"").toLowerCase().includes(q))
.map(d=>`
<div class="card">
<div class="content">
<span class="badge">🔥 Deal</span>
<h3>${d.title}</h3>
<p>${d.description||""}</p>
<a class="btn">Claim</a>
</div>
</div>
`).join("");
}

</script>

</body>
</html>
