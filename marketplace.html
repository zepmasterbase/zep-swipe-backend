<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Marketplace </title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#141414;--accent:#b8ff3b;--text:#fff;--border:#262626;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px}
header{position:sticky;top:0;background:#090909;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:800}
.logo img{width:34px;height:34px;border-radius:8px}
.search{padding:16px}.search input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:#141414;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:0 16px}
.card{background:#141414;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.card img{width:100%;height:170px;object-fit:cover}
.content{padding:14px}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(184,255,59,.15);color:var(--accent);font-size:11px}
.btn{display:inline-block;margin-top:10px;padding:10px 14px;background:var(--accent);color:#000;text-decoration:none;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.section{padding:16px}
footer{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px}
footer a{text-decoration:none;color:#fff;text-align:center;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;padding:20px}
.modal-content{background:#141414;border:1px solid var(--border);border-radius:16px;padding:20px;max-width:420px;width:100%}
</style>
</head>
<body>

<header>
<div class="logo">
<img src="https://payhip.com/cdn-cgi/image/format=auto/https://pe56d.s3.amazonaws.com/o_1jpitama61nopisi19aqb041vvo15.png">
<span>Zep Swipe</span>
</div>
<div>💳</div>
</header>

<div class="search">
<input id="search" placeholder="Search services...">
</div>

<div class="section"><h2>🔥 Featured Providers</h2></div>
<div class="cards" id="services"></div>

<div class="section"><h2>🏷️ Featured Deals</h2></div>
<div class="cards" id="deals"></div>

<footer>
<a href="index.html">🏠<br>Home</a>
<a href="marketplace.html">🛠️<br>Services</a>
<a href="login.html">💼<br>Earn</a>
<a href="business-deals.html">🏷️<br>List Deal</a>
<a href="provider.html">👛<br>Wallet</a>
</footer>

<div class="modal" id="checkoutModal">
<div class="modal-content">
<h3>Book & Pay</h3>
<p id="serviceName"></p>
<p id="priceText"></p>
<p id="feeText"></p>
<button class="btn" onclick="startPayment()">Pay Now</button>
<button class="btn" style="background:#333;color:#fff" onclick="closeModal()">Cancel</button>
</div>
</div>

<script>
const COMMISSION_RATE=0.10;
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let selectedProvider=null;

const demoProviders=[
{id:1,service:"Math Tutor",price:300,location:"Johannesburg",featured:true,image_url:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f"},
{id:2,service:"Graphic Designer",price:250,location:"Soweto",featured:true,image_url:"https://images.unsplash.com/photo-1558655146-364adaf1fcc9"}
];

const demoDeals=[
{title:"50% Student Meal",description:"Limited offer",featured:true}
];

render();

function render(){
document.getElementById("services").innerHTML=demoProviders.map(p=>{
const fee=p.price*COMMISSION_RATE;
return `<div class="card">
<img src="${p.image_url}">
<div class="content">
<span class="badge">Featured ⭐</span>
<h3>${p.service}</h3>
<p>${p.location}</p>
<p>From R${p.price}</p>
<p style="font-size:12px">Platform Fee: R${fee.toFixed(2)}</p>
<button class="btn" onclick='bookService(${JSON.stringify(p)})'>Book & Pay</button>
</div></div>`;
}).join("");

document.getElementById("deals").innerHTML=demoDeals.map(d=>`
<div class="card"><div class="content">
<span class="badge">Featured Deal 🔥</span>
<h3>${d.title}</h3>
<p>${d.description}</p>
</div></div>`).join("");
}

function bookService(provider){
selectedProvider=provider;
const fee=provider.price*COMMISSION_RATE;
const payout=provider.price-fee;
serviceName.innerText=provider.service;
priceText.innerText="Customer Pays: R"+provider.price;
feeText.innerText="Platform Fee: R"+fee.toFixed(2)+" | Student Receives: R"+payout.toFixed(2);
checkoutModal.style.display="flex";
}

function closeModal(){
checkoutModal.style.display="none";
}

async function startPayment(){
alert("Connect Paystack here. After successful payment, create booking + wallet transaction in Supabase.");
}
</script>

</body>
</html>
