<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zep Swipe Marketplace V45</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#070707;color:#fff;font-family:Inter,sans-serif;margin:0;padding-bottom:90px}
.card{background:#141414;border:1px solid #262626;border-radius:18px;padding:16px;margin:16px}
.btn{background:#b8ff3b;color:#000;border:none;padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer}
#claimModal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:420px;z-index:999}
input{width:100%;padding:12px;margin-top:10px;background:#101010;color:#fff;border:1px solid #262626;border-radius:12px}
</style>
</head>
<body>

<div class="card">
<h2>Zep Swipe Marketplace V45</h2>
<p>Supabase-ready marketplace with student deal claims.</p>
<button class="btn" onclick="openClaim('meal-deal')">Claim Deal</button>
</div>

<div id="claimModal" class="card">
<h3>Student Verification</h3>
<input id="studentId" placeholder="Zep Swipe Student ID">
<input id="studentName" placeholder="Full Name">
<input id="studentUniversity" placeholder="University">
<button class="btn" onclick="submitClaim()">Claim Deal</button>
<button class="btn" onclick="closeClaim()">Cancel</button>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let currentDeal='';

function openClaim(id){
 currentDeal=id;
 document.getElementById('claimModal').style.display='block';
}

function closeClaim(){
 document.getElementById('claimModal').style.display='none';
}

function coupon(){
 return 'ZS-'+Math.random().toString(36).substring(2,8).toUpperCase();
}

async function submitClaim(){
 const code=coupon();
 alert('Demo coupon: '+code+'\nConnect Supabase to save claims.');
 closeClaim();
}

lucide.createIcons();
</script>
</body>
</html>
