<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V17 SPA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   V16 DESIGN SYSTEM
========================= */
:root{
  --bg:#070707;
  --card:#141414;
  --accent:#b8ff3b;
  --text:#fff;
  --muted:#aaa;
  --border:#262626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  padding-bottom:80px;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:var(--accent);
  font-weight:800;
}

/* TABS */
.tabs{
  display:flex;
  gap:10px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  background:#0b0b0b;
  position:sticky;
  top:58px;
  z-index:90;
}

.tab{
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--card);
  color:#fff;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
}

.tab.active{
  background:var(--accent);
  color:#000;
  font-weight:700;
}

/* LAYOUT */
.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px;
  margin-top:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:var(--accent);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#222;
}

.content{
  padding:14px;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  font-size:11px;
  border-radius:999px;
  background:rgba(184,255,59,.15);
  color:var(--accent);
  margin-bottom:8px;
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px 14px;
  border-radius:10px;
  background:var(--accent);
  color:#000;
  font-weight:700;
  text-decoration:none;
}

/* HIDE SYSTEM */
.hidden{display:none;}

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Zep Swipe</div>
  <div>🔔</div>
</header>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('home')">🏠 Home</button>
  <button class="tab" onclick="switchTab('services')">🛠️ Services</button>
  <button class="tab" onclick="switchTab('deals')">🏷️ Deals</button>
</div>

<div class="wrap">

<!-- HOME TAB -->
<section id="homeTab">

  <h2>🔥 Marketplace Feed</h2>

  <div class="cards" id="homeCards"></div>

</section>

<!-- SERVICES TAB -->
<section id="servicesTab" class="hidden">

  <h2>🛠️ Services</h2>

  <div class="cards" id="servicesCards"></div>

</section>

<!-- DEALS TAB -->
<section id="dealsTab" class="hidden">

  <h2>🏷️ Deals</h2>

  <div class="cards" id="dealsCards"></div>

</section>

</div>

<script>

/* =========================
   SUPABASE
========================= */
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* DATA */
let providers=[];
let deals=[];

/* INIT */
loadAll();

/* =========================
   LOAD DATA
========================= */
async function loadAll(){

const p = await client.from("providers").select("*").eq("approved", true);
const d = await client.from("deals").select("*").eq("active", true);

providers = p.data || [];
deals = d.data || [];

renderAll();
}

/* =========================
   RENDER ALL TABS
========================= */
function renderAll(){

renderHome();
renderServices();
renderDeals();
}

/* HOME (MIXED FEED) */
function renderHome(){

const container = document.getElementById("homeCards");

const mix = [
  ...providers.slice(0,3),
  ...deals.slice(0,3)
];

container.innerHTML = mix.map(item=>{

if(item.title){
return `
<div class="card">
<div class="content">
<span class="badge">🏷️ Deal</span>
<h3>${item.title}</h3>
<p>${item.description||""}</p>
<a class="btn">Claim</a>
</div>
</div>`;
}

return `
<div class="card">
<div class="content">
<span class="badge">${item.category||"Service"}</span>
<h3>${item.service}</h3>
<p>${item.location||""}</p>
<a class="btn">Hire</a>
</div>
</div>`;
}).join("");
}

/* SERVICES */
function renderServices(){

const container = document.getElementById("servicesCards");

container.innerHTML = providers.map(p=>`
<div class="card">
<div class="content">
<span class="badge">${p.category||"Service"}</span>
<h3>${p.service}</h3>
<p>${p.name||""}</p>
<a class="btn" href="https://wa.me/${p.whatsapp}" target="_blank">Hire</a>
</div>
</div>
`).join("");
}

/* DEALS */
function renderDeals(){

const container = document.getElementById("dealsCards");

container.innerHTML = deals.map(d=>`
<div class="card">
<div class="content">
<span class="badge">🔥 Deal</span>
<h3>${d.title}</h3>
<p>${d.description||""}</p>
<a class="btn">Claim</a>
</div>
</div>
`).join("");
}

/* =========================
   TAB SWITCHER
========================= */
function switchTab(tab){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

event.target.classList.add("active");

document.getElementById("homeTab").classList.add("hidden");
document.getElementById("servicesTab").classList.add("hidden");
document.getElementById("dealsTab").classList.add("hidden");

if(tab==="home") document.getElementById("homeTab").classList.remove("hidden");
if(tab==="services") document.getElementById("servicesTab").classList.remove("hidden");
if(tab==="deals") document.getElementById("dealsTab").classList.remove("hidden");

}

</script>

</body>
</html>
