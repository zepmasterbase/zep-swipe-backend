<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace V7</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE
========================= */
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #0b0f0d;
  color: white;
}

/* =========================
   HEADER
========================= */
header {
  position: sticky;
  top: 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background: rgba(10,14,12,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,255,140,0.15);
}

.logo {
  font-weight:700;
  color:#00ff8c;
}

.btn {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
}

.primary { background:#00ff8c; color:black; }
.dark { background:rgba(255,255,255,0.08); color:white; }

/* =========================
   LAYOUT
========================= */
.container {
  max-width:900px;
  margin:auto;
  padding:12px;
}

/* =========================
   REQUEST BOX
========================= */
.request-box {
  background:rgba(255,255,255,0.03);
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(0,255,140,0.12);
}

input {
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#0b0f0d;
  color:white;
}

button.request {
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00ff8c;
  font-weight:700;
}

/* =========================
   SECTIONS
========================= */
h3 {
  margin-top:16px;
  color:#00ff8c;
  font-size:14px;
}

/* =========================
   PROVIDER CARD
========================= */
.card {
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;
  padding:12px;
  margin-top:10px;
}

.small {
  font-size:12px;
  opacity:0.7;
}

.badge {
  font-size:11px;
  padding:4px 8px;
  border-radius:20px;
  background:rgba(0,255,140,0.12);
  color:#00ff8c;
}

/* =========================
   PROVIDERS GRID
========================= */
.grid {
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

/* =========================
   FLOAT BUTTON
========================= */
.fab {
  position:fixed;
  bottom:16px;
  right:16px;
  background:#00ff8c;
  color:black;
  padding:14px 16px;
  border-radius:50px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,140,0.3);
}

</style>
</head>

<body>

<header>
  <div class="logo">⚡ Zep Marketplace</div>

  <div>
    <button class="btn dark" onclick="window.location.href='provider.html'">
      Become Provider
    </button>
  </div>
</header>

<div class="container">

  <!-- REQUEST -->
  <div class="request-box">

    <h3>What service do you need?</h3>

    <input id="category" placeholder="e.g. Cleaning, Hair, Tutoring">
    <input id="desc" placeholder="Describe what you need">
    <input id="location" placeholder="Your location">

    <button class="request" onclick="createRequest()">
      Request Service
    </button>

  </div>

  <!-- PROVIDERS -->
  <h3>🛠 Available Providers Near You</h3>
  <div id="providers" class="grid"></div>

  <!-- LIVE REQUESTS -->
  <h3>📍 Recent Requests</h3>
  <div id="requests"></div>

</div>

<!-- FLOAT -->
<div class="fab" onclick="window.location.href='waitlists.html'">
  Join Waitlist
</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   CREATE REQUEST
========================= */
async function createRequest(){

  await client.from("service_requests").insert([{
    category: document.getElementById("category").value,
    description: document.getElementById("desc").value,
    location: document.getElementById("location").value,
    status: "open"
  }]);

  loadRequests();
}

/* =========================
   LOAD PROVIDERS
========================= */
async function loadProviders(){

  const { data } = await client
    .from("service_profiles")
    .select("*");

  renderProviders(data || []);
}

/* =========================
   LOAD REQUESTS
========================= */
async function loadRequests(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .order("created_at",{ascending:false});

  renderRequests(data || []);
}

/* =========================
   RENDER PROVIDERS
========================= */
function renderProviders(list){

  const box = document.getElementById("providers");
  box.innerHTML = "";

  list.forEach(p => {

    box.innerHTML += `
      <div class="card">

        <span class="badge">${p.category}</span>

        <p><b>${p.description}</b></p>

        <div class="small">
          📍 ${p.location || "Nearby"}<br>
          💰 ${p.price_range || "Negotiable"}
        </div>

        <button class="request"
          onclick="contact('${p.phone}')">
          Contact Provider
        </button>

      </div>
    `;
  });
}

/* =========================
   RENDER REQUESTS
========================= */
function renderRequests(list){

  const box = document.getElementById("requests");
  box.innerHTML = "";

  list.forEach(r => {

    box.innerHTML += `
      <div class="card">

        <span class="badge">${r.category}</span>

        <p>${r.description}</p>

        <div class="small">
          📍 ${r.location}
        </div>

      </div>
    `;
  });
}

/* =========================
   CONTACT (MVP WHATSAPP)
========================= */
function contact(phone){

  window.open(`https://wa.me/${phone}`, "_blank");
}

/* INIT */
loadProviders();
loadRequests();

</script>

</body>
</html>
