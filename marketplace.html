<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050607;
  color: white;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(0,0,0,0.8);
  border-bottom: 1px solid rgba(0,255,140,0.2);
}

h2 {
  color: #00ff8c;
}

button {
  background: #00ff8c;
  border: none;
  padding: 10px 15px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: #0b120e;
  border-radius: 12px;
  border: 1px solid rgba(0,255,140,0.15);
  padding: 15px;
}

/* REQUEST BUTTON */
.request-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #00ff8c;
  color: black;
  padding: 15px 18px;
  border-radius: 50px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,255,140,0.3);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #0b120e;
  padding: 20px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  border: 1px solid rgba(0,255,140,0.2);
}

input, select, textarea {
  width: 100%;
  margin: 8px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

textarea {
  height: 80px;
}
</style>
</head>

<body>

<header>
  <h2>Zep Swipe Marketplace</h2>
  <button onclick="loadServices()">Refresh</button>
</header>

<!-- SERVICES -->
<div class="grid" id="services"></div>

<!-- REQUEST BUTTON -->
<div class="request-btn" onclick="openModal()">
  + Request Service
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 style="color:#00ff8c;">Request a Service</h3>

    <input id="name" placeholder="Your Name">
    <input id="phone" placeholder="Phone Number">

    <select id="category">
      <option>Academic</option>
      <option>Digital</option>
      <option>Technical</option>
      <option>Creative</option>
      <option>Community</option>
    </select>

    <textarea id="description" placeholder="Describe what you need"></textarea>

    <input id="location" placeholder="Location (Randfontein etc)">
    <input id="budget" placeholder="Budget (optional)">

    <button onclick="submitRequest()">Submit Request</button>
    <button onclick="closeModal()" style="background:red;margin-top:10px;">Close</button>
  </div>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* OPEN / CLOSE MODAL */
function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* SUBMIT REQUEST */
async function submitRequest() {
  const request = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value,
    location: document.getElementById("location").value,
    budget: document.getElementById("budget").value,
    status: "open"
  };

  const { error } = await client
    .from("service_requests")
    .insert([request]);

  if (error) {
    alert("Error submitting request");
    console.log(error);
  } else {
    alert("Request submitted successfully!");
    closeModal();
  }
}

/* LOAD SERVICES (placeholder if you connect later) */
function loadServices() {
  document.getElementById("services").innerHTML = `
    <div class="card">
      <h3 style="color:#00ff8c;">Live Marketplace Ready</h3>
      <p>Services will load from Supabase 'services' table.</p>
    </div>
  `;
}

loadServices();
</script>

</body>
</html>
