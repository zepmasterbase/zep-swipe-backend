<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep Swipe Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

/* =========================
   BASE SYSTEM
========================= */

body {
  margin: 0;
  font-family: system-ui, -apple-system, Arial;
  background: #0b0f0d;
  color: #ffffff;
}

/* subtle animated background dots (clean instead of icons) */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
}

.dot {
  position: absolute;
  width: 6px;
  height: 6px;
  background: rgba(0,255,140,0.12);
  border-radius: 50%;
  animation: float 12s infinite linear;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* =========================
   HEADER (SLEEK)
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(10, 14, 12, 0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(0,255,140,0.12);
}

.logo {
  font-weight: 700;
  font-size: 15px;
  color: #00ff8c;
  letter-spacing: 0.3px;
}

/* =========================
   BUTTONS
========================= */

.btn {
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s ease;
}

.primary {
  background: #00ff8c;
  color: #0b0f0d;
}

.secondary {
  background: rgba(255,255,255,0.08);
  color: white;
}

/* =========================
   LAYOUT
========================= */

.container {
  position: relative;
  z-index: 2;
  max-width: 920px;
  margin: auto;
  padding: 14px;
}

/* =========================
   REQUEST BOX (MAIN CTA)
========================= */

.request {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(0,255,140,0.12);
  border-radius: 14px;
  padding: 14px;
  margin-top: 14px;
}

.request h3 {
  margin: 0;
  font-size: 14px;
  color: #00ff8c;
  font-weight: 600;
}

.request input {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: rgba(0,0,0,0.3);
  color: white;
  outline: none;
}

.request button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #00ff8c;
  font-weight: 700;
  color: #0b0f0d;
  cursor: pointer;
}

/* =========================
   LIVE STRIP
========================= */

.live {
  margin-top: 12px;
  padding: 10px 12px;
  font-size: 12px;
  border-radius: 12px;
  background: rgba(0,255,140,0.06);
  border: 1px solid rgba(0,255,140,0.12);
  color: rgba(255,255,255,0.85);
}

/* =========================
   JOB CARDS
========================= */

.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 14px;
  margin-top: 12px;
  transition: 0.2s ease;
}

.card:hover {
  border-color: rgba(0,255,140,0.25);
}

.badge {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 20px;
  background: rgba(0,255,140,0.12);
  color: #00ff8c;
}

.meta {
  margin-top: 6px;
  font-size: 12px;
  opacity: 0.7;
}

/* =========================
   FLOAT CTA
========================= */

.fab {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: #00ff8c;
  color: #0b0f0d;
  padding: 14px 16px;
  border-radius: 50px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(0,255,140,0.25);
}

</style>
</head>

<body>

<!-- subtle background -->
<div class="bg">
  <div class="dot" style="left:10%; animation-delay:0s;"></div>
  <div class="dot" style="left:25%; animation-delay:2s;"></div>
  <div class="dot" style="left:40%; animation-delay:4s;"></div>
  <div class="dot" style="left:60%; animation-delay:1s;"></div>
  <div class="dot" style="left:80%; animation-delay:3s;"></div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">Zep Swipe</div>

  <div>
    <!-- PROVIDER BUTTON (KEPT INTTACT) -->
    <button class="btn secondary"
      onclick="window.location.href='provider.html'">
      Provider
    </button>

    <!-- UPDATED JOIN BUTTON -->
    <button class="btn primary"
      onclick="window.location.href='waitlists.html'">
      Join Waitlist
    </button>
  </div>
</header>

<!-- MAIN -->
<div class="container">

  <!-- REQUEST CTA -->
  <div class="request">

    <h3>What do you need?</h3>

    <input id="request" placeholder="e.g. Cleaning, Tutoring, Barber...">
    <input id="location" placeholder="Your location">

    <button onclick="createRequest()">
      Request Service
    </button>

  </div>

  <!-- LIVE STATUS -->
  <div class="live">
    ⚡ Live: Providers available in your area • Avg response time: 5–8 mins
  </div>

  <!-- JOB FEED -->
  <div id="jobs"></div>

</div>

<!-- FLOAT CTA -->
<div class="fab" onclick="window.location.href='waitlists.html'">
  Join Waitlist
</div>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* CREATE REQUEST */
async function createRequest(){

  const req = document.getElementById("request").value;
  const loc = document.getElementById("location").value;

  if(!req) return alert("Please enter a request");

  await client.from("service_requests").insert([{
    category: "General",
    description: req,
    location: loc,
    status: "open"
  }]);

  loadJobs();
}

/* LOAD JOBS */
async function loadJobs(){

  const { data } = await client
    .from("service_requests")
    .select("*")
    .order("created_at",{ascending:false});

  render(data || []);
}

/* RENDER */
function render(jobs){

  const box = document.getElementById("jobs");
  box.innerHTML = "";

  jobs.forEach(job => {

    box.innerHTML += `
      <div class="card">

        <span class="badge">${job.category}</span>

        <p style="margin-top:8px;">
          ${job.description}
        </p>

        <div class="meta">
          📍 ${job.location || "Unknown"}
        </div>

      </div>
    `;
  });
}

/* INIT */
loadJobs();

</script>

</body>
</html>
