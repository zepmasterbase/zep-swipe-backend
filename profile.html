<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zep Swipe — Student Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400,500,600&display=swap" rel="stylesheet">

<style>
body{background:#050018;color:white;font-family:Poppins;display:flex;justify-content:center;padding:20px;}
.container{width:100%;max-width:700px;background:rgba(255,255,255,0.05);padding:20px;border-radius:20px;}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;}
button{background:linear-gradient(90deg,#00f0ff,#9c4dff);cursor:pointer;}
img{width:120px;height:120px;border-radius:50%;cursor:pointer;}
.task{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}
.task div{background:rgba(255,255,255,0.1);padding:10px;text-align:center;border-radius:8px;}
.completed{background:#00f0ff;}
</style>

</head>

<body>

<div class="container">

<h2>👤 Student Profile</h2>

<img id="profileImg" src="https://via.placeholder.com/120">

<input id="name" placeholder="Full Name">
<input id="university" placeholder="University">
<input id="country" placeholder="Country">
<input id="city" placeholder="City">
<input id="level" placeholder="Level">

<button onclick="saveProfile()">Save Profile</button>

<h3>📊 21-Day Progress</h3>
<div class="task" id="tasks"></div>

<button id="verifyBtn" onclick="verifyUser()">Verify Freelancer ($15)</button>

</div>

<script>

const supabaseUrl = "https://wucferiudoekefgaciua.supabase.co";
const supabaseKey = "YOUR_ANON_KEY";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

let user = null;

/* ======================
   GET AUTH USER
====================== */
async function getUser(){
  const { data } = await supabase.auth.getUser();
  user = data.user;

  if(!user){
    window.location.href = "login-signup.html";
  }
}

/* ======================
   LOAD PROFILE
====================== */
async function loadProfile(){

  await getUser();

  const { data } = await supabase
    .from("users")
    .select("*")
    .eq("auth_id", user.id)
    .single();

  if(data){
    document.getElementById("name").value = data.name || "";
    document.getElementById("university").value = data.university || "";
    document.getElementById("country").value = data.country || "";
    document.getElementById("city").value = data.city || "";
    document.getElementById("level").value = data.level || "";
    document.getElementById("profileImg").src = data.profile_image || "https://via.placeholder.com/120";

    renderTasks(data.tasks_completed || 0);
  }
}

/* ======================
   SAVE PROFILE
====================== */
async function saveProfile(){

  const updates = {
    auth_id: user.id,
    name: name.value,
    university: university.value,
    country: country.value,
    city: city.value,
    level: level.value
  };

  const { error } = await supabase
    .from("users")
    .upsert(updates, { onConflict: "auth_id" });

  if(error){
    alert("Error saving profile");
    console.log(error);
    return;
  }

  alert("Profile saved");
}

/* ======================
   TASKS
====================== */
function renderTasks(completed){
  const container = document.getElementById("tasks");
  container.innerHTML = "";

  for(let i=1;i<=21;i++){
    const div = document.createElement("div");
    div.innerText = i;

    if(i <= completed){
      div.classList.add("completed");
    }

    container.appendChild(div);
  }
}

/* ======================
   VERIFY (placeholder)
====================== */
function verifyUser(){
  alert("Connect payment gateway later (Paystack/Momo)");
}

/* INIT */
loadProfile();

</script>

</body>
</html>
