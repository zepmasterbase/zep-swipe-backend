<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zep OS 3.6 — Global Identity Passport</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#050014;
  color:white;
  font-family:Poppins;
  display:flex;
  justify-content:center;
  padding:20px;
}

.container{
  max-width:720px;
  width:100%;
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.1);
}

input,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.4);
  color:white;
}

button{
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  cursor:pointer;
  font-weight:bold;
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  display:inline-block;
  background:rgba(0,240,255,0.1);
  border:1px solid rgba(0,240,255,0.3);
  font-size:12px;
}

.locked{
  opacity:0.6;
}
</style>
</head>

<body>

<div class="container">

<h2>🛂 Zep Students Global Passport</h2>

<div id="status" class="badge">Identity Status: Loading...</div>

<input id="name" placeholder="Full Name" disabled>
<input id="country" placeholder="Country" disabled>

<div class="badge" id="passportCode">Passport: Not Issued</div>

<button onclick="requestVerification()">
Request Identity Verification
</button>

<button onclick="loadProfile()">
Refresh Identity
</button>

</div>

<script>

const supabase = window.supabase.createClient(
  "https://zazbdbkoqjxdzisfszeg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphemJkYmtvcWp4ZHppc2ZzemVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTA4MzAsImV4cCI6MjA5MTQ4NjgzMH0.uTqieGXErIpooSUn0TMmYwYYJuo0yHYcAqdampHWRj4"
);

let user;

/* LOAD USER */
async function getUser(){
  const { data } = await supabase.auth.getUser();
  user = data.user;

  if(!user){
    location.href = "login-signup.html";
  }
}

/* LOAD PROFILE */
async function loadProfile(){

  await getUser();

  const { data } = await supabase
    .from("users")
    .select("*")
    .eq("id", user.id)
    .single();

  if(!data) return;

  document.getElementById("name").value = data.name || "";
  document.getElementById("country").value = data.country || "";

  document.getElementById("status").innerText =
    "Identity Status: " + data.verification_status;

  if(data.passport_id){
    document.getElementById("passportCode").innerText =
      "Passport: " + data.passport_id;
  }
}

/* REQUEST VERIFICATION (NO DEVICE UPLOAD) */
async function requestVerification(){

  const { data: passport } = await supabase
    .from("passports")
    .insert([{
      user_id: user.id,
      passport_code: "ZEP-" + Math.floor(Math.random()*999999),
      full_name: name.value,
      country: country.value,
      status: "pending",
      tier: "basic"
    }])
    .select()
    .single();

  await supabase
    .from("users")
    .update({
      verification_status: "pending",
      passport_id: passport.id,
      identity_locked: true
    })
    .eq("id", user.id);

  document.getElementById("status").innerText =
    "Identity Status: pending";

  document.getElementById("passportCode").innerText =
    "Passport: " + passport.passport_code;
}

loadProfile();

</script>

</body>
</html>
