<!DOCTYPE html>
<html>
<head>
<title>Zep AI Agent</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>
body{margin:0;font-family:Poppins;background:#050018;color:#fff}
#box{position:fixed;bottom:20px;right:20px;width:350px;height:520px;background:rgba(255,255,255,0.06);display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
#msgs{flex:1;overflow-y:auto;padding:10px}
.msg{margin:6px 0;font-size:13px}
.user{text-align:right;color:#9ff}
.bot{text-align:left;color:#fff}
#input{display:flex}
input{flex:1;padding:10px;border:none;background:#111;color:#fff}
button{padding:10px;border:none;background:linear-gradient(90deg,#00f0ff,#9c4dff);cursor:pointer}
</style>
</head>

<body>

<div id="box">
  <div id="msgs"></div>
  <div id="input">
    <input id="msg" placeholder="Ask Zep AI Agent..."/>
    <button onclick="send()">Send</button>
  </div>
</div>

<script>

const supabaseUrl = "https://wucferiudoekefgaciua.supabase.co";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let user;

async function init(){
  const { data } = await supabase.auth.getUser();
  user = data.user;

  if(!user){
    alert("Login required");
    location.href="login.html";
  }

  loadMessages();
}
init();

/* ================= LOAD CHAT ================= */
async function loadMessages(){
  const { data } = await supabase
    .from("ai_chats")
    .select("*")
    .eq("user_id", user.id)
    .order("created_at",{ascending:true});

  render(data||[]);
}

function render(d){
  const box=document.getElementById("msgs");
  box.innerHTML="";
  d.forEach(m=>{
    const div=document.createElement("div");
    div.className="msg "+(m.role==="user"?"user":"bot");
    div.textContent=m.message;
    box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
}

/* ================= AGENT CORE ================= */
async function send(){
  const input=document.getElementById("msg");
  if(!input.value) return;

  const text=input.value;
  input.value="";

  await save("user",text);

  const reply = await agentBrain(text);

  await save("bot",reply);

  loadMessages();
}

async function save(role,msg){
  await supabase.from("ai_chats").insert({
    user_id:user.id,
    role,
    message:msg
  });
}

/* ================= ZEP AI AGENT BRAIN ================= */
async function agentBrain(msg){

  // 1. fetch gigs
  const { data: gigs } = await supabase.from("gigs").select("*").limit(5);

  // 2. simple reasoning engine
  let context = `
You are Zep AI Freelance Agent.

You help students:
- find gigs
- price work
- generate invoices
- improve skills

Available gigs:
${JSON.stringify(gigs)}

User message: ${msg}
`;

  try{
    const res = await axios.post("https://api.openai.com/v1/chat/completions",{
      model:"gpt-4",
      messages:[
        {role:"system",content:context},
        {role:"user",content:msg}
      ],
      max_tokens:400
    },{
      headers:{
        "Authorization":"Bearer YOUR_OPENAI_API_KEY",
        "Content-Type":"application/json"
      }
    });

    const output = res.data.choices[0].message.content;

    // log AI decision
    await supabase.from("ai_actions").insert({
      user_id:user.id,
      action:"ai_response",
      payload:{input:msg,output}
    });

    return output;

  }catch(e){
    return "Agent error. Try again.";
  }
}

</script>

</body>
</html>
