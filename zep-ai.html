<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep AI — Freelance OS Brain</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050012;
  --glass:rgba(255,255,255,0.06);
  --blue:#00f0ff;
  --purple:#9c4dff;
  --green:#00ff9d;
  --text:rgba(255,255,255,0.85);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  background:radial-gradient(circle at top,#0b0620,#050012);
  color:white;
  height:100vh;
}

/* AI PANEL */
#aiBox{
  position:fixed;
  bottom:18px;
  right:18px;
  width:380px;
  height:540px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
  border-radius:18px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(0,240,255,0.2);
  box-shadow:0 0 35px rgba(156,77,255,0.35);
}

/* HEADER */
#header{
  padding:12px 14px;
  font-family:Orbitron;
  font-size:14px;
  font-weight:700;
  color:#000;
  background:linear-gradient(90deg,var(--blue),var(--purple));
}

/* MESSAGE AREA */
#msgs{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.msg{
  margin:8px 0;
  font-size:13px;
  line-height:1.4;
  white-space:pre-wrap;
}

.user{
  text-align:right;
  color:var(--blue);
}

.bot{
  text-align:left;
  color:white;
  opacity:0.9;
}

/* INPUT AREA */
#inputBox{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid rgba(255,255,255,0.08);
  background:rgba(0,0,0,0.2);
}

input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
  background:#0d0a1f;
  color:white;
  outline:none;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-family:Orbitron;
  font-weight:700;
  color:#000;
  background:linear-gradient(90deg,var(--blue),var(--purple));
}

button:hover{
  opacity:0.9;
}
</style>
</head>

<body>

<div id="aiBox">
  <div id="header">Zep AI — Freelance OS Brain 🤖</div>

  <div id="msgs"></div>

  <div id="inputBox">
    <input id="msg" placeholder="Ask: gigs, wallet, invoice, escrow, earnings..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
/* ================= SUPABASE INIT ================= */
const supabaseUrl = "https://zazbdbkoqjxdzisfszeg.supabase.co";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY"; // keep secure in production

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let user = null;

/* ================= INIT USER ================= */
async function init(){
  const { data } = await supabase.auth.getUser();
  user = data.user;

  if(!user){
    alert("Please login first");
    location.href = "login.html";
    return;
  }

  greet();
}

init();

/* ================= UI ================= */
function addMsg(text,type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  document.getElementById("msgs").appendChild(div);
  document.getElementById("msgs").scrollTop = 999999;
}

/* GREETING */
function greet(){
  addMsg("👋 Welcome to Zep AI Freelance OS", "bot");
  addMsg("Ask me anything: gigs, wallet, escrow, invoices", "bot");
}

/* ================= SEND ================= */
async function send(){
  const input = document.getElementById("msg");
  if(!input.value.trim()) return;

  const text = input.value;
  input.value = "";

  addMsg(text,"user");

  const response = await brain(text);

  addMsg(response,"bot");
}

/* ================= AI BRAIN (UNCHANGED LOGIC) ================= */
async function brain(msg){

  const [gigsRes, walletRes, invoiceRes, escrowRes, taskRes] = await Promise.all([
    supabase.from("gigs").select("*").limit(5),
    supabase.from("wallets").select("*").eq("user_id", user.id).single(),
    supabase.from("invoices").select("*").eq("user_id", user.id),
    supabase.from("escrow").select("*"),
    supabase.from("ai_tasks").select("*").eq("user_id", user.id)
  ]);

  const gigs = gigsRes.data || [];
  const wallet = walletRes.data || {};
  const invoices = invoiceRes.data || [];
  const escrow = escrowRes.data || [];
  const tasks = taskRes.data || [];

  const systemContext = `
You are Zep AI Autonomous Freelance OS.

You control:
- Gigs marketplace
- Wallet system
- Invoice system
- Escrow system
- Task automation system

User Data:
Wallet: ${JSON.stringify(wallet)}
Invoices: ${JSON.stringify(invoices)}
Escrow: ${JSON.stringify(escrow)}
Tasks: ${JSON.stringify(tasks)}

Available Gigs:
${JSON.stringify(gigs)}

Rules:
- Suggest gigs if user is broke or idle
- Suggest invoices if gig exists
- Explain escrow status clearly
- Help user earn money
- Be short and practical
`;

  try{

    const res = await axios.post(
      "https://api.openai.com/v1/chat/completions",
      {
        model: "gpt-4",
        messages: [
          { role:"system", content: systemContext },
          { role:"user", content: msg }
        ],
        max_tokens: 400,
        temperature: 0.7
      },
      {
        headers:{
          "Authorization":"Bearer YOUR_OPENAI_API_KEY",
          "Content-Type":"application/json"
        }
      }
    );

    const output = res.data.choices[0].message.content;

    await supabase.from("ai_tasks").insert({
      user_id: user.id,
      task_type: "ai_response",
      payload: { input: msg, output }
    });

    return output;

  }catch(err){
    console.log(err);
    return "⚠️ AI temporarily unavailable. Try again.";
  }
}
</script>

</body>
</html>
