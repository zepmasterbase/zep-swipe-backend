<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zep AI — Freelance OS Brain</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:#050018;
  color:#fff;
}

#aiBox{
  position:fixed;
  bottom:20px;
  right:20px;
  width:370px;
  height:520px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(14px);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 40px rgba(156,77,255,0.4);
}

#header{
  padding:12px;
  font-family:Orbitron;
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  color:#000;
  font-weight:700;
}

#msgs{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{margin:6px 0;font-size:13px}
.user{text-align:right;color:#9ff}
.bot{text-align:left;color:#fff}

#inputBox{
  display:flex;
  padding:8px;
  border-top:1px solid rgba(255,255,255,0.1);
}

input{
  flex:1;
  padding:10px;
  border:none;
  background:#111;
  color:#fff;
  border-radius:10px;
}

button{
  margin-left:6px;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#00f0ff,#9c4dff);
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="aiBox">
  <div id="header">Zep AI — Freelance OS Brain 🤖</div>

  <div id="msgs"></div>

  <div id="inputBox">
    <input id="msg" placeholder="Ask: find gigs, wallet, invoice, escrow..."/>
    <button onclick="send()">Send</button>
  </div>
</div>

<script>

/* ================= SUPABASE INIT ================= */
const supabaseUrl = "https://wucferiudoekefgaciua.supabase.co";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let user;

/* ================= INIT USER ================= */
async function init(){
  const { data } = await supabase.auth.getUser();
  user = data.user;

  if(!user){
    alert("Please login first");
    location.href="login.html";
  }

  greet();
}
init();

/* ================= UI ================= */
function addMsg(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  document.getElementById("msgs").appendChild(div);
  document.getElementById("msgs").scrollTop = 999999;
}

function greet(){
  addMsg("Welcome to Zep AI Freelance OS 👋", "bot");
  addMsg("Ask me: gigs, wallet, invoices, escrow, earnings", "bot");
}

/* ================= MAIN SEND ================= */
async function send(){
  const input = document.getElementById("msg");
  if(!input.value) return;

  const text = input.value;
  input.value="";

  addMsg(text,"user");

  const response = await brain(text);

  addMsg(response,"bot");
}

/* ================= AI BRAIN ================= */
async function brain(msg){

  // STEP 1: FETCH ALL SYSTEM DATA
  const [gigsRes, walletRes, invoiceRes, escrowRes, taskRes] = await Promise.all([
    supabase.from("gigs").select("*").limit(5),
    supabase.from("wallets").select("*").eq("user_id", user.id).single(),
    supabase.from("invoices").select("*").eq("user_id", user.id),
    supabase.from("escrow").select("*"),
    supabase.from("ai_tasks").select("*").eq("user_id", user.id)
  ]);

  const gigs = gigsRes.data || [];
  const wallet = walletRes.data || {};
  const invoices = invoiceRes.data || [];
  const escrow = escrowRes.data || [];
  const tasks = taskRes.data || [];

  /* ================= CONTEXT ENGINE ================= */
  const systemContext = `
You are Zep AI Autonomous Freelance OS.

You control:
- Gigs marketplace
- Wallet system
- Invoice system
- Escrow system
- Task automation system

User Data:
Wallet: ${JSON.stringify(wallet)}
Invoices: ${JSON.stringify(invoices)}
Escrow: ${JSON.stringify(escrow)}
Tasks: ${JSON.stringify(tasks)}

Available Gigs:
${JSON.stringify(gigs)}

Rules:
- Suggest gigs if user is broke or idle
- Suggest invoices if gig exists
- Explain escrow status clearly
- Help user earn money
- Be short and practical
`;

  try{

    const res = await axios.post("https://api.openai.com/v1/chat/completions",{
      model:"gpt-4",
      messages:[
        {role:"system",content:systemContext},
        {role:"user",content:msg}
      ],
      max_tokens:400,
      temperature:0.7
    },{
      headers:{
        "Authorization":"Bearer YOUR_OPENAI_API_KEY",
        "Content-Type":"application/json"
      }
    });

    const output = res.data.choices[0].message.content;

    /* ================= LOG AI TASK ================= */
    await supabase.from("ai_tasks").insert({
      user_id: user.id,
      task_type: "ai_response",
      payload: {
        input: msg,
        output: output
      }
    });

    return output;

  }catch(err){
    console.log(err);
    return "AI temporarily unavailable.";
  }
}

</script>

</body>
</html>
